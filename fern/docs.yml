instances:
  - url: nvidia-k8s-test-infra.docs.buildwithfern.com/k8s-test-infra
    custom-domain: docs.nvidia.com/k8s-test-infra
    multi-source: true

redirects:
  - source: /k8s-test-infra/index.html
    destination: /k8s-test-infra

title: NVIDIA Mokka

global-theme: nvidia

logo:
  href: /k8s-test-infra
  right-text: Mokka

navbar-links:
  - type: github
    value: https://github.com/NVIDIA/k8s-test-infra

# Each vX.Y.Z release registers itself under products[0].versions: the publish
# workflow (.github/workflows/fern-publish-docs.yml) adds the entry, keeps the
# newest three, and opens a pull request with the change. Only a release that
# predates the Fern migration, such as v0.5.0, is registered by hand, because
# its tag has no docs/index.yml to generate the navigation from.
products:
  - display-name: Mokka
    path: ../docs/index.yml
    slug: /
    versions:
      - display-name: v0.5.0
        path: versions/v0.5.0.yml
        slug: v0.5.0
        availability: stable
