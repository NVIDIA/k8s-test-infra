#
# GPU Feature Discovery DaemonSet for E2E testing with nvml-mock chart.
# Deploys GFD standalone (without GPU Operator) to label nodes with GPU attributes.
#
# GFD writes a feature file under features.d; Node Feature Discovery (NFD) turns
# it into node labels, so the scenario installs NFD before applying this.
#
# The standalone gpu-feature-discovery image stops at v0.8.2, which has no
# driver-root flag. Later GFD releases ship as a second binary inside the device
# plugin image, so this runs gpu-feature-discovery from the same
# k8s-device-plugin image device-plugin-mock.yaml pins. That binary takes the
# driver root as --driver-root-ctr-path; --nvidia-driver-root is the device
# plugin's flag, not GFD's.
#
# Expected node labels after GFD runs:
#   nvidia.com/gpu.compute.major=8
#   nvidia.com/gpu.product=NVIDIA-A100-SXM4-40GB
#   nvidia.com/gpu.memory=40960  (or similar)
#   nvidia.com/gpu.driver.version=580.65.06
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gfd-mock
  namespace: kube-system
  labels:
    app.kubernetes.io/name: gpu-feature-discovery
    app.kubernetes.io/component: gfd
spec:
  selector:
    matchLabels:
      name: nvidia-gfd-mock
  template:
    metadata:
      labels:
        name: nvidia-gfd-mock
    spec:
      # Same placement as device-plugin-mock.yaml: only nodes that run the mock
      # have an NVML to read. Elsewhere GFD exits with ERROR_LIBRARY_NOT_FOUND
      # and the DaemonSet never reports ready.
      nodeSelector:
        mokka.nvidia.com/type: sgpu
      tolerations:
        - operator: Exists
      serviceAccountName: nvidia-gfd-mock
      containers:
        - name: gpu-feature-discovery
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.2
          imagePullPolicy: IfNotPresent
          command: ["gpu-feature-discovery"]
          args:
            - "--driver-root-ctr-path=/var/lib/nvml-mock/driver"
            - "--device-discovery-strategy=nvml"
            # Kind has no DMI product name to own; the node agent stages the
            # machine type in the driver config instead.
            - "--machine-type-file=/var/lib/nvml-mock/driver/config/machine-type"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GFD_SLEEP_INTERVAL
              value: "60s"
          securityContext:
            privileged: true
          volumeMounts:
            - name: mock-root
              mountPath: /var/lib/nvml-mock
              readOnly: true
            - name: output-dir
              mountPath: /etc/kubernetes/node-feature-discovery/features.d
            - name: host-sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: mock-root
          hostPath:
            path: /var/lib/nvml-mock
        - name: output-dir
          hostPath:
            path: /etc/kubernetes/node-feature-discovery/features.d
            type: DirectoryOrCreate
        - name: host-sys
          hostPath:
            path: /sys
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-gfd-mock
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvidia-gfd-mock
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvidia-gfd-mock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvidia-gfd-mock
subjects:
  - kind: ServiceAccount
    name: nvidia-gfd-mock
    namespace: kube-system
