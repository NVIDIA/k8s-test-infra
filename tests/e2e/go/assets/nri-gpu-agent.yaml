#
# gpu-agent is an explicit node-management workload: it requests no schedulable
# GPU resource, but opts into node-wide GPU visibility with the Mokka annotation.
# The container's `set -eu` self-test fails unless NRI delivers the overlay and
# all mock devices, so DaemonSet readiness proves the management path works.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-agent
  labels:
    app: gpu-agent
spec:
  selector:
    matchLabels:
      app: gpu-agent
  template:
    metadata:
      labels:
        app: gpu-agent
      annotations:
        nvml-mock.nvidia.com/devices: "true"
        nvml-mock.nvidia.com/infiniband: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        mokka.nvidia.com/type: sgpu
      containers:
        - name: agent
          image: debian:bookworm-slim
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[gpu-agent] node=${NODE_NAME} verifying explicit management injection"
              # The overlay and nvidia-smi come from the explicit all-device
              # annotation; this pod requests no nvidia.com/gpu and mounts no volumes.
              test -d /opt/nvml-mock
              command -v nvidia-smi
              echo "=== nvidia-smi ==="
              nvidia-smi
              echo "=== nvidia-smi -q (fabric clique) ==="
              nvidia-smi -q | grep -iE "ClusterUUID|CliqueId" || true
              echo "=== check-fabric (ComputeDomain identity via NRI) ==="
              command -v check-fabric >/dev/null 2>&1 && check-fabric || true
              echo "[gpu-agent] management injection OK; entering nvidia-smi -L loop"
              while true; do
                nvidia-smi -L
                sleep 300
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
