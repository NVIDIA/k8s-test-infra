# The single-container test pod every scenario applies. Callers supply the parts
# that vary; everything omitted is left out of the manifest rather than emitted
# empty, so the API server applies its own defaults.
#
# terminationGracePeriodSeconds is capped here on purpose and is load-bearing for
# suite runtime; see the package doc for why the 30s default costs minutes.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Name | quote }}
  namespace: {{ .Namespace | quote }}
  {{- with .Labels }}
  labels:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  {{- with .Annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  restartPolicy: {{ .RestartPolicy | quote }}
  terminationGracePeriodSeconds: {{ .GracePeriodSeconds }}
  {{- with .Node }}
  nodeName: {{ . | quote }}
  {{- end }}
  {{- with .NodeSelector }}
  nodeSelector:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  containers:
    - name: {{ .ContainerName | quote }}
      image: {{ .Image | quote }}
      {{- with .Command }}
      command:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Env }}
      env:
        {{- range $name, $value := . }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
      {{- end }}
      {{- if .GPUs }}
      resources:
        limits:
          {{ .GPUResourceName }}: {{ .GPUs }}
      {{- end }}
