apiVersion: v1
kind: Node
metadata:
  name: kwok-worker
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    mokka.nvidia.com/sgpu-node: "true"
    mokka.nvidia.com/node-type: KWOK
    mokka.nvidia.com/pool: binding-e2e
    nvidia.com/gpu.deploy.operands: "false"
spec:
  taints:
    - {key: kwok.x-k8s.io/node, value: fake, effect: NoSchedule}
status:
  capacity: {cpu: "8", memory: 32Gi, pods: "32"}
  allocatable: {cpu: "8", memory: 32Gi, pods: "32"}
---
apiVersion: mokka.nvidia.com/v1alpha1
kind: SGPURackProfile
metadata:
  name: binding-e2e
spec:
  rack: {nodesPerRack: 1}
  node:
    gpus:
      count: 8
      model: {productName: NVIDIA A100-SXM4-40GB}
      memory: {capacity: 40Gi}
      pci: {vendorID: "10de"}
    topology:
      gpuSlots:
        - {index: 0, pciAddress: "0000:01:00.0", rootComplex: pci0000:00}
        - {index: 1, pciAddress: "0000:02:00.0", rootComplex: pci0000:00}
        - {index: 2, pciAddress: "0000:03:00.0", rootComplex: pci0000:00}
        - {index: 3, pciAddress: "0000:04:00.0", rootComplex: pci0000:00}
        - {index: 4, pciAddress: "0000:05:00.0", rootComplex: pci0000:00}
        - {index: 5, pciAddress: "0000:06:00.0", rootComplex: pci0000:00}
        - {index: 6, pciAddress: "0000:07:00.0", rootComplex: pci0000:00}
        - {index: 7, pciAddress: "0000:08:00.0", rootComplex: pci0000:00}
---
apiVersion: mokka.nvidia.com/v1alpha1
kind: SGPUInventory
metadata:
  name: binding-e2e
spec:
  rackGroups:
    - id: real
      count: 1
      node: {type: CPU}
      profileRef: {name: binding-e2e}
      placement: &placement
        nodeSelector:
          matchLabels: {mokka.nvidia.com/pool: binding-e2e}
    - id: virtual
      count: 1
      node: {type: KWOK}
      profileRef: {name: binding-e2e}
      placement: *placement
