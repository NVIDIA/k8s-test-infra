#
# GPU Operator Validator pod for E2E testing with nvml-mock chart.
# Runs cuda-vectorAdd against the mock libcuda.so.
#
# This does NOT pass today and the scenario is gated off in CI (E2E_RUN_NGC,
# see #446). The mock exports the CUDA Runtime surface under the name of the
# Driver library and omits cuGetProcAddress, which is how this statically
# linked sample reaches the driver, so vectorAdd fails identically with and
# without the mock mounted. See docs/cuda-mock.md.
#
# This is a standalone Job (not the full operator validator) that exercises
# the same validation the GPU Operator performs.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-validator-mock
  namespace: default
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        name: gpu-validator-mock
    spec:
      restartPolicy: Never
      tolerations:
        - operator: Exists
      containers:
        - name: cuda-validation
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LD_LIBRARY_PATH
              value: "/var/lib/nvml-mock/driver/usr/lib64"
          volumeMounts:
            - name: mock-root
              mountPath: /var/lib/nvml-mock
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: "1"
      volumes:
        - name: mock-root
          hostPath:
            path: /var/lib/nvml-mock
