apiVersion: config.kwok.x-k8s.io/v1alpha1
kind: KwokctlResource
metadata:
  name: mokka-node
template: |-
  apiVersion: v1
  kind: Node
  metadata:
    name: {{ Name }}
    annotations:
      kwok.x-k8s.io/node: fake
    labels:
      type: kwok
      kubernetes.io/hostname: {{ Name }}
      mokka.nvidia.com/sgpu-node: "true"
      mokka.nvidia.com/pool: kwok-scale
      tests.mokka.nvidia.com/kwok-cluster: __CLUSTER_LABEL__
  spec: {}
