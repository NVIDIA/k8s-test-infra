suite: KWOK data plane
chart:
  appVersion: 1.2.3
templates:
  - templates/kwok/data-plane.yaml
tests:
  - it: is off by default
    asserts:
      - hasDocuments: {count: 0}
  - it: watches as a single named replica with its own identity
    set:
      kwok.enabled: true
    asserts:
      - hasDocuments: {count: 5}
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/nvidia/mokka-kwok:1.2.3
        documentIndex: 4
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 4
      - equal:
          path: spec.template.spec.serviceAccountName
          value: mokka-kwok-data-plane
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].args
          value: [data-plane, "--gpu-publishing=DevicePlugin", "--gpu-driver=gpu.nvidia.com", "--compute-domains=false", "--node-resource-topology=false", "--shard-name=$(POD_NAME)", "--control-plane-url=http://RELEASE-NAME-nvml-mock-control-plane:8080", "--batch-size=100", "--batch-window=1s", "--max-in-flight=2"]
        documentIndex: 4
      - equal:
          path: rules
          value:
            - apiGroups: ["mokka.nvidia.com"]
              resources: ["sgpuracks"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["mokka.nvidia.com"]
              resources: ["sgpurackallocations"]
              verbs: ["get", "create", "update"]
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["get", "list", "watch", "patch"]
            - apiGroups: [""]
              resources: ["nodes/status"]
              verbs: ["patch"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch", "patch"]
            - apiGroups: [""]
              resources: ["pods/status"]
              verbs: ["patch"]
            - apiGroups: ["", "events.k8s.io"]
              resources: ["events"]
              verbs: ["create", "patch", "update"]
        documentIndex: 1

  - it: renders no KWOK resources when an older release has no KWOK settings
    set:
      kwok: null
    asserts:
      - hasDocuments: {count: 0}

  - it: can enable KWOK with no saved data-plane image settings
    set:
      kwok.enabled: true
      kwok.dataPlane: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/nvidia/mokka-kwok:1.2.3
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
        documentIndex: 4

  - it: grants DRA access and checks only the selected GPU class
    set:
      kwok.enabled: true
      kwok.dataPlane.gpuPublishing: DRA
      kwok.dataPlane.gpuDriver: example.com
    asserts:
      - hasDocuments: {count: 5}
      - contains:
          path: rules
          content: {apiGroups: [resource.k8s.io], resources: [deviceclasses], resourceNames: [example.com], verbs: [get]}
        documentIndex: 1
      - contains:
          path: rules
          content: {apiGroups: [resource.k8s.io], resources: [resourceclaims], verbs: [get, list, watch]}
        documentIndex: 1
      - contains: {path: "spec.template.spec.containers[0].args", content: "--gpu-publishing=DRA"}
        documentIndex: 4

  - it: grants channel access in DevicePlugin mode and scopes clique writes to the driver namespace
    set:
      kwok.enabled: true
      kwok.dataPlane.computeDomains.enabled: true
      kwok.dataPlane.computeDomains.driverNamespace: nvidia-drivers
    asserts:
      - hasDocuments: {count: 7}
      - lengthEqual: {path: rules, count: 10}
        documentIndex: 1
      - contains:
          path: rules
          content: {apiGroups: [resource.k8s.io], resources: [resourceslices], verbs: [get, list, watch, create, patch, update, delete]}
        documentIndex: 1
      - contains:
          path: rules
          content: {apiGroups: [resource.nvidia.com], resources: [computedomains], verbs: [list, watch]}
        documentIndex: 1
      - equal: {path: metadata.namespace, value: nvidia-drivers}
        documentIndex: 5
      - equal: {path: "rules[0].resources", value: [computedomaincliques]}
        documentIndex: 5
      - equal: {path: metadata.namespace, value: nvidia-drivers}
        documentIndex: 6
      - equal: {path: "subjects[0].namespace", value: NAMESPACE}
        documentIndex: 6

  - it: grants topology access without enabling DRA
    set:
      kwok.enabled: true
      kwok.dataPlane.nodeResourceTopology.enabled: true
    asserts:
      - hasDocuments: {count: 5}
      - lengthEqual: {path: rules, count: 8}
        documentIndex: 1
      - contains:
          path: rules
          content: {apiGroups: [topology.node.k8s.io], resources: [noderesourcetopologies], verbs: [get, create, patch, delete]}
        documentIndex: 1
