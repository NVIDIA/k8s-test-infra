suite: Mokka Control Plane PodDisruptionBudget
templates:
  - templates/controlplane/poddisruptionbudget.yaml
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  - it: should not render by default
    set:
      controlPlane:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when the control plane is disabled
    set:
      controlPlane:
        podDisruptionBudget:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # Default replicas is 1, so the default bound must still let a drain evict it.
  - it: should allow one disruption when no bound is set
    set:
      controlPlane:
        enabled: true
        podDisruptionBudget:
          enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nvml-mock-control-plane
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: should select exactly the control-plane Deployment's pods
    set:
      controlPlane:
        enabled: true
        podDisruptionBudget:
          enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: nvml-mock-control-plane
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: control-plane

  - it: should render minAvailable instead of the default bound
    set:
      controlPlane:
        enabled: true
        replicas: 3
        podDisruptionBudget:
          enabled: true
          minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2
      - notExists:
          path: spec.maxUnavailable

  # Zero is falsy in templates; it must still render, not fall back to 1.
  - it: should render maxUnavailable 0
    set:
      controlPlane:
        enabled: true
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 0
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0

  - it: should treat a null bound as unset
    set:
      controlPlane:
        enabled: true
        podDisruptionBudget:
          enabled: true
          minAvailable: null
    asserts:
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: should accept a percentage
    set:
      controlPlane:
        enabled: true
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 50%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 50%

  - it: should reject a bound that is neither a count nor a percentage
    set:
      controlPlane:
        enabled: true
        podDisruptionBudget:
          enabled: true
          maxUnavailable: half
    asserts:
      - failedTemplate: {}
