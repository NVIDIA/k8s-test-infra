suite: Mokka Control Plane RBAC
templates:
  - templates/controlplane-serviceaccount.yaml
  - templates/controlplane-rbac.yaml
tests:
  - it: should not render when the control plane is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the dedicated service account
    set:
      controlPlane.enabled: true
    template: templates/controlplane-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nvml-mock-control-plane

  - it: should allow only the controller resource surface
    set:
      controlPlane.enabled: true
    template: templates/controlplane-rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list", "watch", "patch"]
      - contains:
          path: rules
          content:
            apiGroups: ["mokka.nvidia.com"]
            resources: ["sgpuinventories/status", "sgpuracks/status"]
            verbs: ["update"]

  - it: should allow namespaced Lease election
    set:
      controlPlane.enabled: true
    template: templates/controlplane-rbac.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "create", "update"]
