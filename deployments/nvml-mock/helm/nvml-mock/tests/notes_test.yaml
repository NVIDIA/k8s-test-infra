suite: NOTES.txt
templates:
  - templates/NOTES.txt
# Render against a fixed chart version so releasing a new chart never
# rewrites expectations or snapshots here.
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  # ── Snapshots ───────────────────────────────────────────────────────
  - it: should match snapshot with default values
    asserts:
      - matchSnapshotRaw: {}

  - it: should match snapshot with b200 profile
    set:
      gpu:
        profile: b200
        count: 4
    asserts:
      - matchSnapshotRaw: {}

  # ── Assertions ──────────────────────────────────────────────────────
  - it: should render NOTES with default profile and count
    asserts:
      - matchRegexRaw:
          pattern: "Profile: gb300"
      - matchRegexRaw:
          pattern: "GPUs per node: 4"
      - matchRegexRaw:
          pattern: "Driver version: 580.65.06"

  # count left unset: the rendered figure is the h100 device list, so it differs
  # from the default profile's above and neither can be satisfied by a constant.
  - it: should render NOTES with h100 profile
    set:
      gpu:
        profile: h100
    asserts:
      - matchRegexRaw:
          pattern: "Profile: h100"
      - matchRegexRaw:
          pattern: "GPUs per node: 8"
      - matchRegexRaw:
          pattern: "Driver version: 580.65.06"

  - it: should render Blackwell Ultra driver version for gb300
    set:
      gpu:
        profile: gb300
        count: 4
    asserts:
      - matchRegexRaw:
          pattern: "Driver version: 580.65.06"

  - it: should render explicit driver version
    set:
      driverVersion: "999.99.99"
    asserts:
      - matchRegexRaw:
          pattern: "Driver version: 999.99.99"

  - it: should list available profiles
    asserts:
      - matchRegexRaw:
          pattern: "a100, h100, b200, gb200, gb300, l40s, t4"

  # The plugin always excludes its release namespace, so a release in
  # "default" silently leaves every workload there without mock GPUs.
  - it: should warn when NRI excludes the default namespace
    release:
      namespace: default
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: this release is in the "default" namespace'

  - it: should name the excluded namespaces without warning in a dedicated one
    release:
      namespace: mokka
    asserts:
      - matchRegexRaw:
          pattern: "never do: mokka, kube-system\\."
      - notMatchRegexRaw:
          pattern: "WARNING"

  - it: should name the namespaces added to nri.excludedNamespaces
    release:
      namespace: mokka
    set:
      nri:
        excludedNamespaces: [team-a, team-b]
    asserts:
      - matchRegexRaw:
          pattern: "never do: mokka, kube-system, team-a, team-b\\."

  - it: should omit the NRI section when NRI is disabled
    release:
      namespace: default
    set:
      nri:
        enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: "NRI injection is on"
      - notMatchRegexRaw:
          pattern: "WARNING"

  - it: should contain all three option sections
    asserts:
      - matchRegexRaw:
          pattern: "OPTION A: NVIDIA Device Plugin"
      - matchRegexRaw:
          pattern: "OPTION B: NVIDIA DRA Driver"
      - matchRegexRaw:
          pattern: "OPTION C: GPU Operator"

  # Guards the OPTION C fix. The printed install must keep pointing at the
  # overlay the demo and docs use (tests/e2e/gpu-operator-values.yaml, which
  # currently matches the one CI installs through Tilt, though nothing
  # enforces that), must keep waiting for the operands, and must never go back
  # to the --set form that told users toolkit.enabled=true. The last two
  # asserts cover contracts the snapshot alone would guard, and `helm unittest
  # -u` launders a snapshot regression away without anyone noticing.
  - it: should install the GPU Operator from the tested values overlay
    asserts:
      - matchRegexRaw:
          pattern: "-f https://raw\\.githubusercontent\\.com/NVIDIA/k8s-test-infra/main/tests/e2e/gpu-operator-values\\.yaml"
      # --wait is bounded to the OPTION C section rather than pinned to a
      # timeout value: [^\u2501] cannot cross the box rule that separates
      # sections, so OPTION B's own --wait line cannot satisfy this.
      - matchRegexRaw:
          pattern: "OPTION C: GPU Operator[^\u2501]*--wait"
      # The pin must survive `helm unittest -u` too. The version is left open
      # so a bump touches only NOTES.txt and its snapshot; [^\u2501] keeps the
      # match inside OPTION C, away from the DRA driver's --version.
      - matchRegexRaw:
          pattern: "OPTION C: GPU Operator[^\u2501]*--version v[0-9]+\\.[0-9]+\\.[0-9]+"
      - notMatchRegexRaw:
          pattern: "--set toolkit\\.enabled"
      - notMatchRegexRaw:
          pattern: "Verified in CI"
      - matchRegexRaw:
          pattern: "guides/scenarios/nvidia-gpu-operator"
      - matchRegexRaw:
          pattern: "docs/guides/with-gpu-operator/"

  # OPTION C's prerequisite follows nodeAgent.containerRuntime: with the
  # setup on, the node daemon registers the handler the operator's pods use,
  # so there is none to name.
  - it: should name no cluster prerequisite when the node daemon prepares containerd
    asserts:
      # OPTION B, the DRA driver, keeps a prerequisite of its own.
      - notMatchRegexRaw:
          pattern: "OPTION C: GPU Operator[^━]*Cluster prerequisites"

  - it: should ask for containerd setup when the node daemon does not do it
    set:
      nodeAgent:
        containerRuntime:
          enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "OPTION C: GPU Operator[^━]*nodeAgent.containerRuntime is off, so each node needs\n  CDI enabled in containerd and the nvidia runtime handler registered"
      - notMatchRegexRaw:
          pattern: "--set toolkit\\.enabled"

  # An upgrade with --reuse-values from an earlier release renders the block
  # absent, which leaves the setup off.
  - it: should ask for containerd setup when the block is absent
    set:
      nodeAgent:
        containerRuntime: null
    asserts:
      - matchRegexRaw:
          pattern: "OPTION C: GPU Operator[^━]*nodeAgent.containerRuntime is off, so each node needs\n  CDI enabled in containerd and the nvidia runtime handler registered"

  # ComputeDomains need a board whose NVLink spans nodes; elsewhere the DRA
  # driver install keeps them off.
  - it: should enable ComputeDomains in the DRA install only on multi-node NVLink profiles
    set:
      gpu:
        profile: gb200
    asserts:
      - matchRegexRaw:
          pattern: "resources.computeDomains.enabled=true"
      - matchRegexRaw:
          pattern: "altProcDevices=/var/lib/nvml-mock/imex/proc-devices"

  - it: should keep ComputeDomains off and say why when NRI is disabled
    set:
      gpu:
        profile: gb200
      nri:
        enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "resources.computeDomains.enabled=false"
      - notMatchRegexRaw:
          pattern: "altProcDevices"
      - matchRegexRaw:
          pattern: "ComputeDomains are off: they need nri.enabled=true"

  - it: should keep ComputeDomains off in the DRA install on single-node NVLink profiles
    set:
      gpu:
        profile: h100
    asserts:
      - matchRegexRaw:
          pattern: "resources.computeDomains.enabled=false"
      - notMatchRegexRaw:
          pattern: "altProcDevices"
