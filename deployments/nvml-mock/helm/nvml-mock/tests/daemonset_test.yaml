suite: DaemonSet
templates:
  - templates/daemonset.yaml
tests:
  # ── Snapshots ───────────────────────────────────────────────────────
  - it: should match snapshot with default values
    asserts:
      - matchSnapshot: {}

  - it: should match snapshot with b200 profile
    set:
      gpu:
        profile: b200
        count: 4
    asserts:
      - matchSnapshot: {}

  - it: should match snapshot with all overrides
    release:
      name: custom
      namespace: gpu-system
    set:
      fullnameOverride: nvml-mock-custom
      image:
        repository: custom-registry/nvml-mock
        tag: v2.0.0
        pullPolicy: Always
      gpu:
        profile: h100
        count: 2
      driverVersion: "555.55.55"
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - matchSnapshot: {}

  # ── Assertions ──────────────────────────────────────────────────────
  - it: should render a DaemonSet with default values
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nvml-mock

  - it: should include standard labels
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: nvml-mock-0.3.0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: nvml-mock
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "550.163.01"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should set selector matchLabels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: nvml-mock
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should set pod template labels
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: nvml-mock
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should use the correct service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-nvml-mock

  - it: should render the default image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/nvidia/nvml-mock:latest"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should set the container as privileged
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true

  - it: should set the entrypoint command
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/scripts/entrypoint.sh"]

  - it: should set preStop lifecycle hook
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["/scripts/cleanup.sh"]

  # The default profile is gb300, whose device list is one NVL72 compute tray.
  - it: should set default GPU_COUNT env var to 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GPU_COUNT
            value: "4"

  - it: should set default DRIVER_VERSION for non-Blackwell profile
    set:
      gpu:
        profile: a100
        count: 8
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRIVER_VERSION
            value: "550.163.01"

  - it: should derive Blackwell driver version for b200 profile
    set:
      gpu:
        profile: b200
        count: 8
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRIVER_VERSION
            value: "560.35.03"

  - it: should derive Blackwell driver version for gb200 profile
    set:
      gpu:
        profile: gb200
        count: 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRIVER_VERSION
            value: "580.65.06"

  # ── NFD features.d mount (nodeLabels.featuresDir) ────────────────────
  # The node agent (containers[1]) writes the pci-10de feature file here.
  # Without its mount the write lands inside the container and NFD never sees
  # it, so that mount IS the contract. nvml-mock does not mount it: the pcibus
  # simulator is the only writer.
  - it: should mount the NFD features.d host directory
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-nfd-features
            mountPath: /host/etc/kubernetes/node-feature-discovery/features.d
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-nfd-features
            mountPath: /host/etc/kubernetes/node-feature-discovery/features.d
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-nfd-features
            hostPath:
              path: /etc/kubernetes/node-feature-discovery/features.d
              type: DirectoryOrCreate

  - it: should honour a custom nodeLabels.featuresDir
    set:
      nodeLabels:
        featuresDir: /custom/features.d
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-nfd-features
            hostPath:
              path: /custom/features.d
              type: DirectoryOrCreate

  # ── fabricmanager enablement (derived from the profile) ─────────────
  - it: should start fabricmanager for an auto-state profile (gb200)
    set:
      gpu:
        profile: gb200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state

  - it: should start fabricmanager for an NVSwitch profile (a100, legacy daemon)
    set:
      gpu:
        profile: a100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state

  - it: should honor an explicit fabricmanager.enabled=true override on a100
    set:
      gpu:
        profile: a100
      fabricmanager:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state

  - it: should honor an explicit fabricmanager.enabled=false override on gb200
    set:
      gpu:
        profile: gb200
      fabricmanager:
        enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state

  - it: should derive Blackwell Ultra driver version for gb300 profile
    set:
      gpu:
        profile: gb300
        count: 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRIVER_VERSION
            value: "570.124.06"

  - it: should use explicit driverVersion when provided
    set:
      driverVersion: "999.99.99"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRIVER_VERSION
            value: "999.99.99"

  - it: should set NODE_NAME from fieldRef
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

  - it: should point MOCK_NVML_CONFIG at the mounted ConfigMap
    # Without this env var, nvidia-smi run inside the daemonset pod (e.g.
    # `kubectl exec ds/nvml-mock -- nvidia-smi`) cannot locate the GPU
    # profile YAML and falls back to no-YAML defaults, surfacing as
    # `[N/A]` for temperature / power.
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_NVML_CONFIG
            value: /etc/nvml-mock/config.yaml

  - it: should override GPU_COUNT
    set:
      gpu:
        profile: a100
        count: 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GPU_COUNT
            value: "4"

  # ── GPU_COUNT derived from the profile devices list (count unset) ──────
  #
  # One case per device-list length the shipped profiles carry, so a derivation
  # replaced by any single constant fails here. The 4-GPU profiles alone would
  # all agree with a hardcoded 4.
  - it: should derive GPU_COUNT from the h100 profile devices list (8)
    set:
      gpu:
        profile: h100
        count: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GPU_COUNT
            value: "8"

  - it: should derive GPU_COUNT from the t4 profile devices list (4)
    set:
      gpu:
        profile: t4
        count: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GPU_COUNT
            value: "4"

  - it: should derive GPU_COUNT from the gb200 profile devices list (4)
    set:
      gpu:
        profile: gb200
        count: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GPU_COUNT
            value: "4"

  - it: should mount all required volumes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-nvml-mock
            mountPath: /host/var/lib/nvml-mock
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gpu-config
            mountPath: /etc/nvml-mock
      # Written by the cdi and gpudriver simulators, so only the agent mounts them.
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-cdi
            mountPath: /host/run/cdi
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-cdi
            mountPath: /host/var/run/cdi
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-run-nvidia
            mountPath: /host/run/nvidia

  - it: should define all required volumes
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-nvml-mock
            hostPath:
              path: /var/lib/nvml-mock
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gpu-config
            configMap:
              name: RELEASE-NAME-nvml-mock-config
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-cdi
            hostPath:
              path: /var/run/cdi
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-run-nvidia
            hostPath:
              path: /run/nvidia
              type: DirectoryOrCreate

  - it: should apply default tolerations
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            operator: Exists

  - it: should not set nodeSelector by default
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector

  - it: should apply custom nodeSelector
    set:
      nodeSelector:
        nvidia.com/gpu.present: "true"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["nvidia.com/gpu.present"]
          value: "true"

  - it: should apply custom tolerations
    set:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule

  - it: should not set resources by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: should apply resource limits and requests
    set:
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: should override image settings
    set:
      image:
        repository: custom-registry/nvml-mock
        tag: v1.2.3
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "custom-registry/nvml-mock:v1.2.3"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should respect nameOverride
    release:
      name: my-release
    set:
      nameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: my-release-custom-name

  - it: should respect fullnameOverride
    set:
      fullnameOverride: my-full-name
    asserts:
      - equal:
          path: metadata.name
          value: my-full-name
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-full-name

  # ── ConfigMap checksum annotation ───────────────────────────────────
  # The pod template carries a sha256 of the rendered GPU config so a
  # `helm upgrade` that flips a failureInjection / dynamicMetrics knob
  # rolls the DaemonSet without an explicit `kubectl rollout restart`.
  # The default-values snapshot above already pins the exact checksum
  # value byte-for-byte; these cases cover presence + format and
  # cross-toggle stability without coupling assertions to a specific
  # hash.
  - it: should annotate pods with a config checksum
    asserts:
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  - it: should keep the checksum well-formed when failureInjection is enabled
    set:
      gpu:
        failureInjection:
          enabled: true
          mode: lost
          after_calls: 1
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  - it: should keep the checksum well-formed when dynamicMetrics is enabled
    set:
      gpu:
        dynamicMetrics:
          enabled: true
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  # ── updateStrategy ──────────────────────────────────────────────────
  # Defaults are covered by the rendered-manifest snapshot above; these
  # cases only assert the override paths.
  - it: should accept maxUnavailable 100% override
    set:
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 100%
    asserts:
      - equal:
          path: spec.updateStrategy.rollingUpdate.maxUnavailable
          value: 100%

  - it: should respect a user-supplied updateStrategy override
    set:
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.updateStrategy.rollingUpdate.maxUnavailable
          value: 1

  - it: should accept OnDelete as an updateStrategy
    set:
      updateStrategy:
        type: OnDelete
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete

  # ── terminationGracePeriodSeconds ──────────────────────────────────
  # Default is asserted by the rendered-manifest snapshot above; only
  # the override path needs an explicit case here.
  - it: should respect terminationGracePeriodSeconds override
    set:
      terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0

  # ── InfiniBand ping mock ────────────────────────────────────────────
  - it: should set ping mock env, LD_PRELOAD, and containerPort
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_IB
            value: "full"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_IB_PING_FABRIC
            value: "1"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_IB_PING_PORT
            value: "18515"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_IB_PING_SOCKET
            value: /var/lib/nvml-mock/run/mock-ib.sock
      # Peer discovery inputs: read by the daemon the agent supervises.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_IB_PING_SERVICE_HOST
            value: RELEASE-NAME-nvml-mock-ibping.NAMESPACE.svc.cluster.local
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LD_PRELOAD
            value: /usr/local/lib/libibmockumad.so.1:/usr/local/lib/libibmockverbs.so.1:/usr/local/lib/libibmocksys.so.1:/usr/local/lib/libpcisysfs.so.1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_PCI_ROOT
            value: /var/lib/nvml-mock
      # The agent binds the fabric relay, so ibping is declared on node-agent.
      # Port names are unique per pod, so it cannot also sit on nvml-mock.
      - equal:
          path: spec.template.spec.containers[1].ports[1].name
          value: ibping
      - equal:
          path: spec.template.spec.containers[1].ports[1].containerPort
          value: 18515
      - equal:
          path: spec.template.spec.containers[1].ports[1].protocol
          value: TCP
      # nvml-mock binds nothing, so it declares no ports at all.
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: should disable ping mock (but keep sysfs masking) for profiles without InfiniBand
    set:
      gpu:
        profile: t4
    asserts:
      # sysfs (not off) so libibmocksys still masks any real host IB.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_IB
            value: "sysfs"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_IB_PING_FABRIC
            value: "0"
      - notExists:
          path: spec.template.spec.containers[0].ports
      # The agent keeps its health port but declares no fabric relay.
      - equal:
          path: spec.template.spec.containers[1].ports[0].name
          value: health
      - notExists:
          path: spec.template.spec.containers[1].ports[1]

  - it: should honor a custom ping port
    set:
      infiniband:
        ping:
          port: 19000
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_IB_PING_PORT
            value: "19000"
      - equal:
          path: spec.template.spec.containers[1].ports[1].containerPort
          value: 19000

  - it: should let infiniband.mockTier override the derived MOCK_IB tier
    set:
      infiniband:
        mockTier: sysfs
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_IB
            value: "sysfs"

  - it: should let infiniband.mockTier force MOCK_IB off on an IB profile
    set:
      infiniband:
        mockTier: "off"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_IB
            value: "off"

  - it: should let infiniband.mockTier force MOCK_IB full on a non-IB profile
    set:
      gpu:
        profile: t4
      infiniband:
        mockTier: full
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_IB
            value: "full"

  - it: should reject an invalid infiniband.mockTier
    set:
      infiniband:
        mockTier: bogus
    asserts:
      - failedTemplate:
          errorMessage: "infiniband.mockTier must be one of off, sysfs, full (got \"bogus\")"

  # ── Fake fabricmanager (NVSwitch platforms) ─────────────────────────
  - it: should not wire fabricmanager for a non-NVSwitch profile (t4)
    set:
      gpu:
        profile: t4
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state

  # b200 declares NVLink but no NVSwitches, so no state dir is created on the
  # node. Leaving node-agent's env unset keeps that mount out of its CDI spec;
  # emitting it would fail creation of every CDI consumer on the node.
  - it: should not wire fabricmanager for an NVLink profile without NVSwitches (b200)
    set:
      gpu:
        profile: b200
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state

  - it: should wire fabricmanager state dir into both containers when enabled
    set:
      fabricmanager:
        enabled: true
    asserts:
      # nvml-mock: the engine reads the marker so `kubectl exec nvidia-smi -q`
      # reports the same fabric state a workload sees.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state
      # node-agent: non-empty is what enables the simulator, and it is the path
      # the cdi simulator mounts into workloads.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /var/lib/nvml-mock/fabric-state
      # No dedicated volume: the directory sits under the host-nvml-mock
      # hostPath both containers already mount, and the agent creates it.
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: host-fabric-state

  - it: should withhold readiness for fabricmanager.initDelay
    set:
      fabricmanager:
        enabled: true
        initDelay: 15s
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_FABRICMANAGER_INIT_DELAY
            value: "15s"

  - it: should publish readiness immediately when no initDelay is set
    set:
      fabricmanager:
        enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_FABRICMANAGER_INIT_DELAY

  - it: should honor a custom fabricmanager.stateDir
    set:
      fabricmanager:
        enabled: true
        stateDir: /run/nvidia-fabricmanager
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /run/nvidia-fabricmanager
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: MOCK_FABRICMANAGER_STATE_DIR
            value: /run/nvidia-fabricmanager

  # ── Node Agent ──────────────────────────────────────────────────────
  - it: should always run the node-agent sidecar
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: node-agent
      - contains:
          path: spec.template.spec.containers[1].command
          content: --log-level=info
      - contains:
          path: spec.template.spec.containers[1].command
          content: --log-format=json
      - contains:
          path: spec.template.spec.containers[1].command
          content: --shutdown-timeout=30s

  # CDI specs are written to h.Run/cdi/ = /host/run/cdi/. Without this mount the
  # writes land in the container overlayfs and containerd never sees the specs.
  - it: node-agent should mount the CDI spec directory
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-cdi
            mountPath: /host/run/cdi

  - it: should honour node-agent logging and timeout overrides
    set:
      nodeAgent:
        logging:
          level: debug
          format: plain
        shutdownTimeout: 60s
    asserts:
      - contains:
          path: spec.template.spec.containers[1].command
          content: --log-level=debug
      - contains:
          path: spec.template.spec.containers[1].command
          content: --log-format=plain
      - contains:
          path: spec.template.spec.containers[1].command
          content: --shutdown-timeout=60s

  # ── Allocation watcher (#506) ───────────────────────────────────────
  - it: should not run the allocation watcher by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: host-pod-resources
            hostPath:
              path: /var/lib/kubelet/pod-resources
              type: Directory

  - it: should add the allocation watcher sidecar and its socket mount when enabled
    set:
      allocationWatcher:
        enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 3
      - equal:
          path: spec.template.spec.containers[2].name
          value: allocation-watcher
      # The image installs the binary at /usr/local/bin. A wrong path here is
      # a CrashLoop that no unit test outside the chart would catch.
      - equal:
          path: spec.template.spec.containers[2].command[0]
          value: /usr/local/bin/nvml-mock-ctl
      - equal:
          path: spec.template.spec.containers[2].command[1]
          value: watch-allocations
      - contains:
          path: spec.template.spec.containers[2].volumeMounts
          content:
            name: host-pod-resources
            mountPath: /var/lib/kubelet/pod-resources
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-pod-resources
            hostPath:
              path: /var/lib/kubelet/pod-resources
              type: Directory
      # It writes only into the driver root; the socket is read-only and the
      # container drops every capability.
      - equal:
          path: spec.template.spec.containers[2].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[2].securityContext.allowPrivilegeEscalation
          value: false

  - it: should thread the poll interval and per-claim fraction into the watcher argv
    set:
      allocationWatcher:
        enabled: true
        interval: 500ms
        usedFractionPerClaim: 0.25
    asserts:
      - contains:
          path: spec.template.spec.containers[2].command
          content: --interval=500ms
      - contains:
          path: spec.template.spec.containers[2].command
          content: --used-fraction=0.25

  - it: should follow a custom pod-resources socket path into both mount and volume
    set:
      allocationWatcher:
        enabled: true
        podResourcesSocket: /var/lib/k0s/kubelet/pod-resources/kubelet.sock
    asserts:
      - contains:
          path: spec.template.spec.containers[2].command
          content: --socket=/var/lib/k0s/kubelet/pod-resources/kubelet.sock
      - contains:
          path: spec.template.spec.containers[2].volumeMounts
          content:
            name: host-pod-resources
            mountPath: /var/lib/k0s/kubelet/pod-resources
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-pod-resources
            hostPath:
              path: /var/lib/k0s/kubelet/pod-resources
              type: Directory
