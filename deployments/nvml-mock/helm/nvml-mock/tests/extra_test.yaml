suite: Extra objects
templates:
  - templates/extra.yaml
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render list entries as templated objects
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-extra"
          data:
            chart: "{{ .Chart.Name }}"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-extra
      - equal:
          path: data.chart
          value: nvml-mock

  # Templating the object as one YAML document would splice the evaluated
  # value into scalars quoted before evaluation, so a quote breaks the render
  # and a newline gets folded.
  - it: should keep templated object values verbatim
    set:
      password: it's "secret"
      script: |
        line one
        line two
      extraObjects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: extra
          stringData:
            password: "{{ .Values.password }}"
            script: "{{ .Values.script }}"
    asserts:
      - equal:
          path: stringData.password
          value: it's "secret"
      - equal:
          path: stringData.script
          value: |
            line one
            line two

  - it: should render string entries through tpl
    set:
      extraObjects:
        - |
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ .Release.Name }}-pull
          type: kubernetes.io/dockerconfigjson
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pull

  # A map lets values files from several layers add or override entries by
  # key; the keys are rendered in sorted order so output is stable.
  - it: should render map entries in key order
    set:
      extraObjects:
        b-second:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: second
        a-first:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: first
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: first
        documentIndex: 0
      - equal:
          path: metadata.name
          value: second
        documentIndex: 1

  # An empty string lets a layered values file switch off an entry it
  # inherited, without having to know how the rest of the map is shaped.
  - it: should skip entries that render empty
    set:
      extraObjects:
        disabled: ""
        kept:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kept
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: kept

  - it: should reject an entry that is neither a map nor a string
    set:
      extraObjects:
        - 42
    asserts:
      - failedTemplate:
          errorMessage: "extraObjects[0]: expected a map or a string, got float64"
