suite: IB ping Service
templates:
  - templates/service-ibping.yaml
# Render against a fixed chart version so releasing a new chart never
# rewrites expectations or snapshots here.
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  - it: should render a headless Service
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nvml-mock-ibping
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: nvml-mock
      # The NRI plugin shares these pods; the numeric target also works when
      # node-agent is a restartable init container on Kubernetes 1.29-1.31.
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: daemon
      - notExists:
          path: spec.selector["app.kubernetes.io/instance"]
      - equal:
          path: spec.ports[0].name
          value: ibping
      - equal:
          path: spec.ports[0].port
          value: 18515
      - equal:
          path: spec.ports[0].targetPort
          value: 18515
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: should publish only ready addresses without the NRI sidecar
    set:
      nri:
        enabled: false
    asserts:
      - notExists:
          path: spec.publishNotReadyAddresses

  - it: should keep the relay discoverable when only the NRI sidecar is unready
    capabilities:
      majorVersion: 1
      minorVersion: 29
    set:
      nri:
        enabled: true
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - equal:
          path: spec.ports[0].targetPort
          value: 18515

  - it: should use a custom ping port
    set:
      infiniband:
        ping:
          port: 19000
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 19000
      - equal:
          path: spec.ports[0].targetPort
          value: 19000

  - it: should not render for profiles without InfiniBand
    set:
      gpu:
        profile: t4
    asserts:
      - hasDocuments:
          count: 0
