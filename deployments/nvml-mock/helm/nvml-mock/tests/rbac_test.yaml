suite: RBAC
templates:
  - templates/rbac.yaml
# Render against a fixed chart version so releasing a new chart never
# rewrites expectations or snapshots here.
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  # ── Snapshots ───────────────────────────────────────────────────────
  - it: should match ServiceAccount snapshot
    documentIndex: 0
    asserts:
      - matchSnapshot: {}

  - it: should create a ServiceAccount
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nvml-mock

  - it: should include standard labels on ServiceAccount
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: nvml-mock
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # The chart grants no cluster permissions, since GPU node labels belong to
  # NFD and GFD. The node agent may only record Events in its namespace.
  - it: should render the ServiceAccount and the node agent's Events Role
    asserts:
      - hasDocuments:
          count: 3

  - it: should let the node agent record Events and nothing else
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]

  - it: should bind the Events Role to the ServiceAccount
    documentIndex: 2
    release:
      namespace: mokka
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-nvml-mock-node-agent
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-nvml-mock
              namespace: mokka

  - it: should respect fullnameOverride across all RBAC resources
    set:
      fullnameOverride: custom-rbac
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: custom-rbac
