suite: RBAC
templates:
  - templates/rbac.yaml
tests:
  # ── Snapshots ───────────────────────────────────────────────────────
  - it: should match ServiceAccount snapshot
    documentIndex: 0
    asserts:
      - matchSnapshot: {}

  - it: should create a ServiceAccount
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nvml-mock

  - it: should include standard labels on ServiceAccount
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: nvml-mock-0.3.0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: nvml-mock
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # The chart grants no cluster permissions: nothing in the pod calls the K8s
  # API, and GPU node labels belong to NFD and GFD.
  - it: should render only the ServiceAccount
    asserts:
      - hasDocuments:
          count: 1

  - it: should respect fullnameOverride across all RBAC resources
    set:
      fullnameOverride: custom-rbac
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: custom-rbac
