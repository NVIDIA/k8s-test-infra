# MIG profile table: VR NVL72 (Rubin)
#
# The board's MIG partition geometry, held apart from its profile so the
# profile stays readable. Resolved at load time via MOCK_MIG_PROFILES_CONFIG
# or as a sibling of the config path, and attached to
# device_defaults.mig.supported_profiles.

version: 1

# Every GPU instance row is read off a real tray with MIG capable and
# disabled: names, ids and placements from `nvidia-smi mig -lgip`/`-lgipp`,
# memory, SM and engine counts from nvmlDeviceGetGpuInstanceProfileInfo. All
# four GPUs report the same table.
#
# Assumption: with MIG disabled the tray lists no compute instance profiles,
# so each GPU instance declares a single compute instance spanning it, the
# layout nvidia-mig-parted creates by default.
#
# Placements are in memory units: the board has eight, so the full-board row
# is one {start: 0, size: 8}. NO_ME rows have no media engines, ALL_ME rows
# take every media engine of the board. See docs/mig.md for the schema.
supported_profiles:
  - name: "1g.35gb"
    nvml_profile: "1_SLICE"
    slices: 1
    profile_id: 19
    instances: 7
    memory_mb: 34304
    multiprocessors: 20
    copy_engines: 2
    decoders: 1
    jpeg: 1
    placements:
      - {start: 0, size: 1}
      - {start: 1, size: 1}
      - {start: 2, size: 1}
      - {start: 3, size: 1}
      - {start: 4, size: 1}
      - {start: 5, size: 1}
      - {start: 6, size: 1}
    compute_instances:
      - nvml_profile: "1_SLICE"
        slices: 1
        instances: 1
        multiprocessors: 20
        shared_copy_engines: 2
        decoders: 1
        jpeg: 1
