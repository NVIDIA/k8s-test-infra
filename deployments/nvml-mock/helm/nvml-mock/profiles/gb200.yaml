# Mock NVML Configuration: GB200 NVL (Grace-Blackwell Superchip)
# Full configuration for nvidia-smi -x -q compatibility
# Use: export MOCK_NVML_CONFIG=/path/to/this/file.yaml

version: "1.0"

# =============================================================================
# System-level configuration
# =============================================================================
system:
  driver_version: "580.65.06"
  nvml_version: "13.580.65"
  cuda_version: "13.0"
  cuda_version_major: 13
  cuda_version_minor: 0

# Helm-only dynamic-metrics defaults (engine ignores this key). Used when
# gpu.dynamicMetrics.enabled=true; base sits inside the power limits so it varies.
dynamic_metrics_defaults:
  power:
    base_mw: 600000                 # 600W, within [400W, 1200W]
    variance_mw: 50000

# =============================================================================
# Default device configuration (applied to all devices unless overridden)
# =============================================================================
device_defaults:
  # ---------------------------------------------------------------------------
  # Basic identification
  # ---------------------------------------------------------------------------
  name: "NVIDIA GB200"
  brand: "nvidia"
  serial: "1562849103750"
  board_part_number: "699-2G530-0200-000"
  vbios_version: "96.00.9E.00.01"

  # ---------------------------------------------------------------------------
  # Architecture
  # ---------------------------------------------------------------------------
  architecture: "blackwell"
  compute_capability:
    major: 10
    minor: 0
  num_gpu_cores: 18432              # Blackwell has more CUDA cores

  # ---------------------------------------------------------------------------
  # NVLink fabric (GB200 ComputeDomain). The clique_id / cluster_uuid below
  # are placeholder defaults; the topology-overlay step in the engine
  # rewrites them per-node based on the cluster-level topology ConfigMap
  # (set Helm value `topology.enabled=true`). Nodes that don't appear in
  # the topology fall through to these defaults, which is sufficient for
  # single-node experiments. See pkg/gpu/mocknvml/engine/fabric.go.
  # ---------------------------------------------------------------------------
  fabric:
    cluster_uuid: "00000000-0000-0000-0000-000000000001"
    clique_id: 0
    state: "auto"                   # couple GPU fabric registration to fake fabricmanager readiness
    # Health defaults to a healthy fabric (nvidia-smi -q reports Summary:
    # Healthy, Bandwidth: Full). Add a `health:` block to fault a specific
    # condition, or use `nvml-mock-ctl fabric-health` at runtime.
    # See docs/configuration.md#fabric-health.

  # ---------------------------------------------------------------------------
  # Platform identity — where this node sits in the NVL72 rack, which
  # nvidia-smi -q renders as its "Platform Info" block and rack-scale fault
  # correlation reads to turn a GPU fault into a physical location.
  #
  # Every field but module_id describes the node, so all its GPUs share them:
  # a node occupies one tray, in one slot, of one chassis. Only module_id
  # ("ID of this GPU within the node") is set per device below.
  #
  # slot_number counts switch trays as well as compute trays while tray_index
  # counts compute trays only, so slot runs ahead of tray for a tray sitting
  # above the rack's nine switch trays: compute tray 11 lands in slot 21.
  # ---------------------------------------------------------------------------
  platform:
    chassis_serial_number: "1822725100200"
    slot_number: 21
    tray_index: 11
    host_id: 1                      # first of the tray's two OS domains
    peer_type: "switch_connected"   # peers reached through the NVSwitch trays

  # ---------------------------------------------------------------------------
  # InfoROM versions
  # ---------------------------------------------------------------------------
  inforom:
    image_version: "G530.0200.00.01"
    oem_object: "2.1"
    ecc_object: "7.16"
    pwr_object: "1.0"

  # ---------------------------------------------------------------------------
  # Memory configuration - 192 GiB HBM3e per GPU
  # ---------------------------------------------------------------------------
  memory:
    total_bytes: 206158430208       # 192 GiB HBM3e
    reserved_bytes: 1073741824      # ~1 GiB reserved
    free_bytes: 205084688384        # total - reserved at idle
    used_bytes: 0
    memory_bus_width: 8192

  bar1_memory:
    total_bytes: 549755813888       # 512 GiB (unified memory with Grace)
    free_bytes: 549755813888
    used_bytes: 0

  # ---------------------------------------------------------------------------
  # PCI configuration
  # ---------------------------------------------------------------------------
  pci:
    device_id: 0x234110DE
    subsystem_id: 0x181710DE

  pcie:
    max_link_gen: 6                 # PCIe Gen6 (or NVLink-C2C to Grace)
    current_link_gen: 6
    max_link_width: 16              # x16
    current_link_width: 16
    replay_counter: 0
    tx_throughput_kbps: 0
    rx_throughput_kbps: 0

  # ---------------------------------------------------------------------------
  # Power configuration - GB200 is much higher power
  # ---------------------------------------------------------------------------
  power:
    management_supported: true
    management_mode: "enabled"
    default_limit_mw: 1000000       # 1000W (full superchip)
    enforced_limit_mw: 1000000
    min_limit_mw: 400000            # 400W minimum
    max_limit_mw: 1200000           # 1200W boost
    current_draw_mw: 145000         # 145W idle
    power_state: "P0"
    total_energy_consumption_mj: 1000000  # millijoules since boot

  # ---------------------------------------------------------------------------
  # Thermal configuration
  # ---------------------------------------------------------------------------
  thermal:
    temperature_gpu_c: 36           # Idle temperature (liquid cooled)
    temperature_memory_c: 34
    shutdown_threshold_c: 95
    slowdown_threshold_c: 90
    max_operating_c: 85
    target_temperature_c: 85

  # ---------------------------------------------------------------------------
  # Fan configuration (N/A - liquid cooled)
  # ---------------------------------------------------------------------------
  fan:
    count: 0                        # Liquid cooled, no fans
    speed_percent: "N/A"
    target_speed_percent: "N/A"

  # ---------------------------------------------------------------------------
  # Clock speeds (MHz) - Blackwell has higher clocks
  # ---------------------------------------------------------------------------
  clocks:
    graphics_current: 345           # Idle
    graphics_max: 2100              # Boost
    graphics_app: 2100
    graphics_app_default: 2100
    sm_current: 345
    sm_max: 2100
    memory_current: 2500            # HBM3e
    memory_max: 2500
    memory_app: 2500
    memory_app_default: 2500
    video_current: 1200
    video_max: 2100

  # ---------------------------------------------------------------------------
  # Clocks throttle reasons
  # ---------------------------------------------------------------------------
  clocks_throttle_reasons:
    gpu_idle: true
    applications_clocks_setting: false
    sw_power_cap: false
    hw_slowdown: false
    hw_thermal_slowdown: false
    hw_power_brake_slowdown: false
    sync_boost: false
    sw_thermal_slowdown: false
    display_clocks_setting: false

  # ---------------------------------------------------------------------------
  # Supported clocks
  # ---------------------------------------------------------------------------
  supported_clocks:
    memory_clocks:
      - freq_mhz: 2500
        graphics_clocks: [345, 690, 1035, 1380, 1725, 1890, 2100]

  # ---------------------------------------------------------------------------
  # Performance state
  # ---------------------------------------------------------------------------
  performance_state: "P0"

  # ---------------------------------------------------------------------------
  # Utilization (percentage, 0-100)
  # ---------------------------------------------------------------------------
  utilization:
    gpu: 0
    memory: 0
    encoder: 0
    decoder: 0
    jpeg: 0
    ofa: 0

  # ---------------------------------------------------------------------------
  # Dynamic utilization (#506)
  #
  # Live without any Helm overlay, so `utilization.gpu` -- and every
  # DCGM_FI_PROF_* fraction derived from it -- is never a constant 0.
  # The driver is elapsed time, NOT workload: these numbers move on a fully
  # idle node and do not rise under load. gpu_min is deliberately > 0 so
  # "utilization is reported" is a deterministic assertion, not a flaky one.
  # ---------------------------------------------------------------------------
  dynamic_metrics:
    utilization:
      pattern: "steady"
      gpu_min: 10
      gpu_max: 45
      memory_min: 5
      memory_max: 25

  # ---------------------------------------------------------------------------
  # Encoder/Decoder statistics
  # ---------------------------------------------------------------------------
  encoder_stats:
    session_count: 0
    average_fps: 0
    average_latency_us: 0

  fbc_stats:
    session_count: 0
    average_fps: 0
    average_latency_us: 0

  # ---------------------------------------------------------------------------
  # ECC configuration
  # ---------------------------------------------------------------------------
  ecc:
    mode_current: "enabled"
    mode_pending: "enabled"
    default_mode: "enabled"
    errors:
      volatile:
        single_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
        double_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
      aggregate:
        single_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
        double_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0

  # ---------------------------------------------------------------------------
  # Retired pages
  # ---------------------------------------------------------------------------
  retired_pages:
    single_bit_retirement:
      count: 0
      addresses: []
    double_bit_retirement:
      count: 0
      addresses: []
    pending_blacklist: false
    pending_retirement: false

  # ---------------------------------------------------------------------------
  # Remapped rows
  # ---------------------------------------------------------------------------
  remapped_rows:
    correctable: 0
    uncorrectable: 0
    pending: false
    failure_occurred: false
    # Bank remap availability: every bank still holds its full complement of
    # spare rows, which is what a GPU that has never remapped reports. Row
    # remapping is Ampere and later, so a pre-Ampere profile (t4) omits this
    # block and the mock reports the histogram unsupported, as that hardware
    # does. The bank count follows the 16-banks-per-GiB ratio a real 40 GiB
    # A100 reports.
    availability_histogram:
      max: 3072
      high: 0
      partial: 0
      low: 0
      none: 0

  # ---------------------------------------------------------------------------
  # Display configuration
  # ---------------------------------------------------------------------------
  display:
    mode: "disabled"
    active: "disabled"

  # ---------------------------------------------------------------------------
  # Persistence mode
  # ---------------------------------------------------------------------------
  persistence_mode: "enabled"

  # ---------------------------------------------------------------------------
  # Compute mode
  # ---------------------------------------------------------------------------
  compute_mode: "default"

  # ---------------------------------------------------------------------------
  # MIG configuration - GB200 supports MIG
  # ---------------------------------------------------------------------------
  mig:
    mode_current: "disabled"
    mode_pending: "disabled"
    max_gpu_instances: 7

  # ---------------------------------------------------------------------------
  # GPU operation mode (GOM)
  # ---------------------------------------------------------------------------
  gpu_operation_mode:
    current: "all_on"
    pending: "all_on"

  # ---------------------------------------------------------------------------
  # Driver model (Windows only)
  # ---------------------------------------------------------------------------
  driver_model:
    current: "N/A"
    pending: "N/A"

  # ---------------------------------------------------------------------------
  # Accounting mode
  # ---------------------------------------------------------------------------
  accounting:
    mode: "disabled"
    buffer_size: 4000

  # ---------------------------------------------------------------------------
  # Virtualization
  # ---------------------------------------------------------------------------
  virtualization:
    mode: "none"
    host_vgpu_mode: "N/A"

  # ---------------------------------------------------------------------------
  # GSP Firmware
  # ---------------------------------------------------------------------------
  gsp_firmware:
    mode: "enabled"
    version: "580.65.06"

  # ---------------------------------------------------------------------------
  # Blackwell-specific features
  # ---------------------------------------------------------------------------
  features:
    transformer_engine: true        # 2nd gen Transformer Engine
    fp4_support: true               # FP4 precision support
    fp8_support: true               # FP8 precision support
    confidential_compute: true      # CC/TEE support
    nvlink_c2c: true                # NVLink Chip-to-Chip (Grace connection)
    decompression_engine: true      # Hardware decompression
    fifth_gen_tensor_cores: true    # 5th generation tensor cores

  # ---------------------------------------------------------------------------
  # Grace CPU pairing (GB200 specific)
  # ---------------------------------------------------------------------------
  grace_superchip:
    enabled: true
    cpu_cores: 72                   # Grace CPU cores
    cpu_memory_gb: 480              # LPDDR5X per Grace CPU
    coherent_memory: true           # NVLink-C2C coherent memory

  # ---------------------------------------------------------------------------
  # Processes (empty at idle)
  # ---------------------------------------------------------------------------
  processes: []

# =============================================================================
# Device-specific overrides
# GB200 NVL72 has 72 GPUs, but we'll define 8 for testing
# In a real GB200 system, GPUs are paired in superchips with Grace CPUs
# =============================================================================
devices:
  - index: 0
    uuid: "GPU-b200b200-0000-0000-0000-000000000000"
    serial: "1562849103700"
    pci:
      bus_id: "0000:0A:00.0"
    minor_number: 0
    grace_cpu_pair: 0               # Paired with Grace CPU 0
    platform:
      module_id: 1                  # ID of this GPU within the node

  - index: 1
    uuid: "GPU-b200b200-0000-0000-0000-000000000001"
    serial: "1562849103701"
    pci:
      bus_id: "0000:0B:00.0"
    minor_number: 1
    grace_cpu_pair: 0               # Same superchip as GPU 0
    platform:
      module_id: 2

  - index: 2
    uuid: "GPU-b200b200-0000-0000-0000-000000000002"
    serial: "1562849103702"
    pci:
      bus_id: "0000:4A:00.0"
    minor_number: 2
    grace_cpu_pair: 1
    platform:
      module_id: 3

  - index: 3
    uuid: "GPU-b200b200-0000-0000-0000-000000000003"
    serial: "1562849103703"
    pci:
      bus_id: "0000:4B:00.0"
    minor_number: 3
    grace_cpu_pair: 1
    platform:
      module_id: 4

  - index: 4
    uuid: "GPU-b200b200-0000-0000-0000-000000000004"
    serial: "1562849103704"
    pci:
      bus_id: "0000:8A:00.0"
    minor_number: 4
    grace_cpu_pair: 2
    platform:
      module_id: 5

  - index: 5
    uuid: "GPU-b200b200-0000-0000-0000-000000000005"
    serial: "1562849103705"
    pci:
      bus_id: "0000:8B:00.0"
    minor_number: 5
    grace_cpu_pair: 2
    platform:
      module_id: 6

  - index: 6
    uuid: "GPU-b200b200-0000-0000-0000-000000000006"
    serial: "1562849103706"
    pci:
      bus_id: "0000:CA:00.0"
    minor_number: 6
    grace_cpu_pair: 3
    platform:
      module_id: 7

  - index: 7
    uuid: "GPU-b200b200-0000-0000-0000-000000000007"
    serial: "1562849103707"
    pci:
      bus_id: "0000:CB:00.0"
    minor_number: 7
    grace_cpu_pair: 3
    platform:
      module_id: 8

# =============================================================================
# NVLink topology - GB200 uses NVLink 5.0
# =============================================================================
nvlink:
  version: 5
  links_per_gpu: 18
  bandwidth_per_link_mbps: 53125    # NVLink5 53.125 GB/s/link unidirectional (`nvlink -s`); 18 links ~= 0.95 TB/s/GPU (1.8 TB/s bidir)
  c2c_enabled: true                 # NVLink-C2C to Grace CPU
  # Switch-link auto-expansion: because switches are declared and
  # links_per_gpu > 0 (and no explicit per-device links exist), the engine
  # synthesizes 18 active links per GPU fanned round-robin across these
  # NVSwitches. Every switch-attached link reaches all peers through the
  # shared fabric, so `nvidia-smi topo -m` shows NV18 between every GPU pair.
  # Fabric-manager readiness is coupled via device_defaults.fabric.state: auto.
  switches:
    - bdf: "0000:01:00.0"
      uuid: "NVSwitch-GB200-0000-0000-0000-000000000000"
    - bdf: "0000:02:00.0"
      uuid: "NVSwitch-GB200-0000-0000-0000-000000000001"
    - bdf: "0000:03:00.0"
      uuid: "NVSwitch-GB200-0000-0000-0000-000000000002"
    - bdf: "0000:04:00.0"
      uuid: "NVSwitch-GB200-0000-0000-0000-000000000003"

# =============================================================================
# InfiniBand topology - 1 ConnectX-7 NDR HCA per GPU (typical GB200 NVL72)
# =============================================================================
infiniband:
  enabled: true
  hca_type: "MT4129"
  fw_version: "28.40.1000"
  hw_rev: "0x0"
  board_id: "MT_0000000838"
  link_layer: "InfiniBand"
  rate_gbps: 400
  port_state: "ACTIVE"
  phys_state: "LinkUp"
  hcas_per_gpu: 1
  guid_prefix: "9b88c2:0300:ab"
  node_desc_template: "{node_name} mlx5_{idx}"

# =============================================================================
# PCIe topology - GB200, 4 Grace CPU pairs -> 4 NUMA nodes, 2 GPUs each.
# Consumed by `render-pci-sysfs` to materialize a fake /sys/bus/pci tree
# under MOCK_PCI_ROOT. C consumers such as `lspci` resolve the PCIe root
# complex through these symlinks. The NVIDIA DRA driver does NOT: it is a
# Go binary, and Go's os package issues raw syscalls that the LD_PRELOAD
# shim cannot intercept, so `dra.k8s.io/pcieRoot` stays absent from the
# ResourceSlices it publishes. See issue #265.
# =============================================================================
pcie_topology:
  root_complexes:
    - id: "pci0000:00"
      numa_node: 0
      devices:
        - "0000:0A:00.0"
        - "0000:0B:00.0"
    - id: "pci0000:40"
      numa_node: 1
      devices:
        - "0000:4A:00.0"
        - "0000:4B:00.0"
    - id: "pci0000:80"
      numa_node: 2
      devices:
        - "0000:8A:00.0"
        - "0000:8B:00.0"
    - id: "pci0000:c0"
      numa_node: 3
      devices:
        - "0000:CA:00.0"
        - "0000:CB:00.0"
