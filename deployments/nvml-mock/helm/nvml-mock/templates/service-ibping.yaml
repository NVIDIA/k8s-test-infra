{{- if eq (include "nvml-mock.infinibandEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvml-mock.fullname" . }}-ibping
  labels:
    {{- include "nvml-mock.labels" . | nindent 4 }}
spec:
  # Headless: DNS returns node DaemonSet pod IPs for peer discovery. The NRI
  # sidecar shares those pods, while targetPort still resolves only the named
  # ibping port exposed by the node-agent container.
  clusterIP: None
  {{- if .Values.nri.enabled }}
  # NRI contributes pod readiness but does not serve the relay. Keep a healthy
  # node-agent discoverable when only its NRI peer is unready.
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "nvml-mock.name" . }}
    app.kubernetes.io/component: daemon
  ports:
    - name: ibping
      port: {{ .Values.infiniband.ping.port }}
      targetPort: ibping
      protocol: TCP
{{- end }}
