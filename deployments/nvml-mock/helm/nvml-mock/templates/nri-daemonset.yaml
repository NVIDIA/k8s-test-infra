{{- if .Values.nri.enabled }}
{{- $image := mergeOverwrite (deepCopy .Values.image) (.Values.nri.image | default dict) }}
{{- $socketDir := dir .Values.nri.socketPath }}
{{- if not (has .Values.nri.deviceInjectionMode (list "raw" "cdi")) }}
{{- fail (printf "nri.deviceInjectionMode must be \"raw\" or \"cdi\", got %q" .Values.nri.deviceInjectionMode) }}
{{- end }}
# Copyright 2026 NVIDIA CORPORATION
# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nvml-mock.fullname" . }}-nri
  labels:
    {{- include "nvml-mock.nriLabels" . | nindent 4 }}
    app.kubernetes.io/component: nri
spec:
  selector:
    matchLabels:
      {{- include "nvml-mock.nriSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nri
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "nvml-mock.nriSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nri
    spec:
      serviceAccountName: {{ include "nvml-mock.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nvml-mock-nri
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          command: ["/usr/local/bin/nri-plugin"]
          args:
            - --socket-path={{ .Values.nri.socketPath }}
            - --plugin-name={{ .Values.nri.pluginName }}
            - --plugin-index={{ .Values.nri.pluginIndex }}
            - --overlay-host-path={{ .Values.nri.overlay.hostPath }}
            - --overlay-mount-path={{ .Values.nri.overlay.mountPath }}
            - --device-host-path={{ .Values.nri.overlay.hostPath }}/driver/dev
            - --opt-out-annotation={{ .Values.nri.optOutAnnotation }}
            - --device-annotation={{ .Values.nri.deviceAnnotation }}
            - --device-injection-mode={{ .Values.nri.deviceInjectionMode }}
            - --cdi-spec-host-path={{ .Values.nri.cdiSpecDir }}/nvml-mock-nri.yaml
            # Mock IMEX channel delivery (#437). The nodes are staged by the
            # main DaemonSet under imex.mockChannels; the plugin only injects
            # them into pods carrying this annotation. Harmless when
            # imex.mockChannels is disabled: the tree is absent, the plugin
            # warns and injects everything else.
            - --imex-channel-annotation={{ .Values.nri.imexChannelAnnotation }}
            - --imex-channel-host-path={{ .Values.nri.overlay.hostPath }}/driver/dev/nvidia-caps-imex-channels
            - --excluded-namespaces={{ .Release.Namespace }},kube-system{{- range .Values.nri.excludedNamespaces }},{{ . }}{{- end }}
            # NODE_NAME (below) gates ComputeDomain topology injection: when
            # topology.enabled stages a topology document into the overlay,
            # the plugin injects NODE_NAME + MOCK_TOPOLOGY_CONFIG into each
            # workload so its mock GPUs report this node's clique / cluster
            # UUID. Harmless when topology is disabled (no document to stage).
            - --node-name=$(NODE_NAME)
            - --health-addr=:{{ .Values.nri.healthPort }}
            - --log-level={{ .Values.nri.logging.level }}
            - --log-format={{ .Values.nri.logging.format }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: {{ .Values.nri.healthPort }}
              protocol: TCP
          {{- with .Values.nri.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nri.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          {{- with .Values.nri.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nri-socket-dir
              mountPath: {{ $socketDir }}
            - name: nvml-mock-overlay
              mountPath: {{ .Values.nri.overlay.hostPath }}
              readOnly: true
            # Read-only so the plugin can confirm its CDI spec is staged before
            # it emits a reference. The runtime, not the plugin, resolves the
            # spec; an unresolvable CDI device fails container creation, so the
            # check is what keeps cdi mode degrading to raw instead of blocking
            # the pod.
            - name: cdi-specs
              mountPath: {{ .Values.nri.cdiSpecDir }}
              readOnly: true
      volumes:
        - name: nri-socket-dir
          hostPath:
            path: {{ $socketDir }}
            type: DirectoryOrCreate
        - name: nvml-mock-overlay
          hostPath:
            path: {{ .Values.nri.overlay.hostPath }}
            type: DirectoryOrCreate
        - name: cdi-specs
          hostPath:
            path: {{ .Values.nri.cdiSpecDir }}
            type: DirectoryOrCreate
{{- end }}
