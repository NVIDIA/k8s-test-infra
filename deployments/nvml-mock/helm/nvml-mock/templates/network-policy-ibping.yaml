{{- /*
Only the mock-ib daemon listens on the relay port, and the node agent runs it
at the full tier alone. Below it the policy guards a closed port, and its
cluster-wide peer still costs OVN-Kubernetes a scan of every Pod per Pod event.
*/}}
{{- if and .Values.infiniband.ping.networkPolicy.enabled (eq (include "nvml-mock.infinibandEnabled" .) "true") (eq (include "nvml-mock.mockIBTier" .) "full") }}
# The fabric relay listens on 0.0.0.0:{{ .Values.infiniband.ping.port }} without
# authentication. Admitting only peer nvml-mock pods keeps that surface
# reachable by its real clients alone.
# Egress stays open so DNS peer discovery and registration still work.
#
# kindnetd enforces NetworkPolicy on current Kind releases, so this is
# load-bearing in local e2e, not only on Calico/Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nvml-mock.fullname" . }}-ibping
  labels:
    {{- include "nvml-mock.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nvml-mock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Name + component, not instance: a fabric can span several releases,
        # so instance scoping would drop cross-release REGISTER. The component
        # label identifies the shared node-agent/NRI pods.
        #
        # Peers come from this namespace unless peerNamespaces lists more. A
        # peer in every namespace (namespaceSelector {}) would make
        # OVN-Kubernetes re-list all Pods in the cluster on each Pod event, on
        # every node; a fleet split across namespaces lists them instead.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "nvml-mock.name" . }}
              app.kubernetes.io/component: daemon
          {{- with .Values.infiniband.ping.networkPolicy.peerNamespaces }}
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ prepend . $.Release.Namespace | uniq | toJson }}
          {{- end }}
      ports:
        # Some CNIs do not resolve named ports on restartable init containers.
        - port: {{ .Values.infiniband.ping.port }}
          protocol: TCP
{{- end }}
