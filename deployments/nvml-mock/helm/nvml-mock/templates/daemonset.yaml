apiVersion: apps/v1
kind: DaemonSet
{{- $ibEnabled := eq (include "nvml-mock.infinibandEnabled" .) "true" }}
{{- $fmEnabled := eq (include "nvml-mock.fabricmanagerEnabled" .) "true" }}
{{- $nriImage := mergeOverwrite (deepCopy .Values.image) (.Values.nri.image | default dict) }}
{{- $nriSocketDir := dir .Values.nri.socketPath }}
{{- $nriOverlayVolume := "mokka-root" }}
{{- if ne .Values.nri.overlay.hostPath "/var/lib/nvml-mock" }}
{{- $nriOverlayVolume = "nri-overlay" }}
{{- end }}
{{- $nriCDIVolume := "cdi-specs" }}
{{- if ne .Values.nri.cdiSpecDir "/var/run/cdi" }}
{{- $nriCDIVolume = "nri-cdi-specs" }}
{{- end }}
{{- if and .Values.nri.enabled (not (has .Values.nri.deviceInjectionMode (list "raw" "cdi"))) }}
{{- fail (printf "nri.deviceInjectionMode must be \"raw\" or \"cdi\", got %q" .Values.nri.deviceInjectionMode) }}
{{- end }}
{{- $nriHealthPort := int .Values.nri.healthPort }}
{{- $nriPortConflict := or (eq $nriHealthPort 9091) (and $ibEnabled (eq $nriHealthPort (int .Values.infiniband.ping.port))) }}
{{- if and .Values.nri.enabled $nriPortConflict }}
{{- fail (printf "nri.healthPort (%v) conflicts with another listener in the shared pod; use a port other than node-agent health port 9091 or the enabled InfiniBand ping port %v" .Values.nri.healthPort .Values.infiniband.ping.port) }}
{{- end }}
{{- $migProfiles := include "nvml-mock.migProfiles" . }}
metadata:
  name: {{ include "nvml-mock.fullname" . }}
  labels:
    {{- include "nvml-mock.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  selector:
    matchLabels:
      {{- include "nvml-mock.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "nvml-mock.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: daemon
      annotations:
        # Roll the DaemonSet on any config.yaml change.
        checksum/config: {{ include "nvml-mock.gpuConfig" . | sha256sum }}
        {{- if $migProfiles }}
        # And on any change to the board's MIG table, which is a ConfigMap of
        # its own and so does not move the checksum above.
        checksum/mig-profiles: {{ $migProfiles | sha256sum }}
        {{- end }}
        # Keep kubectl exec/logs behavior stable when optional sidecars are on.
        kubectl.kubernetes.io/default-container: node-agent
    spec:
      serviceAccountName: {{ include "nvml-mock.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/node-agent
            - start
            - --config=/etc/nvml-mock/config.yaml
            {{- if .Values.topology.enabled }}
            # Names the cluster-topology mount below. Leaving it unset is what
            # retracts the document the nvlink simulator staged for workloads.
            - --topology=/etc/nvml-mock/topology/topology.yaml
            {{- end }}
            - --host-root=/host
            - --health-addr=:9091
            - --log-level={{ .Values.nodeAgent.logging.level }}
            - --log-format={{ .Values.nodeAgent.logging.format }}
            - --shutdown-timeout={{ .Values.nodeAgent.shutdownTimeout }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GPU_COUNT
              value: "{{ include "nvml-mock.gpuCount" . }}"
            - name: DRIVER_VERSION
              value: "{{ include "nvml-mock.driverVersion" . }}"
            {{- if $fmEnabled }}
            # Non-empty is what turns the fabricmanager simulator on, and it is
            # also the path the cdi simulator mounts into workloads. The agent
            # creates the directory during Stage, before Apply writes the CDI
            # spec that references it.
            - name: MOCK_FABRICMANAGER_STATE_DIR
              value: {{ .Values.fabricmanager.stateDir }}
            {{- if .Values.fabricmanager.initDelay }}
            # Withholds the readiness marker, so workloads observe the
            # IN_PROGRESS window real NVSwitch registration takes.
            - name: MOCK_FABRICMANAGER_INIT_DELAY
              value: {{ .Values.fabricmanager.initDelay | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.imex.mockChannels.enabled }}
            # Mock IMEX capability surface for the DRA compute-domain plugin.
            # See values.yaml imex.mockChannels and NVIDIA/k8s-test-infra#498.
            - name: IMEX_MOCK_CHANNELS
              value: "true"
            - name: IMEX_CHANNEL_COUNT
              value: "{{ .Values.imex.mockChannels.channelCount }}"
            - name: IMEX_CHANNEL_MAJOR
              value: "{{ .Values.imex.mockChannels.channelMajor }}"
            - name: IMEX_CAPS_MAJOR
              value: "{{ .Values.imex.mockChannels.capsMajor }}"
            {{- end }}
            # Drives both the IB tree the agent renders and the tier the
            # LD_PRELOAD shims operate at, so the two can never disagree.
            - name: MOCK_IB
              value: {{ include "nvml-mock.mockIBTier" . | quote }}
            - name: MOCK_IB_PING_FABRIC
              value: {{ ternary "1" "0" $ibEnabled | quote }}
            - name: MOCK_IB_PING_PORT
              value: "{{ .Values.infiniband.ping.port }}"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MOCK_IB_PING_SERVICE_HOST
              value: "{{ include "nvml-mock.fullname" . }}-ibping.{{ .Release.Namespace }}.svc.cluster.local"
            # The env below serves `kubectl exec` rather than the agent itself:
            # nvidia-smi, ibstat and nvml-mock-ctl run in this container and must
            # resolve the same profile, overrides and mock trees a workload sees.
            - name: MOCK_NVML_CONFIG
              value: /etc/nvml-mock/config.yaml
            # The engine resolves overrides via ConfigOverridePathFor, which would
            # otherwise look next to MOCK_NVML_CONFIG -- a read-only ConfigMap mount
            # the CLI can never write to.
            - name: MOCK_NVML_OVERRIDES
              value: /var/lib/nvml-mock/driver/config/overrides.yaml
            # Where the agent announces an injected Xid, as a driver's printk
            # would. Unlike the env above this one is the agent's own: it
            # watches the override document and writes the kernel line, so an
            # Xid raised by any writer reaches the node's log. Empty says this
            # pod cannot reach the kernel log -- it is only mounted, and only
            # writable, when nodeAgent.kernelLog is enabled.
            - name: MOCK_NVML_KMSG
              value: {{ ternary "/dev/kmsg" "" .Values.nodeAgent.kernelLog.enabled | quote }}
            {{- if .Values.topology.enabled }}
            - name: MOCK_TOPOLOGY_CONFIG
              value: /etc/nvml-mock/topology/topology.yaml
            {{- end }}
            {{- if $migProfiles }}
            # Names the MIG table mount below. The engine's other way of
            # finding a table is a sibling of MOCK_NVML_CONFIG, which a
            # ConfigMap mounted at its own path is not, so leaving this unset
            # is what leaves the board not MIG-capable.
            - name: MOCK_MIG_PROFILES_CONFIG
              value: /etc/nvml-mock/mig/mig-profiles.yaml
            {{- end }}
            # The socket the UMAD/verbs shims dial. The agent serves it; exec'd
            # tools only need to find it.
            - name: MOCK_IB_PING_SOCKET
              value: /var/lib/nvml-mock/run/mock-ib.sock
            # LD_PRELOAD installs four shims in every process spawned here.
            # libibmockumad and libibmockverbs forward UMAD and verbs traffic to
            # the mock-ib daemon when MOCK_IB=full. libibmocksys rewrites paths
            # under /sys/class/infiniband, /sys/class/infiniband_mad,
            # /sys/class/infiniband_verbs, /sys/class/infiniband_cm and
            # /dev/infiniband into $MOCK_IB_ROOT. libmockfs rewrites /sys/bus/pci,
            # /sys/devices/pci, /sys/module and /proc/modules into $MOCK_PCI_ROOT.
            # A path outside those prefixes passes through unchanged. The shims
            # serve tools exec'd here, not the agent: Go issues its file syscalls
            # directly, so no interposed symbol runs in the agent. That is why the
            # agent still reads the node's /proc/modules while a libc reader here
            # sees the rendered copy.
            # libibmockumad must precede libibmocksys so UMAD ioctls are
            # intercepted before sysfs path rewriting.
            - name: LD_PRELOAD
              value: "/usr/local/lib/libibmockumad.so.1:/usr/local/lib/libibmockverbs.so.1:/usr/local/lib/libibmocksys.so.1:/usr/local/lib/libmockfs.so.1"
            - name: MOCK_IB_ROOT
              value: "/var/lib/nvml-mock/ib"
            - name: MOCK_PCI_ROOT
              value: "/var/lib/nvml-mock"
          ports:
            - name: health
              containerPort: 9091
              protocol: TCP
            {{- if $ibEnabled }}
            # The infiniband simulator binds the cross-pod fabric relay here.
            # Named: the -ibping Service and NetworkPolicy select it by name.
            - name: ibping
              containerPort: {{ .Values.infiniband.ping.port }}
              protocol: TCP
            {{- end }}
          securityContext:
            # Kubernetes rejects mountPropagation: Bidirectional (below) on a
            # non-privileged container regardless of capabilities granted.
            privileged: true
          volumeMounts:
            # Where the simulators write. Every path they stage is rooted here.
            - name: mokka-root
              mountPath: /host/var/lib/nvml-mock
            # The same tree at the path its contents name. MOCK_PCI_ROOT and
            # MOCK_IB_ROOT are host-absolute, so the LD_PRELOAD shims and any
            # tool run via `kubectl exec` only resolve them through this mount.
            - name: mokka-root
              mountPath: /var/lib/nvml-mock
            # gpudriver.Apply bind-mounts the driver root here. Bidirectional
            # so that mount propagates to our consumer workloads that mounted this path before we did (the workload started before Mokka node daemon).
            - name: driver-root-link
              mountPath: /host/run/nvidia
              mountPropagation: Bidirectional
            # cdi.Apply writes both specs here; containerd scans the directory.
            - name: cdi-specs
              mountPath: /host/run/cdi
            # The agent's --config input, and what exec'd nvidia-smi reads.
            - name: mokka-profile
              mountPath: /etc/nvml-mock
              readOnly: true
            # pcibus.Apply drops the feature file NFD's local source turns into
            # a node label.
            - name: nfd-features
              mountPath: /host/etc/kubernetes/node-feature-discovery/features.d
            {{- if .Values.topology.enabled }}
            # Source for the topology document the nvlink simulator stages into
            # the overlay, where the NRI plugin points workloads at it.
            - name: cluster-topology
              mountPath: /etc/nvml-mock/topology
              readOnly: true
            {{- end }}
            {{- if $migProfiles }}
            # The board's MIG partition table, read at LoadConfig() time by the
            # agent and by anything exec'd here. Its own mount rather than a
            # key beside config.yaml, so a table change rolls only this.
            - name: mig-profiles
              mountPath: /etc/nvml-mock/mig
              readOnly: true
            {{- end }}
            {{- if $fmEnabled }}
            # The agent writes the readiness marker here; the mock NVML engine in
            # every consumer reads it to resolve fabric.state: auto.
            - name: fabric-state
              mountPath: {{ printf "/host%s" .Values.fabricmanager.stateDir }}
            {{- end }}
            # Read only: the agent copies the node's DMI attributes into the
            # rendered tree, which shadows them once served at /sys/devices.
            - name: node-sysfs
              mountPath: /host/sys
              readOnly: true
            {{- if .Values.nodeAgent.kernelLog.enabled }}
            # The node's kernel ring buffer, for the Xid announcement. Write
            # only in practice: nothing here reads it back.
            - name: kernel-log
              mountPath: /dev/kmsg
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9091
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
        {{- if .Values.nri.enabled }}
        # The NRI plugin shares this pod with the node agent so staging and
        # injection have one scheduling and rollout lifecycle per node.
        - name: nvml-mock-nri
          image: "{{ $nriImage.repository }}:{{ $nriImage.tag }}"
          imagePullPolicy: {{ $nriImage.pullPolicy }}
          command: ["/usr/local/bin/nri-plugin"]
          args:
            - --socket-path={{ .Values.nri.socketPath }}
            - --plugin-name={{ .Values.nri.pluginName }}
            - --plugin-index={{ .Values.nri.pluginIndex }}
            - --overlay-host-path={{ .Values.nri.overlay.hostPath }}
            - --overlay-mount-path={{ .Values.nri.overlay.mountPath }}
            - --device-host-path={{ .Values.nri.overlay.hostPath }}/driver/dev
            - --opt-out-annotation={{ .Values.nri.optOutAnnotation }}
            - --device-annotation={{ .Values.nri.deviceAnnotation }}
            - --device-injection-mode={{ .Values.nri.deviceInjectionMode }}
            - --cdi-spec-host-path={{ .Values.nri.cdiSpecDir }}/nvml-mock-nri.yaml
            # Mock IMEX channel delivery (#437). The nodes are staged by the
            # node agent; the plugin only injects them into opted-in pods.
            - --imex-channel-annotation={{ .Values.nri.imexChannelAnnotation }}
            - --imex-channel-host-path={{ .Values.nri.overlay.hostPath }}/driver/dev/nvidia-caps-imex-channels
            - --infiniband-annotation={{ .Values.nri.infinibandAnnotation }}
            - --excluded-namespaces={{ .Release.Namespace }},kube-system{{- range .Values.nri.excludedNamespaces }},{{ . }}{{- end }}
            - --node-name=$(NODE_NAME)
            - --health-addr=:{{ .Values.nri.healthPort }}
            - --log-level={{ .Values.nri.logging.level }}
            - --log-format={{ .Values.nri.logging.format }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: nri-health
              containerPort: {{ .Values.nri.healthPort }}
              protocol: TCP
          {{- with .Values.nri.readinessProbe }}
          readinessProbe:
            {{- include "nvml-mock.nriProbe" . | nindent 12 }}
          {{- end }}
          {{- with .Values.nri.livenessProbe }}
          livenessProbe:
            {{- include "nvml-mock.nriProbe" . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          {{- with .Values.nri.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nri-socket-dir
              mountPath: {{ $nriSocketDir }}
            - name: {{ $nriOverlayVolume }}
              mountPath: {{ .Values.nri.overlay.hostPath }}
              readOnly: true
            - name: {{ $nriCDIVolume }}
              mountPath: {{ .Values.nri.cdiSpecDir }}
              readOnly: true
        {{- end }}
        {{- if .Values.allocationWatcher.enabled }}
        # #506: mirrors each pod's nvidia.com/gpu claim into the same runtime
        # override file nvml-mock-ctl writes, which the engine re-reads within
        # one TTL. A sidecar rather than its own DaemonSet so it shares the
        # driver-root hostPath the override file lives in.
        - name: allocation-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/nvml-mock-ctl
            - watch-allocations
            - --interval={{ .Values.allocationWatcher.interval }}
            - --used-fraction={{ .Values.allocationWatcher.usedFractionPerClaim }}
            - --socket={{ .Values.allocationWatcher.podResourcesSocket }}
          env:
            - name: MOCK_NVML_CONFIG
              value: /var/lib/nvml-mock/driver/config/config.yaml
            - name: MOCK_NVML_OVERRIDES
              value: /var/lib/nvml-mock/driver/config/overrides.yaml
          securityContext:
            # The pod-resources socket is root-owned on the host and this
            # container only reads it; it writes nothing outside the driver root.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.allocationWatcher.resources | nindent 12 }}
          volumeMounts:
            - name: mokka-root
              mountPath: /var/lib/nvml-mock
            - name: pod-resources
              mountPath: {{ dir .Values.allocationWatcher.podResourcesSocket }}
              readOnly: true
        {{- end }}
      volumes:
        # The simulated driver tree: chardevs, shims, PCI and IB sysfs, configs.
        - name: mokka-root
          hostPath:
            path: /var/lib/nvml-mock
            type: DirectoryOrCreate
        {{- if .Values.allocationWatcher.enabled }}
        # Read-only, node-local kubelet API. It is a socket, not the API
        # server, so this needs no RBAC. Directory (not the socket itself) so
        # a kubelet restart that recreates the socket is picked up.
        - name: pod-resources
          hostPath:
            path: {{ dir .Values.allocationWatcher.podResourcesSocket }}
            type: Directory
        {{- end }}
        - name: mokka-profile
          configMap:
            name: {{ include "nvml-mock.fullname" . }}-config
        - name: cdi-specs
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        {{- if .Values.nri.enabled }}
        - name: nri-socket-dir
          hostPath:
            path: {{ $nriSocketDir }}
            type: DirectoryOrCreate
        {{- if ne .Values.nri.overlay.hostPath "/var/lib/nvml-mock" }}
        - name: nri-overlay
          hostPath:
            path: {{ .Values.nri.overlay.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if ne .Values.nri.cdiSpecDir "/var/run/cdi" }}
        - name: nri-cdi-specs
          hostPath:
            path: {{ .Values.nri.cdiSpecDir }}
            type: DirectoryOrCreate
        {{- end }}
        {{- end }}
        - name: driver-root-link
          hostPath:
            path: /run/nvidia
            type: DirectoryOrCreate
        - name: nfd-features
          hostPath:
            path: {{ .Values.nodeLabels.featuresDir | quote }}
            type: DirectoryOrCreate
        # Directory, not DirectoryOrCreate: a node without /sys should fail
        # loudly rather than get an empty stand-in.
        - name: node-sysfs
          hostPath:
            path: /sys
            type: Directory
        {{- if .Values.nodeAgent.kernelLog.enabled }}
        # CharDevice, so a node that exposes no kernel ring buffer fails the
        # pod instead of silently swallowing announcements into a new file.
        - name: kernel-log
          hostPath:
            path: /dev/kmsg
            type: CharDevice
        {{- end }}
        {{- if .Values.topology.enabled }}
        - name: cluster-topology
          configMap:
            name: {{ include "nvml-mock.fullname" . }}-topology
        {{- end }}
        {{- if $migProfiles }}
        - name: mig-profiles
          configMap:
            name: {{ include "nvml-mock.fullname" . }}-mig-profiles
        {{- end }}
        {{- if $fmEnabled }}
        - name: fabric-state
          hostPath:
            path: {{ .Values.fabricmanager.stateDir }}
            type: DirectoryOrCreate
        {{- end }}
