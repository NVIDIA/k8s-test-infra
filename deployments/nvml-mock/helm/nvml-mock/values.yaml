gpu:
  profile: gb300          # any *.yaml basename under profiles/ (e.g. a100, h100, b200, gb200, gb300, l40s, t4)
  # Number of GPUs to expose. Empty (default) derives the count from the
  # selected profile's `devices:` list (t4 and the Grace-Blackwell trays
  # gb200/gb300 -> 4, the 8-GPU baseboards -> 8), so the profile is the single
  # source of truth. Set to a positive integer to force a smaller/larger slice;
  # setup.sh caps it to the profile's device count at runtime.
  count: ""
  customConfig: ""

  # Opt-in time-varying temperature / power / utilization. Disabled by default
  # (static profile values). See pkg/gpu/mocknvml/README.md#dynamic-metrics-optional.
  #
  # Per-field resolution, highest priority last:
  #   chart baseline  <  GPU profile default  <  user override (below / --set)
  # Leave a field unset to inherit. Profiles set a power base that fits their
  # TDP envelope (t4 ~65W, b200/gb200 ~600W, gb300 ~800W; others use the 250W
  # baseline) so it isn't force-clamped to a bound.
  dynamicMetrics:
    enabled: false
    # Chart baseline defaults, shown for reference. Uncomment to override:
    # seed: 0                            # 0 = time-based; non-zero for reproducibility
    # temperature:
    #   base_c: 55
    #   variance_c: 3
    #   ramp_c: 15
    #   ramp_period_sec: 120
    # power:                             # profile default wins unless set here
    #   base_mw: 250000
    #   variance_mw: 25000
    # utilization:
    #   pattern: burst                   # idle | busy | burst | steady
    #   gpu_min: 0
    #   gpu_max: 100
    #   memory_min: 0
    #   memory_max: 100
    #   burst_period_sec: 30

  # Opt-in simulation of GPU failure scenarios: lost device, fallen-off-bus,
  # uncorrectable ECC errors, and Xid critical events. When `enabled: false`
  # (the default) the rendered ConfigMap is unchanged and the mock reports
  # healthy hardware.
  #
  # See pkg/gpu/mocknvml/README.md#failure-injection-optional for the full
  # behavioural contract per mode.
  failureInjection:
    enabled: false
    mode: healthy                        # healthy (no-op) | lost | fallen_off_bus | ecc_uncorrectable
    probability: 0.0                     # 0..1 chance per guarded NVML call
    after_calls: 0                       # deterministic trip after N guarded calls (0 = disabled)
    seed: 0                              # 0 = time-based; non-zero for reproducible rolls
    xid:
      code: 0                            # 0 = no Xid surfaced; e.g. 79 = "GPU has fallen off the bus"

image:
  repository: ghcr.io/nvidia/nvml-mock
  tag: latest
  pullPolicy: IfNotPresent

driverVersion: ""                  # Auto-derived from profile. Override: "550.163.01"

nodeSelector: {}
tolerations:
  - operator: Exists

resources: {}

# Node labels nvml-mock causes to exist: setup.sh writes nvidia.com/gpu.present
# directly; NFD derives pci-10de.present from the node agent's feature file.
nodeLabels:
  # Host directory NFD's local source reads feature files from; must match the
  # featureFilesDir the deployed NFD actually reads.
  featuresDir: /etc/kubernetes/node-feature-discovery/features.d

# Node-wide ambient injection via containerd NRI. When enabled, a lightweight
# node-local plugin appends the nvml-mock overlay mount and environment to each
# container at runtime without mutating pod specs. Opt-in (default false): it
# injects into workloads cluster-wide, so enable it only for the
# node-wide-injection demo/use case. See docs/demo/node-wide-injection.

nodeAgent:
  logging:
    level: info    # debug | info | warn | error
    format: json   # json | plain
  # Go duration string: 5s, 1m30s, etc.
  shutdownTimeout: 30s
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Allocation-aware GPU memory (#506). When enabled, a sidecar in the nvml-mock
# DaemonSet polls the kubelet pod-resources API and mirrors each pod's
# nvidia.com/gpu claim into memory.used_bytes / memory.free_bytes, so a
# scheduled workload moves the number and deleting it returns the number.
#
# Off by default: it mounts the kubelet pod-resources socket, and a cluster
# that only wants a static mock should not take that mount. The reported bytes
# are SYNTHETIC — the mock runs no kernel and allocates no device memory, so
# the value says a claim exists, not what a workload touched.
#
# While enabled, the watcher owns memory.used_bytes/free_bytes: an
# `nvml-mock-ctl set --gpu N memory.used_bytes=...` is overwritten on the next
# poll. Every other field nvml-mock-ctl writes is preserved.
allocationWatcher:
  enabled: false
  # Poll period. The engine re-reads the override file at most once per its own
  # TTL (1s), so polling much faster is not observable.
  interval: 2s
  # Share of the usable aperture (total - reserved) attributed to each claim.
  # Claims on one device add up and clamp at the aperture, so a time-sliced GPU
  # held by two containers reads as full at the 0.5 default.
  usedFractionPerClaim: 0.5
  podResourcesSocket: /var/lib/kubelet/pod-resources/kubelet.sock
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

nri:
  enabled: false
  socketPath: /var/run/nri/nri.sock
  pluginName: nvml-mock
  pluginIndex: "10"
  image: {}
  overlay:
    hostPath: /var/lib/nvml-mock
    mountPath: /opt/nvml-mock
  optOutAnnotation: nvml-mock.nvidia.com/inject
  # Workloads that can set this pod annotation to "true" can opt into host GPU
  # device-node mounts from the staged mock overlay. Treat that pod-authored
  # control as part of the demo trust boundary and exclude namespaces as needed.
  deviceAnnotation: nvml-mock.nvidia.com/devices
  # How the deviceAnnotation opt-in delivers mock GPUs to a container:
  #   raw - stage the /dev/nvidiaN nodes directly in the NRI adjustment.
  #   cdi - emit a CDI device reference and let the runtime resolve it from the
  #         spec setup.sh stages at cdiSpecDir/nvml-mock-nri.yaml.
  #
  # raw is the default. It is the only mode that works where the runtime has no
  # CDI support, and MEP-0002 requires it to stay reachable. containerd 2.x
  # enables CDI by default, so cdi mode needs no container toolkit on the node;
  # containerd 1.x gates it behind enable_cdi.
  #
  # Neither mode changes WHETHER a container is served. A container the device
  # plugin already served is left alone in both.
  #
  # If cdi is selected and no spec is staged, the plugin logs a warning and
  # falls back to raw rather than failing container creation.
  deviceInjectionMode: raw
  # Host directory containing CDI specs. Mounted read-only into the plugin so it
  # can confirm its spec is staged before emitting a reference. Must be one of
  # the runtime's configured cdi_spec_dirs.
  cdiSpecDir: /var/run/cdi
  # Workloads that set this pod annotation to "true" additionally get the mock
  # IMEX channel nodes at /dev/nvidia-caps-imex-channels/channelN — the fabric
  # surface a ComputeDomain workload expects. Same trust boundary as
  # deviceAnnotation above.
  #
  # The channels themselves come from imex.mockChannels; this plugin only
  # delivers what that already staged, so enable imex.mockChannels too or the
  # annotation is a no-op (the plugin logs a warning and the pod still starts).
  # Every channel staged on the node is injected, so a large
  # imex.mockChannels.channelCount adds real container-start cost: creating the
  # default 2048 nodes measures around one second.
  imexChannelAnnotation: nvml-mock.nvidia.com/imex-channels
  excludedNamespaces: []
  resources: {}
  # Port serving the plugin's /healthz and /readyz endpoints. The NRI DaemonSet
  # does not use host networking, so this port lives only inside the pod's own
  # network namespace: it is reachable by the kubelet on the pod IP and is not
  # bound on the node.
  healthPort: 8080
  # Probes for the two ways this plugin fails while its process stays alive.
  # See the "NRI plugin failure modes" section of the chart README before
  # retuning either: both thresholds are stated relative to containerd's
  # plugin_request_timeout.
  #
  # readinessProbe reports whether the plugin is registered with the runtime
  # and answering. It does not restart anything; it makes the window in which
  # injection has silently stopped visible as a NotReady pod.
  #
  # livenessProbe restarts the container when a container-creation request has
  # been in flight past the wedge threshold. That is the one state the plugin
  # cannot leave on its own — losing the connection already exits the process.
  #
  # Set either to null to drop that probe (an empty map merges with the
  # default rather than replacing it).
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 2
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# DaemonSet rolling update strategy.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%

# Pod termination grace period. preStop cleanup is a few rm -rf
# calls plus kubectl label requests, so the upstream 30s default
# is overkill and slows rollouts.
terminationGracePeriodSeconds: 2

# ComputeDomain (NVLink fabric) simulation. Opt-in: when `topology.enabled`
# is true a cluster-level ConfigMap declaring domain UUID + per-clique node
# membership is rendered and mounted into every nvml-mock pod. The mock
# NVML engine looks up its NODE_NAME on startup and overrides each GPU's
# fabric cluster_uuid / clique_id accordingly. See
# pkg/gpu/mocknvml/engine/fabric.go and issue NVIDIA/k8s-test-infra#304.
topology:
  enabled: false
  # Cluster-level topology document (consumed only by the mock NVML
  # engine). Each node must appear in exactly one clique within one
  # domain. Example:
  # domains:
  #   - name: "test-domain-1"
  #     uuid: "00000000-0000-0000-0000-000000000001"
  #     cliques:
  #       - id: 0
  #         nodes: [kind-worker, kind-worker2]
  #       - id: 1
  #         nodes: [kind-worker3, kind-worker4]
  domains: []

# InfiniBand ping mock. For profiles with infiniband.enabled=true, the
# DaemonSet preloads libibmockumad alongside libibmocksys, starts mock-ib via
# the container entrypoint, exposes a headless Service on `ping.port`, and sets
# MOCK_IB / MOCK_IB_PING_FABRIC so ibping can reach peer pods.
#
# MOCK_IB is a tri-state mock tier:
#   full  -> all shims (libibmocksys sysfs, libibmockumad UMAD, libibmockverbs
#            verbs) + the mock-ib daemon. Enables
#            ibstat/ibstatus/ibping/iblinkinfo/ibv_devinfo.
#   sysfs -> libibmocksys sysfs redirection only (ibstat/ibstatus; no daemon).
#   off   -> every shim is a no-op (real host).
# The shims stay LD_PRELOAD'd in every container process regardless of tier and
# no-op when MOCK_IB=off, so `MOCK_IB=off <cmd>` is the per-command escape hatch.
infiniband:
  # mockTier sets the container's MOCK_IB value: off | sysfs | full.
  # Defaults to "full" for InfiniBand-enabled profiles and "sysfs" for non-IB
  # profiles (sysfs keeps the libibmocksys redirect active so any real host IB
  # is masked, i.e. ibstat reports 0 HCAs). Leaving this empty auto-derives
  # that per profile. Set it explicitly to override (an invalid value fails
  # `helm template`).
  mockTier: ""
  ping:
    port: 18515
    # The mock-ib TCP fabric listener binds 0.0.0.0:<port> with no auth and
    # the DaemonSet runs privileged. This NetworkPolicy restricts inbound
    # access to that port to peer nvml-mock pods (the only legitimate
    # clients), limiting the blast radius on clusters whose CNI enforces
    # NetworkPolicy. NOTE: Kind's default CNI (kindnet) ENFORCES
    # NetworkPolicy on current releases, so this allow-list is load-bearing
    # there; it also matters on Calico/Cilium.
    networkPolicy:
      enabled: true

# DEPRECATED — fake IMEX coordination, removed in a follow-up release.
# The fake nvidia-imex / nvidia-imex-ctl marker protocol is superseded
# by the REAL nvidia-imex daemon running in NO GPU mode (--nogpu) via
# nvidia-imex-shim; real daemons coordinate over the pod network and
# need no hostPath (see deployments/nvml-mock/Dockerfile.compute-domain-daemon
# and NVIDIA/k8s-test-infra#304). While deprecated, `imex.enabled: true`
# still mounts the hostPath state directory the fakes' marker files use.
imex:
  enabled: false
  stateDir: /var/lib/nvml-mock/imex-state

  # Mock IMEX capability surface for the NVIDIA DRA driver's compute-domain
  # kubelet plugin. That plugin reads a device major for
  # nvidia-caps-imex-channels out of /proc/devices at startup; on a mock node
  # there is no NVIDIA kernel module, so the entry is absent and the plugin
  # aborts with "error parsing '/proc/devices': unexpected regex match: []".
  #
  # When enabled, the DaemonSet renders:
  #   <hostPath>/imex/proc-devices                       substitute /proc/devices
  #   <driverRoot>/proc/driver/nvidia/capabilities/...   fabric-imex-mgmt
  #   <driverRoot>/dev/nvidia-caps-imex-channels/channelN  channel device nodes
  #
  # Pair it with the DRA driver, on a release that supports altProcDevices:
  #   --set altProcDevices=/var/lib/nvml-mock/imex/proc-devices
  #   --set resources.computeDomains.enabled=true
  #
  # NOTE: as of 2026-07-25 altProcDevices is on the DRA driver's main branch
  # but is NOT in any release (absent at v25.12.0), so enabling this alone does
  # not yet make ComputeDomains work with released artifacts. See
  # NVIDIA/k8s-test-infra#498.
  #
  # Off by default: it creates channelCount device nodes per node.
  mockChannels:
    enabled: false
    # Number of channel device nodes. 2048 matches getImexChannelCount() in the
    # DRA driver's compute-domain kubelet plugin.
    channelCount: 2048
    # Device majors advertised in the rendered proc-devices file. Defaults match
    # the DRA driver's own CI fixtures. They must differ from each other and
    # must not collide with a major already present on the node.
    channelMajor: 235
    capsMajor: 236

# Fake nvidia-fabricmanager. NVSwitch platforms (HGX H100 / GB200 / GB300)
# run nvidia-fabricmanager to register GPUs with the NVSwitch fabric. When
# enabled the entrypoint starts the fake nvidia-fabricmanager daemon (baked
# into the image), which writes a node-local readiness marker under
# `stateDir`. The mock NVML engine reads that marker to resolve each GPU's
# fabric state for profiles that set `fabric.state: auto` (GB200/GB300/H100):
# IN_PROGRESS until the daemon is ready, COMPLETED once it is.
#
# `enabled` is a tri-state override and is derived from the GPU profile by
# default — leave it empty and the chart starts the daemon when the profile
# declares NVSwitches (`nvlink.switches`) or sets `device_defaults.fabric.state:
# auto` (same pattern as infiniband.mockTier). A100 runs the legacy daemon
# (NVSwitch baseboard, no GpuFabricInfo API); standalone B200/L40S/T4 declare
# no NVSwitches and do not start the daemon. Set to true/false to force it
# regardless of profile (e.g. with gpu.customConfig).
fabricmanager:
  enabled: ""
  stateDir: /var/lib/nvml-mock/fabric-state

# Integration with external projects
integrations:
  fakeGpuOperator:
    enabled: false
    # Namespace for the profile ConfigMaps. Empty means the release namespace.
    # fake-gpu-operator loads profiles from its OWN release namespace, so set
    # this to that namespace (their README installs into `gpu-operator`) for
    # the ConfigMaps to be readable. Doing so requires FGO's
    # `builtinProfiles.enabled=false`, because their builtin set uses the same
    # seven names and is owned by their Helm release. See
    # docs/integrations/fake-gpu-operator.md.
    targetNamespace: ""
    # Extra labels applied to per-profile ConfigMaps. The contract labels
    # `fake-gpu-operator/gpu-profile` and `nvml-mock/profile-name` are always
    # emitted by the template and cannot be removed through this map.
    profileLabels:
      run.ai/gpu-profile: "true"

# Mokka Control Plane (MEP-0001). Defaults to disabled: the init slice serves
# only /healthz and /readyz, so enabling it today only buys the probe surface.
# Singleton-per-cluster placement is deferred to the MEP that gives the CP
# real state; until then N releases produce N stateless CPs, which is fine.
controlPlane:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/nvidia/mokka-control-plane
    tag: latest
    pullPolicy: IfNotPresent
  logging:
    level: info    # debug | info | warn | error
    format: json   # json | plain
  # Go duration string: 5s, 1m30s, etc.
  shutdownTimeout: 5s
  service:
    type: ClusterIP
    port: 8080
  # Total shutdown budget on the pod: preStop sleep + in-flight request drain
  # (shutdownTimeout above) must fit inside this. 30s matches the kube default
  # and leaves headroom over the current 10s preStop + 5s drain; raise this
  # together with shutdownTimeout if the CP starts holding long-lived connections.
  # Setting it below preStop + drain truncates the drain — kube SIGKILLs at the
  # grace boundary regardless.
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
