global:
  # Pulls every image the chart runs from this registry (e.g. a mirror),
  # replacing the registry host of each image repository.
  imageRegistry: ""
  # Pull secrets added to every chart pod, ahead of imagePullSecrets below.
  # Each entry is a Secret name or {name: <secret>}.
  imagePullSecrets: []

# Pull secrets added to every chart pod (nvml-mock, NRI and control plane).
# Each entry is a Secret name or {name: <secret>}.
imagePullSecrets: []

gpu:
  # -- GPU profile and per-device simulation settings.
  profile: gb300          # any *.yaml basename under profiles/ (e.g. a100, h100, b200, gb200, gb300, l40s, t4)
  # Number of GPUs to expose. Empty (default) derives the count from the
  # selected profile's `devices:` list (t4 and the Grace-Blackwell trays
  # gb200/gb300 -> 4, the 8-GPU baseboards -> 8), so the profile is the single
  # source of truth. Set to a positive integer to force a smaller/larger slice;
  # The node agent caps it to the profile's device count at runtime.
  # -- Number of simulated GPUs; empty derives the count from the selected profile.
  count: ""
  # -- Complete YAML configuration that replaces the selected GPU profile.
  customConfig: ""

  # Opt-in time-varying temperature / power / utilization. Disabled by default
  # (static profile values). See pkg/gpu/mocknvml/README.md#dynamic-metrics-optional.
  #
  # Per-field resolution, highest priority last:
  #   chart baseline  <  GPU profile default  <  user override (below / --set)
  # Leave a field unset to inherit. Profiles set a power base that fits their
  # TDP envelope (t4 ~65W, b200/gb200 ~600W, gb300 ~800W; others use the 250W
  # baseline) so it isn't force-clamped to a bound.
  dynamicMetrics:
    # -- Enable time-varying synthetic temperature, power, and utilization values.
    enabled: false
    # Chart baseline defaults, shown for reference. Uncomment to override:
    # seed: 0                            # 0 = time-based; non-zero for reproducibility
    # temperature:
    #   base_c: 55
    #   variance_c: 3
    #   ramp_c: 15
    #   ramp_period_sec: 120
    # power:                             # profile default wins unless set here
    #   base_mw: 250000
    #   variance_mw: 25000
    # utilization:
    #   pattern: burst                   # idle | busy | burst | steady
    #   gpu_min: 0
    #   gpu_max: 100
    #   memory_min: 0
    #   memory_max: 100
    #   burst_period_sec: 30

  # Opt-in simulation of GPU failure scenarios: lost device, fallen-off-bus,
  # uncorrectable ECC errors, and Xid critical events. When `enabled: false`
  # (the default) the rendered ConfigMap is unchanged and the mock reports
  # healthy hardware.
  #
  # See pkg/gpu/mocknvml/README.md#failure-injection-optional for the full
  # behavioural contract per mode.
  failureInjection:
    # -- Enable deterministic or probabilistic simulated GPU failures.
    enabled: false
    # -- Failure mode to expose when failure injection is enabled.
    mode: healthy                        # healthy (no-op) | lost | fallen_off_bus | ecc_uncorrectable
    # -- Probability that each guarded NVML call triggers the selected failure.
    probability: 0.0                     # 0..1 chance per guarded NVML call
    # -- Trigger the selected failure after this many guarded calls; zero disables it.
    after_calls: 0                       # deterministic trip after N guarded calls (0 = disabled)
    # -- Random seed; zero uses a time-based seed.
    seed: 0                              # 0 = time-based; non-zero for reproducible rolls
    xid:
      # -- Xid code reported when the failure mode emits an Xid event.
      code: 0                            # 0 = no Xid surfaced; e.g. 79 = "GPU has fallen off the bus"

  # MIG partitioning. Off by default: a partitioned board stops publishing
  # nvidia.com/gpu under the device plugin's migStrategy=single, so enabling
  # this changes what the node advertises.
  #
  # Enabling requires gpuInstances: no profile ships a layout, because how a
  # board is carved is a deployment choice rather than a property of the
  # silicon. Name the partitioning you want, in the names the board above
  # publishes — for the gb300 default that is —
  #
  #   gpuInstances:
  #     - profile: "3g.139gb"
  #       count: 2
  #
  # — or fill the board with its smallest slice, which is the shape
  # migStrategy=single publishes as one resource name: seven of 1g.5gb on
  # a100, 1g.10gb on h100, 1g.23gb on b200 and gb200, 1g.35gb on gb300. A
  # slice is named for the share of its own board it holds, so confirm a
  # board's names with `nvidia-smi mig -lgip`.
  #
  # A board whose profile declares no mig.max_gpu_instances is refused, as is a
  # capable board left with no layout: MIG on with nothing partitioned
  # publishes no GPU resource at all under migStrategy=single.
  #
  # The instances stay mutable at runtime through NVML, as on real hardware.
  mig:
    enabled: false
    gpuInstances: []

image:
  # -- Container image repository for the node agent.
  repository: ghcr.io/nvidia/nvml-mock
  # -- Immutable image digest; when set, it takes precedence over the tag.
  digest: ""                       # sha256:...; pins the image and wins over tag
  # -- Image tag; defaults to the chart appVersion.
  tag: ""                          # Defaults to the chart appVersion
  # -- Kubernetes image pull policy.
  pullPolicy: IfNotPresent

# Feature gate overrides passed to the node agent, NRI plugin and control plane
# as --feature-gates, for example {AllAlpha: true}. The values schema lists the
# gates this chart version accepts, so an unknown or locked gate fails the Helm
# command before any pod changes. See docs/feature-gates.md.
featureGates: {}

# -- Driver version reported by the simulated driver; empty derives it from the profile.
driverVersion: ""                  # Auto-derived from profile. Override: "550.163.01"

# -- Existing node labels required to schedule the mock DaemonSet.
nodeSelector: {}
 # -- Pod tolerations for the mock DaemonSet.
tolerations:
  - operator: Exists

# Scheduling and metadata shared by the node DaemonSet pods.
# The node agent stands in for the GPU driver its node's workloads depend on,
# so a priority such as system-node-critical keeps it from being starved or
# evicted before them.
priorityClassName: ""
affinity: {}
podAnnotations: {}
# Must not set the selector labels app.kubernetes.io/{name,instance,component}.
podLabels: {}

# NFD derives pci-10de.present from the feature file the node agent writes here.
# GPU labels under nvidia.com/ belong to NFD and GFD, exactly as on real hardware.
nodeLabels:
  # Host directory NFD's local source reads feature files from; must match the
  # featureFilesDir the deployed NFD actually reads.
  # -- Host directory from which NFD reads generated feature files.
  featuresDir: /etc/kubernetes/node-feature-discovery/features.d

# Workload injection via containerd NRI. When enabled, a lightweight sidecar in
# the node DaemonSet appends the nvml-mock overlay mount and environment at
# runtime, without mutating pod specs, to containers that hold a device-plugin
# or NVIDIA DRA GPU allocation or whose pod carries the devices or IMEX
# annotation below. Every other container is left untouched. Opt-in (default
# false). On Kubernetes 1.29+, the node agent is a restartable init sidecar so
# staging gates NRI startup. See docs/helm-chart.

nodeAgent:
  # -- Node-agent logging settings and lifecycle behavior.
  logging:
    # -- Log level for the node agent.
    level: info    # debug | info | warn | error
    # -- Log encoding for the node agent.
    format: json   # json | plain
  # On Kubernetes 1.29+, enabling NRI gates plugin startup on the node agent's
  # /stagedz endpoint until its first Stage wave completes. Kubernetes runs no
  # liveness probe until then, so this is also how long a node agent whose
  # first staging failed waits before it is restarted.
  nriStartupTimeoutSeconds: 120
  # Announces an injected Xid on the node's kernel log, the way a real
  # driver's printk does, so journald/syslog consumers (e.g. NVSentinel) see
  # it too, not just NVML clients. Watches the runtime override document, so
  # any writer's Xid — `nvml-mock-ctl fail --xid` included — is announced.
  kernelLog:
    # TODO: remove the flag and make it on by default
    # -- Announce injected Xids through the host kernel log.
    enabled: false
  # Go duration string: 5s, 1m30s, etc. Teardown is a handful of parallel file
  # removals, and it has to finish inside terminationGracePeriodSeconds.
  shutdownTimeout: 5s
  # How often the agent re-reads its profile and topology regardless of
  # filesystem events. An event carries a ConfigMap update within
  # milliseconds; this covers a node whose kernel reports none, such as one
  # that has reached its watch limit. Set to 0s to rely on events alone.
  # -- Node-agent profile and topology resync period.
  resyncInterval: 1m
  # -- Resource requests for the node agent.
  resources:
    requests:
      # -- CPU requested by the node agent.
      cpu: 10m
      # -- Memory requested by the node agent.
      memory: 32Mi
  # /healthz fails while the last Stage wave failed; /readyz reports whether
  # every simulator is serving. Set either to null to drop that probe (an empty map
  # merges with the default rather than replacing it).
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
  readinessProbe:
    httpGet:
      path: /readyz
      port: health

# Allocation-aware GPU memory (#506). When enabled, a sidecar in the nvml-mock
# DaemonSet polls the kubelet pod-resources API and mirrors each pod's
# nvidia.com/gpu claim into memory.used_bytes / memory.free_bytes, so a
# scheduled workload moves the number and deleting it returns the number.
#
# Off by default: it mounts the kubelet pod-resources socket, and a cluster
# that only wants a static mock should not take that mount. The reported bytes
# are SYNTHETIC — the mock runs no kernel and allocates no device memory, so
# the value says a claim exists, not what a workload touched.
#
# While enabled, the watcher owns memory.used_bytes/free_bytes: an
# `nvml-mock-ctl set --gpu N memory.used_bytes=...` is overwritten on the next
# poll. Every other field nvml-mock-ctl writes is preserved.
allocationWatcher:
  # -- Enable allocation-based synthetic memory metrics.
  enabled: false
  # Poll period. The engine re-reads the override file at most once per its own
  # TTL (1s), so polling much faster is not observable.
  # -- Poll period for the kubelet pod-resources socket.
  interval: 2s
  # Share of the usable aperture (total - reserved) attributed to each claim.
  # Claims on one device add up and clamp at the aperture, so a time-sliced GPU
  # held by two containers reads as full at the 0.5 default.
  # -- Fraction of usable GPU memory attributed to each claim.
  usedFractionPerClaim: 0.5
  # -- Kubelet pod-resources socket path.
  podResourcesSocket: /var/lib/kubelet/pod-resources/kubelet.sock
  resources:
    limits:
      # -- CPU limit for the allocation watcher.
      cpu: 100m
      # -- Memory limit for the allocation watcher.
      memory: 64Mi
    requests:
      # -- CPU request for the allocation watcher.
      cpu: 10m
      # -- Memory request for the allocation watcher.
      memory: 32Mi

nri:
  # -- Enable node-wide container injection through the NRI plugin.
  # Inject the mock into containers that hold a GPU allocation or opt in by
  # annotation. Needs containerd NRI enabled on the node: containerd 2.x
  # enables it by default, containerd 1.7 does not. Set false where it is off;
  # otherwise the node pod stays NotReady.
  enabled: true
  # Kubernetes 1.29+ enables SidecarContainers by default. Set this to false
  # if the cluster explicitly disables that feature gate; the chart then uses
  # the unordered regular-container layout also used on Kubernetes 1.28.
  nativeSidecar: true
  logging:
    # -- Log level for the NRI plugin.
    level: info    # debug | info | warn | error
    # -- Log encoding for the NRI plugin.
    format: json   # json | plain
  # -- Runtime NRI socket path.
  socketPath: /var/run/nri/nri.sock
  # -- NRI plugin name.
  pluginName: nvml-mock
  # -- NRI plugin ordering index.
  pluginIndex: "10"
  # -- Optional container image overrides for the NRI plugin.
  image: {}
  overlay:
    # -- Host path containing the staged mock driver overlay.
    hostPath: /var/lib/nvml-mock
    # -- Container mount path for the mock driver overlay.
    mountPath: /opt/nvml-mock
  # -- Pod annotation that disables ambient mock injection when set to "false".
  optOutAnnotation: nvml-mock.nvidia.com/inject
  # Workloads that set this pod annotation to "true" request all staged mock
  # GPUs for node-wide management. A scheduler-backed allocation takes
  # precedence and remains exact. Treat this pod-authored
  # control as part of the demo trust boundary and exclude namespaces as needed.
  # -- Pod annotation enabling mock GPU device injection.
  deviceAnnotation: nvml-mock.nvidia.com/devices
  # How the deviceAnnotation opt-in delivers mock GPUs to a container:
  #   raw - stage the /dev/nvidiaN nodes directly in the NRI adjustment.
  #   cdi - emit a CDI device reference and let the runtime resolve it from the
  #         spec the node agent stages at cdiSpecDir/nvml-mock-nri.yaml.
  #
  # raw is the default. It is the only mode that works where the runtime has no
  # CDI support, and MEP-0002 requires it to stay reachable. containerd 2.x
  # enables CDI by default, so cdi mode needs no container toolkit on the node;
  # containerd 1.x gates it behind enable_cdi.
  #
  # Neither mode changes WHICH GPUs an allocated container gets. Device-plugin
  # and NVIDIA DRA allocations keep their incoming GPU set in both modes.
  #
  # If cdi is selected and no spec is staged, the plugin logs a warning and
  # falls back to raw rather than failing container creation.
  # -- Device injection mode: raw nodes or CDI references.
  deviceInjectionMode: raw
  # Host directory containing CDI specs. Mounted read-only into the plugin so it
  # can confirm its spec is staged before emitting a reference. Must be one of
  # the runtime's configured cdi_spec_dirs.
  # -- Host directory containing staged CDI specifications.
  cdiSpecDir: /var/run/cdi
  # Workloads that set this pod annotation to "true" get the mock InfiniBand
  # tools, shims and sysfs tree with MOCK_IB=full. It is independent of GPU
  # access: an IB-only pod sees no mock GPUs, and a GPU pod without it runs with
  # MOCK_IB=off. Inherited /dev/infiniband nodes never select it. On a profile
  # without infiniband.enabled the pod still starts, finds no HCA, and the
  # plugin logs a warning. Same trust boundary as deviceAnnotation above.
  infinibandAnnotation: nvml-mock.nvidia.com/infiniband
  # Workloads that set this pod annotation to "true" get the mock IMEX channel
  # nodes at /dev/nvidia-caps-imex-channels/channelN — the fabric surface a
  # ComputeDomain workload expects. Channels alone bring no overlay, mock NVML
  # or InfiniBand; add deviceAnnotation or hold a GPU allocation for those.
  # Same trust boundary as deviceAnnotation above.
  #
  # The channels themselves come from imex.mockChannels; this plugin only
  # delivers what that already staged, so enable imex.mockChannels too or the
  # annotation is a no-op (the plugin logs a warning and the pod still starts).
  # Every channel staged on the node is injected, so a large
  # imex.mockChannels.channelCount adds real container-start cost: creating the
  # default 2048 nodes measures around one second.
  # -- Pod annotation enabling IMEX channel injection.
  imexChannelAnnotation: nvml-mock.nvidia.com/imex-channels
  # -- Namespaces excluded from NRI injection.
  excludedNamespaces: []
  # -- NRI plugin resource requests; limits are unset by default.
  # Requests only: the plugin runs on every node by default, and no limit is set
  # until its usage under load has been measured.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  # Port serving the plugin's /healthz and /readyz endpoints. The node DaemonSet
  # does not use host networking, so this port lives only inside the pod's own
  # network namespace: it is reachable by the kubelet on the pod IP and is not
  # bound on the node.
  # -- NRI plugin health and readiness port.
  healthPort: 8080
  # Probes for the two ways this plugin fails while its process stays alive.
  # See the "NRI plugin failure modes" section of the chart README before
  # retuning either: both thresholds are stated relative to containerd's
  # plugin_request_timeout.
  #
  # readinessProbe reports whether the plugin is registered with the runtime
  # and answering. It does not restart anything; it makes the window in which
  # injection has silently stopped visible as a NotReady pod.
  #
  # livenessProbe restarts the container when a container-creation request has
  # been in flight past the wedge threshold. That is the one state the plugin
  # cannot leave on its own — losing the connection already exits the process.
  #
  # Set either to null to drop that probe (an empty map merges with the
  # default rather than replacing it).
  #
  # The chart rewrites the legacy `port: health` name to `nri-health` for
  # httpGet and tcpSocket probes. gRPC probes require the numeric healthPort.
  readinessProbe:
    httpGet:
      path: /readyz
      port: nri-health
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 2
  livenessProbe:
    httpGet:
      path: /healthz
      port: nri-health
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# DaemonSet rolling update strategy.
updateStrategy:
  # -- DaemonSet update strategy.
  type: RollingUpdate
  rollingUpdate:
    # -- Maximum number of DaemonSet pods unavailable during an update.
    maxUnavailable: 25%

# Pod termination grace period. It must exceed nodeAgent.shutdownTimeout or
# SIGKILL lands mid-teardown, leaving the CDI specs and driver symlink behind.
# -- Pod termination grace period for the node-agent DaemonSet.
terminationGracePeriodSeconds: 10

# ComputeDomain (NVLink fabric) simulation. Opt-in: when `topology.enabled`
# is true a cluster-level ConfigMap declaring domain UUID + per-clique node
# membership is rendered and mounted into every nvml-mock pod. The mock
# NVML engine looks up its NODE_NAME on startup and overrides each GPU's
# fabric cluster_uuid / clique_id accordingly. See
# pkg/gpu/mocknvml/engine/fabric.go and issue NVIDIA/k8s-test-infra#304.
topology:
  # -- Enable simulation of multi-node GPU fabric topology.
  enabled: false
  # Cluster-level topology document, read by the mock NVML engine and staged
  # for workloads by the node agent. Each node must appear in exactly one
  # clique within one domain. Example:
  # domains:
  #   - name: "test-domain-1"
  #     uuid: "00000000-0000-0000-0000-000000000001"
  #     cliques:
  #       - id: 0
  #         nodes: [kind-worker, kind-worker2]
  #       - id: 1
  #         nodes: [kind-worker3, kind-worker4]
  # -- Synthetic topology domains and clique membership.
  domains: []

# InfiniBand ping mock. For profiles with infiniband.enabled=true, the
# DaemonSet preloads libibmockumad alongside libibmocksys, starts mock-ib via
# the container entrypoint, exposes a headless Service on `ping.port`, and sets
# MOCK_IB / MOCK_IB_PING_FABRIC so ibping can reach peer pods.
#
# MOCK_IB is a tri-state mock tier:
#   full  -> all shims (libibmocksys sysfs, libibmockumad UMAD, libibmockverbs
#            verbs) + the mock-ib daemon. Enables
#            ibstat/ibstatus/ibping/iblinkinfo/ibv_devinfo.
#   sysfs -> libibmocksys sysfs redirection only (ibstat/ibstatus; no daemon).
#   off   -> every shim is a no-op (real host).
# The shims stay LD_PRELOAD'd in every container process regardless of tier and
# no-op when MOCK_IB=off, so `MOCK_IB=off <cmd>` is the per-command escape hatch.
infiniband:
  # -- InfiniBand mock tier; empty derives the tier from the selected profile.
  # mockTier sets the container's MOCK_IB value: off | sysfs | full.
  # Defaults to "full" for InfiniBand-enabled profiles and "sysfs" for non-IB
  # profiles (sysfs keeps the libibmocksys redirect active so any real host IB
  # is masked, i.e. ibstat reports 0 HCAs). Leaving this empty auto-derives
  # that per profile. Set it explicitly to override (an invalid value fails
  # `helm template`).
  mockTier: ""
  ping:
    # -- TCP port used by the mock InfiniBand ping service.
    port: 18515
    # The mock-ib TCP fabric listener binds 0.0.0.0:<port> with no
    # authentication. This NetworkPolicy restricts inbound
    # access to that port to peer nvml-mock pods (the only legitimate
    # clients), limiting the blast radius on clusters whose CNI enforces
    # NetworkPolicy. NOTE: Kind's default CNI (kindnet) ENFORCES
    # NetworkPolicy on current releases, so this allow-list is load-bearing
    # there; it also matters on Calico/Cilium.
    networkPolicy:
      # -- Restrict mock InfiniBand traffic to peer nvml-mock pods.
      enabled: true

imex:
  # Mock IMEX capability surface for the NVIDIA DRA driver's compute-domain
  # kubelet plugin. That plugin reads a device major for
  # nvidia-caps-imex-channels out of /proc/devices at startup; on a mock node
  # there is no NVIDIA kernel module, so the entry is absent and the plugin
  # aborts with "error parsing '/proc/devices': unexpected regex match: []".
  #
  # When enabled, the DaemonSet renders:
  #   <hostPath>/imex/proc-devices                       substitute /proc/devices
  #   <driverRoot>/proc/driver/nvidia/capabilities/...   fabric-imex-mgmt
  #   <driverRoot>/dev/nvidia-caps-imex-channels/channelN  channel device nodes
  #
  # Pair it with the DRA driver, on a release that supports altProcDevices:
  #   --set altProcDevices=/var/lib/nvml-mock/imex/proc-devices
  #   --set resources.computeDomains.enabled=true
  #
  # NOTE: as of 2026-07-25 altProcDevices is on the DRA driver's main branch
  # but is NOT in any release (absent at v25.12.0), so enabling this alone does
  # not yet make ComputeDomains work with released artifacts. See
  # NVIDIA/k8s-test-infra#498.
  #
  # Off by default: it creates channelCount device nodes per node.
  mockChannels:
    # -- Enable simulation of IMEX channel devices.
    enabled: false
    # Number of channel device nodes. 2048 matches getImexChannelCount() in the
    # DRA driver's compute-domain kubelet plugin.
    # -- Number of IMEX channel device nodes to create per node.
    channelCount: 2048
    # Device majors advertised in the rendered proc-devices file. Defaults match
    # the DRA driver's own CI fixtures. They must differ from each other and
    # must not collide with a major already present on the node.
    # -- Major number used for IMEX channel devices.
    channelMajor: 235
    # -- Major number used for IMEX capability devices.
    capsMajor: 236

# Fake nvidia-fabricmanager. NVSwitch platforms (HGX H100 / GB200 / GB300)
# run nvidia-fabricmanager to register GPUs with the NVSwitch fabric. When
# enabled the entrypoint starts the fake nvidia-fabricmanager daemon (baked
# into the image), which writes a node-local readiness marker under
# `stateDir`. The mock NVML engine reads that marker to resolve each GPU's
# fabric state for profiles that set `fabric.state: auto` (GB200/GB300/H100):
# IN_PROGRESS until the daemon is ready, COMPLETED once it is.
#
# `enabled` is a tri-state override and is derived from the GPU profile by
# default — leave it empty and the chart starts the daemon when the profile
# declares NVSwitches (`nvlink.switches`) or sets `device_defaults.fabric.state:
# auto` (same pattern as infiniband.mockTier). A100 runs the legacy daemon
# (NVSwitch baseboard, no GpuFabricInfo API); standalone B200/L40S/T4 declare
# no NVSwitches and do not start the daemon. Set to true/false to force it
# regardless of profile (e.g. with gpu.customConfig).
fabricmanager:
  # -- Enable or disable the fake fabric manager; empty derives it from the profile.
  enabled: ""
  # -- Host directory for fabric-manager readiness state.
  stateDir: /var/lib/nvml-mock/fabric-state
  # Delay before the node agent publishes fabric readiness, as a Go duration
  # ("15s"). Real NVSwitch registration is not instant; set this to exercise the
  # IN_PROGRESS window a workload sees before the fabric comes up. Empty means
  # publish immediately.
  # -- Delay before publishing fabric readiness.
  initDelay: ""

# Integration with external projects
integrations:
  fakeGpuOperator:
    # -- Enable fake-gpu-operator profile integration.
    enabled: false
    # Namespace for the profile ConfigMaps. Empty means the release namespace.
    # fake-gpu-operator loads profiles from its OWN release namespace, so set
    # this to that namespace (their README installs into `gpu-operator`) for
    # the ConfigMaps to be readable. Doing so requires FGO's
    # `builtinProfiles.enabled=false`, because their builtin set uses the same
    # seven names and is owned by their Helm release. See
    # docs/guides/runai-fgo/README.md.
    # -- Namespace where fake-gpu-operator reads profile ConfigMaps.
    targetNamespace: ""
    # Extra labels applied to per-profile ConfigMaps. The contract labels
    # `fake-gpu-operator/gpu-profile` and `nvml-mock/profile-name` are always
    # emitted by the template and cannot be removed through this map.
    profileLabels:
      # -- Additional label applied to generated fake-gpu-operator profiles.
      run.ai/gpu-profile: "true"

# Mokka Control Plane (MEP-0001). Defaults to disabled.
controlPlane:
  # -- Enable the Mokka control-plane service.
  enabled: false
  # -- Number of control-plane replicas.
  replicas: 1
  image:
    # -- Control-plane image repository.
    repository: ghcr.io/nvidia/mokka-control-plane
    # Required when enabled outside Tilt's explicit local mutable-tag mode.
    # Digest pinning prevents the cluster-privileged controller artifact from
    # changing without a Helm values change.
    # -- Immutable digest for the control-plane image.
    digest: ""
    # Tilt sets both fields for locally built images. Keep mutable tags disabled
    # for normal installs so the cluster-privileged controller stays immutable.
    # -- Control-plane image tag for local development.
    tag: ""
    # -- Allow a mutable control-plane image tag.
    allowMutableTag: false
    # -- Kubernetes image pull policy for the control plane.
    pullPolicy: IfNotPresent
  logging:
    # -- Control-plane log level.
    level: info    # debug | info | warn | error
    # -- Control-plane log encoding.
    format: json   # json | plain
  # Go duration string: 5s, 1m30s, etc.
  # -- Graceful control-plane shutdown timeout.
  shutdownTimeout: 5s
  # -- Number of control-plane worker goroutines.
  workers: 2
  # Client-side Kubernetes API throttling. Raise these together with workers
  # when faster initial convergence is worth the additional control-plane load.
  # -- Kubernetes API request rate for the control plane.
  kubeAPIQPS: 50
  # -- Kubernetes API burst allowance for the control plane.
  kubeAPIBurst: 100
  leaderElection:
    # -- Lease name used for control-plane leader election.
    name: control-plane.mokka.nvidia.com
  service:
    # -- Kubernetes Service type for the control plane.
    type: ClusterIP
    # -- Kubernetes Service port for the control plane.
    port: 8080
  # Total shutdown budget on the pod: preStop sleep + in-flight request drain
  # (shutdownTimeout above) must fit inside this. 30s matches the kube default
  # and leaves headroom over the current 10s preStop + 5s drain; raise this
  # together with shutdownTimeout if the CP starts holding long-lived connections.
  # Setting it below preStop + drain truncates the drain — kube SIGKILLs at the
  # grace boundary regardless.
  # -- Pod termination grace period for the control plane.
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      # -- CPU requested by the control plane.
      cpu: 50m
      # -- Memory requested by the control plane.
      memory: 64Mi
    limits:
      # -- CPU limit for the control plane.
      cpu: 500m
      # -- Memory limit for the control plane.
      memory: 1Gi
  # -- Node selector for control-plane pods.
  nodeSelector: {}
  # -- Tolerations for control-plane pods.
  tolerations: []
  # With replicas > 1, pod anti-affinity on kubernetes.io/hostname keeps the
  # standby off the leader's node, so losing one node does not stop both.
  priorityClassName: ""
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  # Must not set the selector labels app.kubernetes.io/{name,instance,component}.
  podLabels: {}
  # PodDisruptionBudget bounding voluntary disruptions of the replicas, such as
  # node drains. Rendered only with replicas > 1: over a single replica it
  # either blocks every drain or protects nothing. Bounds are a count or a
  # percentage; maxUnavailable wins if both are set, and with neither
  # minAvailable is 1. A minAvailable equal to replicas blocks every drain of a
  # node running a replica.
  pdb:
    enabled: false
    # minAvailable: 1
    # maxUnavailable: 1

# Additional Kubernetes objects rendered with the release, each passed through
# tpl so it can reference chart values (e.g. "{{ .Release.Name }}"). Either a
# list, or a map keyed by name so layered values files can override or drop
# ("") individual entries. Each entry is an object or a YAML string.
extraObjects: []
