apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mokka-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mokka-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mokka-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mokka-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mokka-controller.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mokka-controller
          image: {{ include "mokka-controller.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --health-bind-address=:{{ .Values.service.port }}
            - --leader-election-namespace={{ .Release.Namespace }}
            - --leader-election-name={{ .Values.controller.leaderElection.name }}
            - --leader-election-lease-duration={{ .Values.controller.leaderElection.leaseDuration }}
            - --leader-election-renew-deadline={{ .Values.controller.leaderElection.renewDeadline }}
            - --leader-election-retry-period={{ .Values.controller.leaderElection.retryPeriod }}
            - --workers={{ .Values.controller.workers }}
            - --status-debounce={{ .Values.controller.statusDebounce }}
            - --status-progress-interval={{ .Values.controller.statusProgressInterval }}
            - --kube-api-qps={{ .Values.controller.kubeAPIQPS }}
            - --kube-api-burst={{ .Values.controller.kubeAPIBurst }}
            {{- range .Values.controller.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
