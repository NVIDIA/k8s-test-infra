---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: sgpuracks.mokka.nvidia.com
spec:
  group: mokka.nvidia.com
  names:
    categories:
    - mokka
    kind: SGPURack
    listKind: SGPURackList
    plural: sgpuracks
    shortNames:
    - sgpur
    singular: sgpurack
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.inventoryRef.name
      name: Inventory
      type: string
    - jsonPath: .spec.identity.rackGroup
      name: Rack Group
      type: string
    - jsonPath: .spec.identity.rackIndex
      name: Rack
      type: integer
    - jsonPath: .spec.profileRef.name
      name: Profile
      type: string
    - jsonPath: .status.assignedNodes
      name: Assigned
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SGPURack is the controller-owned materialization of one inventory rack.
          Its controller owner reference identifies the inventory pinned by
          spec.inventoryRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the controller-owned rendered rack specification.
            properties:
              identity:
                description: Identity is the stable coordinate used by agents and
                  topology consumers.
                properties:
                  cliqueID:
                    description: |-
                      CliqueID remains zero while each rack represents one fabric clique.
                      CliqueID is reserved for future multi-clique racks and is currently zero.
                    format: int32
                    maximum: 0
                    minimum: 0
                    type: integer
                  fabricUUID:
                    description: FabricUUID identifies the fabric clique represented
                      by this rack.
                    format: uuid
                    type: string
                  rackGroup:
                    description: RackGroup is the stable group identifier.
                    format: dns1123Label
                    maxLength: 63
                    minLength: 1
                    type: string
                  rackIndex:
                    description: RackIndex is the zero-based index within the group.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - cliqueID
                - fabricUUID
                - rackGroup
                - rackIndex
                type: object
              inventoryRef:
                description: |-
                  InventoryRef pins ownership to an exact inventory instance so a
                  same-name replacement cannot inherit this rack.
                properties:
                  name:
                    description: Name is the inventory resource name.
                    minLength: 1
                    type: string
                  uid:
                    description: UID identifies the exact inventory instance.
                    type: string
                required:
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: uid must not be empty
                  rule: size(self.uid) > 0
              nodes:
                description: |-
                  Nodes retain stable device identities while Kubernetes Node assignments
                  change. Fabric and network capabilities remain in the referenced profile.
                items:
                  description: SGPURackNode is one logical Node and its optional Kubernetes
                    Node binding.
                  properties:
                    gpus:
                      description: GPUs are rendered once for the logical Node and
                        do not depend on its binding.
                      items:
                        description: SGPURackGPU contains deterministic identity and
                          structural placement.
                        properties:
                          hostProcessorIndex:
                            description: HostProcessorIndex is the host processor
                              index associated with the GPU.
                            format: int32
                            minimum: 0
                            type: integer
                          index:
                            description: Index is the logical GPU index within the
                              node.
                            format: int32
                            maximum: 63
                            minimum: 0
                            type: integer
                          minorNumber:
                            description: MinorNumber is the simulated device minor
                              number.
                            format: int32
                            minimum: 0
                            type: integer
                          numaNode:
                            description: NUMANode is the host NUMA node containing
                              the GPU.
                            format: int32
                            minimum: 0
                            type: integer
                          pciAddress:
                            pattern: ^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]$
                            type: string
                          rootComplex:
                            description: RootComplex identifies the PCI root complex.
                            pattern: ^pci[0-9a-f]{4}:[0-9a-f]{2}$
                            type: string
                          serial:
                            description: Serial is the simulated GPU serial number.
                            minLength: 1
                            type: string
                          uuid:
                            description: UUID is the stable GPU identifier.
                            pattern: ^GPU-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                            type: string
                        required:
                        - hostProcessorIndex
                        - index
                        - minorNumber
                        - numaNode
                        - pciAddress
                        - rootComplex
                        - serial
                        - uuid
                        type: object
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - index
                      x-kubernetes-list-type: map
                    index:
                      description: Index is the logical node index within the rack.
                      format: int32
                      maximum: 1023
                      minimum: 0
                      type: integer
                    nodeRef:
                      description: |-
                        NodeRef is absent while the logical Node is unbound. Its UID distinguishes
                        a replacement Kubernetes Node that reuses the same name.
                      properties:
                        name:
                          description: Name is the Kubernetes Node name.
                          minLength: 1
                          type: string
                        uid:
                          description: UID identifies the exact Kubernetes Node instance.
                          type: string
                      required:
                      - name
                      - uid
                      type: object
                      x-kubernetes-validations:
                      - message: uid must not be empty
                        rule: size(self.uid) > 0
                  required:
                  - gpus
                  - index
                  type: object
                maxItems: 1024
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - index
                x-kubernetes-list-type: map
              profileRef:
                description: ProfileRef records the exact profile revision used to
                  render the rack.
                properties:
                  generation:
                    description: Generation is the profile resource generation used
                      to render the rack.
                    format: int64
                    minimum: 1
                    type: integer
                  name:
                    description: Name is the profile resource name.
                    minLength: 1
                    type: string
                  revision:
                    description: Revision identifies the rendered profile content,
                      independent of its name.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  uid:
                    description: UID identifies the exact profile instance.
                    type: string
                required:
                - generation
                - name
                - revision
                - uid
                type: object
                x-kubernetes-validations:
                - message: uid must not be empty
                  rule: size(self.uid) > 0
            required:
            - identity
            - inventoryRef
            - nodes
            - profileRef
            type: object
          status:
            description: Status reports node binding and readiness state.
            properties:
              assignedNodes:
                description: |-
                  AssignedNodes is the number of logical Nodes with an exact Kubernetes
                  Node binding.
                format: int32
                minimum: 0
                type: integer
              conditions:
                description: |-
                  Conditions report whether the rendered assignment is ready for agents.
                  Conditions report whether the rack assignment is ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest spec generation reflected
                  by this status.
                format: int64
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
