---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: sgpuruntimepolicies.mokka.nvidia.com
spec:
  group: mokka.nvidia.com
  names:
    categories:
    - mokka
    kind: SGPURuntimePolicy
    listKind: SGPURuntimePolicyList
    plural: sgpuruntimepolicies
    shortNames:
    - srpol
    singular: sgpuruntimepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Inventory
      type: string
    - jsonPath: .status.rackGroupsSummary
      name: RackGroups
      type: string
    - jsonPath: .status.rackIndexesSummary
      name: Racks
      type: string
    - jsonPath: .status.nodeIndexesSummary
      name: Nodes
      type: string
    - jsonPath: .status.gpuIndexesSummary
      name: GPUs
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SGPURuntimePolicy applies a sparse RuntimeState override to a subset of
          an SGPUInventory.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec selects the inventory scope and runtime override.
            properties:
              runtime:
                description: Runtime is the sparse runtime override to apply.
                properties:
                  deviceState:
                    description: DeviceState is the simulated GPU health state.
                    enum:
                    - Healthy
                    - Degraded
                    - Failed
                    type: string
                  modes:
                    description: Modes contains persistent NVML/CUDA mode settings.
                    properties:
                      accounting:
                        description: Accounting controls accounting mode.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      compute:
                        description: Compute controls compute mode.
                        enum:
                        - Default
                        - Exclusive
                        - Prohibited
                        type: string
                      ecc:
                        description: ECC controls ECC mode.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      mig:
                        description: MIG controls MIG mode.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      persistence:
                        description: Persistence controls persistence mode.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  telemetry:
                    description: Telemetry contains synthetic NVML telemetry values.
                    properties:
                      clocks:
                        description: ClocksTelemetry reports current clock rates.
                        properties:
                          graphicsMHz:
                            description: GraphicsMHz is the graphics clock in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          memoryMHz:
                            description: MemoryMHz is the memory clock in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          smMHz:
                            description: SMMHz is the SM clock in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          videoMHz:
                            description: VideoMHz is the video clock in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      performanceState:
                        description: |-
                          NVML P-state, e.g. "P0".
                          PerformanceState is the NVML performance state, such as P0.
                        pattern: ^P[0-9]+$
                        type: string
                      power:
                        description: PowerTelemetry drives synthetic power draw.
                        properties:
                          drawMilliWatts:
                            description: DrawMilliWatts is the synthetic power draw
                              in milliwatts.
                            format: int64
                            minimum: 0
                            type: integer
                          mode:
                            description: Mode selects fixed or patterned power draw.
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      temperature:
                        description: TemperatureTelemetry drives synthetic GPU/memory
                          temperature.
                        properties:
                          gpuCelsius:
                            description: GPUCelsius is the GPU temperature in Celsius.
                            format: int32
                            type: integer
                          memoryCelsius:
                            description: MemoryCelsius is the memory temperature in
                              Celsius.
                            format: int32
                            type: integer
                          mode:
                            description: Mode selects fixed or patterned temperature.
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      utilization:
                        description: UtilizationTelemetry drives synthetic GPU/memory
                          utilization.
                        properties:
                          mode:
                            description: Mode selects fixed or patterned utilization.
                            enum:
                            - Pattern
                            - Fixed
                            type: string
                          pattern:
                            description: Pattern describes the utilization curve when
                              Mode is Pattern.
                            properties:
                              gpuPercent:
                                description: GPUPercent is the GPU utilization range.
                                properties:
                                  maximum:
                                    description: Maximum is the upper percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    description: Minimum is the lower percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              memoryPercent:
                                description: MemoryPercent is the memory utilization
                                  range.
                                properties:
                                  maximum:
                                    description: Maximum is the upper percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    description: Minimum is the lower percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              type:
                                description: Type selects the utilization curve shape.
                                enum:
                                - Steady
                                - Bursty
                                - Wave
                                type: string
                            type: object
                        type: object
                    type: object
                type: object
              targetRef:
                description: TargetRef identifies the inventory and optional rack,
                  node, and GPU axes.
                properties:
                  gpuIndexes:
                    description: GPUIndexes limits the policy to these GPU indexes.
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  group:
                    description: Group is the API group of the selected inventory.
                    enum:
                    - mokka.nvidia.com
                    type: string
                  kind:
                    description: Kind is the resource kind being selected.
                    enum:
                    - SGPUInventory
                    type: string
                  name:
                    description: Name is the selected SGPUInventory resource name.
                    minLength: 1
                    type: string
                  nodeIndexes:
                    description: NodeIndexes limits the policy to these node indexes.
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackGroups:
                    description: RackGroups limits the policy to these rack-group
                      IDs.
                    items:
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackIndexes:
                    description: RackIndexes limits the policy to these rack indexes.
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - group
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
          status:
            description: Status contains denormalized target axes for print columns.
            properties:
              gpuIndexesSummary:
                description: GPUIndexesSummary lists the selected GPU indexes.
                type: string
              nodeIndexesSummary:
                description: NodeIndexesSummary lists the selected node indexes.
                type: string
              rackGroupsSummary:
                description: RackGroupsSummary lists the selected rack groups.
                type: string
              rackIndexesSummary:
                description: RackIndexesSummary lists the selected rack indexes.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
