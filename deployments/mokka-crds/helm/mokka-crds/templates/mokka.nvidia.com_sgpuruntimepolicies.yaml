---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sgpuruntimepolicies.mokka.nvidia.com
spec:
  group: mokka.nvidia.com
  names:
    categories:
    - mokka
    kind: SGPURuntimePolicy
    listKind: SGPURuntimePolicyList
    plural: sgpuruntimepolicies
    shortNames:
    - srpol
    singular: sgpuruntimepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.kind
      name: TargetKind
      type: string
    - jsonPath: .spec.targetRef.name
      name: TargetName
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SGPURuntimePolicy applies a sparse RuntimeState override to a subset of the
          referenced SGPUInventory: a whole inventory, specific rack groups, specific
          rack indices, specific node indices, or specific GPU indices. Omitted
          spec.runtime fields inherit from the profile's defaults.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SGPURuntimePolicySpec pairs a target selector with the RuntimeState
              to apply.
            properties:
              runtime:
                description: |-
                  RuntimeState is the effective device runtime settings applied to a
                  simulated GPU. SGPUProfile.spec.defaults.runtime holds the baseline shape;
                  SGPURuntimePolicy.spec.runtime holds a sparse override with identical
                  semantics: an omitted field means "inherit"; an explicit zero or empty
                  list is a real assignment.
                properties:
                  deviceState:
                    description: DeviceState enumerates simulated GPU health states
                      surfaced through NVML.
                    enum:
                    - Healthy
                    - Degraded
                    - Failed
                    type: string
                  modes:
                    description: |-
                      RuntimeModes mirrors the persistent NVML/CUDA mode settings surfaced by
                      nvidia-smi -q.
                    properties:
                      accounting:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      compute:
                        enum:
                        - Default
                        - Exclusive
                        - Prohibited
                        type: string
                      ecc:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      mig:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      persistence:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  telemetry:
                    description: |-
                      RuntimeTelemetry defines the synthetic telemetry values the mock reports
                      through NVML — utilization, power, temperature, and clock rates.
                    properties:
                      clocks:
                        description: ClocksTelemetry reports current clock rates back
                          through NVML queries.
                        properties:
                          graphicsMHz:
                            format: int32
                            minimum: 0
                            type: integer
                          memoryMHz:
                            format: int32
                            minimum: 0
                            type: integer
                          smMHz:
                            format: int32
                            minimum: 0
                            type: integer
                          videoMHz:
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      performanceState:
                        description: PerformanceState is an NVML P-state string such
                          as "P0" or "P8".
                        pattern: ^P[0-9]+$
                        type: string
                      power:
                        description: PowerTelemetry drives synthetic power draw.
                        properties:
                          drawMilliWatts:
                            format: int64
                            minimum: 0
                            type: integer
                          mode:
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      temperature:
                        description: TemperatureTelemetry drives synthetic GPU/memory
                          temperatures.
                        properties:
                          gpuCelsius:
                            format: int32
                            type: integer
                          memoryCelsius:
                            format: int32
                            type: integer
                          mode:
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      utilization:
                        description: UtilizationTelemetry drives synthetic GPU/memory
                          utilization curves.
                        properties:
                          mode:
                            description: Mode selects between a static value ("Fixed")
                              and a generator ("Pattern").
                            enum:
                            - Pattern
                            - Fixed
                            type: string
                          pattern:
                            description: UtilizationPattern selects the shape of the
                              generated utilization curve.
                            properties:
                              gpuPercent:
                                description: PercentRange bounds a synthetic percentage
                                  curve.
                                properties:
                                  maximum:
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              memoryPercent:
                                description: PercentRange bounds a synthetic percentage
                                  curve.
                                properties:
                                  maximum:
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              type:
                                enum:
                                - Steady
                                - Bursty
                                - Wave
                                type: string
                            type: object
                        type: object
                    type: object
                type: object
              targetRef:
                description: |-
                  PolicyTargetRef selects the fan-out scope. Increasing specificity: whole
                  inventory → subset of rack groups → subset of rack indices → subset of
                  node indices → subset of GPU indices. Each optional slice narrows the
                  previous level. Cross-field validation (rackIndex < count etc.) is done by
                  the controller, not the schema — see MEP0001 §SGPURuntimePolicy.
                properties:
                  gpuIndexes:
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  group:
                    enum:
                    - mokka.nvidia.com
                    type: string
                  kind:
                    enum:
                    - SGPUInventory
                    type: string
                  name:
                    minLength: 1
                    type: string
                  nodeIndexes:
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackGroups:
                    items:
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackIndexes:
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - group
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
