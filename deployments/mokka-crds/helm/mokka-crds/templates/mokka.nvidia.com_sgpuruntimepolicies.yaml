---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: sgpuruntimepolicies.mokka.nvidia.com
spec:
  group: mokka.nvidia.com
  names:
    categories:
    - mokka
    kind: SGPURuntimePolicy
    listKind: SGPURuntimePolicyList
    plural: sgpuruntimepolicies
    shortNames:
    - srpol
    singular: sgpuruntimepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Inventory
      type: string
    - jsonPath: .status.rackGroupsSummary
      name: RackGroups
      type: string
    - jsonPath: .status.rackIndexesSummary
      name: Racks
      type: string
    - jsonPath: .status.nodeIndexesSummary
      name: Nodes
      type: string
    - jsonPath: .status.gpuIndexesSummary
      name: GPUs
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SGPURuntimePolicy applies a sparse RuntimeState override to a subset of
          an SGPUInventory.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the target selection and runtime settings to
              apply.
            properties:
              runtime:
                description: Runtime contains sparse settings to apply to the selected
                  GPUs.
                properties:
                  deviceState:
                    description: DeviceState is the simulated health state of the
                      GPU.
                    enum:
                    - Healthy
                    - Degraded
                    - Failed
                    type: string
                  modes:
                    description: Modes contains persistent NVML/CUDA mode settings.
                    properties:
                      accounting:
                        description: Accounting controls whether GPU accounting mode
                          is enabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      compute:
                        description: Compute selects the simulated compute mode.
                        enum:
                        - Default
                        - Exclusive
                        - Prohibited
                        type: string
                      ecc:
                        description: ECC controls whether error-correcting code is
                          enabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      mig:
                        description: MIG controls whether Multi-Instance GPU mode
                          is enabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      persistence:
                        description: Persistence controls the simulated persistence
                          mode.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  telemetry:
                    description: Telemetry contains synthetic utilization, power,
                      temperature, and clock values.
                    properties:
                      clocks:
                        description: Clocks defines the current simulated clock rates.
                        properties:
                          graphicsMHz:
                            description: GraphicsMHz is the simulated graphics clock
                              rate in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          memoryMHz:
                            description: MemoryMHz is the simulated memory clock rate
                              in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          smMHz:
                            description: SMMHz is the simulated streaming-multiprocessor
                              clock rate in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          videoMHz:
                            description: VideoMHz is the simulated video clock rate
                              in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      performanceState:
                        description: NVML P-state, e.g. "P0".
                        pattern: ^P[0-9]+$
                        type: string
                      power:
                        description: Power defines synthetic power draw values.
                        properties:
                          drawMilliWatts:
                            description: DrawMilliWatts is the simulated GPU power
                              draw in milliwatts.
                            format: int64
                            minimum: 0
                            type: integer
                          mode:
                            description: Mode selects a constant or generated power
                              draw.
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      temperature:
                        description: Temperature defines synthetic GPU and memory
                          temperature values.
                        properties:
                          gpuCelsius:
                            description: GPUCelsius is the simulated GPU temperature
                              in degrees Celsius.
                            format: int32
                            type: integer
                          memoryCelsius:
                            description: MemoryCelsius is the simulated memory temperature
                              in degrees Celsius.
                            format: int32
                            type: integer
                          mode:
                            description: Mode selects constant or generated temperature
                              values.
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      utilization:
                        description: Utilization defines synthetic GPU and memory
                          utilization values.
                        properties:
                          mode:
                            description: Mode selects pattern-generated or fixed utilization
                              values.
                            enum:
                            - Pattern
                            - Fixed
                            type: string
                          pattern:
                            description: Pattern defines the utilization values generated
                              over time.
                            properties:
                              gpuPercent:
                                description: GPUPercent sets the minimum and maximum
                                  GPU utilization percentages.
                                properties:
                                  maximum:
                                    description: Maximum is the upper utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    description: Minimum is the lower utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              memoryPercent:
                                description: MemoryPercent sets the minimum and maximum
                                  memory utilization percentages.
                                properties:
                                  maximum:
                                    description: Maximum is the upper utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    description: Minimum is the lower utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              type:
                                description: Type selects the shape of the generated
                                  utilization curve.
                                enum:
                                - Steady
                                - Bursty
                                - Wave
                                type: string
                            type: object
                        type: object
                    type: object
                type: object
              targetRef:
                description: TargetRef selects the inventory and optional rack, Node,
                  and GPU subset.
                properties:
                  gpuIndexes:
                    description: GPUIndexes optionally limits the policy to these
                      GPU indexes.
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  group:
                    description: Group is the API group containing the target resource.
                    enum:
                    - mokka.nvidia.com
                    type: string
                  kind:
                    description: Kind is the target resource kind.
                    enum:
                    - SGPUInventory
                    type: string
                  name:
                    description: Name is the name of the target SGPUInventory.
                    minLength: 1
                    type: string
                  nodeIndexes:
                    description: NodeIndexes optionally limits the policy to these
                      logical Node indexes.
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackGroups:
                    description: RackGroups optionally limits the policy to these
                      rack-group IDs.
                    items:
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackIndexes:
                    description: RackIndexes optionally limits the policy to these
                      rack indexes.
                    items:
                      format: int32
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - group
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
          status:
            description: Status summarizes the target scope selected for this policy.
            properties:
              gpuIndexesSummary:
                description: GPUIndexesSummary is the comma-separated selected GPU
                  indexes.
                type: string
              nodeIndexesSummary:
                description: NodeIndexesSummary is the comma-separated selected logical
                  Node indexes.
                type: string
              rackGroupsSummary:
                description: RackGroupsSummary is the comma-separated selected rack-group
                  IDs.
                type: string
              rackIndexesSummary:
                description: RackIndexesSummary is the comma-separated selected rack
                  indexes.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
