---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: sgpuruntimepolicies.mokka.nvidia.com
spec:
  group: mokka.nvidia.com
  names:
    categories:
    - mokka
    kind: SGPURuntimePolicy
    listKind: SGPURuntimePolicyList
    plural: sgpuruntimepolicies
    shortNames:
    - srpol
    singular: sgpuruntimepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Inventory
      type: string
    - jsonPath: .status.rackGroupsSummary
      name: RackGroups
      type: string
    - jsonPath: .status.rackIndexesSummary
      name: Racks
      type: string
    - jsonPath: .status.nodeIndexesSummary
      name: Nodes
      type: string
    - jsonPath: .status.gpuIndexesSummary
      name: GPUs
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SGPURuntimePolicy applies a sparse RuntimeState override to a subset of
          an SGPUInventory.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SGPURuntimePolicySpec pairs a target selector with the RuntimeState
              to apply.
            properties:
              runtime:
                description: Runtime contains sparse settings to apply to the selected
                  GPUs.
                properties:
                  deviceState:
                    description: DeviceState is a simulated GPU health state.
                    enum:
                    - Healthy
                    - Degraded
                    - Failed
                    type: string
                  modes:
                    description: RuntimeModes is the persistent NVML/CUDA mode settings.
                    properties:
                      accounting:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      compute:
                        enum:
                        - Default
                        - Exclusive
                        - Prohibited
                        type: string
                      ecc:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      mig:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                      persistence:
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  telemetry:
                    description: RuntimeTelemetry is the synthetic NVML telemetry.
                    properties:
                      clocks:
                        description: ClocksTelemetry reports current clock rates.
                        properties:
                          graphicsMHz:
                            description: GraphicsMHz is the simulated graphics clock
                              rate in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          memoryMHz:
                            description: MemoryMHz is the simulated memory clock rate
                              in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          smMHz:
                            description: SMMHz is the simulated streaming-multiprocessor
                              clock rate in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                          videoMHz:
                            description: VideoMHz is the simulated video clock rate
                              in MHz.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      performanceState:
                        description: NVML P-state, e.g. "P0".
                        pattern: ^P[0-9]+$
                        type: string
                      power:
                        description: PowerTelemetry drives synthetic power draw.
                        properties:
                          drawMilliWatts:
                            description: DrawMilliWatts is the simulated GPU power
                              draw in milliwatts.
                            format: int64
                            minimum: 0
                            type: integer
                          mode:
                            description: Mode selects a constant or generated power
                              draw.
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      temperature:
                        description: TemperatureTelemetry drives synthetic GPU/memory
                          temperature.
                        properties:
                          gpuCelsius:
                            description: GPUCelsius is the simulated GPU temperature
                              in degrees Celsius.
                            format: int32
                            type: integer
                          memoryCelsius:
                            description: MemoryCelsius is the simulated memory temperature
                              in degrees Celsius.
                            format: int32
                            type: integer
                          mode:
                            description: Mode selects constant or generated temperature
                              values.
                            enum:
                            - Fixed
                            - Pattern
                            type: string
                        type: object
                      utilization:
                        description: UtilizationTelemetry drives synthetic GPU/memory
                          utilization.
                        properties:
                          mode:
                            description: Mode selects pattern-generated or fixed utilization
                              values.
                            enum:
                            - Pattern
                            - Fixed
                            type: string
                          pattern:
                            description: Pattern defines the utilization values generated
                              over time.
                            properties:
                              gpuPercent:
                                description: GPUPercent sets the minimum and maximum
                                  GPU utilization percentages.
                                properties:
                                  maximum:
                                    description: Maximum is the upper utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    description: Minimum is the lower utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              memoryPercent:
                                description: MemoryPercent sets the minimum and maximum
                                  memory utilization percentages.
                                properties:
                                  maximum:
                                    description: Maximum is the upper utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                  minimum:
                                    description: Minimum is the lower utilization
                                      percentage bound.
                                    format: int32
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                                required:
                                - maximum
                                - minimum
                                type: object
                              type:
                                description: Type selects the shape of the generated
                                  utilization curve.
                                enum:
                                - Steady
                                - Bursty
                                - Wave
                                type: string
                            type: object
                        type: object
                    type: object
                type: object
              targetRef:
                description: TargetRef selects the inventory and optional rack, Node,
                  and GPU subset.
                properties:
                  gpuIndexes:
                    description: GPUIndexes optionally limits the policy to these
                      GPU indexes.
                    items:
                      format: int32
                      minimum: 0
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  group:
                    description: Group is the API group containing the target resource.
                    enum:
                    - mokka.nvidia.com
                    type: string
                  kind:
                    description: Kind is the target resource kind.
                    enum:
                    - SGPUInventory
                    type: string
                  name:
                    description: Name is the name of the target SGPUInventory.
                    minLength: 1
                    type: string
                  nodeIndexes:
                    description: NodeIndexes optionally limits the policy to these
                      logical Node indexes.
                    items:
                      format: int32
                      minimum: 0
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackGroups:
                    description: RackGroups optionally limits the policy to these
                      rack-group IDs.
                    items:
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  rackIndexes:
                    description: RackIndexes optionally limits the policy to these
                      rack indexes.
                    items:
                      format: int32
                      minimum: 0
                      type: integer
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - group
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
          status:
            description: |-
              SGPURuntimePolicyStatus reports whether the policy is accepted and holds
              comma-joined denormalizations of spec.targetRef axes for print columns.
            properties:
              conditions:
                description: Conditions report whether the policy is accepted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gpuIndexesSummary:
                description: GPUIndexesSummary is the comma-separated selected GPU
                  indexes.
                type: string
              nodeIndexesSummary:
                description: NodeIndexesSummary is the comma-separated selected logical
                  Node indexes.
                type: string
              rackGroupsSummary:
                description: RackGroupsSummary is the comma-separated selected rack-group
                  IDs.
                type: string
              rackIndexesSummary:
                description: RackIndexesSummary is the comma-separated selected rack
                  indexes.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
