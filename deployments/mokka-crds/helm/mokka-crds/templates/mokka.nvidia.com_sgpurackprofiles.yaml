---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: sgpurackprofiles.mokka.nvidia.com
spec:
  group: mokka.nvidia.com
  names:
    categories:
    - mokka
    kind: SGPURackProfile
    listKind: SGPURackProfileList
    plural: sgpurackprofiles
    shortNames:
    - srprof
    singular: sgpurackprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.rack.nodesPerRack
      name: Nodes/Rack
      type: integer
    - jsonPath: .spec.node.gpus.count
      name: GPUs/Node
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SGPURackProfile is the static shape of a simulated GPU rack.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec describes the static rack shape and GPU defaults.
            properties:
              defaults:
                description: Defaults contains initial runtime values for newly created
                  GPUs.
                properties:
                  runtime:
                    description: Runtime contains initial runtime state for newly
                      created GPUs.
                    properties:
                      deviceState:
                        description: DeviceState is the simulated GPU health state.
                        enum:
                        - Healthy
                        - Degraded
                        - Failed
                        type: string
                      modes:
                        description: Modes contains persistent NVML/CUDA mode settings.
                        properties:
                          accounting:
                            description: Accounting controls accounting mode.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          compute:
                            description: Compute controls compute mode.
                            enum:
                            - Default
                            - Exclusive
                            - Prohibited
                            type: string
                          ecc:
                            description: ECC controls ECC mode.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          mig:
                            description: MIG controls MIG mode.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          persistence:
                            description: Persistence controls persistence mode.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                        type: object
                      telemetry:
                        description: Telemetry contains synthetic NVML telemetry values.
                        properties:
                          clocks:
                            description: ClocksTelemetry reports current clock rates.
                            properties:
                              graphicsMHz:
                                description: GraphicsMHz is the graphics clock in
                                  MHz.
                                format: int32
                                minimum: 0
                                type: integer
                              memoryMHz:
                                description: MemoryMHz is the memory clock in MHz.
                                format: int32
                                minimum: 0
                                type: integer
                              smMHz:
                                description: SMMHz is the SM clock in MHz.
                                format: int32
                                minimum: 0
                                type: integer
                              videoMHz:
                                description: VideoMHz is the video clock in MHz.
                                format: int32
                                minimum: 0
                                type: integer
                            type: object
                          performanceState:
                            description: |-
                              NVML P-state, e.g. "P0".
                              PerformanceState is the NVML performance state, such as P0.
                            pattern: ^P[0-9]+$
                            type: string
                          power:
                            description: PowerTelemetry drives synthetic power draw.
                            properties:
                              drawMilliWatts:
                                description: DrawMilliWatts is the synthetic power
                                  draw in milliwatts.
                                format: int64
                                minimum: 0
                                type: integer
                              mode:
                                description: Mode selects fixed or patterned power
                                  draw.
                                enum:
                                - Fixed
                                - Pattern
                                type: string
                            type: object
                          temperature:
                            description: TemperatureTelemetry drives synthetic GPU/memory
                              temperature.
                            properties:
                              gpuCelsius:
                                description: GPUCelsius is the GPU temperature in
                                  Celsius.
                                format: int32
                                type: integer
                              memoryCelsius:
                                description: MemoryCelsius is the memory temperature
                                  in Celsius.
                                format: int32
                                type: integer
                              mode:
                                description: Mode selects fixed or patterned temperature.
                                enum:
                                - Fixed
                                - Pattern
                                type: string
                            type: object
                          utilization:
                            description: UtilizationTelemetry drives synthetic GPU/memory
                              utilization.
                            properties:
                              mode:
                                description: Mode selects fixed or patterned utilization.
                                enum:
                                - Pattern
                                - Fixed
                                type: string
                              pattern:
                                description: Pattern describes the utilization curve
                                  when Mode is Pattern.
                                properties:
                                  gpuPercent:
                                    description: GPUPercent is the GPU utilization
                                      range.
                                    properties:
                                      maximum:
                                        description: Maximum is the upper percentage
                                          bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                      minimum:
                                        description: Minimum is the lower percentage
                                          bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                    required:
                                    - maximum
                                    - minimum
                                    type: object
                                  memoryPercent:
                                    description: MemoryPercent is the memory utilization
                                      range.
                                    properties:
                                      maximum:
                                        description: Maximum is the upper percentage
                                          bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                      minimum:
                                        description: Minimum is the lower percentage
                                          bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                    required:
                                    - maximum
                                    - minimum
                                    type: object
                                  type:
                                    description: Type selects the utilization curve
                                      shape.
                                    enum:
                                    - Steady
                                    - Bursty
                                    - Wave
                                    type: string
                                type: object
                            type: object
                        type: object
                    type: object
                type: object
              node:
                description: Node is the homogeneous node template for the rack.
                properties:
                  gpus:
                    description: GPUs describes the GPU template repeated on each
                      node.
                    properties:
                      capabilities:
                        description: GPUCapabilities is GPU feature toggles and extensible
                          attributes.
                        properties:
                          attributes:
                            additionalProperties:
                              description: CapabilityAttribute is a typed variant;
                                set exactly one field.
                              properties:
                                bool:
                                  description: Bool is the boolean value when this
                                    attribute is boolean-valued.
                                  type: boolean
                                int:
                                  description: Int is the integer value when this
                                    attribute is integer-valued.
                                  format: int64
                                  type: integer
                                string:
                                  description: String is the string value when this
                                    attribute is string-valued.
                                  type: string
                                strings:
                                  description: Strings contains the string values
                                    when this attribute is a set.
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: set
                              type: object
                            description: Extensible capability flags keyed by qualified
                              name.
                            type: object
                          mig:
                            description: MIG describes Multi-Instance GPU support.
                            properties:
                              maxGPUInstances:
                                description: MaxGPUInstances is the maximum number
                                  of GPU instances.
                                format: int32
                                type: integer
                              supported:
                                description: Supported indicates whether MIG is available.
                                type: boolean
                            type: object
                        type: object
                      clocks:
                        description: GPUClocks is clock ceilings and per-memory-clock
                          schedules.
                        properties:
                          maximumMHz:
                            description: MaximumMHz is the maximum clock tuple.
                            properties:
                              graphics:
                                description: Graphics is the maximum graphics clock
                                  in MHz.
                                format: int32
                                type: integer
                              memory:
                                description: Memory is the maximum memory clock in
                                  MHz.
                                format: int32
                                type: integer
                              sm:
                                description: SM is the maximum SM clock in MHz.
                                format: int32
                                type: integer
                              video:
                                description: Video is the maximum video clock in MHz.
                                format: int32
                                type: integer
                            type: object
                          supported:
                            description: Supported lists supported graphics clocks
                              by memory clock.
                            items:
                              description: SupportedClocks pairs a memory clock with
                                supported graphics clocks.
                              properties:
                                graphicsMHz:
                                  description: GraphicsMHz lists supported graphics
                                    clocks for MemoryMHz.
                                  items:
                                    format: int32
                                    type: integer
                                  type: array
                                  x-kubernetes-list-type: set
                                memoryMHz:
                                  description: MemoryMHz is the memory clock for this
                                    supported set.
                                  format: int32
                                  type: integer
                              required:
                              - graphicsMHz
                              - memoryMHz
                              type: object
                            type: array
                        type: object
                      count:
                        description: Count is the number of GPUs on each node.
                        format: int32
                        maximum: 64
                        minimum: 1
                        type: integer
                      memory:
                        description: Memory describes capacity and bus characteristics.
                        properties:
                          bar1Capacity:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Bar1Capacity is the BAR1 aperture capacity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          busWidthBits:
                            description: BusWidthBits is the memory bus width in bits.
                            format: int32
                            type: integer
                          capacity:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Capacity is the total on-device memory capacity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          reserved:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Reserved is memory reserved for system use.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        required:
                        - capacity
                        type: object
                      model:
                        description: Model describes the vendor and product identity.
                        properties:
                          architecture:
                            description: Architecture is the GPU architecture name.
                            type: string
                          board:
                            description: Board contains board-level identity.
                            properties:
                              partNumber:
                                description: PartNumber is the board part number.
                                type: string
                            type: object
                          computeCapability:
                            description: ComputeCapability is the CUDA compute capability.
                            properties:
                              major:
                                description: Major is the CUDA compute capability
                                  major version.
                                format: int32
                                type: integer
                              minor:
                                description: Minor is the CUDA compute capability
                                  minor version.
                                format: int32
                                type: integer
                            required:
                            - major
                            - minor
                            type: object
                          cores:
                            description: Cores contains programmable core counts.
                            properties:
                              cuda:
                                description: CUDA is the number of programmable CUDA
                                  cores.
                                format: int32
                                type: integer
                            type: object
                          firmware:
                            description: Firmware contains firmware and InfoROM versions.
                            properties:
                              gspVersion:
                                description: GSPVersion is the GPU System Processor
                                  firmware version.
                                type: string
                              infoROM:
                                description: InfoROM contains InfoROM sub-object versions.
                                properties:
                                  eccObjectVersion:
                                    description: ECCObjectVersion is the InfoROM ECC
                                      object version.
                                    type: string
                                  imageVersion:
                                    description: ImageVersion is the InfoROM image
                                      version.
                                    type: string
                                  oemObjectVersion:
                                    description: OEMObjectVersion is the InfoROM OEM
                                      object version.
                                    type: string
                                  powerObjectVersion:
                                    description: PowerObjectVersion is the InfoROM
                                      power object version.
                                    type: string
                                type: object
                              vbiosVersion:
                                description: VBIOSVersion is the GPU VBIOS version.
                                type: string
                            type: object
                          product:
                            description: Product is the short GPU product identifier.
                            type: string
                          productName:
                            description: ProductName is the human-readable GPU product
                              name.
                            type: string
                          vendor:
                            description: Vendor is the GPU vendor name.
                            type: string
                        type: object
                      pci:
                        description: PCI describes the simulated PCI identity and
                          link.
                        properties:
                          deviceID:
                            description: DeviceID is the PCI device identifier.
                            type: string
                          maxLink:
                            description: MaxLink is the maximum PCIe link configuration.
                            properties:
                              generation:
                                description: Generation is the maximum PCIe generation.
                                format: int32
                                type: integer
                              width:
                                description: Width is the maximum PCIe link width.
                                format: int32
                                type: integer
                            type: object
                          subsystemDeviceID:
                            description: SubsystemDeviceID is the PCI subsystem device
                              identifier.
                            type: string
                          subsystemVendorID:
                            description: SubsystemVendorID is the PCI subsystem vendor
                              identifier.
                            type: string
                          vendorID:
                            description: VendorID is the PCI vendor identifier.
                            type: string
                        type: object
                      power:
                        description: GPUPower is the power envelope.
                        properties:
                          limitsMilliWatts:
                            description: LimitsMilliWatts contains the power cap range
                              in milliwatts.
                            properties:
                              default:
                                description: Default is the default power limit in
                                  milliwatts.
                                format: int64
                                type: integer
                              maximum:
                                description: Maximum is the maximum power limit in
                                  milliwatts.
                                format: int64
                                type: integer
                              minimum:
                                description: Minimum is the minimum power limit in
                                  milliwatts.
                                format: int64
                                type: integer
                            type: object
                          managementSupported:
                            description: ManagementSupported indicates whether power
                              management is available.
                            type: boolean
                        type: object
                      thermal:
                        description: GPUThermal is thermal thresholds.
                        properties:
                          maxOperatingCelsius:
                            description: MaxOperatingCelsius is the maximum operating
                              temperature.
                            format: int32
                            type: integer
                          shutdownThresholdCelsius:
                            description: ShutdownThresholdCelsius is the thermal shutdown
                              threshold.
                            format: int32
                            type: integer
                          slowdownThresholdCelsius:
                            description: SlowdownThresholdCelsius is the thermal slowdown
                              threshold.
                            format: int32
                            type: integer
                          targetCelsius:
                            description: TargetCelsius is the target operating temperature.
                            format: int32
                            type: integer
                        type: object
                    required:
                    - count
                    - memory
                    - model
                    - pci
                    type: object
                  host:
                    description: Host describes the simulated host CPU and memory.
                    properties:
                      cpu:
                        description: CPU describes host processor identity and capacity.
                        properties:
                          architecture:
                            description: Architecture is the host CPU architecture.
                            type: string
                          cores:
                            description: Cores is the number of host CPU cores.
                            format: int32
                            type: integer
                          product:
                            description: Product is the host CPU product name.
                            type: string
                          vendor:
                            description: Vendor is the host CPU vendor.
                            type: string
                        type: object
                      memory:
                        description: Memory describes host memory capacity and coherence.
                        properties:
                          capacity:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Capacity is the host memory capacity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          coherentWithGPU:
                            description: CoherentWithGPU indicates whether host memory
                              is coherent with GPU memory.
                            type: boolean
                        required:
                        - capacity
                        type: object
                    type: object
                  topology:
                    description: Topology describes PCIe, fabric, and network placement.
                    properties:
                      gpuFabric:
                        description: GPUFabric describes the node's simulated GPU
                          fabric.
                        properties:
                          bandwidthPerLinkMBps:
                            description: BandwidthPerLinkMBps is the bandwidth of
                              each fabric link.
                            format: int32
                            type: integer
                          c2cSupported:
                            description: C2CSupported indicates whether chip-to-chip
                              links are available.
                            type: boolean
                          domain:
                            description: Domain identifies the fabric compute domain.
                            properties:
                              gpuCount:
                                description: GPUCount is the number of GPUs in the
                                  fabric domain.
                                format: int32
                                type: integer
                              scope:
                                description: Scope is the domain over which the fabric
                                  is shared.
                                enum:
                                - Node
                                - Rack
                                - Cluster
                                type: string
                            type: object
                          generation:
                            description: Generation is the fabric generation.
                            format: int32
                            type: integer
                          linksPerGPU:
                            description: LinksPerGPU is the number of fabric links
                              per GPU.
                            format: int32
                            type: integer
                          switches:
                            description: Switches describes fabric switches visible
                              to the node.
                            properties:
                              visiblePerNode:
                                description: VisiblePerNode is the number of fabric
                                  switches visible per node.
                                format: int32
                                type: integer
                            type: object
                          type:
                            description: Type identifies the fabric implementation.
                            type: string
                        type: object
                      gpuSlots:
                        description: GPUSlots maps logical GPUs to PCI addresses on
                          the node.
                        items:
                          description: GPUSlot pins one GPU to a PCI address + NUMA/root-complex/host
                            CPU.
                          properties:
                            hostProcessorIndex:
                              description: HostProcessorIndex is the host processor
                                associated with the slot.
                              format: int32
                              type: integer
                            index:
                              description: Index is the logical GPU index for this
                                slot.
                              format: int32
                              maximum: 63
                              minimum: 0
                              type: integer
                            numaNode:
                              description: NumaNode is the NUMA node associated with
                                the slot.
                              format: int32
                              type: integer
                            pciAddress:
                              description: PCIAddress is the GPU PCI address.
                              pattern: ^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]$
                              type: string
                            rootComplex:
                              pattern: ^pci[0-9a-f]{4}:[0-9a-f]{2}$
                              type: string
                          required:
                          - index
                          - pciAddress
                          - rootComplex
                          type: object
                        maxItems: 64
                        minItems: 1
                        type: array
                        x-kubernetes-list-map-keys:
                        - index
                        x-kubernetes-list-type: map
                      network:
                        description: Network describes the node's simulated network
                          topology.
                        properties:
                          adapterModel:
                            description: AdapterModel is the network adapter model.
                            type: string
                          adaptersPerGPU:
                            description: AdaptersPerGPU is the number of adapters
                              associated with each GPU.
                            format: int32
                            type: integer
                          firmwareVersion:
                            description: FirmwareVersion is the network adapter firmware
                              version.
                            type: string
                          linkSpeedGbps:
                            description: LinkSpeedGbps is the network link speed in
                              gigabits per second.
                            format: int32
                            type: integer
                          type:
                            description: Type identifies the network fabric.
                            type: string
                        type: object
                    required:
                    - gpuSlots
                    type: object
                required:
                - gpus
                - topology
                type: object
                x-kubernetes-validations:
                - message: topology.gpuSlots must contain one slot per GPU with indexes
                    in range
                  rule: size(self.topology.gpuSlots) == self.gpus.count && self.topology.gpuSlots.all(slot,
                    slot.index < self.gpus.count)
              rack:
                description: Rack is the logical rack shape described by this profile.
                properties:
                  nodesPerRack:
                    description: NodesPerRack is the number of logical nodes in each
                      rack.
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                required:
                - nodesPerRack
                type: object
              software:
                description: Software contains simulated driver and accelerator versions.
                properties:
                  cudaVersion:
                    description: CUDAVersion is the simulated CUDA version.
                    type: string
                  driverVersion:
                    description: DriverVersion is the simulated NVIDIA driver version.
                    type: string
                  nvmlVersion:
                    description: NVMLVersion is the simulated NVML version.
                    type: string
                type: object
            required:
            - node
            - rack
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
