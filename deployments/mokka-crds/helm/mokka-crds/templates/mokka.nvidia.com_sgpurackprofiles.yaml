---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: sgpurackprofiles.mokka.nvidia.com
spec:
  group: mokka.nvidia.com
  names:
    categories:
    - mokka
    kind: SGPURackProfile
    listKind: SGPURackProfileList
    plural: sgpurackprofiles
    shortNames:
    - srprof
    singular: sgpurackprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.rack.nodesPerRack
      name: Nodes/Rack
      type: integer
    - jsonPath: .spec.node.gpus.count
      name: GPUs/Node
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SGPURackProfile is the static shape of a simulated GPU rack.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the hardware shape and default software/runtime
              metadata.
            properties:
              defaults:
                description: Defaults provides initial runtime settings for newly
                  materialized GPUs.
                properties:
                  runtime:
                    description: Runtime provides initial sparse runtime settings
                      for newly materialized GPUs.
                    properties:
                      deviceState:
                        description: DeviceState is a simulated GPU health state.
                        enum:
                        - Healthy
                        - Degraded
                        - Failed
                        type: string
                      modes:
                        description: RuntimeModes is the persistent NVML/CUDA mode
                          settings.
                        properties:
                          accounting:
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          compute:
                            enum:
                            - Default
                            - Exclusive
                            - Prohibited
                            type: string
                          ecc:
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          mig:
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          persistence:
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                        type: object
                      telemetry:
                        description: RuntimeTelemetry is the synthetic NVML telemetry.
                        properties:
                          clocks:
                            description: ClocksTelemetry reports current clock rates.
                            properties:
                              graphicsMHz:
                                description: GraphicsMHz is the simulated graphics
                                  clock rate in MHz.
                                format: int32
                                minimum: 0
                                type: integer
                              memoryMHz:
                                description: MemoryMHz is the simulated memory clock
                                  rate in MHz.
                                format: int32
                                minimum: 0
                                type: integer
                              smMHz:
                                description: SMMHz is the simulated streaming-multiprocessor
                                  clock rate in MHz.
                                format: int32
                                minimum: 0
                                type: integer
                              videoMHz:
                                description: VideoMHz is the simulated video clock
                                  rate in MHz.
                                format: int32
                                minimum: 0
                                type: integer
                            type: object
                          performanceState:
                            description: NVML P-state, e.g. "P0".
                            pattern: ^P[0-9]+$
                            type: string
                          power:
                            description: PowerTelemetry drives synthetic power draw.
                            properties:
                              drawMilliWatts:
                                description: DrawMilliWatts is the simulated GPU power
                                  draw in milliwatts.
                                format: int64
                                minimum: 0
                                type: integer
                              mode:
                                description: Mode selects a constant or generated
                                  power draw.
                                enum:
                                - Fixed
                                - Pattern
                                type: string
                            type: object
                          temperature:
                            description: TemperatureTelemetry drives synthetic GPU/memory
                              temperature.
                            properties:
                              gpuCelsius:
                                description: GPUCelsius is the simulated GPU temperature
                                  in degrees Celsius.
                                format: int32
                                type: integer
                              memoryCelsius:
                                description: MemoryCelsius is the simulated memory
                                  temperature in degrees Celsius.
                                format: int32
                                type: integer
                              mode:
                                description: Mode selects constant or generated temperature
                                  values.
                                enum:
                                - Fixed
                                - Pattern
                                type: string
                            type: object
                          utilization:
                            description: UtilizationTelemetry drives synthetic GPU/memory
                              utilization.
                            properties:
                              mode:
                                description: Mode selects pattern-generated or fixed
                                  utilization values.
                                enum:
                                - Pattern
                                - Fixed
                                type: string
                              pattern:
                                description: Pattern defines the utilization values
                                  generated over time.
                                properties:
                                  gpuPercent:
                                    description: GPUPercent sets the minimum and maximum
                                      GPU utilization percentages.
                                    properties:
                                      maximum:
                                        description: Maximum is the upper utilization
                                          percentage bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                      minimum:
                                        description: Minimum is the lower utilization
                                          percentage bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                    required:
                                    - maximum
                                    - minimum
                                    type: object
                                  memoryPercent:
                                    description: MemoryPercent sets the minimum and
                                      maximum memory utilization percentages.
                                    properties:
                                      maximum:
                                        description: Maximum is the upper utilization
                                          percentage bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                      minimum:
                                        description: Minimum is the lower utilization
                                          percentage bound.
                                        format: int32
                                        maximum: 100
                                        minimum: 0
                                        type: integer
                                    required:
                                    - maximum
                                    - minimum
                                    type: object
                                  type:
                                    description: Type selects the shape of the generated
                                      utilization curve.
                                    enum:
                                    - Steady
                                    - Bursty
                                    - Wave
                                    type: string
                                type: object
                            type: object
                        type: object
                    type: object
                type: object
              node:
                description: Node describes the shared simulated hardware for each
                  rack Node.
                properties:
                  gpus:
                    description: GPUs defines the homogeneous simulated GPU set on
                      each Node.
                    properties:
                      capabilities:
                        description: Capabilities describes MIG support and additional
                          named capabilities.
                        properties:
                          attributes:
                            additionalProperties:
                              description: CapabilityAttribute is a typed variant;
                                set exactly one field.
                              properties:
                                bool:
                                  description: Bool stores a boolean capability value.
                                  type: boolean
                                int:
                                  description: Int stores an integer capability value.
                                  format: int64
                                  type: integer
                                string:
                                  description: String stores a string capability value.
                                  type: string
                                strings:
                                  description: Strings stores a set of string capability
                                    values.
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: set
                              type: object
                            description: Extensible capability flags keyed by qualified
                              name.
                            type: object
                          mig:
                            description: MIG describes Multi-Instance GPU support.
                            properties:
                              maxGPUInstances:
                                description: MaxGPUInstances is the maximum number
                                  of GPU instances supported.
                                format: int32
                                type: integer
                              supported:
                                description: Supported indicates whether MIG is available
                                  on the GPU.
                                type: boolean
                            type: object
                        type: object
                      clocks:
                        description: Clocks describes maximum and supported device
                          clock rates.
                        properties:
                          maximumMHz:
                            description: MaximumMHz gives the maximum graphics, SM,
                              memory, and video clock rates.
                            properties:
                              graphics:
                                description: Graphics is the graphics clock rate in
                                  MHz.
                                format: int32
                                type: integer
                              memory:
                                description: Memory is the memory clock rate in MHz.
                                format: int32
                                type: integer
                              sm:
                                description: SM is the streaming-multiprocessor clock
                                  rate in MHz.
                                format: int32
                                type: integer
                              video:
                                description: Video is the video clock rate in MHz.
                                format: int32
                                type: integer
                            type: object
                          supported:
                            description: Supported lists graphics clock rates available
                              at each memory clock rate.
                            items:
                              description: SupportedClocks pairs a memory clock with
                                supported graphics clocks.
                              properties:
                                graphicsMHz:
                                  description: GraphicsMHz lists graphics clock rates
                                    supported at MemoryMHz.
                                  items:
                                    format: int32
                                    type: integer
                                  type: array
                                  x-kubernetes-list-type: set
                                memoryMHz:
                                  description: MemoryMHz is a memory clock rate paired
                                    with GraphicsMHz values.
                                  format: int32
                                  type: integer
                              required:
                              - graphicsMHz
                              - memoryMHz
                              type: object
                            type: array
                        type: object
                      count:
                        description: Count is the number of GPUs exposed on each Node.
                        format: int32
                        maximum: 64
                        minimum: 1
                        type: integer
                      memory:
                        description: Memory describes device memory capacity and bus
                          width.
                        properties:
                          bar1Capacity:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Bar1Capacity is the device BAR1 aperture
                              size.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          busWidthBits:
                            description: BusWidthBits is the memory bus width in bits.
                            format: int32
                            type: integer
                          capacity:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Capacity is the total device memory capacity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          reserved:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Reserved is the amount of memory reserved
                              from workloads.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        required:
                        - capacity
                        type: object
                      model:
                        description: Model describes the GPU vendor, product, and
                          architecture.
                        properties:
                          architecture:
                            description: Architecture is the GPU architecture name.
                            type: string
                          board:
                            description: Board contains board-level identity.
                            properties:
                              partNumber:
                                description: PartNumber is the board part number reported
                                  for the GPU.
                                type: string
                            type: object
                          computeCapability:
                            description: ComputeCapability is the CUDA compute capability
                              version.
                            properties:
                              major:
                                description: Major is the major CUDA compute capability
                                  version.
                                format: int32
                                type: integer
                              minor:
                                description: Minor is the minor CUDA compute capability
                                  version.
                                format: int32
                                type: integer
                            required:
                            - major
                            - minor
                            type: object
                          cores:
                            description: Cores contains programmable core counts.
                            properties:
                              cuda:
                                description: CUDA is the number of CUDA cores per
                                  GPU.
                                format: int32
                                type: integer
                            type: object
                          firmware:
                            description: Firmware contains firmware and information-ROM
                              versions.
                            properties:
                              gspVersion:
                                description: GSPVersion is the GPU System Processor
                                  firmware version.
                                type: string
                              infoROM:
                                description: InfoROM contains versions of the GPU
                                  information-ROM objects.
                                properties:
                                  eccObjectVersion:
                                    description: ECCObjectVersion is the ECC information-ROM
                                      object version.
                                    type: string
                                  imageVersion:
                                    description: ImageVersion is the information-ROM
                                      image version.
                                    type: string
                                  oemObjectVersion:
                                    description: OEMObjectVersion is the OEM information-ROM
                                      object version.
                                    type: string
                                  powerObjectVersion:
                                    description: PowerObjectVersion is the power information-ROM
                                      object version.
                                    type: string
                                type: object
                              vbiosVersion:
                                description: VBIOSVersion is the video BIOS version.
                                type: string
                            type: object
                          product:
                            description: Product is the vendor's product identifier.
                            type: string
                          productName:
                            description: ProductName is the human-readable product
                              name.
                            type: string
                          vendor:
                            description: Vendor is the GPU manufacturer name.
                            type: string
                        type: object
                      pci:
                        description: PCI describes device identifiers and maximum
                          link properties.
                        properties:
                          deviceID:
                            description: DeviceID is the PCI device identifier in
                              hexadecimal.
                            type: string
                          maxLink:
                            description: MaxLink is the maximum supported PCIe generation
                              and width.
                            properties:
                              generation:
                                description: Generation is the maximum PCIe generation.
                                format: int32
                                type: integer
                              width:
                                description: Width is the maximum PCIe link width
                                  in lanes.
                                format: int32
                                type: integer
                            type: object
                          subsystemDeviceID:
                            description: SubsystemDeviceID is the PCI subsystem device
                              identifier.
                            type: string
                          subsystemVendorID:
                            description: SubsystemVendorID is the PCI subsystem vendor
                              identifier.
                            type: string
                          vendorID:
                            description: VendorID is the PCI vendor identifier in
                              hexadecimal.
                            type: string
                        type: object
                      power:
                        description: Power describes power-management support and
                          device limits.
                        properties:
                          limitsMilliWatts:
                            description: LimitsMilliWatts gives the minimum, default,
                              and maximum power limits.
                            properties:
                              default:
                                description: Default is the default power limit in
                                  milliwatts.
                                format: int64
                                type: integer
                              maximum:
                                description: Maximum is the maximum power limit in
                                  milliwatts.
                                format: int64
                                type: integer
                              minimum:
                                description: Minimum is the minimum power limit in
                                  milliwatts.
                                format: int64
                                type: integer
                            type: object
                          managementSupported:
                            description: ManagementSupported indicates whether power
                              management is available.
                            type: boolean
                        type: object
                      thermal:
                        description: Thermal describes device temperature thresholds.
                        properties:
                          maxOperatingCelsius:
                            description: MaxOperatingCelsius is the maximum rated
                              operating temperature.
                            format: int32
                            type: integer
                          shutdownThresholdCelsius:
                            description: ShutdownThresholdCelsius is the temperature
                              at which shutdown is triggered.
                            format: int32
                            type: integer
                          slowdownThresholdCelsius:
                            description: SlowdownThresholdCelsius is the temperature
                              at which thermal slowdown begins.
                            format: int32
                            type: integer
                          targetCelsius:
                            description: TargetCelsius is the target GPU temperature
                              in degrees Celsius.
                            format: int32
                            type: integer
                        type: object
                    required:
                    - count
                    - memory
                    - model
                    - pci
                    type: object
                  host:
                    description: Host describes the CPU and memory presented by each
                      Node.
                    properties:
                      cpu:
                        description: CPU describes the host processor presented by
                          the simulated Node.
                        properties:
                          architecture:
                            description: Architecture is the host processor architecture.
                            type: string
                          cores:
                            description: Cores is the number of host CPU cores.
                            format: int32
                            type: integer
                          product:
                            description: Product is the processor product identifier.
                            type: string
                          vendor:
                            description: Vendor is the processor manufacturer.
                            type: string
                        type: object
                      memory:
                        description: Memory describes host memory presented by the
                          simulated Node.
                        properties:
                          capacity:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Capacity is the host memory capacity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          coherentWithGPU:
                            description: CoherentWithGPU indicates whether host and
                              GPU memory are coherent.
                            type: boolean
                        required:
                        - capacity
                        type: object
                    type: object
                  topology:
                    description: Topology describes PCIe slots and optional GPU/network
                      fabrics.
                    properties:
                      gpuFabric:
                        description: GPUFabric describes optional NVLink/NVSwitch
                          connectivity.
                        properties:
                          bandwidthPerLinkMBps:
                            description: BandwidthPerLinkMBps is the bandwidth of
                              each link in megabytes per second.
                            format: int32
                            type: integer
                          c2cSupported:
                            description: C2CSupported indicates whether coherent CPU-to-GPU
                              links are supported.
                            type: boolean
                          domain:
                            description: Domain describes the scope and size of the
                              GPU fabric domain.
                            properties:
                              gpuCount:
                                description: GPUCount is the number of GPUs in the
                                  domain.
                                format: int32
                                type: integer
                              scope:
                                description: Scope is the level at which GPUs share
                                  a fabric domain.
                                enum:
                                - Node
                                - Rack
                                - Cluster
                                type: string
                            type: object
                          generation:
                            description: Generation is the fabric generation.
                            format: int32
                            type: integer
                          linksPerGPU:
                            description: LinksPerGPU is the number of fabric links
                              available per GPU.
                            format: int32
                            type: integer
                          switches:
                            description: Switches describes the fabric switches visible
                              to each Node.
                            properties:
                              visiblePerNode:
                                description: VisiblePerNode is the number of fabric
                                  switches visible from each Node.
                                format: int32
                                type: integer
                            type: object
                          type:
                            description: Type names the GPU interconnect fabric.
                            type: string
                        type: object
                      gpuSlots:
                        description: GPUSlots maps each GPU index to its PCI and host
                          topology coordinates.
                        items:
                          description: GPUSlot pins one GPU to a PCI address + NUMA/root-complex/host
                            CPU.
                          properties:
                            hostProcessorIndex:
                              description: HostProcessorIndex is the host CPU index
                                associated with this GPU.
                              format: int32
                              type: integer
                            index:
                              description: Index is the zero-based GPU index on the
                                Node.
                              format: int32
                              maximum: 63
                              minimum: 0
                              type: integer
                            numaNode:
                              description: NumaNode is the host NUMA node associated
                                with this GPU.
                              format: int32
                              type: integer
                            pciAddress:
                              description: PCIAddress is the PCI bus address of this
                                GPU.
                              pattern: ^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]$
                              type: string
                            rootComplex:
                              description: RootComplex identifies the PCI root complex
                                connected to this GPU.
                              pattern: ^pci[0-9a-f]{4}:[0-9a-f]{2}$
                              type: string
                          required:
                          - index
                          - pciAddress
                          - rootComplex
                          type: object
                        maxItems: 64
                        minItems: 1
                        type: array
                        x-kubernetes-list-map-keys:
                        - index
                        x-kubernetes-list-type: map
                      network:
                        description: Network describes optional out-of-band network
                          adapters.
                        properties:
                          adapterModel:
                            description: AdapterModel is the adapter model name.
                            type: string
                          adaptersPerGPU:
                            description: AdaptersPerGPU is the number of network adapters
                              associated with each GPU.
                            format: int32
                            type: integer
                          firmwareVersion:
                            description: FirmwareVersion is the adapter firmware version.
                            type: string
                          linkSpeedGbps:
                            description: LinkSpeedGbps is the adapter link speed in
                              gigabits per second.
                            format: int32
                            type: integer
                          type:
                            description: Type names the out-of-band network adapter
                              type.
                            type: string
                        type: object
                    required:
                    - gpuSlots
                    type: object
                required:
                - gpus
                - topology
                type: object
                x-kubernetes-validations:
                - message: topology.gpuSlots must contain one slot per GPU with indexes
                    in range
                  rule: size(self.topology.gpuSlots) == self.gpus.count && self.topology.gpuSlots.all(slot,
                    slot.index < self.gpus.count)
              rack:
                description: Rack is the logical rack shape described by this profile.
                properties:
                  nodesPerRack:
                    description: NodesPerRack is the number of logical Nodes in each
                      rack.
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                required:
                - nodesPerRack
                type: object
              software:
                description: Software records optional driver, NVML, and CUDA versions.
                properties:
                  cudaVersion:
                    description: CUDAVersion is the CUDA version.
                    type: string
                  driverVersion:
                    description: DriverVersion is the NVIDIA driver version.
                    type: string
                  nvmlVersion:
                    description: NVMLVersion is the NVIDIA Management Library version.
                    type: string
                type: object
            required:
            - node
            - rack
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
