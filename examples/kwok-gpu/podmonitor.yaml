apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mokka-kwok-gpu
spec:
  namespaceSelector:
    matchNames: [mokka-kwok-poc]
  selector:
    matchLabels:
      app: mokka-kwok-gpu
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      relabelings:
        - action: labeldrop
          regex: pod|container|namespace
      metricRelabelings:
        - sourceLabels: [Hostname]
          regex: (.+)
          targetLabel: node
          replacement: ${1}
