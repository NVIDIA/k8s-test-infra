#
# GPU Operator Helm values overlay for the gpu-operator local dev scenario.
#
# Usage (via Tilt):
#   tilt up -- --gpu-operator
#
# Prerequisites:
#   - make cluster-create
#   - nvml-mock deployed first (Tilt handles ordering via resource_deps)

# Driver is replaced by nvml-mock chart — no real kernel module needed.
driver:
  enabled: false

# Container toolkit is not needed — the mock libs are placed on the host
# by the nvml-mock DaemonSet, not injected by the toolkit.
toolkit:
  enabled: false

# DCGM is not supported by the mock NVML (requires full driver stack).
dcgm:
  enabled: false

dcgmExporter:
  enabled: true
  env:
    - name: NVIDIA_DRIVER_ROOT
      value: "/var/lib/nvml-mock/driver"
    - name: DCGM_EXPORTER_COLLECT_INTERVAL
      value: "5000"

# This deployment does not partition the board, so there are no slices to
# advertise and whole GPUs are the right view; mig-manager partitions through a
# real driver. MIG itself is simulated — see the MIG partitioning guide.
mig:
  strategy: none
migManager:
  enabled: false

# Node status exporter depends on DCGM — disable.
nodeStatusExporter:
  enabled: false

# CDI mode — the toolkit reads /var/run/cdi/nvidia.yaml generated by nvml-mock.
cdi:
  enabled: true
  default: true

# Device plugin discovers GPUs via mock NVML.
devicePlugin:
  enabled: true
  config:
    name: ""
  env:
    - name: NVIDIA_DRIVER_ROOT
      value: "/var/lib/nvml-mock/driver"

# GFD reads GPU attributes via mock NVML and labels the node.
#
# The machine type has to come from a file of the mock's own: GFD's default,
# /sys/class/dmi/id/product_name, reads "kind" under kind and does not exist on
# hosts without DMI. The agent writes this one, served by the CDI config mount.
#
# Set here only because this overlay drives the CDI path, where the toolkit
# resolving nvidia.com/gpu applies the spec's mounts and drops its env (#747).
# With nri.enabled the plugin injects GFD_MACHINE_TYPE_FILE itself and no
# override is needed.
gfd:
  enabled: true
  env:
    - name: NVIDIA_DRIVER_ROOT
      value: "/var/lib/nvml-mock/driver"
    - name: GFD_MACHINE_TYPE_FILE
      value: "/etc/nvml-mock/machine-type"

# Validator checks that the GPU stack is functional.
#
# driver-validation passes: it finds nvidia-smi via DRIVER_INSTALL_DIR and loads
# libnvidia-ml.so via LD_LIBRARY_PATH, both pointing at the mock driver root.
# DISABLE_DEV_CHAR_SYMLINK_CREATION=true is required. Without it, the /dev/char
# symlink step finds /sys/module/nvidia/refcnt (served by the agent), skips
# modprobe, and then fails with "failed to create devices info: no NVIDIA
# devices found".
#
# toolkit-validation passes: nvidia-container-runtime (pre-baked in the custom
# Kind node image) intercepts NVIDIA_VISIBLE_DEVICES=all, performs CDI injection
# using /var/run/cdi/nvidia.yaml written by nvml-mock, and nvidia-smi is found.
validator:
  driver:
    env:
      - name: DRIVER_INSTALL_DIR
        value: "/run/nvidia/driver"
      - name: LD_LIBRARY_PATH
        value: "/run/nvidia/driver/usr/lib64"
      - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
        value: "true"
  toolkit:
    env:
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
  plugin:
    env:
      - name: LD_LIBRARY_PATH
        value: "/run/nvidia/driver/usr/lib64"
