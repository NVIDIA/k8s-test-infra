driver:
  enabled: false

# The toolkit operand's job is done by the Mokka node daemon, which
# installs the NVIDIA container runtime and registers the nvidia handler the
# operator's own pods use. The operand could not run here anyway: it needs the
# NVIDIA kernel module.
toolkit:
  enabled: false

# Standalone DCGM (nv-hostengine) is not supported by the mock NVML: it needs the
# full driver stack. dcgm-exporter embeds its own hostengine and runs without it.
dcgm:
  enabled: false

dcgmExporter:
  enabled: true
  env:
    - name: DCGM_EXPORTER_COLLECT_INTERVAL
      value: "5000"

# Whole GPUs only: nothing here partitions the board, and mig-manager partitions
# through a real driver. The mock simulates MIG itself; see docs/mig.md.
mig:
  strategy: none
migManager:
  enabled: false

# Node status exporter depends on DCGM — disable.
nodeStatusExporter:
  enabled: false

# CDI mode: nvidia.com/gpu resolves from /var/run/cdi/nvidia.yaml, which the Mokka
# node daemon writes.
cdi:
  enabled: true
  default: true

devicePlugin:
  enabled: true
  config:
    name: ""

# GFD's machine type has to come from a file of the mock's own: its default,
# /sys/class/dmi/id/product_name, reads "kind" under Kind and does not exist on
# hosts without DMI. The node daemon writes this one, served by the CDI config
# mount.
#
# Set here only because this overlay drives the CDI path, and the node agent's
# nvidia.com/gpu spec does not set GFD_MACHINE_TYPE_FILE. nri.enabled does not
# replace it: NRI injects only containers that hold a GPU allocation or opt in
# by annotation, and GFD does neither.
gfd:
  enabled: true
  env:
    - name: GFD_MACHINE_TYPE_FILE
      value: "/etc/nvml-mock/machine-type"

# driver-validation needs no DRIVER_INSTALL_DIR/LD_LIBRARY_PATH override: it finds
# nvidia-smi and libnvidia-ml.so under /run/nvidia/driver, the chart's own
# driverInstallDir default, where the DaemonSet mirrors the mock driver root.
# DISABLE_DEV_CHAR_SYMLINK_CREATION=true is required: without it the /dev/char
# step finds /sys/module/nvidia/refcnt (served by the node daemon), skips modprobe,
# and fails with "failed to create devices info: no NVIDIA devices found".
#
# toolkit-validation runs under RuntimeClass nvidia, whose handler the node daemon
# registers. nvidia-container-runtime turns NVIDIA_VISIBLE_DEVICES=all into CDI
# devices from /var/run/cdi/nvidia.yaml.
validator:
  driver:
    env:
      - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
        value: "true"
  toolkit:
    env:
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
