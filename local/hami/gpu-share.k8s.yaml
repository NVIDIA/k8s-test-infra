#
# Two pods that each take a slice of a mock GPU through HAMi: a memory cap on
# the first, a memory cap and a core share on the second. The limits are what
# local/hami/scenarios/smoke.sh expects; change both together.
#
# No grace period: sleep is PID 1 and ignores SIGTERM, so a rerun of the smoke
# test would otherwise wait out the default 30s.
apiVersion: v1
kind: Pod
metadata:
  name: hami-share-a
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: workload
      image: ubuntu:22.04
      command: ["bash", "-c", "sleep 86400"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 10240
---
apiVersion: v1
kind: Pod
metadata:
  name: hami-share-b
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: workload
      image: ubuntu:22.04
      command: ["bash", "-c", "sleep 86400"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 20480
          nvidia.com/gpucores: 30
