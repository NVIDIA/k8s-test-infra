#
# Values for the Slinky `slurm` chart: one GPU NodeSet whose slurmd pods each
# claim every mock GPU on their node through the GPU Operator's device plugin,
# and let Slurm discover them itself (AutoDetect) instead of being told.

configFiles:
  gres.conf: |
    AutoDetect=nvidia

controller:
  extraConfMap:
    # Without it slurmctld drops every gpu GRES a node reports, and nodes
    # register with Gres=(null). Slinky's docs claim the chart sets it; 1.2.3
    # does not.
    GresTypes: ["gpu"]

nodesets:
  gpu:
    # One slurmd per mock-GPU worker, so the Slurm cluster follows whichever
    # Kind cluster it lands on (2 workers by default, 4 under compute-domain).
    scalingMode: DaemonSet
    slurmd:
      resources:
        limits:
          # The allocation is what makes the NRI plugin serve slurmd the mock
          # driver files AutoDetect reads. Matches gpu.count in
          # local/slinky/nvml-mock.values.yaml.
          nvidia.com/gpu: 4
    # sshd in every slurmd pod; pam_slurm_adopt confines a session to the job
    # that owns the node.
    ssh:
      enabled: true
    podSpec:
      nodeSelector:
        mokka.nvidia.com/type: sgpu

# Where users submit jobs from, as on a real cluster. It holds no GPUs; sackd
# in the pod reaches slurmctld.
loginsets:
  slinky:
    enabled: true
    service:
      spec:
        # Kind has no load balancer, so the chart's LoadBalancer default would
        # never get an address. Reach it with kubectl exec or port-forward.
        type: ClusterIP

partitions:
  all:
    enabled: true
