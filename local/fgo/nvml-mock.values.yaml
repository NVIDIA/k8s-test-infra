#
# The profile ConfigMaps stay in this release's namespace. For FGO to load them,
# set targetNamespace to FGO's namespace and disable FGO's builtinProfiles; see
# docs/guides/runai-fgo/README.md.

integrations:
  fakeGpuOperator:
    enabled: true

nodeSelector:
  run.ai/simulated-gpu-node-pool: integration

# Must match the integration pool in fgo.values.yaml (8x a100), which the mock
# backs. Pinned rather than inherited from the chart default; an explicit
# --gpu-profile still wins, as Tilt passes it with --set.
gpu:
  profile: a100
