#
# The mock backs `integration`, so local/fgo/nvml-mock.values.yaml pins the profile
# declared here. Pools are labelled in local/kind/default.kind.yaml.
topology:
  nodePools:
    integration:
      backend: mock
      gpuCount: 8
      gpuProfile: a100
    scale:
      backend: fake
      gpuCount: 4
      gpuProfile: t4
