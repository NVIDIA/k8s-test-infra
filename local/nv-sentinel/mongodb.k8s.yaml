#
# External MongoDB for the nv-sentinel Tilt consumer, using the official
# multi-arch image public.ecr.aws/docker/library/mongo:8.0.3.
#
# Ported from docs/demo/nv-sentinel/mongodb.yaml. Two additions: the Namespace
# is declared here (run.sh created it with `kubectl create namespace`, which has
# no Tilt equivalent) and so is the MONGODB_URI Secret (run.sh shelled out to
# `kubectl create secret`). The URI carries no credentials — this MongoDB runs
# without auth — so committing it exposes nothing.
#
# Why not the chart's built-in MongoDB? NVSentinel's mongodb-store subchart uses
# the Bitnami MongoDB chart, whose containers run Bitnami-only scripts and whose
# images (bitnamilegacy/*) are published amd64-only, so on arm64 it cannot
# start. NVSentinel therefore points at this as an EXTERNAL datastore
# (global.mongodbStore.enabled=false + global.datastore).
#
# NVSentinel talks TLS to the datastore and reads a CA certificate, so MongoDB
# serves TLS with a cert-manager-issued cert and the CA secret (mongodb-ca) is
# handed over via global.datastore.tls.caSecretName.
#
# The single-node rs0 below, and its init Job, are not optional: --replSet is
# what makes this remediation pipeline work at all. fault-quarantine and
# node-drainer each hold an open change stream on
# HealthEventsDatabase.HealthEvents — that is how a stored health event becomes
# a cordon and a drain — and change streams are derived from the oplog, which a
# standalone mongod does not keep. Dropping --replSet gets
# "Location40573: The $changeStream stage is only supported on replica sets"
# and a pipeline that stores events and reacts to none of them.
#
# Everything is pinned to the control-plane so a remediation drain of a GPU
# worker never evicts the datastore the pipeline depends on.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nvsentinel
---
# ---------------------------------------------------------------------------
# cert-manager: self-signed root CA -> CA issuer -> MongoDB server certificate
# ---------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mongodb-selfsigned
  namespace: nvsentinel
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mongodb-ca
  namespace: nvsentinel
spec:
  isCA: true
  commonName: nvsentinel-demo-mongodb-ca
  secretName: mongodb-ca            # data keys: ca.crt, tls.crt, tls.key
  duration: 87600h                  # 10y
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: mongodb-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mongodb-ca-issuer
  namespace: nvsentinel
spec:
  ca:
    secretName: mongodb-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mongodb-server
  namespace: nvsentinel
spec:
  secretName: mongodb-server-tls    # data keys: ca.crt, tls.crt, tls.key
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 2048
  # SANs must cover the service DNS NVSentinel connects to and the replica-set
  # member host advertised by rs.initiate below.
  dnsNames:
    - mongodb-ext
    - mongodb-ext.nvsentinel
    - mongodb-ext.nvsentinel.svc
    - mongodb-ext.nvsentinel.svc.cluster.local
    - mongodb-ext-0.mongodb-ext.nvsentinel.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: mongodb-ca-issuer
    kind: Issuer
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-ext
  namespace: nvsentinel
  labels:
    app: mongodb-ext
spec:
  clusterIP: None
  # Publish the pod's DNS before it is Ready so the replica-set init Job and the
  # readiness probe can resolve it during startup.
  publishNotReadyAddresses: true
  selector:
    app: mongodb-ext
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-ext
  namespace: nvsentinel
  labels:
    app: mongodb-ext
spec:
  serviceName: mongodb-ext
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-ext
  template:
    metadata:
      labels:
        app: mongodb-ext
    spec:
      # Keep MongoDB off the GPU worker so a remediation drain never evicts it.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        # mongod wants cert + key in a single PEM; cert-manager emits them
        # separately, so concatenate into an emptyDir the main container reads.
        - name: mk-pem
          image: public.ecr.aws/docker/library/mongo:8.0.3
          command:
            - bash
            - -c
            - |
              set -e
              cat /certs/tls.key /certs/tls.crt > /tls/server.pem
              cp /certs/ca.crt /tls/ca.crt
              chmod 644 /tls/server.pem /tls/ca.crt
          volumeMounts:
            - name: server-cert
              mountPath: /certs
              readOnly: true
            - name: tls-pem
              mountPath: /tls
      containers:
        - name: mongodb
          image: public.ecr.aws/docker/library/mongo:8.0.3
          args:
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
            - "--tlsMode"
            - "requireTLS"
            - "--tlsCertificateKeyFile"
            - "/tls/server.pem"
            - "--tlsCAFile"
            - "/tls/ca.crt"
            - "--tlsAllowConnectionsWithoutCertificates"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tls-pem
              mountPath: /tls
              readOnly: true
          # Deliberately only liveness, not "the replica set is usable". The
          # stronger probe (quit(db.hello().isWritablePrimary ? 0 : 1)) cannot
          # go here: rs.initiate() runs in the mongodb-ext-rs-init Job, Tilt
          # withholds that Job until this pod is Ready, and the pod cannot be
          # Ready until the Job has run — a circular wait that leaves mongod
          # running forever with no rs0. Consumers must therefore order
          # themselves behind mongodb-ext-rs-init, not behind mongodb-ext.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --tls
                - --tlsAllowInvalidCertificates
                - --host
                - localhost
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: server-cert
          secret:
            secretName: mongodb-server-tls
        - name: tls-pem
          emptyDir: {}
---
# Initialize the single-node replica set once MongoDB is reachable over TLS.
# Idempotent: skips if the replica set is already initialized.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-ext-rs-init
  namespace: nvsentinel
spec:
  # Both wait loops below are unbounded, so a mongod that answers but never
  # reaches PRIMARY would hang this Job forever and `tilt ci` would wait on it
  # rather than failing. 10 minutes is well past a cold Kind cluster pulling the
  # mongo image and scheduling both pods, which is the slowest legitimate path.
  activeDeadlineSeconds: 600
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: rs-init
          image: public.ecr.aws/docker/library/mongo:8.0.3
          command:
            - bash
            - -c
            - |
              set -e
              host="mongodb-ext.nvsentinel.svc.cluster.local:27017"
              tls=(--tls --tlsAllowInvalidCertificates)
              echo "waiting for mongod at ${host}..."
              until mongosh "${tls[@]}" --host "${host}" --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                sleep 3
              done
              mongosh "${tls[@]}" --host "${host}" --quiet --eval '
                try {
                  if (rs.status().ok === 1) { print("replica set already initialized"); quit(0); }
                } catch (e) {
                  rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb-ext.nvsentinel.svc.cluster.local:27017"}]});
                  print("replica set initiated");
                }
              '
              # Wait until the node reports PRIMARY so consumers can use change streams.
              until mongosh "${tls[@]}" --host "${host}" --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do
                echo "waiting for PRIMARY..."; sleep 3
              done
              echo "mongodb replica set ready"
---
# The URI NVSentinel reads via global.datastore.credentialsFromSecret. No
# credentials: this MongoDB runs without auth, and the replicaSet parameter is
# what makes the driver open a change stream against rs0.
apiVersion: v1
kind: Secret
metadata:
  name: nvsentinel-datastore-mongodb-uri
  namespace: nvsentinel
stringData:
  MONGODB_URI: mongodb://mongodb-ext.nvsentinel.svc.cluster.local:27017/HealthEventsDatabase?replicaSet=rs0
