#
# A trivial "GPU workload" so the NVSentinel Node Drainer has something
# observable to evict once it cordons the node with the overheating GPU.
#
# Ported from docs/demo/nv-sentinel/sample-workload.yaml without its
# nvml-mock-gpu=true nodeSelector: requesting nvidia.com/gpu already restricts
# this to the workers, since the GPU Operator's device plugin does not tolerate
# the control-plane taint and so never advertises the resource there. That is
# also why the shared cluster needs no GPU-worker label of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-sample-workload
  labels:
    app: gpu-sample-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-sample-workload
  template:
    metadata:
      labels:
        app: gpu-sample-workload
    spec:
      containers:
        - name: sleeper
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              nvidia.com/gpu: 1
