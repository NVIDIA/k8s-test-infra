#
# image.repository and image.tag are not set here: compute_domain.tiltfile injects
# them through helm_resource.

# The scenario and its guide are written for gb200, a board with a multi-node
# NVLink fabric (the fabric identity nvmlDeviceGetGpuFabricInfo reports).
gpu:
  profile: gb200

# Workers only. compute_domain.tiltfile does not layer
# local/nvml-mock.values.yaml, so the selector is repeated here. It matters more
# in this scenario: topology.yaml gives each worker a clique and the control plane
# none, so a mock pod there would report a fabric identity the topology never
# declared.
nodeSelector:
  mokka.nvidia.com/type: sgpu

# Roll every pod at once so the topology rebind re-reads MOCK_TOPOLOGY_CONFIG in seconds.
updateStrategy:
  rollingUpdate:
    maxUnavailable: "100%"
