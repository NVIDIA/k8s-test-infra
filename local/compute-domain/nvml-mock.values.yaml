#
# nvml-mock helm values overlay for the compute-domain scenario.
# Layered on top of local/compute-domain/topology.yaml.
#
# Mirrors the profile, node selector and rollout settings of the nvml-mock
# install in docs/guides/compute-domain/run.sh.
# image.repository/tag are injected by compute_domain.tiltfile via
# helm_resource image_keys (matches local/nvml_mock.tiltfile's pattern).

# GB200 profile — the fabric API mock (nvmlDeviceGetGpuFabricInfo)
# is the only profile that reports NVLink5 fabric identity.
gpu:
  profile: gb200

# Workers only, same reason as local/nvml-mock.values.yaml — repeated here
# because compute_domain.tiltfile installs the chart itself and does not layer
# that baseline. Also load-bearing for this scenario: topology.yaml assigns a
# clique per worker and nothing describes the control plane, so a mock pod there
# would report a fabric identity the topology never declared.
nodeSelector:
  mokka.nvidia.com/type: sgpu

# Speed up the topology-rebind DaemonSet rollout so every pod re-reads
# MOCK_TOPOLOGY_CONFIG in seconds, not tens.
updateStrategy:
  rollingUpdate:
    maxUnavailable: "100%"
