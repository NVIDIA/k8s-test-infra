#
# DRA driver values overlay layered on top of local/dra/dra-driver.values.yaml
# when both --compute-domain and --dra are set. The driver keeps its upstream
# images: on the gb200 profile the node agent stages what a real GB200 node
# has, and the driver reads it from there.
#
# Default is off (see local/dra/dra-driver.values.yaml) because single-node
# dev doesn't need it.
resources:
  computeDomains:
    enabled: true

# The node agent's substitute /proc/devices, which carries the
# nvidia-caps-imex-channels major a real NVIDIA kernel module registers. The
# compute-domain kubelet plugin reads it at startup and aborts without it.
# Needs chart 0.5.0 or later.
altProcDevices: /var/lib/nvml-mock/imex/proc-devices
