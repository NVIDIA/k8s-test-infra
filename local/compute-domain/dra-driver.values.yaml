#
# DRA driver values overlay layered on top of local/dra/dra-driver.values.yaml
# when both --compute-domain and --dra are set.
#
# Flips resources.computeDomains.enabled=true so the DRA driver deploys
# its ComputeDomain controller + compute-domain-daemon pods against
# nvml-mock's simulated fabric. Default is off (see
# local/dra/dra-driver.values.yaml) because single-node dev doesn't
# need it.
#
# The chart's pinned upstream image is used unchanged. Its CDI device supplies
# the mock driver surface; Mokka's NRI plugin recognizes its DRA-owned pod label
# and container name and adds only the node-staged real IMEX executable and
# mock topology document.
resources:
  computeDomains:
    enabled: true

# The node has no NVIDIA kernel module, so the real /proc/devices does not
# contain the IMEX channel major. The node agent stages a consistent substitute
# inside the driver root used by the DRA kubelet plugin.
kubeletPlugin:
  containers:
    computeDomains:
      env:
        - name: ALT_PROC_DEVICES_PATH
          value: /driver-root/proc/devices
