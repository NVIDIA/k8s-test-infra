# Minimal domain used by the local/CI acceptance check. The upstream DRA
# controller turns this into a per-domain daemon DaemonSet and channel claim
# template; Mokka only supplies the simulated node surfaces it consumes.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: mokka-imex-e2e
spec:
  # Match the four workers in tests/e2e/kind-compute-domain-config.yaml so
  # Ready proves that every simulated node joined the domain.
  numNodes: 4
  channel:
    resourceClaimTemplate:
      name: mokka-imex-e2e-channel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mokka-imex-e2e
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: mokka-imex-e2e
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mokka-imex-e2e
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: mokka.nvidia.com/type
                    operator: In
                    values: [sgpu]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mokka-imex-e2e
              topologyKey: kubernetes.io/hostname
      containers:
        - name: claim-holder
          image: registry.k8s.io/pause:3.10
          resources:
            claims:
              - name: imex-channel
      resourceClaims:
        - name: imex-channel
          resourceClaimTemplateName: mokka-imex-e2e-channel
