#
# The DynamicResourceAllocation gate and resource.k8s.io/v1beta1 are on because
# the scenario supports --compute-domain --dra. The ComputeDomain e2e and guide use
# the two-rack tests/e2e/kind-compute-domain-racks.yaml instead.
#
# Workers are named worker-0..3 through JoinConfiguration, and
# local/compute-domain/topology.yaml assigns cliques by those names. No node
# carries a clique label: consumers such as topograph read the fabric from the
# mock driver.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mokka-compute-domain
featureGates:
  DynamicResourceAllocation: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            runtime-config: "resource.k8s.io/v1beta1=true"
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: control-0
  - role: worker
    labels:
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-0
  - role: worker
    labels:
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-1
  - role: worker
    labels:
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-2
  - role: worker
    labels:
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-3
