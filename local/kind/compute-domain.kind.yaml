#
# Kind cluster config for the compute-domain Tilt scenario.
#
# Four workers that kubeadm registers as worker-0 .. worker-3, the node names
# local/compute-domain/topology.yaml lists, whatever the cluster is called.
# DRA feature gates and the apiServer runtime-config are on, so the scenario
# composes with --dra. The ComputeDomain e2e scenario and guide use the
# two-rack tests/e2e/kind-compute-domain-racks.yaml instead.
#
# Each worker carries mokka.nvidia.com/type=sgpu, the simulated-GPU fleet
# marker local/compute-domain/nvml-mock.values.yaml selects on. It keeps the
# mock off the control plane, which topology.yaml gives no clique — a mock pod
# there would report a fabric identity the topology never declared.
#
# Usage:
#   make cluster-create PROFILE=compute-domain
#   tilt up -- --compute-domain   # context kind-mokka-compute-domain
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mokka-compute-domain
featureGates:
  DynamicResourceAllocation: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            runtime-config: "resource.k8s.io/v1beta1=true"
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: control-0
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000ab.0"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-0
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000ab.1"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-1
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000cd.0"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-2
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000cd.1"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-3
