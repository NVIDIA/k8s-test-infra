#
# journald drop-in mounted onto every node by the Kind configs here, so a node keeps
# a "syslog" that consumers of host kernel logs can read: the Xid the node daemon
# writes to /dev/kmsg for an injection, and NVSentinel's syslog-health-monitor,
# which opens the journal directory under a /var/log hostPath and admits only
# kernel-transport entries. The stock Kind node image satisfies neither:
#
#   Storage=persistent  journald otherwise keeps the journal in /run/log/journal,
#                       where a /var/log hostPath cannot see it. The boot-time
#                       journal-flush unit creates the directory and moves the
#                       journal there.
#   ReadKMsg=yes        journald.conf ships ReadKMsg=no, dropping kernel messages;
#                       with this, a line written to /dev/kmsg is ingested as
#                       _TRANSPORT=kernel.
#
# Mounted at cluster creation, not written into a running node: journald cannot
# reload (CanReload=no), so a later drop-in would need systemd-journald and
# systemd-journal-flush restarted.
#
# The nodes see one another's Xids: the kernel ring buffer is not namespaced, so
# every node container shares the host's. A per-node log consumer would report one
# GPU's fault against every node it watches (the NVSentinel demo ingests kernel
# messages on a single node for that reason); reading the journal by hand is fine.
[Journal]
Storage=persistent
ReadKMsg=yes
