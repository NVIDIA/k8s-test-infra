#
# Two workers is the least that still exercises heterogeneous fleets (per-profile
# releases, a ResourceSlice per node, FGO's integration/scale split) while staying
# cheap enough for a laptop. Under --multi-gpu-profile they take a100 (worker-0) and
# t4 (worker-1), which differ in GPU count (8 vs 4) and InfiniBand (a100 on, t4 off).
#
# Worker names are pinned through JoinConfiguration so they survive recreation and
# can be selected directly: install_fleet() in local/nvml_mock.tiltfile pins each
# release with kubernetes.io/hostname=<worker>. The control-plane node keeps its
# kind-derived name: kubeadm names the bootstrap node from InitConfiguration, which
# JoinConfiguration cannot override.
#
# Worker labels:
#   - run.ai/simulated-gpu-node-pool=<integration|scale> splits the workers for FGO:
#     the mock backs integration, FGO's fake backend simulates scale.
#   - mokka.nvidia.com/type=sgpu marks the simulated-GPU fleet. The mock selects on
#     it (local/nvml-mock.values.yaml), which keeps it off the control plane.
#
# Cluster-wide: the DynamicResourceAllocation gate and resource.k8s.io/v1beta1 let
# the DRA driver publish ResourceSlices. With no ResourceClaim the scheduler paths
# never fire, so non-DRA scenarios pay nothing. containerd 2.x in kindest/node has
# NRI on, which the mock's NRI plugin attaches to, so no containerd patch is needed.
#
# hostPaths in a Kind config are repo-relative: create the cluster from the repo
# root (make cluster-create does).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mokka
featureGates:
  DynamicResourceAllocation: true
nodes:
  - role: control-plane
    extraMounts: &node-syslog
      - hostPath: local/kind/journald-node-syslog.conf
        containerPath: /etc/systemd/journald.conf.d/99-node-syslog.conf
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            runtime-config: "resource.k8s.io/v1beta1=true"
  - role: worker
    labels:
      run.ai/simulated-gpu-node-pool: integration
      mokka.nvidia.com/type: sgpu
    extraMounts: *node-syslog
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-0
  - role: worker
    labels:
      run.ai/simulated-gpu-node-pool: scale
      mokka.nvidia.com/type: sgpu
    extraMounts: *node-syslog
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-1
