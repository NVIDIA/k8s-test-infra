apiVersion: v1
kind: Pod
metadata:
  name: gpu-validator
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  containers:
    - name: gpu-test
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      command: ["sh", "-c", "nvidia-smi && sleep infinity"]
      resources:
        limits:
          nvidia.com/gpu: "1"
