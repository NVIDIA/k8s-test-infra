# Keep the mock off the control-plane node. The chart tolerates every taint, so
# without a selector the DaemonSet also lands there, where no consumer follows it:
# GPU Operator operands, FGO and NFD workers stop at the NoSchedule taint. The node
# would advertise a GPU driver nobody consumes, and scenarios that pick a mock pod
# by position would intermittently hit it. Every worker in local/kind/*.kind.yaml
# carries this label. Overlays add their own keys (helm deep-merges maps).
nodeSelector:
  mokka.nvidia.com/type: sgpu

# Announce injected Xids on the node's kernel log. The chart leaves it off because
# it makes the node-agent container privileged; a local cluster is where that trade
# is worth it: `nvml-mock-ctl fail --xid` is meant to be visible to whatever reads
# the node's kernel messages, and local/kind/*.kind.yaml already has journald
# ingest them.
nodeAgent:
  kernelLog:
    enabled: true
