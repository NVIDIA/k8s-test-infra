# The mock's device nodes sit under the driver root so the upstream driver's
# getDevRoot() resolves here rather than falling back to "/".
nvidiaDriverRoot: /var/lib/nvml-mock/driver

# The driver's default gating waits for NFD to detect physical NVIDIA devices, and
# plain --dra runs no NFD.
gpuResourcesEnabledOverride: true

# Pin the kubelet plugin to the simulated-GPU pool: the chart's default affinity
# accepts only NFD/GFD-owned labels, which plain --dra does not produce.
kubeletPlugin:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: mokka.nvidia.com/type
                operator: In
                values: ["sgpu"]

# Off by default: Compute Domains need the fabric of --compute-domain, whose
# overlay (local/compute-domain/dra-driver.values.yaml) turns them on.
resources:
  computeDomains:
    enabled: false
