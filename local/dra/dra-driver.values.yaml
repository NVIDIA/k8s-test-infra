# The mock's device nodes sit under the driver root so the upstream driver's
# getDevRoot() resolves here rather than falling back to "/".
nvidiaDriverRoot: /var/lib/nvml-mock/driver

# The driver's default gating waits for NFD to detect physical NVIDIA devices, and
# plain --dra runs no NFD.
gpuResourcesEnabledOverride: true

# Pin the kubelet plugin to the simulated-GPU pool: the chart's default affinity
# accepts only NFD/GFD-owned labels, which plain --dra does not produce.
kubeletPlugin:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: mokka.nvidia.com/type
                operator: In
                values: ["sgpu"]
  # Same as the chart default. Spelled out because Helm replaces lists instead of
  # merging them: an overlay that adds a toleration must restate this one.
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}

# On for every profile, as downstream stacks such as AICR deploy the driver: the
# compute-domain kubelet plugin starts on every GPU node, NVLink fabric or not.
# Running a ComputeDomain still needs a multi-node NVLink profile and the
# fabric of --compute-domain.
resources:
  computeDomains:
    enabled: true
# The node agent's substitute /proc/devices, which carries the
# nvidia-caps-imex-channels major a real NVIDIA kernel module registers on every
# profile. The compute-domain kubelet plugin reads it at startup and aborts
# without it. Needs chart 0.5.0 or later.
altProcDevices: /var/lib/nvml-mock/imex/proc-devices
