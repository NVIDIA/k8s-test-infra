#
# Helm values for nvidia-dra-driver-gpu when running against nvml-mock in the
# 'dra' local dev scenario.
#
# Usage (via Tilt):
#   tilt up -- --dra
#
# Prerequisites:
#   - Cluster created with DRA feature gates (make cluster-create).
#   - nvml-mock deployed first (Tilt handles ordering via resource_deps).
#
# Mirrors the DRA driver install used by the CI e2e-dra job
# (.github/workflows/nvml-mock-e2e.yaml).

# Point the DRA kubelet plugin at the mock driver tree instead of "/".
# The mock DaemonSet lays down libnvidia-ml.so, device nodes, and nvidia-smi
# under this path — see deployments/nvml-mock/scripts/setup.sh, which
# co-locates $DEV_ROOT under $DRIVER_ROOT specifically so getDevRoot() in
# the upstream DRA driver resolves here rather than falling back to "/".
nvidiaDriverRoot: /var/lib/nvml-mock/driver

# Force-enable GPU resources without waiting for NFD to detect real hardware.
# The mock advertises fake GPUs via labels, but the DRA driver's default
# gating expects NFD-detected physical NVIDIA devices.
gpuResourcesEnabledOverride: true

# Compute Domains (IMEX / fabricmanager coordination) is not exercised by the
# mock in the default local dev flow. Keep it off to avoid extra pods on the
# single-node kind cluster. Enable if you're specifically iterating on IMEX.
resources:
  computeDomains:
    enabled: false

# Read the nvidia-caps-imex-channels device major from the substitute
# /proc/devices that nvml-mock stages (local/dra/nvml-mock.values.yaml turns
# that staging on) rather than the node's real one, which has no NVIDIA entries
# without a kernel module. Without this the compute-domain plugin exits at
# startup with "error parsing '/proc/devices': unexpected regex match: []"
# (NVIDIA/k8s-test-infra#497).
#
# Set through the chart's generic per-container env list rather than its
# altProcDevices value: no released chart carries altProcDevices (absent up to
# and including v25.12.0), while every release honours ALT_PROC_DEVICES_PATH in
# the plugin binary. The generic list cannot add a volume, hence the
# /driver-root path — nvidiaDriverRoot above is already bind-mounted there, so
# the file is reachable with no chart change.
#
# Inert on this default path: the chart only renders the compute-domains
# container, and therefore this env block, when resources.computeDomains is
# enabled (local/compute-domain/dra-driver.values.yaml).
kubeletPlugin:
  containers:
    computeDomains:
      env:
        - name: ALT_PROC_DEVICES_PATH
          value: /driver-root/proc/devices
