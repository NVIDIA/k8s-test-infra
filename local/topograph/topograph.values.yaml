# 'infiniband-k8s' with useGpuCliqueLabel=true derives the topology from the
# nvidia.com/gpu.clique node labels: no ibnetdiscover, no nvidia-smi exec, no
# InfiniBand hardware (the node-data-broker returns {instance: hostname,
# region: "local"}).
global:
  provider:
    name: infiniband-k8s
    params:
      useGpuCliqueLabel: true

  # 'k8s' writes node labels; 'nfd' would emit NodeFeature CRs, which nothing here
  # consumes.
  engine:
    name: k8s
