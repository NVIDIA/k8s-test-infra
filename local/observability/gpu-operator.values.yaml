dcgmExporter:
  enabled: true
  env:
    # Matches serviceMonitor.interval below and
    # prometheus.prometheusSpec.scrapeInterval in
    # kube-prometheus-stack.values.yaml, so every scrape sees a fresh sample.
    - name: DCGM_EXPORTER_COLLECT_INTERVAL
      value: "10000"
  serviceMonitor:
    enabled: true
    # No shorter than the chart's scrapeTimeout. Charts from v26.7.0 default
    # that to 10s, and the Prometheus Operator skips a ServiceMonitor whose
    # timeout is longer than its interval, logging only a warning, so
    # dcgm-exporter is never scraped.
    interval: 10s
    additionalLabels:
      # The most fragile coupling here. kube-prometheus-stack defaults
      # serviceMonitorSelectorNilUsesHelmValues=true, so Prometheus selects only
      # ServiceMonitors labelled with its own release name and ignores the rest
      # silently: the target is never discovered and every GPU panel stays empty.
      # Must equal RELEASE in observability.tiltfile.
      release: kube-prometheus-stack
