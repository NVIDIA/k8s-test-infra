#
# GPU Operator values overlay for the observability consumer.
#
# Layered by the root Tiltfile ON TOP OF local/gpu-operator/gpu-operator.values.yaml
# (later --values wins), so this file carries only the deltas: that baseline
# disables dcgm-exporter because the plain --gpu-operator scenario has nothing to
# scrape it, and this consumer's whole point is scraping it.
#
# Standalone DCGM (nv-hostengine) stays disabled — dcgm-exporter embeds its own
# hostengine and nothing here polls one directly.

dcgmExporter:
  enabled: true
  env:
    # The exporter loads the mock libnvidia-ml.so from the driver root the
    # nvml-mock DaemonSet stages on each node.
    - name: NVIDIA_DRIVER_ROOT
      value: "/var/lib/nvml-mock/driver"
    # 5s so an injected fault reaches the dashboard promptly; matches
    # prometheus.prometheusSpec.scrapeInterval in
    # kube-prometheus-stack.values.yaml.
    - name: DCGM_EXPORTER_COLLECT_INTERVAL
      value: "5000"
  serviceMonitor:
    enabled: true
    interval: 5s
    additionalLabels:
      # THE most fragile coupling in this consumer. kube-prometheus-stack
      # defaults serviceMonitorSelectorNilUsesHelmValues=true, so Prometheus
      # only selects ServiceMonitors labelled with its own Helm release name and
      # ignores the rest SILENTLY — no error, no warning, just a target that was
      # never discovered and a dashboard where every GPU panel is empty.
      #
      # Must equal RELEASE in local/observability/observability.tiltfile, which
      # is the release name the stack is installed under. Both files are owned by
      # this consumer, so the two move together or not at all.
      release: kube-prometheus-stack
