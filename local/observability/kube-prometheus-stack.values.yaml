#
# Issue #597 sizes the stack against the per-node footprint budget, so
# Alertmanager is off, retention is 2h and Prometheus has explicit limits.
# node-exporter stays on: host CPU and memory pressure is what a scale run
# correlates GPU symptoms against, and it is the stack's only per-node DaemonSet.
# kube-state-metrics is a single Deployment.

alertmanager:
  enabled: false

# The bundled Kubernetes control-plane alert rules fire constantly on Kind
# (single-node etcd, no kube-proxy metrics) and would bury the demo in noise.
defaultRules:
  create: false

grafana:
  # Local-dev credential for a throwaway Kind cluster, reachable only through the
  # Tilt-managed port-forward on localhost.
  adminPassword: "mokka"
  service:
    type: ClusterIP
  # The sidecar imports any ConfigMap with this label, which is how the
  # dashboard arrives as a reviewable file instead of UI state. Chart defaults,
  # pinned because dashboards/mokka-gpu-dashboard.yaml carries the same label:
  # if they disagree the dashboard never appears, and nothing errors.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    # dcgm-exporter collects every 10s (see gpu-operator.values.yaml); scraping
    # slower would alias away the step change the fault scenarios assert on.
    scrapeInterval: 10s
    evaluationInterval: 30s
    retention: 2h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
