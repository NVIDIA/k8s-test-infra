    clique_id: 65534                # GetGpuFabricInfo.CliqueId
    state: "completed"              # GetGpuFabricInfo.State = 3
  platform:
    chassis_serial_number: "1820000000001" # placeholder, scrubbed in the capture: GetPlatformInfo.ChassisSerialNumber
    slot_number: 4                  # GetPlatformInfo.SlotNumber
