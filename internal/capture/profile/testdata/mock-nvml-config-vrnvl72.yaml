nvlink:
  version: 6                        # GetNvLinkVersion(link) = 8 on all 144 links (NVML's enum; the key is the generation)
  links_per_gpu: 36                 # links GetNvLinkState(link) answers on every GPU
  bandwidth_per_link_mbps: 41000    # smi-nvlink-s.txt: 41 GB/s on all 144 links
  c2c_enabled: true                 # smi-q.xml c2c_mode = Enabled
  multi_node: true                  # GetPlatformInfo.PeerType = 1
  bw_mode:
    scope: "device"                 # GetNvlinkBwMode answers per device
    supported: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36] # GetNvlinkSupportedBwModes.BwModes[:TotalBwModes]
  # switches: left out, NVSwitches sit in switch trays outside the captured node; pass -base to copy it

infiniband:
  enabled: true                     # 12 RDMA devices in host-ib-sysfs.txt
  hca_type: "MT4133"                # host-ib-sysfs.txt hca_type of 8 devices of 12; the rest: MT41695 x4
  fw_version: "82.48.4222"          # host-ib-sysfs.txt fw_ver of the MT4133 devices
  hw_rev: "0"                       # host-ibstat.txt Hardware version of the MT4133 devices
  board_id: "MT_0000001658"         # host-ib-sysfs.txt board_id of the MT4133 devices
  link_layer: "Ethernet"            # host-ib-sysfs.txt port layer of the MT4133 devices
  rate_gbps: 200                    # host-ib-sysfs.txt port rate of the MT4133 devices
  port_state: "ACTIVE"              # host-ib-sysfs.txt port state of the MT4133 devices
  phys_state: "LinkUp"              # host-ib-sysfs.txt port phys of the MT4133 devices
  hcas_per_gpu: 3                   # 12 RDMA devices / 4 GPUs
  # guid_prefix: left out, the capture scrubs GUIDs; pass -base to copy it
  # node_desc_template: left out, the mock's node description naming; pass -base to copy it

pcie_topology:
  root_complexes:                   # host-pci-hierarchy.txt root of each GPU; numa_node from host-pci-nvidia.txt
    - id: "pci0002:80"
      numa_node: 0
      devices: ["0002:81:00.0"]
    - id: "pci0002:c0"
      numa_node: 0
      devices: ["0002:C1:00.0"]
    - id: "pci000a:80"
      numa_node: 1
      devices: ["000A:81:00.0"]
    - id: "pci000a:e0"
      numa_node: 1
      devices: ["000A:E1:00.0"]
