  power:
    management_supported: true      # GetPowerManagementMode answers
    management_mode: "enabled"      # GetPowerManagementMode = 1
    default_limit_mw: 2300000       # GetPowerManagementDefaultLimit
    enforced_limit_mw: 2300000      # GetEnforcedPowerLimit
