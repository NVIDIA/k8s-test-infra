    total_bytes: 300442189824       # GetMemoryInfo_v2.Total
    reserved_bytes: 1338638336      # GetMemoryInfo_v2.Reserved
    free_bytes: 299103551488        # GetMemoryInfo_v2.Free, idle reading
    used_bytes: 0                   # GetMemoryInfo_v2.Used, idle reading
    memory_bus_width: 16128         # GetMemoryBusWidth
  bar1_memory:
    total_bytes: 549755813888       # GetBAR1MemoryInfo.Bar1Total
    free_bytes: 549755289600        # GetBAR1MemoryInfo.Bar1Free, idle reading
    used_bytes: 524288              # GetBAR1MemoryInfo.Bar1Used, idle reading
