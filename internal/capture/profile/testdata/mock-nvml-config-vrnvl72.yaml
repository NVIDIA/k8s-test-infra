# Mock NVML profile generated by `mokka-capture profile` from the capture
# vr-nvl72/node-a. Regenerate it rather than editing it:
#
#   mokka-capture profile -o mock-nvml-config-vrnvl72.yaml tests/hardware-captures/vr-nvl72/node-a
#
# Each comment names the value's source: an NVML getter in nvml-dump.json.gz
# (GetClockInfo(1) is the call with argument 1, .Field a field of its answer,
# [n] an element), an element of smi-q.xml, or a host file. "idle
# reading" marks a value that moves with load, "placeholder" an identifier
# the capture scrubbed. A key the capture cannot give is noted where it would
# go. `mokka-capture profile -explain` lists each GPU's answer for every key.

version: "1.0"

system:
  driver_version: "615.71.09"       # SystemGetDriverVersion
  nvml_version: "13.615.71.09"      # SystemGetNVMLVersion
  cuda_version: "13.4"              # SystemGetCudaDriverVersion = 13040
  cuda_version_major: 13            # SystemGetCudaDriverVersion = 13040
  cuda_version_minor: 4             # SystemGetCudaDriverVersion = 13040
  product_name: "VR NVL72"          # host-dmi.txt product_name

# dynamic_metrics_defaults: left out, Helm-only defaults for the mock's varying readings; pass -base to copy it

device_defaults:
  name: "NVIDIA Graphics Device"    # GetName
