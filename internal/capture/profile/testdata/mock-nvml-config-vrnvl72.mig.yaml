# MIG profile table generated by `mokka-capture profile` from the capture
# vr-nvl72/node-a, beside the profile it belongs to.
#
# Each row is GetGpuInstanceProfileInfo(index) on every GPU: slices
# SliceCount, profile_id Id, instances InstanceCount, memory_mb
# MemorySizeMB, multiprocessors MultiprocessorCount, copy_engines
# CopyEngineCount and the engine counts. Names come from smi-mig-lgip.txt,
# placements (start and size in memory slices) from smi-mig-lgipp.txt.
# MIG was disabled, so the capture lists no compute instance profiles; each
# row assumes one compute instance spanning it.

version: 1

supported_profiles:
  - name: "1g.35gb"                 # smi-mig-lgip.txt; GetGpuInstanceProfileInfo(0)
    nvml_profile: "1_SLICE"
    slices: 1
    profile_id: 19
    instances: 7
    memory_mb: 34304
    multiprocessors: 20
    copy_engines: 2
    decoders: 1
    jpeg: 1
    placements:                     # smi-mig-lgipp.txt
      - {start: 0, size: 1}
      - {start: 1, size: 1}
      - {start: 2, size: 1}
      - {start: 3, size: 1}
      - {start: 4, size: 1}
      - {start: 5, size: 1}
      - {start: 6, size: 1}
    compute_instances:              # assumed: one compute instance spanning the GPU instance
      - nvml_profile: "1_SLICE"
        slices: 1
        instances: 1
        multiprocessors: 20
        shared_copy_engines: 2
        decoders: 1
        jpeg: 1
