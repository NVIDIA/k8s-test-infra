# Causes of the differences between the Node declared by the gb300-cx7 rack
# fixture, run as its inventory fixture selects, and the capture in
# tests/hardware-captures/gb300-roce/node-a, in
# the format `mokka-capture diff nic -causes` reads. The first entry that
# matches a failure gives its cause.
#
# Cluster software on this node enabled one VF on each ConnectX-8's PF0 and put
# the eswitch in switchdev mode with a multiport eswitch. In that mode mlx5
# gives the four PFs of an ASIC one RDMA device on PF0, with a port per vport:
# per PF the host PF, one per possible VF (16) and the uplink, so 4 x 18 = 72
# ports, numbered vport index + 1 (drivers/infiniband/hw/mlx5/ib_rep.c,
# mlx5_ib_vport_rep_load and mlx5_ib_num_ports_update; vport order from
# mlx5_esw_vports_init in drivers/net/ethernet/mellanox/mlx5/core/eswitch.c;
# lag/mpesw.c requires switchdev). The declaration describes the ASIC before
# that: each PF with its own RDMA device and port.

- match: '^\S+ \S+/(0000|0002|0010|0012):03:00\.4(/|$)'
  cause: by design
  note: a VF that cluster software enabled on PF0; VFs aren't declared
- match: '^pci\.(sriov_numvfs|virtfn_count) pci/(0000|0002|0010|0012):03:00\.0$'
  cause: by design
  note: PF0 has the VF that cluster software enabled
- match: '^(net|rel\.switch_id)(\.\S+)? \S+/pf0vf0$'
  cause: by design
  note: the VF's switchdev representor, which exists once cluster software sets switchdev mode
- match: '^(rdma\.ports rdma|port(\.\S+)? port)/(0000|0002|0010|0012):03:00\.0/dev(/\d+)?$'
  cause: by design
  note: switchdev with a multiport eswitch makes PF0's RDMA device the 72-port representor device; port 1 is the host PF's representor
- match: '^(rdma|port|uverbs|mad|topo|rel\.sys_image_guid|rel\.devnode)(\.\S+)? \S*(0000|0002|0010|0012):03:00\.[1-3](/|$)'
  cause: by design
  note: with a multiport eswitch PFs 1 to 3 have no RDMA device of their own
- match: '^topo(\.\S+)? topo/(0000|0002|0010|0012):03:00\.0/dev$'
  cause: by design
  note: nvidia-smi topo -m lists the VFs' RDMA devices, not the 72-port representor device switchdev makes of PF0's
- match: '^topo\.GPU\d topo/00(07|17):01:00\.0/dev$'
  cause: by design
  note: on this cloud provider's node nvidia-smi reports SYS between every NIC and GPU, also within a NUMA node; the InfiniBand tray reports NODE there, as the declared placement does
- match: '^(mad|rel\.devnode)(\.\S+)? \S*(0000|0002|0010|0012):03:00\.0/dev/\d+/umad$'
  cause: by design
  note: the representor device's ports have no MAD interface

- match: '^module(\.\S+)? '
  cause: by design
  note: kernel modules belong to the node image
- match: '^devnode(\.\S+)? devnode/mlx5_perm_ctrl_'
  cause: by design
  note: device files this node's newer driver stack adds; the node image decides them
- match: '^(pci\.(files|aux|hwmon|ptp|irqs|local_cpulist|iommu_group|roce_enable|mlx5_num_vfs|ari_enabled|d3cold_allowed|power_state|reset_method|uevent)|rdma\.files|port\.(files|counters|hw_counters)|net\.(files|ecn|qos)(\.\S+)?|uverbs\.(by_ibdev|by_path|function_backlink)) '
  cause: by design
  note: rendered by the node agent, not decided by the declaration; compared at the rendered level
- match: '^(port\.(state|phys_state) port/0017:01:00\.0/dev/1|net\.(operstate|carrier|speed) net/0017:01:00\.0/p1)$'
  cause: by design
  note: network state; this front-end port has no link
- match: '^(net\.mtu net/(00(07|17):01:00\.0/p[01]|(0000|0002|0010|0012):03:00\.[0-3]/p[0-3])|port\.(gids|gid_ndevs) port/0007:01:00\.0/dev/1)$'
  cause: by design
  note: front-end network configuration, MTU 9000 and IP addresses, whose GIDs the kernel adds
- match: '^node\.dev_infiniband node$'
  cause: by design
  note: includes the newer driver stack's device files; each device file is compared on its own
- match: '^rdma\.fw_ver rdma/(0000|0002|0010|0012):03:00\.0/dev$'
  cause: schema gap
  note: runtime policy not implemented. The boards run firmware 40.48.1102; a declaration reports the profile's 40.47.3576 until an SGPURuntimePolicy can set a cluster's firmware version
