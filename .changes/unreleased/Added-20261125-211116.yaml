  node-agent: a NIC declaration that doesn't resolve leaves the GPUs serving: the agent keeps the NICs it last accepted while they fit the node's PCI tree, records a Warning Event on its pod, and names the error under `nics` in `/readyz`. See the chart guide's NIC slots section.
