kind: Added
body: |-
  helm: `imex.payload.image` delivers the pinned IMEX archive to multi-node NVLink nodes, such as gb200 and gb300, from an image. Mokka does not publish that image: build it with `make imex-payload-image`, then load it into the cluster or push it to a private registry.
