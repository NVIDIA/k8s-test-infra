kind: Changed
body: |-
  helm: **Breaking:** the NRI plugin now runs by default, so a container holding
    a GPU allocation gets the mock driver. It needs containerd NRI (off in 1.7)
    or `nri.enabled=false`; upgrades with `--reuse-values` keep it off. See
    `docs/guides/nri-injection.md`.
