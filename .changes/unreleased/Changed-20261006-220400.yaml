kind: Changed
body: |-
  helm: **Breaking:** the NRI plugin now runs by default, so a container that
    holds a GPU allocation gets the mock driver with no extra setup. It needs
    containerd with NRI enabled; containerd 1.7 ships it off, so enable it there
    or set `nri.enabled=false`.
