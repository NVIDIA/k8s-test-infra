kind: Changed
body: |-
  **Breaking:** helm: the NRI plugin now runs by default, so a container holding a GPU allocation gets the mock driver. It needs NRI in containerd, which the node agent enables while `nodeAgent.containerRuntime.enabled` is on. Set `nri.enabled=false` to opt out; upgrade from 0.4.x without `--reuse-values`.
time: 2026-10-07T05:04:00Z
