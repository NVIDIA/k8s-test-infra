kind: Added
body: |-
  helm: `identity.derive: node` gives every node its own GPU UUIDs, board serials and, for rack-scale profiles, chassis serial, slot and tray, so one release covers all nodes of a profile. See [Per-node identities](https://nvidia.github.io/k8s-test-infra/configuration/#per-node-identities).
