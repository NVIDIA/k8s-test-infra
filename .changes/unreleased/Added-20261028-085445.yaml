kind: Added
body: |-
  helm: `nri.driverManager.enabled` lets the GPU Operator's stock `k8s-driver-manager` see and unload simulated kernel modules on mock nodes, so it pauses and reschedules the GPU operands around a driver change; see "GPU Operator driver manager" on the Helm chart page.
