kind: Added
body: |-
  control-plane: Set `node.type` to `KWOK` to bind eligible virtual nodes to a rack group. The default is `CPU`. Enable `kwok.enabled` in Helm to run one data-plane replica that watches its racks and bound Pods and publishes GPU product, count, per-GPU memory, MIG strategy and NVIDIA PCI discovery labels on bound KWOK nodes.
