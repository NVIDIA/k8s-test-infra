body: |-
  Repository automation: a Commands run now applies earlier command comments from the last 24 hours whose runs were cancelled by a later run for the same pull request, so a queued /hold is no longer lost; a caught-up /lgtm or /approve is not recorded, and the policy comment names its comment so it can be repeated. merge.requiredCI rejects workflows in subdirectories of .github/workflows, which GitHub never runs.
