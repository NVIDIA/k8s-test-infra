  node-agent: the `IMEXDownload` feature gate (beta, on) downloads the pinned IMEX archive from NVIDIA when none is provided, on multi-node NVLink profiles such as the default `gb300`, for about a minute; `imex.binaries.download.timeout` limits each attempt. Turn it off without internet access.
