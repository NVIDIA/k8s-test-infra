kind: Added
body: |-
  nvml-mock: on a 615 or newer driver, features a profile leaves out (GPU operation mode, retired pages, DRAM encryption, memory, acoustic and GPS thresholds) answer NOT_SUPPORTED, and disabled accounting lists no processes, as on a real board; this applies to any profile run on such a driver. `device_defaults.egm` sets the EGM capability. Output on older drivers is unchanged.
time: 2026-11-06T12:00:00Z
