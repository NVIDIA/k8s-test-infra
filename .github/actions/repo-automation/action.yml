name: Repository automation
description: Apply repository automation policy idempotently
inputs:
  mode:
    description: Repository automation mode to run
    required: true
  pr-number:
    description: Pull request number for modes that operate on a pull request
    required: false
  control-directory:
    description: Fixed trusted checkout containing repository automation policy
    required: false
  policy-revision:
    description: Exact trusted default branch commit used by metadata label scans and merge evaluation
    required: false
  request-id:
    description: Canonical UUID for a dispatched label scan report
    required: false
  workflow-commit-sha:
    description: Exact main workflow commit for dispatched label scan reports
    required: false
  dry-run:
    description: Plan supported modes without mutating GitHub
    required: false
    default: "true"
outputs:
  summary:
    description: JSON summary of the idempotent operation
runs:
  using: node24
  main: dist/index.js
