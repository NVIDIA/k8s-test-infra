name: Repository automation
description: Apply repository automation policy idempotently
inputs:
  mode:
    description: Repository automation mode to run
    required: true
  pr-number:
    description: Pull request number for modes that operate on a pull request
    required: false
  pull_request_number:
    description: Exact pull request number for Mokka cherry-pick mode
    required: false
  source-sha:
    description: Exact source commit for generic modes
    required: false
  source_sha:
    description: Exact source commit for Mokka cherry-pick mode
    required: false
  target-branch:
    description: Policy-approved target branch for backport modes
    required: false
  action-id:
    description: Canonical action identity for generic modes
    required: false
  action_id:
    description: Canonical Mokka action UUID for retry-safe branch identity
    required: false
  working-directory:
    description: Fixed target checkout for backport modes
    required: false
  control-directory:
    description: Fixed trusted checkout containing repository automation policy
    required: false
  policy-revision:
    description: Exact trusted default branch commit used by metadata label scans and merge evaluation
    required: false
  request-id:
    description: Canonical UUID for a dispatched label scan report
    required: false
  workflow-commit-sha:
    description: Exact main workflow commit for dispatched label scan reports
    required: false
  dry-run:
    description: Plan supported modes without mutating GitHub; Mokka requires false
    required: false
    default: "true"
outputs:
  summary:
    description: JSON summary of the idempotent operation
runs:
  using: node24
  main: dist/index.js
