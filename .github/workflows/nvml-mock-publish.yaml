name: nvml-mock Publish

permissions: {}

# No paths filter here: GitHub applies paths filters to tag pushes too, and
# a tag push has no changed-files diff, so a paths filter silently suppresses
# every tag-triggered run (the v0.2.0 tag published no image until it was
# retagged by hand). workflow_dispatch allows re-running a publish at any ref
# without re-pushing tags.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvidia/nvml-mock

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for keyless cosign signing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read chart appVersion
        id: chart
        run: |
          app_version=$(grep '^appVersion:' deployments/nvml-mock/helm/nvml-mock/Chart.yaml | awk '{print $2}' | tr -d '"')

          if [ -z "${app_version}" ]; then
            echo "could not read appVersion from the nvml-mock Chart.yaml" >&2
            exit 1
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"

      # main retags the image with the appVersion on every merge, so a release
      # appVersion there would be overwritten by the next merge (#1034), and
      # only a stable vMAJOR.MINOR.PATCH tag releases. Fail on either before
      # logging in or minting any credential.
      - name: Check the publish ref and version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          PUBLISH_REF: ${{ github.ref }}
          APP_VERSION: ${{ steps.chart.outputs.app_version }}
        run: ./hack/chart-publish-version.sh "${PUBLISH_REF}" "${APP_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The published image's dependencies must come from Artifactory. The
      # builder stage cannot reach this credential on its own, so it is minted
      # here and handed to BuildKit as a secret below.
      - name: Load Go version
        id: golang
        run: echo "version=$(./hack/golang-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.golang.outputs.version }}
          cache: false

      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        run: ./hack/check-goproxy.sh enforced

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # On push to main: tag with the chart's -dev appVersion, which every
            # merge overwrites; the guard above refuses any other appVersion
            type=raw,value=${{ steps.chart.outputs.app_version }},enable={{is_default_branch}}
            # On tag push: use the tag (e.g., v0.1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A tag push rebuilds the same commit. Keep the SHA tag owned by
            # the main/dispatch build so an automatic release build cannot
            # rewrite it. Manual recovery still works from any selected ref.
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' || !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deployments/nvml-mock/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Both are required. With only the secret the builder still points at
          # the public proxy; with only the build arg it points at Artifactory
          # with no credential and fails closed.
          build-args: |
            GOPROXY=https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual
          secret-files: |
            goauth=${{ runner.temp }}/dgxc-goauth
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign and attest the digest this run pushed, never a tag: on main the
      # first tag is the -dev tag, which an overlapping run can repoint.
      - name: Sign container image
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Attach SBOM to image
        run: |
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Remove the proxy credential
        if: always()
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"
