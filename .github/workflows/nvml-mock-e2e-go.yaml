# Go/Ginkgo nvml-mock E2E. Every scenario job uses `make cluster-create` +
# `tilt ci` for cluster provisioning and rollout (mirroring the local-dev flow
# in local/README.md); Ginkgo attaches to the resulting cluster and only
# observes/asserts, selecting the scenario by Ginkgo label filter.
#
# Image distribution: a single `build-nvmlmock-image` job builds the nvml-mock
# image once, exports it to a tarball and uploads it as a run-scoped artifact.
# Every leg downloads that artifact, stages it with `make image-load`, and the
# harness kind-loads it (E2E_SKIP_BUILD=true) rather than rebuilding per leg.
# Artifacts need no credentials, so fork PRs work, and no third-party registry
# can fail the matrix (see issue #566).
#
# Kind node image: the standalone `e2e` pilot uses `make cluster-create` (same
# as local dev), which needs a custom kind-node image with nvidia-container-
# toolkit pre-baked. A parallel `build-kind-node-image` job builds and shares
# that image the same way; the standalone leg loads it as kind-node-nv:latest
# and sets KIND_NODE_IMAGE_PREBUILT so `make image-kind-node` is a no-op. Other
# jobs still use kindest/node directly and don't need this.
name: nvml-mock E2E (Go)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      gpu_profiles:
        required: false
        type: string
        default: '["a100", "h100", "b200", "gb200", "gb300", "t4"]'
      golang_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      gpu_profiles:
        description: 'GPU profiles to test (JSON array)'
        required: false
        default: '["gb200"]'
        type: string
      golang_version:
        description: 'Go version to use (match go.mod / hack/golang-version.sh)'
        required: true
        type: string

env:
  GO_VERSION: ${{ inputs.golang_version }}
  KIND_VERSION: "v0.31.0"
  KIND_AMD64_SHA256: "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa"
  # Standalone `e2e` job only (pilot): pinned so Tilt version drift doesn't
  # silently change rollout semantics between runs. Bump alongside local dev.
  TILT_VERSION: "0.37.5"
  # Local ref of the pre-built nvml-mock image every leg loads from the
  # run-scoped artifact build-nvmlmock-image uploads. Deliberately identical to
  # the harness default in tests/e2e/go/framework/config/config.go, so CI and a
  # laptop `make e2e` exercise the same image name. No registry host: the image
  # only ever reaches a node via `kind load`, and the chart's IfNotPresent pull
  # policy means kubelet never tries to fetch it.
  E2E_IMAGE: nvml-mock:e2e
  # Tarball basenames the build jobs write and every consumer reconstructs under
  # RUNNER_TEMP after downloading. Kept here so producer and consumers cannot
  # drift apart on the filename.
  NVMLMOCK_TARBALL: nvml-mock.tar
  KIND_NODE_TARBALL: kind-node-nv.tar
  E2E_SKIP_BUILD: "true"
  E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e/go

jobs:
  # Build nvml-mock once and hand it to every leg as a run-scoped artifact;
  # legs load it instead of rebuilding the image per job (see issue #460).
  # Artifacts need no credentials, so fork PRs work, and no third-party
  # service sits in the path that can fail the whole matrix (see issue #566).
  build-nvmlmock-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build nvml-mock image to a tarball
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: deployments/nvml-mock/Dockerfile
          tags: ${{ env.E2E_IMAGE }}
          push: false
          # type=docker bakes the tag into the tarball, so a plain `docker load`
          # in each leg yields E2E_IMAGE with no re-tagging.
          outputs: type=docker,dest=${{ runner.temp }}/${{ env.NVMLMOCK_TARBALL }}
          build-args: |
            GOLANG_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha,scope=nvml-mock
          cache-to: type=gha,mode=max,scope=nvml-mock

      - name: Upload nvml-mock image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nvml-mock-image
          path: ${{ runner.temp }}/${{ env.NVMLMOCK_TARBALL }}
          # One day is the shortest retention GitHub allows and is long enough
          # to re-run a single failed leg.
          retention-days: 1
          # Artifacts are keyed per run, so a re-run would otherwise collide
          # with the previous attempt's upload.
          overwrite: true
          if-no-files-found: error
          # Buildx's docker exporter already writes gzipped layers.
          compression-level: 0

  # Build the custom kind-node image (kindest/node + nvidia-container-toolkit)
  # once per commit for the standalone `e2e` pilot, and share it the same way
  # as build-nvmlmock-image: tarball + run-scoped artifact. The pilot leg loads
  # it as kind-node-nv:latest, then `make cluster-create` sees the ref and skips
  # the rebuild (KIND_NODE_IMAGE_PREBUILT=1 in the leg's env). Runs in parallel
  # with build-nvmlmock-image; independent GHA cache scope so the two jobs don't
  # contend for the same key. Other jobs use kindest/node directly.
  build-kind-node-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build kind-node image to a tarball
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./deployments/kind-nvidia-cdi
          # Tag the ref `make image-kind-node` expects, so loading the tarball
          # is all a consumer has to do.
          tags: kind-node-nv:latest
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/${{ env.KIND_NODE_TARBALL }}
          cache-from: type=gha,scope=kind-node
          cache-to: type=gha,mode=max,scope=kind-node

      - name: Upload kind-node image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kind-node-image
          path: ${{ runner.temp }}/${{ env.KIND_NODE_TARBALL }}
          retention-days: 1
          # Artifacts are keyed per run, so a re-run would otherwise collide
          # with the previous attempt's upload.
          overwrite: true
          if-no-files-found: error
          # Buildx's docker exporter already writes gzipped layers.
          compression-level: 0

  # TODO: The standalone `e2e` job uses `make cluster-create` +
  # `tilt ci` for the cluster provisioning and nvml-mock rollout, mirroring the
  # local-dev flow documented in local/README.md. Ginkgo runs in attach mode
  # (E2E_ATTACH_EXISTING=true) and only observes/asserts. If this pattern
  # holds up, the four other jobs (dra, gpu-operator, multi-node, nri) will
  # follow in a subsequent PR.
  e2e:
    needs: [build-nvmlmock-image, build-kind-node-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gpu-profile: ${{ fromJson(inputs.gpu_profiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install Kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
          echo "${{ env.KIND_AMD64_SHA256 }}  ./kind" | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Tilt
        run: |
          curl -fsSL "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz" \
            | sudo tar -xzC /usr/local/bin tilt
          tilt version

      - name: Download pre-built kind-node image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kind-node-image
          path: ${{ runner.temp }}

      - name: Load pre-built kind-node image
        run: make image-load TARBALL=${{ runner.temp }}/${{ env.KIND_NODE_TARBALL }} IMAGE=kind-node-nv:latest

      - name: Create Kind cluster (make cluster-create)
        # Uses local/kind/default.kind.yaml (1 CP + 2 workers, a100 / t4). Same
        # command a laptop dev runs — cluster name is `mokka`, context is
        # kind-mokka. KIND_NODE_IMAGE_PREBUILT tells the Makefile to skip
        # the local `docker build` and trust the tag we just loaded from the
        # kind-node-image artifact.
        env:
          KIND_NODE_IMAGE_PREBUILT: "1"
        run: make cluster-create

      - name: Download pre-built nvml-mock image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nvml-mock-image
          path: ${{ runner.temp }}

      - name: Load pre-built nvml-mock image
        run: make image-load TARBALL=${{ runner.temp }}/${{ env.NVMLMOCK_TARBALL }} IMAGE=${{ env.E2E_IMAGE }}

      - name: Load nvml-mock image into Kind
        run: kind load docker-image "$E2E_IMAGE" --name mokka

      - name: Stage CI Helm values for Tilt
        # local/nvml-mock.values.local.yaml is the Tiltfile's "wins over
        # everything" overlay hook (nvml_mock.tiltfile:68). Copying our CI
        # tuning file there is how CI participates in the same values stack a
        # local dev's personal overrides use.
        run: cp tests/e2e/ci/nvml-mock.values.yaml local/nvml-mock.values.local.yaml

      - name: Roll out nvml-mock via Tilt (${{ matrix.gpu-profile }})
        # `tilt ci` runs the Tiltfile headless: waits for every resource to
        # become ready, then exits 0/1.
        run: tilt ci -- --gpu-profile="${{ matrix.gpu-profile }}" --nvmlmock-image="$E2E_IMAGE"

      - name: Run E2E (${{ matrix.gpu-profile }})
        # Attach mode: Ginkgo does NOT create a cluster, does NOT install helm,
        # does NOT kind-load; it just wires kube/helm clients to the existing
        # context and runs the standalone specs against Tilt's rollout.
        env:
          E2E_PROFILES: ${{ matrix.gpu-profile }}
          E2E_KUBE_CONTEXT: kind-mokka
          E2E_CLUSTER_NAME: mokka
        run: make e2e

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo "=== e2e diagnostics (${{ matrix.gpu-profile }}) ==="
          if [ -d "$E2E_ARTIFACTS" ]; then
            find "$E2E_ARTIFACTS" -type f | while read -r f; do
              echo "----- $f -----"; cat "$f"; echo;
            done
          else
            echo "no diagnostics written"
          fi

  e2e-dra:
    needs: [build-nvmlmock-image, build-kind-node-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gpu-profile: ${{ fromJson(inputs.gpu_profiles) }}
    steps:
      - name: Checkout
