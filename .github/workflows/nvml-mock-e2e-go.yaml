      - name: Roll out nvml-mock + DRA driver via Tilt (${{ matrix.gpu-profile }})
        run: tilt ci -- --gpu-profile="${{ matrix.gpu-profile }}" --dra --nvmlmock-image="$E2E_IMAGE"

      - name: Run DRA E2E (${{ matrix.gpu-profile }})
        env:
          E2E_PROFILES: ${{ matrix.gpu-profile }}
          E2E_KUBE_CONTEXT: kind-mokka
          E2E_CLUSTER_NAME: mokka
        run: make e2e-dra

      - name: Print diagnostics on failure
        if: failure()
