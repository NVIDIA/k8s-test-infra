      - name: Create Kind cluster (make cluster-create)
        env:
          KIND_NODE_IMAGE_PREBUILT: "1"
        run: make cluster-create

      - name: Load pre-built nvml-mock image
        run: make image-load TARBALL=${{ runner.temp }}/${{ env.NVMLMOCK_TARBALL }} IMAGE=${{ env.E2E_IMAGE }}

      - name: Load nvml-mock image into Kind
        run: kind load docker-image "$E2E_IMAGE" --name mokka

      - name: Stage CI Helm values for Tilt
        run: cp tests/e2e/ci/nvml-mock.values.yaml local/nvml-mock.values.local.yaml

      - name: Roll out nvml-mock via Tilt (${{ matrix.gpu-profile }})
        # No consumer flag: the scenario's specs each install nvml-mock with
        # their own NRI/IMEX/topology values, and pre-installing would fight
        # those upgrades. Containerd's NRI socket is enabled at the cluster
        # level (see local/kind/default.kind.yaml).
        run: tilt ci -- --gpu-profile="${{ matrix.gpu-profile }}" --nvmlmock-image="$E2E_IMAGE"

      - name: Run node-wide NRI injection E2E (${{ matrix.gpu-profile }})
        env:
          E2E_PROFILES: ${{ matrix.gpu-profile }}
          E2E_KUBE_CONTEXT: kind-mokka
          E2E_CLUSTER_NAME: mokka
        run: make e2e-nri

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo "=== e2e-nri diagnostics (${{ matrix.gpu-profile }}) ==="
          if [ -d "$E2E_ARTIFACTS" ]; then
            find "$E2E_ARTIFACTS" -type f | while read -r f; do
              echo "----- $f -----"; cat "$f"; echo;
            done
          else
            echo "no diagnostics written"
          fi

  e2e-nfd:
    needs: [build-nvmlmock-image, build-kind-node-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deliberately NOT fanned out over inputs.gpu_profiles like the sibling
        # jobs. The label under test (feature.node.kubernetes.io/pci-10de.present)
        # is vendor-only — byte-identical for every profile, since every mock GPU
        # is PCI vendor 0x10de — and the scenario itself hardcodes a100, so extra
        # legs would spend a kind cluster each to re-run the identical assertion
        # while reporting a profile name they never exercised.
        gpu-profile: [a100]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Download pre-built nvml-mock image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nvml-mock-image
          path: ${{ runner.temp }}

      - name: Install Kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
          echo "${{ env.KIND_AMD64_SHA256 }}  ./kind" | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Tilt
        run: |
          curl -fsSL "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz" \
            | sudo tar -xzC /usr/local/bin tilt
          tilt version

      - name: Download pre-built kind-node image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kind-node-image
          path: ${{ runner.temp }}

      - name: Load pre-built kind-node image
        run: make image-load TARBALL=${{ runner.temp }}/${{ env.KIND_NODE_TARBALL }} IMAGE=kind-node-nv:latest

      - name: Create Kind cluster (make cluster-create)
        env:
          KIND_NODE_IMAGE_PREBUILT: "1"
        run: make cluster-create

      - name: Load pre-built nvml-mock image
        run: make image-load TARBALL=${{ runner.temp }}/${{ env.NVMLMOCK_TARBALL }} IMAGE=${{ env.E2E_IMAGE }}

      - name: Load nvml-mock image into Kind
        run: kind load docker-image "$E2E_IMAGE" --name mokka

      - name: Stage CI Helm values for Tilt
        run: cp tests/e2e/ci/nvml-mock.values.yaml local/nvml-mock.values.local.yaml

      - name: Roll out nvml-mock via Tilt (${{ matrix.gpu-profile }})
        # No consumer flag: the scenario asserts the pci-10de label is absent
        # before installing NFD itself, so pre-installing NFD would collapse
        # the provenance check.
        run: tilt ci -- --gpu-profile="${{ matrix.gpu-profile }}" --nvmlmock-image="$E2E_IMAGE"

      - name: Run NFD label-provenance E2E (${{ matrix.gpu-profile }})
        env:
          E2E_PROFILES: ${{ matrix.gpu-profile }}
          E2E_KUBE_CONTEXT: kind-mokka
          E2E_CLUSTER_NAME: mokka
        run: make e2e-nfd

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo "=== e2e-nfd diagnostics (${{ matrix.gpu-profile }}) ==="
          if [ -d "$E2E_ARTIFACTS" ]; then
            find "$E2E_ARTIFACTS" -type f | while read -r f; do
              echo "----- $f -----"; cat "$f"; echo;
            done
          else
            echo "no diagnostics written"
          fi
