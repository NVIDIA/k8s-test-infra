name: "basic checks"

# Read-only default for all jobs. Only the code-scanning job elevates, so a
# newly added job cannot silently inherit a write token.
permissions:
  contents: read
  actions: read
  packages: read
  # Passed down to golang.yaml, which mints a short-lived Artifactory token.
  # A called workflow cannot hold more permission than its caller.
  id-token: write

on:
  workflow_call:
    outputs:
      version:
        description: "The short SHA to use as a version string"
        value: ${{ jobs.variables.outputs.version }}
      golang_version:
        description: "The golang version for this project"
        value: ${{ jobs.variables.outputs.golang_version }}
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - release-*

jobs:
  variables:
    uses: ./.github/workflows/variables.yaml

  golang:
    needs:
    - variables
    uses: ./.github/workflows/golang.yaml
    with:
      golang_version: ${{ needs.variables.outputs.golang_version }}

  code-scanning:
    needs:
    - variables
    # CodeQL uploads SARIF results. A job-level block replaces the workflow
    # defaults rather than merging with them, so the read grants are repeated.
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/code_scanning.yaml
    with:
      golang_version: ${{ needs.variables.outputs.golang_version }}
