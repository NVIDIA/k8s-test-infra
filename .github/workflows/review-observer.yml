name: Review observer

"on":
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  observe:
    if: ${{ vars.REPOSITORY_AUTOMATION_REVIEWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Signal review change
        run: ":"
