# The Mokka agent owns the Prow /assign, /unassign, /cc, /uncc, /close, /reopen
# and /retitle commands: it reads the comment, applies Prow's rules for who may
# use the command, and dispatches this workflow from main. The workflow only
# executes the command. Like every write job here, it runs only after
# REPOSITORY_AUTOMATION_ISSUE_COMMANDS_ENABLED is set to true. The agent checks
# this interface: five string inputs, all sent, with "" for unused ones.

name: Issue commands
run-name: "Issue command ${{ inputs.command }} #${{ inputs.number }} by ${{ inputs.requester }}"

"on":
  workflow_dispatch:
    inputs:
      command:
        description: "Command to apply: assign, unassign, cc, uncc, close, reopen or retitle"
        type: string
        required: true
      number:
        description: Issue or pull request number
        type: string
        required: true
      users:
        description: Comma-separated GitHub logins, for assign, unassign, cc and uncc
        type: string
        required: false
      title:
        description: New title, for retitle
        type: string
        required: false
      requester:
        description: Login of the user whose comment asked for the command
        type: string
        required: true

permissions: {}

jobs:
  issue-command:
    name: Apply issue command
    if: ${{ vars.REPOSITORY_AUTOMATION_ISSUE_COMMANDS_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # GitHub keeps one pending run per group and cancels the older one, so a
    # group two dispatches could share would drop a command, even an identical
    # one whose requester the audit trail needs. Every run is its own group.
    concurrency:
      group: issue-commands-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        id: inputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_USERS: ${{ inputs.users }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_REQUESTER: ${{ inputs.requester }}
        with:
          script: |
            const { validate } = require('./.github/scripts/issue-commands/run.js');
            const request = await validate({
              github,
              context,
              core,
              inputs: {
                command: process.env.INPUT_COMMAND,
                number: process.env.INPUT_NUMBER,
                users: process.env.INPUT_USERS,
                title: process.env.INPUT_TITLE,
                requester: process.env.INPUT_REQUESTER,
              },
            });
            if (request !== null) core.setOutput('request', JSON.stringify(request));

      - name: Apply command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUEST_JSON: ${{ steps.inputs.outputs.request }}
        with:
          script: |
            const run = require('./.github/scripts/issue-commands/run.js');
            return await run({ github, context, core, request: JSON.parse(process.env.REQUEST_JSON) });
