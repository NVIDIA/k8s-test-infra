name: Mokka Control Plane Publish

permissions: {}

# No paths filter here: GitHub applies paths filters to tag pushes too, and
# a tag push has no changed-files diff, so a paths filter silently suppresses
# every tag-triggered run. workflow_dispatch allows re-running a publish from
# main or an exact stable semantic-version release tag without re-pushing it.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# GitHub keeps one pending run per group and cancels it when a newer run
# queues, so tag runs get a group of their own: no merge to main and no
# dispatch on a branch can cancel a tag run, running or pending. Main runs
# push latest and sha-<commit>, and tag pushes push only MAJOR.MINOR.PATCH and
# MAJOR.MINOR (latest=false in Extract metadata), so a main run and a tag run
# never push the same tag. (A manual dispatch on a tag also pushes
# sha-<commit>; see Extract metadata.) Tag runs serialize among themselves,
# because two tags of one minor both move MAJOR.MINOR. Every v* tag push
# lands in that group, a refused rc tag included, so a third tag push while a
# tag run is running cancels the pending one. Never cancel a push that may
# have started updating the registry.
concurrency:
  group: mokka-control-plane-publish-${{ startsWith(github.ref, 'refs/tags/') && 'tags' || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvidia/mokka-control-plane

jobs:
  validate-publish-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require an approved publishing ref
        env:
          PUBLISH_REF: ${{ github.ref }}
        run: ./hack/validate-mokka-control-plane-publish-ref.sh "${PUBLISH_REF}"

  publish:
    needs: validate-publish-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for keyless cosign signing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Go version
        id: golang
        run: echo "version=$(./hack/golang-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.golang.outputs.version }}
          cache: false

      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        run: ./hack/check-goproxy.sh enforced

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest belongs to main builds (the raw tag below). Without this a
          # stable tag push also moves latest.
          flavor: latest=false
          tags: |
            # On push to main: tag as "latest"
            type=raw,value=latest,enable={{is_default_branch}}
            # On tag push: use the tag (e.g., v0.1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A tag push rebuilds the same commit. Keep the SHA tag owned by
            # the main/dispatch build so an automatic release build cannot
            # rewrite it. Manual recovery still works from any selected ref.
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' || !startsWith(github.ref, 'refs/tags/') }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Publish
        run: make mokka-control-plane-publish
        env:
          COSIGN_EXPERIMENTAL: "true"
          MOKKA_CONTROL_PLANE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          MOKKA_CONTROL_PLANE_TAGS: ${{ steps.meta.outputs.tags }}
          MOKKA_CONTROL_PLANE_LABELS: ${{ steps.meta.outputs.labels }}
          MOKKA_CONTROL_PLANE_GOLANG_VERSION: ${{ steps.golang.outputs.version }}
          MOKKA_CONTROL_PLANE_GOPROXY: https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual
          MOKKA_CONTROL_PLANE_GOAUTH_FILE: ${{ runner.temp }}/dgxc-goauth
          MOKKA_CONTROL_PLANE_DIGEST_FILE: ${{ runner.temp }}/mokka-control-plane.digest
          MOKKA_CONTROL_PLANE_SBOM_FILE: ${{ runner.temp }}/mokka-control-plane.spdx.json

      - name: Remove the proxy credential
        if: always()
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"
