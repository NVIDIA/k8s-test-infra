name: Mokka Control Plane Publish

permissions: {}

# No paths filter here: GitHub applies paths filters to tag pushes too, and
# a tag push has no changed-files diff, so a paths filter silently suppresses
# every tag-triggered run. workflow_dispatch allows re-running a publish from
# protected main or a protected semantic-version release tag without
# re-pushing it.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# All runs can update shared tags such as latest and MAJOR.MINOR. Keep the
# entire publication atomic relative to other runs, and do not cancel a push
# after it may have started updating the registry.
concurrency:
  group: mokka-control-plane-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvidia/mokka-control-plane

jobs:
  validate-publish-ref:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Require an approved publishing ref
        env:
          PUBLISH_REF: ${{ github.ref }}
          PUBLISH_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "${PUBLISH_REF_PROTECTED}" != "true" ]]; then
            echo "Publishing requires a ref protected by branch protection or a ruleset." >&2
            exit 1
          fi

          if [[ "${PUBLISH_REF}" == "refs/heads/main" ]]; then
            exit 0
          fi

          if [[ "${PUBLISH_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi

          echo "Publishing is restricted to main and semantic-version release tags (vMAJOR.MINOR.PATCH)." >&2
          exit 1

  publish:
    needs: validate-publish-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for keyless cosign signing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Go version
        id: golang
        run: echo "version=$(./hack/golang-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.golang.outputs.version }}
          cache: false

      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        run: ./hack/check-goproxy.sh enforced

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # On push to main: tag as "latest"
            type=raw,value=latest,enable={{is_default_branch}}
            # On tag push: use the tag (e.g., v0.1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Always: short SHA for traceability
            type=sha,prefix=sha-,format=short

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Publish
        run: make mokka-control-plane-publish
        env:
          COSIGN_EXPERIMENTAL: "true"
          MOKKA_CONTROL_PLANE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          MOKKA_CONTROL_PLANE_TAGS: ${{ steps.meta.outputs.tags }}
          MOKKA_CONTROL_PLANE_LABELS: ${{ steps.meta.outputs.labels }}
          MOKKA_CONTROL_PLANE_CACHE_FROM: type=gha
          MOKKA_CONTROL_PLANE_CACHE_TO: type=gha,mode=max
          MOKKA_CONTROL_PLANE_GOPROXY: https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual
          MOKKA_CONTROL_PLANE_GOAUTH_FILE: ${{ runner.temp }}/dgxc-goauth
          MOKKA_CONTROL_PLANE_DIGEST_FILE: ${{ runner.temp }}/mokka-control-plane.digest
          MOKKA_CONTROL_PLANE_SBOM_FILE: ${{ runner.temp }}/mokka-control-plane.spdx.json

      - name: Remove the proxy credential
        if: always()
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"
