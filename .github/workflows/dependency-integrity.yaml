---
# Re-verifies every module against go.sum whenever a manifest changes.
#
# Ordinary CI does not establish this. Go checks a module against go.sum when it
# downloads it, not when it reuses an already-extracted copy, so a run served by
# a warm cache verifies nothing. `make deps-verify` fetches the whole graph into
# a throwaway cache to force the check.
#
# It deliberately uses no secrets and no `id-token`. Fork pull requests get a
# read-only token and cannot mint an Artifactory credential, so a gate built on
# authenticated checks would pass for internal branches and fail for exactly the
# contributors it is meant to protect. Everything here works for someone with
# access to nothing of ours, which is what makes it safe to require.
#
# What it does not prove: that Artifactory will serve these modules. That is
# answered later, by the release build resolving in `enforced` mode.
name: Dependency Integrity

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      # The recipe is the check's contract, so a change to it re-runs it.
      - 'Makefile'
      - '.github/workflows/dependency-integrity.yaml'

permissions:
  contents: read

jobs:
  verify:
    name: Modules match go.sum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Go version
        id: golang
        run: echo "version=$(./hack/golang-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.golang.outputs.version }}
          # The check uses its own throwaway GOMODCACHE, so a restored cache
          # would only cost time.
          cache: false

      - name: Verify modules against go.sum
        run: make deps-verify
