name: Repository automation CI

on:
  pull_request:
    paths:
      - .github/actions/repo-automation/**
      - .github/repo-automation/**
      - .github/scripts/issue-commands/**
      - .github/workflows/**
      - hack/actionlint.sh
      - Makefile
      - OWNERS
      - OWNERS_ALIASES

permissions: {}

concurrency:
  group: automation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  automation-ci:
    name: Repository automation CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run repository automation CI
        run: make repository-automation-ci
