name: helm

on:
  pull_request:
    branches: [main, 'release-*']
    paths:
      - 'deployments/nvml-mock/helm/**'
      - 'deployments/mokka-crds/helm/**'

  # helm-publish.yaml runs these checks as the gate in front of publishing.
  workflow_call:

concurrency:
  # Named literally rather than after github.workflow: a called workflow sees
  # its caller's name, and sharing the caller's group deadlocks the run.
  group: helm-checks-${{ github.ref }}
  # Cancel superseded PR runs to save CI minutes, but never a publish gate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    # `ct lint` covers the nvml-mock chart tree only. mokka-crds is linted and
    # template-rendered by the `crds` job via `make helm-crds-tests`, because
    # chart-testing wants a values/CI layout that a CRDs-only chart does not
    # have.
    env:
      CHART_DIR: deployments/nvml-mock/helm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # chart-testing-action v2.8.0 installs Cosign 3.0.2, whose detached
      # certificate bug prevents it from verifying the chart-testing release.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Set up uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

      - name: Set up chart-testing
        env:
          CT_VERSION: 3.14.0
          YAMLLINT_VERSION: 1.33.0
          YAMALE_VERSION: 6.0.0
        run: |
          set -euo pipefail
          arch=amd64
          if [[ "$(uname -m)" == "aarch64" ]]; then
            arch=arm64
          fi

          install_dir="${RUNNER_TOOL_CACHE}/ct/${CT_VERSION}/${arch}"
          venv_dir="${install_dir}/venv"
          archive="chart-testing_${CT_VERSION}_linux_${arch}.tar.gz"
          release_url="https://github.com/helm/chart-testing/releases/download/v${CT_VERSION}"
          staging_dir="$(mktemp -d)"
          trap 'rm -rf "${staging_dir}"' EXIT

          curl --fail --retry 5 --retry-delay 1 -sSLo "${staging_dir}/${archive}" \
            "${release_url}/${archive}"
          cosign verify-blob \
            --certificate "${release_url}/${archive}.pem" \
            --signature "${release_url}/${archive}.sig" \
            --certificate-identity "https://github.com/helm/chart-testing/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${staging_dir}/${archive}"

          mkdir -p "${install_dir}"
          tar -xzf "${staging_dir}/${archive}" -C "${install_dir}"
          uv venv "${venv_dir}"
          VIRTUAL_ENV="${venv_dir}" uv pip install \
            "yamllint==${YAMLLINT_VERSION}" \
            "yamale==${YAMALE_VERSION}"

          echo "${install_dir}" >> "${GITHUB_PATH}"
          echo "${venv_dir}/bin" >> "${GITHUB_PATH}"
          echo "CT_CONFIG_DIR=${install_dir}/etc" >> "${GITHUB_ENV}"
          echo "VIRTUAL_ENV=${venv_dir}" >> "${GITHUB_ENV}"
          "${install_dir}/ct" version

      - name: Run chart-testing (lint)
        run: |
          ct lint \
            --target-branch ${{ github.event.repository.default_branch }} \
            --all \
            --chart-dirs ${{ env.CHART_DIR }} \
            --validate-maintainers=false

  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install helm-unittest plugin
        run: |
          echo "Installing helm-unittest plugin..."
          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --verify=false \
            --version v1.0.3 # 6f82a998e0b5461762ca959f87f5dd344af5e4eb

      - name: Run helm unittest
        run: make helm-tests

  # mokka-crds ships only CRD YAMLs (generated by controller-gen), so there
  # are no helm-unittest suites to run against it. A lint + template render is
  # enough to catch template/values regressions; schema drift is enforced
  # separately by `make gen-check` in the Go lint pipeline.
  crds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Lint + render mokka-crds chart
        run: make helm-crds-tests
