name: helm

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployments/nvml-mock/helm/**'
      - 'deployments/mokka-crds/helm/**'

  push:
    branches: [main]
    paths:
      - 'deployments/nvml-mock/helm/**'
      - 'deployments/mokka-crds/helm/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs to save CI minutes, but let main-branch runs
  # finish — publish pushes and cosign-signs a chart in two non-atomic
  # steps, and cancellation between them would leave an unsigned chart in
  # GHCR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default for all jobs. The publish job explicitly elevates only the
# permissions it needs.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    # `ct lint` covers the nvml-mock chart tree only. mokka-crds is linted and
    # template-rendered by the `crds` job via `make helm-crds-tests`, because
    # chart-testing wants a values/CI layout that a CRDs-only chart does not
    # have.
    env:
      CHART_DIR: deployments/nvml-mock/helm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        run: |
          ct lint \
            --target-branch ${{ github.event.repository.default_branch }} \
            --all \
            --chart-dirs ${{ env.CHART_DIR }} \
            --validate-maintainers=false

  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install helm-unittest plugin
        run: |
          echo "Installing helm-unittest plugin..."
          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --verify=false \
            --version v1.0.3 # 6f82a998e0b5461762ca959f87f5dd344af5e4eb

      - name: Run helm unittest
        run: make helm-tests

  # mokka-crds ships only CRD YAMLs (generated by controller-gen), so there
  # are no helm-unittest suites to run against it. A lint + template render is
  # enough to catch template/values regressions; schema drift is enforced
  # separately by `make gen-check` in the Go lint pipeline.
  crds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Lint + render mokka-crds chart
        run: make helm-crds-tests

  publish:
    needs:
      - lint
      - unittest
      # A matrix cannot express a per-leg `needs`, so the crds gate applies to
      # both legs: a broken mokka-crds chart now also holds back the nvml-mock
      # publish. That is the price of one job definition instead of two
      # copy-pasted ones, and both charts are cut from the same commit anyway.
      - crds

    # This job is privileged.
    # We protect it from malicious forks by only triggering when it's a push event on main.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    strategy:
      # Never cancel a sibling leg. Each leg pushes and then cosign-signs in
      # two non-atomic steps, and fail-fast cancellation of a leg sitting
      # between those two steps would leave an unsigned chart in GHCR, which is
      # the same hazard the workflow-level `cancel-in-progress` guards against.
      fail-fast: false
      matrix:
        include:
          - chart: nvml-mock
            dir: deployments/nvml-mock/helm
          - chart: mokka-crds
            dir: deployments/mokka-crds/helm

    permissions:
      contents: read
      packages: write
      id-token: write # needed for keyless cosign signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Read chart version
        id: chart
        run: |
          version=$(helm show chart ${{ matrix.dir }}/${{ matrix.chart }} | grep '^version:' | awk '{print $2}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

      - name: Package chart
        run: |
          helm package \
            ${{ matrix.dir }}/${{ matrix.chart }} \
            --destination .cr-release-packages

      # GHCR intermittently 404s the tag operation right after a fresh
      # manifest upload ("failed to perform Tag ...: not found"), leaving an
      # untagged package version behind; a short retry finds the
      # already-uploaded manifest and tags it.
      - name: Push chart to OCI registry
        id: push
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            if helm push \
              .cr-release-packages/${{ matrix.chart }}-${{ steps.chart.outputs.version }}.tgz \
              oci://ghcr.io/nvidia/k8s-test-infra/chart \
              2>&1 | tee push.log; then
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "helm push failed after ${attempt} attempts" >&2
              exit 1
            fi

            echo "helm push attempt ${attempt} failed; retrying in 10s" >&2
            sleep 10
          done

          digest=$(awk '/^Digest:/ {print $2}' push.log)

          if [ -z "${digest}" ]; then
            echo "could not extract chart digest from helm push output" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign reads registry credentials from the Docker config, which
      # `helm registry login` does not write; without this login the
      # signature blob upload is rejected with UNAUTHORIZED.
      - name: Log in to GHCR for cosign
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign OCI artifact
        run: |
          cosign sign --yes \
            ghcr.io/nvidia/k8s-test-infra/chart/${{ matrix.chart }}@${{ steps.push.outputs.digest }}
