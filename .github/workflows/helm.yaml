name: helm

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/helm.yaml'
      - 'deployments/nvml-mock/helm/**'
      - 'deployments/mokka-crds/helm/**'

  # helm-publish.yaml runs these checks as the gate in front of publishing.
  workflow_call:

concurrency:
  # Named literally rather than after github.workflow: a called workflow sees
  # its caller's name, and sharing the caller's group deadlocks the run.
  group: helm-checks-${{ github.ref }}
  # Cancel superseded PR runs to save CI minutes, but never a publish gate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    # `ct lint` covers the nvml-mock chart tree only. mokka-crds is linted and
    # template-rendered by the `crds` job via `make helm-crds-tests`, because
    # chart-testing wants a values/CI layout that a CRDs-only chart does not
    # have.
    env:
      CHART_DIR: deployments/nvml-mock/helm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      - name: Run chart-testing (lint)
        run: |
          ct lint \
            --target-branch ${{ github.event.repository.default_branch }} \
            --all \
            --chart-dirs ${{ env.CHART_DIR }} \
            --validate-maintainers=false

  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      - name: Install helm-unittest plugin
        env:
          HELM_UNITTEST_VERSION: 1.2.1
        run: |
          set -o pipefail
          echo "Installing helm-unittest plugin..."
          curl -fsSL "https://raw.githubusercontent.com/helm-unittest/helm-unittest/v${HELM_UNITTEST_VERSION}/public-key.asc" |
            gpg --dearmor > "${RUNNER_TEMP}/helm-unittest.gpg"
          helm plugin install \
            "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}/unittest-${HELM_UNITTEST_VERSION}.tgz" \
            --keyring "${RUNNER_TEMP}/helm-unittest.gpg"

      - name: Run helm unittest
        run: make helm-tests

  # mokka-crds ships only CRD YAMLs (generated by controller-gen), so there
  # are no helm-unittest suites to run against it. A lint + template render is
  # enough to catch template/values regressions; schema drift is enforced
  # separately by `make gen-check` in the Go lint pipeline.
  crds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      - name: Lint + render mokka-crds chart
        run: make helm-crds-tests
