# Validates the Fern docs on pull requests that touch them.
#
# The paths below are mirrored in `.github/repo-automation/policy.yml`, which
# decides from the same patterns when this workflow must pass before a merge; a
# test keeps the two in step. The checks live in `make docs-check`, so a failure
# reproduces locally.

name: Fern Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "fern/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/fern-docs-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Fern CLI
        # Intentionally unpinned: Fern ships often with no LTS channel and the
        # NVIDIA global theme tracks the latest CLI, so a pin goes stale and
        # breaks more than it protects. Do not pin.
        run: npm install -g fern-api@latest

      # Fern reads local files that a page names, so docs-check also rejects
      # any path that leaves docs/ before the CLI sees it.
      - name: Check docs
        run: make docs-check
