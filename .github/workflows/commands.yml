name: Commands

"on":
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  command:
    if: ${{ vars.REPOSITORY_AUTOMATION_COMMANDS_ENABLED == 'true' && github.event.issue.pull_request != null && github.event.action == 'created' && github.event.comment.user.type == 'User' && contains(github.event.comment.body, '/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    # Shared with PR metadata for the same pull request: both rewrite its policy comment.
    concurrency:
      group: repository-automation-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Resolve trusted default branch
        id: trusted
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const branch = context.payload.repository.default_branch;
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            });
            const sha = data.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error("default branch did not resolve to a canonical commit SHA");
            }
            return sha;
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.result }}
          path: control
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Apply authorized command
        id: command
        uses: ./control/.github/actions/repo-automation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          mode: command
          control-directory: control
          dry-run: "false"
