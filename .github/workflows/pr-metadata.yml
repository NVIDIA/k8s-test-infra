name: PR metadata

"on":
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
    branches: [main, "release-*"]

permissions: {}

jobs:
  metadata:
    if: ${{ vars.REPOSITORY_AUTOMATION_METADATA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: repository-automation-state
      cancel-in-progress: false
    steps:
      - name: Resolve trusted default branch
        id: trusted
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const branch = context.payload.repository.default_branch;
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
            });
            const sha = data.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error("default branch did not resolve to a canonical commit SHA");
            }
            return sha;
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.result }}
          path: control
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Reconcile pull request metadata
        uses: ./control/.github/actions/repo-automation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          mode: metadata
          control-directory: control
          dry-run: "false"
