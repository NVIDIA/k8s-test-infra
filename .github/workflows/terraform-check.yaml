# Validates the managed EKS reference Terraform without AWS credentials.
#
# The Terraform lives beside the EKS guide but is not part of the Fern site, so
# it is checked here instead of in the docs workflow. The paths are mirrored in
# `.github/repo-automation/policy.yml`.

name: EKS Terraform

on:
  pull_request:
    paths:
      - "docs/guides/install/aws/eks/terraform/**"
      - "Makefile"
      - ".github/workflows/terraform-check.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform-check:
    name: Managed EKS Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Resolve patch releases automatically while keeping minor-version
          # changes explicit and reviewable.
          terraform_version: "~1.16.0"

      - name: Validate managed EKS Terraform
        run: make managed-eks-terraform-check
