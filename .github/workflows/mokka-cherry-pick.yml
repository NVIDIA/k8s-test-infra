name: Mokka cherry-pick

run-name: "Mokka cherry-pick: ${{ inputs.action_id }}"

"on":
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged source pull request number
        required: true
        type: string
      source_sha:
        description: Lowercase 40-character merge commit SHA
        required: true
        type: string
      target_branch:
        description: Frozen target branch
        required: true
        type: string
      action_id:
        description: Canonical UUIDv4 action identifier
        required: true
        type: string

permissions: {}

concurrency:
  group: mokka-cherry-pick-${{ inputs.pull_request_number }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  cherry-pick:
    if: ${{ vars.REPOSITORY_AUTOMATION_MOKKA_ENABLED == 'true' && github.ref == 'refs/tags/mokka-cherry-pick-v0.11.0-r1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Check out validated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          path: target
          persist-credentials: true
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Cherry-pick merged source pull request
        uses: ./control/.github/actions/repo-automation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          mode: mokka-cherry-pick
          pull_request_number: ${{ inputs.pull_request_number }}
          source_sha: ${{ inputs.source_sha }}
          target-branch: ${{ inputs.target_branch }}
          action_id: ${{ inputs.action_id }}
          working-directory: target
          dry-run: "false"
