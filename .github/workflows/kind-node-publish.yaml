name: KIND node Publish

permissions: {}

concurrency:
  group: kind-node-publish-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kind-node-publish.yaml'
      - 'deployments/kind-nvidia-cdi/**'
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvidia/mokka-kind-node
  SMOKE_IMAGE: mokka-kind-node:smoke
  SMOKE_CLUSTER: kind-node-smoke

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install KIND
        run: make -C deployments/kind-nvidia-cdi install-kind-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build amd64 smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./deployments/kind-nvidia-cdi
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha,scope=kind-node-publish
          cache-to: type=gha,mode=max,scope=kind-node-publish

      - name: Create smoke cluster
        run: make -C deployments/kind-nvidia-cdi smoke-create
        env:
          IMAGE: ${{ env.SMOKE_IMAGE }}
          KIND_CLUSTER_NAME: ${{ env.SMOKE_CLUSTER }}

      - name: Verify effective runtime configuration
        run: make -C deployments/kind-nvidia-cdi smoke-verify-runtime
        env:
          KIND_CLUSTER_NAME: ${{ env.SMOKE_CLUSTER }}

      - name: Start a pod through the default runtime
        run: make -C deployments/kind-nvidia-cdi smoke-pod

      - name: Collect smoke-test diagnostics
        if: failure()
        run: make -C deployments/kind-nvidia-cdi smoke-diagnostics
        env:
          KIND_CLUSTER_NAME: ${{ env.SMOKE_CLUSTER }}

      - name: Delete smoke cluster
        if: always()
        run: make -C deployments/kind-nvidia-cdi smoke-delete
        env:
          KIND_CLUSTER_NAME: ${{ env.SMOKE_CLUSTER }}

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for keyless cosign signing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A tag push rebuilds the same commit. Keep the SHA tag owned by
            # the main/dispatch build so an automatic release build cannot
            # rewrite it. Manual recovery still works from any selected ref.
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' || !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./deployments/kind-nvidia-cdi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kind-node-publish
          cache-to: type=gha,mode=max,scope=kind-node-publish

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image
        run: make -C deployments/kind-nvidia-cdi sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "true"

      # An SBOM generated from a multi-platform index describes only the
      # runner's selected platform. Resolve each child so every attestation's
      # subject matches the architecture its document actually describes.
      - name: Resolve platform manifests
        id: manifests
        run: make -C deployments/kind-nvidia-cdi resolve-manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate amd64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifests.outputs.amd64 }}
          format: spdx-json
          output-file: sbom-amd64.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Generate arm64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifests.outputs.arm64 }}
          format: spdx-json
          output-file: sbom-arm64.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Attach platform SBOMs
        run: make -C deployments/kind-nvidia-cdi attest-platform-sboms
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64_DIGEST: ${{ steps.manifests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.manifests.outputs.arm64 }}
          AMD64_SBOM: ${{ github.workspace }}/sbom-amd64.spdx.json
          ARM64_SBOM: ${{ github.workspace }}/sbom-arm64.spdx.json
          COSIGN_EXPERIMENTAL: "true"

      # GHCR creates the package as private on its first push. This deliberately
      # leaves the first run red until an organization owner changes the linked
      # package to public; a rerun then proves the documented anonymous pull.
      - name: Verify anonymous pull access
        run: make -C deployments/kind-nvidia-cdi verify-anonymous-pull
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
