name: Golang

permissions:
  contents: read
  # Mints the short-lived Artifactory token for the Go proxy.
  id-token: write

on:
  workflow_call:
    inputs:
      golang_version:
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: Checkout code

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.golang_version }}

    - name: Install golangci-lint (fast prebuilt, via action)
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: latest
        install-only: true

    - name: Stage golangci-lint into tmp/bin (make lint expects it there)
      run: |
        mkdir -p tmp/bin
        ln -sf "$(command -v golangci-lint)" tmp/bin/golangci-lint

    # A fork PR gets a read-only token and cannot mint an OIDC credential, so
    # it resolves publicly. A gate an outside contributor cannot pass would
    # deadlock their PR permanently.
    - name: Configure the DGXC Go proxy
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: ./.github/actions/setup-dgxc-goproxy
      with:
        mode: routed

    - name: Assert the proxy is actually in front
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      run: ./hack/check-goproxy.sh

    - name: Lint
      run: make lint

    - name: Run unit tests
      run: make test

    - name: Run mockpcisysfs integration tests
      run: make test-mockpcisysfs

    # The unit run above never links the shared object, so a missing export or
    # a broken --defsym alias passes it. This drives the real .so via go-nvml.
    - name: Run mock NVML bridge integration tests
      run: make test-mocknvml-bridge
    # The tests/e2e harness packages sit behind the `e2e` build tag, so the
    # untagged unit-test run above skips them -- `go list ./...` does not even
    # match them. `make e2e` does not reach them either: it targets the Ginkgo
    # suite package ./tests/e2e/go, not ./tests/e2e/go/... . Without this step
    # the harness's own unit tests compile for nobody and rot silently, which is
    # how the diagnostics collection path lost its sidecar logs unnoticed
    # (#562). These are plain `go test` units -- no cluster, no kubectl.
    - name: Run e2e framework unit tests
      run: make test-e2e-framework

    - name: Remove the proxy credential
      if: always()
      run: rm -f "${RUNNER_TEMP}/dgxc-goauth"
