# Checks external links in the docs on a schedule and on demand.
#
# `fern docs broken-links`, which the PR workflow runs, checks internal links
# only. External links rot on their own schedule, so they are checked here
# rather than on every pull request, where a third-party outage would block
# unrelated changes. Run it before cutting a release.
#
# No secrets required.

name: Fern Docs Preflight

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  external-links:
    name: External Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Fern pages link to each other with root-relative slugs such as
          # /k8s-test-infra/general/overview. lychee cannot resolve those without
          # --root-dir, and with it they map to files that do not exist, so the
          # product slug is excluded; `fern docs broken-links` covers them.
          args: >-
            --no-progress
            --exclude-loopback
            --exclude 'localhost'
            --exclude 'docs\.nvidia\.com'
            --root-dir docs
            --exclude '/docs/k8s-test-infra/'
            --retry-wait-time 5
            'docs/**/*.md'
          fail: true
