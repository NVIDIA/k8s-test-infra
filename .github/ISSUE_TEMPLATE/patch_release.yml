name: "Out-of-cycle release"
description: "Track an unscheduled security or bug-fix release, cut from main."
title: "Release vX.Y.Z"
labels: ["release", "kind/chore"]
body:
  - type: markdown
    attributes:
      value: |
        Mokka fixes forward: a fix merges to `main` and ships in the next
        scheduled release. There are no release branches and no backports.
        This template is for a fix, already merged to `main`, that cannot wait
        for the next scheduled release. Scheduled and major releases use the
        **Release** template.

        Do not remove checklist items: an item that does not apply is checked
        with a note saying why, so the record shows it was considered.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Set by the version check below: the next Z when every change is a fix, otherwise the next Y."
      placeholder: "v0.5.1"
    validations: { required: true }
  - type: input
    id: engineer
    attributes:
      label: Release engineer
      description: "GitHub handle of the maintainer running this release."
      placeholder: "@handle"
    validations: { required: true }
  - type: input
    id: lasttag
    attributes:
      label: Last release tag
      placeholder: "v0.5.0"
    validations: { required: true }
  - type: input
    id: basesha
    attributes:
      label: Base commit
      description: "The `main` SHA this release is cut from. It contains every fix listed below and must be fully green."
    validations: { required: true }
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options:
        - "Security"
        - "Bug"
    validations: { required: true }
  - type: textarea
    id: advisories
    attributes:
      label: Advisory IDs fixed
      description: "One per line: GO-, GHSA- or CVE IDs. Leave empty for a bug release."
      placeholder: |
        GO-2026-0000
        GHSA-xxxx-xxxx-xxxx
      render: text
  - type: textarea
    id: fixes
    attributes:
      label: Fix PRs
      description: "One per line: the PR merged to `main` and what it fixes."
      placeholder: |
        #1234  fix(engine): ...
      render: text
    validations: { required: true }
  - type: checkboxes
    id: versioncheck
    attributes:
      label: Version check
      options:
        - label: "`git log --format='%h %s' <last-tag>..<base-commit>` pasted in this issue."
        - label: "The version is the next Z only when every commit listed is a fix, security, dependency, docs, chore, ci or test change. Otherwise, for a feature, a breaking change or anything else, it is the next Y, and the release notes say it shipped ahead of the schedule."
  - type: checkboxes
    id: security
    attributes:
      label: Security
      description: "For a bug release, check each item with a note."
      options:
        - label: "`govulncheck -tags=e2e,integration ./...`, the command `make lint` runs, in a checkout of the last tag and of the base commit. Both outputs pasted in this issue."
        - label: "The base commit run reports none of the advisories listed above."
        - label: "If the release spans more than one day, govulncheck is rerun on the base commit on the day of tagging and the output pasted."
        - label: "If the `go` directive in `go.mod` rose since the last tag (`git diff <last-tag> <base-commit> -- go.mod`), the release notes state the new minimum Go version."
  - type: checkboxes
    id: prep
    attributes:
      label: Release-prep PR (against `main`)
      options:
        - label: "CI Pipeline and `make lint` are green on the base commit."
        - label: "`make changelog-preview RELEASE_VERSION=<version-without-v>`, then `make changelog-release RELEASE_VERSION=<version-without-v>`."
        - label: "No changelog content lost: one bullet per fragment the fold removed from `.changes/unreleased/`. Both counts pasted in the PR."
        - label: "Compare link added at the bottom of CHANGELOG.md."
        - label: "Docs that pin the previous release's version updated: `git grep -n '<previous-version-without-v>' -- docs`."
        - label: "`skip-changelog` label applied."
        - label: "Gates: `make helm-tests`, `make helm-crds-tests`, `make lint`, `make build`, `make test`."
        - label: "No `Chart.yaml` version edited: the tag sets the published versions."
        - label: "Reviewed and merged. Review fixes batched into one push; the branch is rebased, never updated with \"Update branch\" (its merge commit fails the DCO check)."
  - type: checkboxes
    id: tag
    attributes:
      label: Tag
      options:
        - label: "Before tagging, CI Pipeline is green on the prep merge commit: `gh run list --workflow \"CI Pipeline\" --commit <prep-merge-commit>`."
        - label: "Before tagging, list the changelog fragments that merged after the base commit: `git diff --name-only --diff-filter=A <base-commit> <prep-merge-commit> -- .changes/unreleased`. They ship in this tag but are not in its changelog section. List pasted in this issue, even when empty. Each listed fragment also meets the version-check items above: do not tag over a `Removed` entry that breaks the floor, and the follow-up PR adds a missing `**Breaking:**` marker and user action."
        - label: "If anything other than the prep PR merged after the base commit (`git log --oneline <base-commit>..<prep-merge-commit>`), the version check is redone against the prep merge commit. If that changes the version, the tag and this issue use the new version; the section heading, the compare link and the doc pins the prep PR set carry the old one, and the follow-up changelog PR corrects them."
        - label: "`git tag -s -m \"<message>\" <version> <prep-merge-commit>`, with the commit given explicitly. The message names the fixes and the advisory IDs."
        - label: "Only a stable `vMAJOR.MINOR.PATCH` tag publishes. Never push an `-rc` tag."
        - label: "`git push upstream <version>`, by a maintainer with bypass on the tag ruleset."
  - type: checkboxes
    id: artefacts
    attributes:
      label: Verify published artefacts
      description: "Resolve the artefact, do not read a green check. `<v>` is the version without the `v`."
      options:
        - label: "`nvml-mock Publish`, `Mokka Control Plane Publish` and `helm-publish` succeeded for the tag: `gh run list --branch <version>`."
        - label: "`ghcr.io/nvidia/nvml-mock:<v>` and `ghcr.io/nvidia/mokka-control-plane:<v>` resolve for `linux/amd64` and `linux/arm64`; `<X.Y>` points at the same digest as `<v>` for both, and so does `nvml-mock:latest`."
        - label: "`helm show chart oci://ghcr.io/nvidia/k8s-test-infra/chart/<chart> --version <v>` for `nvml-mock` and `mokka-crds`: `version` and `appVersion` both equal `<v>`."
        - label: "`cosign verify` passes for both images by tag (each tag resolves to the signed multi-arch index) and for both charts."
        - label: "`cosign verify-attestation --type spdxjson` passes for `ghcr.io/nvidia/nvml-mock:<v>` and for the `linux/amd64` and `linux/arm64` digests of `ghcr.io/nvidia/mokka-control-plane:<v>` (from `docker buildx imagetools inspect`)."
        - label: "Every cosign command passes `--certificate-identity https://github.com/NVIDIA/k8s-test-infra/.github/workflows/<workflow>@refs/tags/<version>` and `--certificate-oidc-issuer https://token.actions.githubusercontent.com`, with `<workflow>` `nvml-mock-publish.yaml`, `mokka-control-plane-publish.yaml` or `helm-publish.yaml`."
  - type: checkboxes
    id: after
    attributes:
      label: After the release
      options:
        - label: "If the fragment list is not empty or the version changed: a PR against `main` moves each listed fragment's entry into this release's section of CHANGELOG.md, under its kind heading, deletes the fragment, and, if the version changed, corrects the section heading, the compare link and the doc pins the prep PR set to the tagged version. Once it merges, this release's section has one bullet per fragment the fold removed plus one per fragment the list named. Three counts pasted in the PR; `skip-changelog` applied, since the PR removes fragments and adds none."
        - label: "GitHub release, created after that PR merges (or after the tag when it is not needed), from this release's section of CHANGELOG.md on `main`, with the image and chart digests and one `cosign verify` command: `gh release create <version> --verify-tag --latest`."
        - label: "For a Y release, PR against `main` bumping both charts' `version` and `appVersion` to the next minor's `-dev` version. Not release-blocking. For a Z release, check this with a note: `main`'s `-dev` version already sorts after it."
        - label: "Link the tag and the release notes in this issue, then close it."
  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: "Paste the release's changelog section here so the issue is a self-contained record."
      render: markdown
