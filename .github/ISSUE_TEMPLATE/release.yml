name: "Release"
description: "Track a scheduled release (vX.Y.0) or a major release (vX.0.0), cut from main."
title: "Release vX.Y.0"
labels: ["release", "kind/chore"]
body:
  - type: markdown
    attributes:
      value: |
        Tracks one release from `main` to published artefacts. A release is cut
        from `main` every second week and ships whatever has merged by then.

        Do not remove checklist items: an item that does not apply is checked
        with a note saying why, so the record shows it was considered.

        A security or bug fix that cannot wait for the next scheduled release
        uses the **Out-of-cycle release** template instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: "The release tag, e.g. v0.5.0. A major release is vX.0.0."
      placeholder: "v0.5.0"
    validations: { required: true }
  - type: input
    id: engineer
    attributes:
      label: Release engineer
      description: "GitHub handle of the maintainer running this release."
      placeholder: "@handle"
    validations: { required: true }
  - type: input
    id: basesha
    attributes:
      label: Base commit
      description: "The `main` SHA this release is cut from. Must be fully green."
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: Release type
      options:
        - "Scheduled minor (vX.Y.0)"
        - "Major (vX.0.0)"
    validations: { required: true }
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: "CI Pipeline is green on the base commit, including the full e2e matrix. A flake rerun to green is fine; record the job and the rerun."
        - label: "`make lint` is green on the base commit. It runs govulncheck, so a known vulnerability in a dependency fails it."
        - label: "Open Dependabot PRs are merged, or listed in this issue as deferred with the reason."
        - label: "Every `Removed` entry this release ships (the `Removed-*` fragments in `.changes/unreleased/`) removes something whose deprecation was announced at least three Y releases earlier; Z releases do not count. A deprecation announced in 0.6.0 is removed no earlier than 0.9.0. New deprecations in this release are listed for the release notes."
        - label: "Every breaking change merged since the last tag has a `**Breaking:**` changelog entry that states the action a user takes. Before 1.0 a breaking change ships in this Y release; from 1.0 it makes the release type Major."
  - type: checkboxes
    id: prep
    attributes:
      label: Release-prep PR (against `main`)
      options:
        - label: "`make changelog-preview RELEASE_VERSION=<version-without-v>` to review the section, then `make changelog-release RELEASE_VERSION=<version-without-v>` to fold the pending fragments into CHANGELOG.md."
        - label: "Verify no changelog content was lost: the new section has one bullet per fragment the fold removed from `.changes/unreleased/`. Paste both counts in the PR."
        - label: "Add the compare link at the bottom of CHANGELOG.md following the existing pattern."
        - label: "Update the docs that pin the previous release's version: `git grep -n '<previous-version-without-v>' -- docs`."
        - label: "Apply the `skip-changelog` label: a release PR removes fragments rather than adding one."
        - label: "Gates: `make helm-tests`, `make helm-crds-tests`, `make lint`, `make build`, `make test`."
        - label: "No `Chart.yaml` version is edited. The tag sets the published chart `version` and `appVersion`."
        - label: "PR reviewed and merged. `main` dismisses stale approvals on push, so batch review fixes into one push. Rebase to update the branch instead of using \"Update branch\": its merge commit has no `Signed-off-by` and fails the DCO check."
  - type: checkboxes
    id: tag
    attributes:
      label: Tag
      options:
        - label: "Before tagging, CI Pipeline is green on the prep PR's merge commit, the commit the tag goes on: `gh run list --workflow \"CI Pipeline\" --commit <prep-merge-commit>`."
        - label: "Before tagging, list the changelog fragments that merged after the base commit: `git diff --name-only --diff-filter=A <base-commit> <prep-merge-commit> -- .changes/unreleased`. They ship in this tag but are not in its changelog section. Paste the list in this issue, even when it is empty. Each listed fragment also meets the two pre-flight checks above: do not tag over a `Removed` entry that breaks the floor, and the follow-up PR adds a missing `**Breaking:**` marker and user action."
        - label: "Annotated and signed, on the prep PR's merge commit given explicitly: `git tag -s -m \"<message>\" <version> <prep-merge-commit>`"
        - label: "Tag message covers the headline change and any breaking changes."
        - label: "Only a stable `vMAJOR.MINOR.PATCH` tag publishes, and every publish workflow refuses any other `v*` tag. Never push an `-rc` tag."
        - label: "`git push upstream <version>`. A ruleset restricts tag creation, so only a maintainer with bypass can push it."
  - type: checkboxes
    id: artefacts
    attributes:
      label: Verify published artefacts
      description: "Confirm by resolving the artefact, not by reading a green check. Image and chart tags drop the `v`: tag `v0.5.0` publishes `0.5.0`, written `<v>` below."
      options:
        - label: "`nvml-mock Publish`, `Mokka Control Plane Publish` and `helm-publish` ran for the tag and succeeded: `gh run list --branch <version>`."
        - label: "`ghcr.io/nvidia/nvml-mock:<v>` and `ghcr.io/nvidia/mokka-control-plane:<v>` resolve for `linux/amd64` and `linux/arm64`: `docker buildx imagetools inspect <image>:<v>`."
        - label: "For both images, `<X.Y>` points at the same digest as `<v>`. `nvml-mock:latest` does too; `mokka-control-plane:latest` is not compared, because every push to `main` also moves it."
        - label: "`helm show chart oci://ghcr.io/nvidia/k8s-test-infra/chart/nvml-mock --version <v>` and the same for `mokka-crds`: `version` and `appVersion` both equal `<v>`."
        - label: "`cosign verify` passes for `ghcr.io/nvidia/nvml-mock:<v>`, `ghcr.io/nvidia/mokka-control-plane:<v>`, `ghcr.io/nvidia/k8s-test-infra/chart/nvml-mock:<v>` and `ghcr.io/nvidia/k8s-test-infra/chart/mokka-crds:<v>`. Each image tag resolves to its multi-arch index, which is the digest the workflow signs."
        - label: "`cosign verify-attestation --type spdxjson` passes for `ghcr.io/nvidia/nvml-mock:<v>`, whose SBOM is attached to the index, and for the `linux/amd64` and `linux/arm64` digests of `ghcr.io/nvidia/mokka-control-plane:<v>`, whose SBOMs are attached per platform. List those digests with `docker buildx imagetools inspect ghcr.io/nvidia/mokka-control-plane:<v>`."
        - label: "Every cosign command passes `--certificate-identity https://github.com/NVIDIA/k8s-test-infra/.github/workflows/<workflow>@refs/tags/<version>` and `--certificate-oidc-issuer https://token.actions.githubusercontent.com`, where `<workflow>` is `nvml-mock-publish.yaml` for the nvml-mock image, `mokka-control-plane-publish.yaml` for the control-plane image and `helm-publish.yaml` for both charts."
  - type: checkboxes
    id: after
    attributes:
      label: After the release
      options:
        - label: "If the fragment list from the Tag section is not empty: a PR against `main` moves each listed fragment's entry into this release's section of CHANGELOG.md, under its kind heading, and deletes the fragment. Once it merges, this release's section has one bullet per fragment the fold removed plus one per fragment the list named. Paste the three counts in the PR, and apply `skip-changelog`: the PR removes fragments and adds none."
        - label: "GitHub release, created after that PR merges (or after the tag when the list was empty), from this release's section of CHANGELOG.md on `main`, with the image and chart digests and one `cosign verify` command, published as the latest release: `gh release create <version> --verify-tag --latest`."
        - label: "PR against `main` bumping both charts' `version` and `appVersion` to the next minor's `-dev` version (for example `0.6.0-dev` after `v0.5.0`). Not release-blocking: it keeps what `main` publishes sorting after this release, and the feature-gate removal rule compares against the chart `appVersion`."
        - label: "Link the tag and the release notes in this issue, then close it."
  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: "Paste the release's changelog section here so the issue is a self-contained record."
      render: markdown
