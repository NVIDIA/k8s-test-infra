# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod"
    target-branch: main
    directories:
    - "/"
    - "/tests/mocknvml"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
    - dependencies
    groups:
      kubernetes:
        patterns:
        - "k8s.io/*"
        - "sigs.k8s.io/*"
      grpc-protobuf:
        patterns:
        - "google.golang.org/grpc*"
        - "google.golang.org/protobuf*"
        - "google.golang.org/genproto*"
      go-dependencies:
        update-types:
        - "minor"
        - "patch"
        exclude-patterns:
        - "k8s.io/*"
        - "sigs.k8s.io/*"
        - "google.golang.org/grpc*"
        - "google.golang.org/protobuf*"
        - "google.golang.org/genproto*"

  - package-ecosystem: "github-actions"
    target-branch: main
    directories:
    - "/"
    - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
    - dependencies
    groups:
      github-actions:
        patterns: ["*"]


  - package-ecosystem: "docker"
    target-branch: main
    directories:
    # Golang version
    - "/deployments/devel"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
    - dependencies
    groups:
      docker-dependencies:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directory: "/docs/guides/install/aws/eks/terraform"
    target-branch: main
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
    - dependencies
    groups:
      terraform-dependencies:
        patterns: ["*"]
