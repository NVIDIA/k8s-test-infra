version: "2"

run:
  timeout: 5m
  # Lint tag-guarded sources too. Without these, `//go:build e2e` and
  # `//go:build integration` files are invisible to every lint invocation --
  # CI, `make lint`, and local runs alike -- which is how 14 findings
  # accumulated unnoticed in tests/e2e/go/. Declaring the tags here rather than
  # in the workflow keeps every invocation identical, so a clean tree locally
  # means a clean tree in CI.
  build-tags:
    - e2e
    - integration

linters:
  enable:
    - nolintlint
    - revive
    - staticcheck
    - asasalint
    - bodyclose
    - contextcheck
    - cyclop
    - dupword
    - errname
    - exhaustive
    - loggercheck
    - misspell
    - nestif
    - perfsprint
    - prealloc
    - predeclared
    - testifylint
    - unconvert
    - usestdlibvars

  settings:
    exhaustive:
      # Treat switches with a `default:` clause as exhaustive. NVML enums
      # (nvml.Return, nvml.ClockType, nvml.TemperatureThresholds, ...) each
      # carry 30+ values; enumerating them all defeats the point of a mock
      # that only implements the well-known cases and falls through the rest.
      default-signifies-exhaustive: true
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-QF*"
  exclusions:
    rules:
      # Ginkgo suites conventionally dot-import ginkgo and gomega, and
      # staticcheck already exempts _test.go files from ST1001 for exactly that
      # reason. The e2e suite keeps its scenario and suite helpers in plain .go
      # files guarded by `//go:build e2e`; they are test-only code in the same
      # package as the _test.go files beside them, and miss staticcheck's
      # carve-out purely on the filename. ST1001 stays enabled everywhere else.
      #
      # Anchored to files directly under tests/e2e/go/ so it covers the suite
      # itself and not its subpackages (assertions/, framework/..., ibutil/,
      # profile/), which are ordinary libraries with no reason to dot-import.
      - path: ^tests/e2e/go/[^/]+\.go$
        linters:
          - staticcheck
        text: "ST1001:"
      # Same carve-out as ST1001 but for revive's dot-imports rule: Ginkgo/Gomega
      # dot imports are the suite's conventional style. Anchored to files directly
      # under tests/e2e/go/ so subpackages (assertions/, framework/..., ibutil/,
      # profile/) still get the standard "no dot imports" gate.
      - path: ^tests/e2e/go/[^/]+\.go$
        linters:
          - revive
        text: 'should not use dot imports'

      # "long long" is a legitimate C type identifier — used in cgo blocks in
      # pkg/gpu/mocknvml/bridge/ and in the C-type switch in
      # cmd/generate-bridge/parser.go. Without this rule, golangci-lint --fix
      # collapses "long long" to "long" and breaks compile with duplicate switch
      # cases or an invalid C type.
      - linters:
          - dupword
        text: 'Duplicate words \(long\)'
      # The mocknvml/mockcuda packages deliberately mirror NVML/CUDA C API names
      # (GetBoardId, DeviceGetHandleByPciBusId, GetMemoryInfo_v2, TemperatureGPU_C,
      # ...) so ConfigurableDevice satisfies go-nvml's Device interface and the
      # YAML profiles read like their real NVML counterparts. Renaming these to
      # Go idiom (BoardID, GetMemoryInfoV2, TemperatureGPUC) would break the
      # interface and the profile schema.
      - path: ^pkg/gpu/mock(nvml|cuda)/
        linters:
          - revive
        text: 'var-naming'

issues:
  # Report every occurrence, not the first three. The default of 3 groups by
  # message text, so a finding repeated across many files is silently truncated:
  # this tree looked like it had 4 issues behind the e2e tag when it had 14, and
  # the discrepancy was invisible until the cap was lifted. Under-reporting a
  # gate is worse than a long log.
  max-same-issues: 0
  # Same reasoning for the per-linter cap (default 50): when revive or cyclop
  # report more than 50 findings, the tail is silently truncated and progress
  # on a cleanup pass looks stuck at 50 until every finding in the visible batch
  # is fixed AND the newly-uncapped ones come into view.
  max-issues-per-linter: 0
