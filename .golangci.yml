version: "2"

run:
  timeout: 5m
  # Lint tag-guarded sources too. Without these, `//go:build e2e` and
  # `//go:build integration` files are invisible to every lint invocation --
  # CI, `make lint`, and local runs alike -- which is how 14 findings
  # accumulated unnoticed in tests/e2e/go/. Declaring the tags here rather than
  # in the workflow keeps every invocation identical, so a clean tree locally
  # means a clean tree in CI.
  build-tags:
    - e2e
    - integration

linters:
  # dupword is deliberately NOT enabled. Its autofix breaks cgo codebase and produces too much false positives
  enable:
    - nolintlint
    - revive
    - staticcheck
    - asasalint
    - bodyclose
    - contextcheck
    - cyclop
    - errname
    - exhaustive
    - loggercheck
    - misspell
    - nestif
    - perfsprint
    - prealloc
    - predeclared
    - testifylint
    - unconvert
    - usestdlibvars

  settings:
    exhaustive:
      # Treat switches with a `default:` clause as exhaustive. NVML enums
      # (nvml.Return, nvml.ClockType, nvml.TemperatureThresholds, ...) each
      # carry 30+ values; enumerating them all defeats the point of a mock
      # that only implements the well-known cases and falls through the rest.
      default-signifies-exhaustive: true
    nolintlint:
      # allow-unused stays at its default (false): unused //nolint directives
      # elsewhere in the tree should still be flagged so stale silences get
      # cleaned up. The one legitimate cross-platform case (Rdev cast in
      # cmd/nvml-mock-nri/main.go) is handled via a path-scoped exclusion in
      # the `exclusions.rules` block below.
      require-specific: true
      require-explanation: true
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-QF*"
    testifylint:
      # enable-all opts every testifylint check on -- expected-actual,
      # require-error, error-nil, bool-compare, empty, len, formatter, the suite-*
      # family, etc. Defaults cover most of these already; making the choice
      # explicit prevents a quiet downgrade if a future edit drops the block, and
      # keeps the migration from plain t.Fatal/Errorf gated by the strongest
      # possible ruleset. The tree is clean under enable-all as of this commit.
      enable-all: true
  exclusions:
    rules:
      # Ginkgo suites conventionally dot-import ginkgo and gomega, and
      # staticcheck already exempts _test.go files from ST1001 for exactly that
      # reason. The e2e suite keeps its scenario and suite helpers in plain .go
      # files guarded by `//go:build e2e`; they are test-only code in the same
      # package as the _test.go files beside them, and miss staticcheck's
      # carve-out purely on the filename. ST1001 stays enabled everywhere else.
      #
      # Anchored to files directly under tests/e2e/go/ so it covers the suite
      # itself and not its subpackages (assertions/, framework/..., ibutil/,
      # profile/), which are ordinary libraries with no reason to dot-import.
      - path: ^tests/e2e/go/[^/]+\.go$
        linters:
          - staticcheck
        text: "ST1001:"
      # Same carve-out as ST1001 but for revive's dot-imports rule: Ginkgo/Gomega
      # dot imports are the suite's conventional style. Anchored to files directly
      # under tests/e2e/go/ so subpackages (assertions/, framework/..., ibutil/,
      # profile/) still get the standard "no dot imports" gate.
      - path: ^tests/e2e/go/[^/]+\.go$
        linters:
          - revive
        text: 'should not use dot imports'

      # The mocknvml/mockcuda packages deliberately mirror NVML/CUDA C API names
      # (GetBoardId, DeviceGetHandleByPciBusId, GetMemoryInfo_v2, TemperatureGPU_C,
      # ...) so ConfigurableDevice satisfies go-nvml's Device interface and the
      # YAML profiles read like their real NVML counterparts. Renaming these to
      # Go idiom (BoardID, GetMemoryInfoV2, TemperatureGPUC) would break the
      # interface and the profile schema.
      - path: ^pkg/gpu/mock(nvml|cuda)/
        linters:
          - revive
        text: 'var-naming'
      # cmd/nvml-mock-nri/main.go casts syscall.Stat_t.Rdev to uint64 — a no-op
      # on Linux (where Rdev is uint64) but required on Darwin (where Rdev is
      # int32). We //nolint:unconvert the two lines; on Darwin those directives
      # look "unused" to nolintlint, and its autofix would strip them and green
      # local `make lint-fix` at the cost of a red Linux CI. Scoping the "unused
      # directive" exclusion to just this file keeps stale nolints in the rest
      # of the tree flagged normally.
      - path: ^cmd/nvml-mock-nri/main\.go$
        linters:
          - nolintlint
        text: 'directive .* is unused'
      # pkg/gpu/allocwatch/podresources.go dials the kubelet pod-resources socket
      # with grpc.DialContext + grpc.WithBlock, both marked "Deprecated: ... Will
      # be supported throughout 1.x" by grpc-go. The blocking-with-timeout dial
      # they provide has no NewClient equivalent, and the //nolint:staticcheck
      # directives on those two lines are what keeps SA1019 quiet.
      #
      # Whether staticcheck actually raises SA1019 there is not stable across
      # analysis environments: the same commit, toolchain and linter version
      # reports it locally (directives used, tree clean) and does not report it
      # on the pull_request runner (directives unused, two nolintlint errors, a
      # red gate on every PR touching nothing near this file). Dropping the
      # directives just inverts which environment is red. Scoping the "unused
      # directive" tolerance to this one file keeps stale nolints flagged
      # everywhere else, exactly as the nvml-mock-nri carve-out above does.
      - path: ^pkg/gpu/allocwatch/podresources\.go$
        linters:
          - nolintlint
        text: 'directive .* is unused'

issues:
  # Report every occurrence, not the first three. The default of 3 groups by
  # message text, so a finding repeated across many files is silently truncated:
  # this tree looked like it had 4 issues behind the e2e tag when it had 14, and
  # the discrepancy was invisible until the cap was lifted. Under-reporting a
  # gate is worse than a long log.
  max-same-issues: 0
  # Same reasoning for the per-linter cap (default 50): when revive or cyclop
  # report more than 50 findings, the tail is silently truncated and progress
  # on a cleanup pass looks stuck at 50 until every finding in the visible batch
  # is fixed AND the newly-uncapped ones come into view.
  max-issues-per-linter: 0
