          1560, 1548, 1536, 1524, 1512, 1500, 1488, 1476, 1464, 1452, 1440, 1428,
          1416, 1404, 1392, 1380, 1368, 1356, 1344, 1332, 1320, 1308, 1296, 1284,
          1272, 1260, 1248, 1236, 1224, 1212, 1200, 1188, 1176, 1164, 1152, 1140,
          1128, 1116, 1104, 1092, 1080, 1068, 1056, 1044, 1032, 1020, 1008, 996,
          984, 972, 960, 948, 936, 924, 912, 900, 888, 876, 864, 852,
          840, 828, 816, 804, 792, 780, 768, 756, 744, 732, 720, 708,
          696, 684, 672, 660, 648, 636, 624, 612, 600, 588, 576, 564,
          552, 540, 528, 516, 504, 492, 480, 468, 456, 444, 432, 420,
          408, 396, 384, 372, 360, 348, 336, 324, 312, 300, 288, 276,
          264, 252, 240, 228, 216, 204, 192, 180, 168, 156, 144, 132,
          120
        ]
      - freq_mhz: 3996
        graphics_clocks: [
          2424, 2412, 2400, 2388, 2376, 2364, 2352, 2340, 2328, 2316, 2304, 2292,
          2280, 2268, 2256, 2244, 2232, 2220, 2208, 2196, 2184, 2172, 2160, 2148,
          2136, 2124, 2112, 2100, 2088, 2076, 2064, 2052, 2040, 2028, 2016, 2004,
