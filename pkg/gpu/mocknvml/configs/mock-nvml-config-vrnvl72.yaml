  # ---------------------------------------------------------------------------
  # Performance state
  # ---------------------------------------------------------------------------
  performance_state: "P0"

  # ---------------------------------------------------------------------------
  # Utilization (percentage, 0-100)
  # ---------------------------------------------------------------------------
  utilization:
    gpu: 0
    memory: 0
    encoder: 0
    decoder: 0
    jpeg: 0
    ofa: 0

  # ---------------------------------------------------------------------------
  # Dynamic utilization (#506)
  #
  # Live without any Helm overlay, so `utilization.gpu` -- and every
  # DCGM_FI_PROF_* fraction derived from it -- is never a constant 0.
  # The driver is elapsed time, NOT workload: these numbers move on a fully
  # idle node and do not rise under load. gpu_min is deliberately > 0 so
  # "utilization is reported" is a deterministic assertion, not a flaky one.
  # ---------------------------------------------------------------------------
  dynamic_metrics:
    utilization:
      pattern: "steady"
      gpu_min: 10
      gpu_max: 45
      memory_min: 5
      memory_max: 25

  # ---------------------------------------------------------------------------
  # Encoder/Decoder statistics
  # ---------------------------------------------------------------------------
  encoder_stats:
    session_count: 0
    average_fps: 0
    average_latency_us: 0

  fbc_stats:
    session_count: 0
    average_fps: 0
    average_latency_us: 0

  # ---------------------------------------------------------------------------
  # ECC configuration
  # ---------------------------------------------------------------------------
  ecc:
    mode_current: "enabled"
    mode_pending: "enabled"
    default_mode: "enabled"
    errors:
      volatile:
        single_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
        double_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
      aggregate:
        single_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
        double_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0

  # No retired_pages block: the tray retires no pages (it remaps rows), and
  # reports page retirement N/A.

  # ---------------------------------------------------------------------------
  # Remapped rows
  # ---------------------------------------------------------------------------
  remapped_rows:
    correctable: 0
    uncorrectable: 0
    pending: false
    failure_occurred: false
    # Bank remap availability: every bank still holds its full complement of
    # spare rows, as the idle tray reports.
    availability_histogram:
      max: 12096
      high: 0
      partial: 0
      low: 0
      none: 0

  # ---------------------------------------------------------------------------
  # Display configuration
  # ---------------------------------------------------------------------------
  display:
    mode: "enabled"                 # NVML reports the display mode on, inactive
    active: "disabled"

  # ---------------------------------------------------------------------------
  # Persistence mode
  # ---------------------------------------------------------------------------
  persistence_mode: "enabled"

  # ---------------------------------------------------------------------------
  # Compute mode
  # ---------------------------------------------------------------------------
  compute_mode: "default"

  # ---------------------------------------------------------------------------
  # Addressing mode: how the GPU reaches system memory (hmm, ats or none)
  # ---------------------------------------------------------------------------
  addressing_mode: "ats"           # Vera CPU: translated over NVLink-C2C
  egm: true                        # Extended GPU Memory, enabled on the captured tray

  # ---------------------------------------------------------------------------
  # MIG - capable and disabled. The profile table is a sibling file
  # (profiles/mig/vrnvl72.yaml in the chart).
  # ---------------------------------------------------------------------------
  mig:
    mode_current: "disabled"
    mode_pending: "disabled"
    max_gpu_instances: 7

  # No gpu_operation_mode block: the tray reports GOM N/A.

  # ---------------------------------------------------------------------------
  # Driver model (Windows only)
  # ---------------------------------------------------------------------------
  driver_model:
    current: "N/A"
    pending: "N/A"

  # ---------------------------------------------------------------------------
  # Accounting mode
  # ---------------------------------------------------------------------------
  accounting:
    mode: "disabled"
    buffer_size: 4000

  # ---------------------------------------------------------------------------
  # Virtualization
  # ---------------------------------------------------------------------------
  virtualization:
    mode: "none"
    host_vgpu_mode: "N/A"

  # ---------------------------------------------------------------------------
  # GSP Firmware
  # ---------------------------------------------------------------------------
  gsp_firmware:
    mode: "enabled"
    version: "615.71.09"

  # ---------------------------------------------------------------------------
  # Rubin features
  # ---------------------------------------------------------------------------
  features:
    transformer_engine: true        # 3rd gen Transformer Engine
    fp4_support: true               # NVFP4
    fp8_support: true
    nvlink_c2c: true                # NVLink-C2C to the Vera CPU, 1.8 TB/s

  # ---------------------------------------------------------------------------
  # Host CPU pairing (Vera Rubin superchip)
  # ---------------------------------------------------------------------------
  cpu:
    type: "vera"                    # NVLink-C2C attached Vera, not a PCIe host
    cores: 88                       # Vera: 88 custom Arm cores
    memory_gb: 1536                 # up to 1.5 TB LPDDR5X per Vera
    coherent_memory: true           # NVLink-C2C coherent memory

  # ---------------------------------------------------------------------------
  # Processes (empty at idle)
  # ---------------------------------------------------------------------------
  processes: []

# =============================================================================
# Device-specific overrides
#
# Four GPUs: one compute tray presents two Vera Rubin superchips (2 Vera CPUs,
# 4 Rubin GPUs) to one OS domain, and the rack's 72 GPUs are 18 such trays.
# The two GPUs of a superchip share a board serial. Each GPU sits behind its
# own root port in a non-zero PCI domain: 0002 on the first Vera's NUMA node,
# 000a on the second's. Minor numbers follow the device index on the captured
# tray; a second tray reported a different order, so consumers must read them
# from the driver.
# =============================================================================
devices:
  - index: 0
    uuid: "GPU-72000000-0000-0000-0000-000000000000"
    serial: "1650000000001"         # superchip board serial, shared with GPU 1
    pci:
      bus_id: "0002:81:00.0"
    minor_number: 0
    grace_cpu_pair: 0               # paired with Vera CPU 0
    platform:
      module_id: 1                  # ID of this GPU within the node

  - index: 1
    uuid: "GPU-72000000-0000-0000-0000-000000000001"
    serial: "1650000000001"
    pci:
      bus_id: "0002:C1:00.0"
    minor_number: 1
    grace_cpu_pair: 0
    platform:
      module_id: 2

  - index: 2
    uuid: "GPU-72000000-0000-0000-0000-000000000002"
    serial: "1650000000002"         # second superchip, shared with GPU 3
    pci:
      bus_id: "000A:81:00.0"
    minor_number: 2
    grace_cpu_pair: 1
    platform:
      module_id: 3

  - index: 3
    uuid: "GPU-72000000-0000-0000-0000-000000000003"
    serial: "1650000000002"
    pci:
      bus_id: "000A:E1:00.0"
    minor_number: 3
    grace_cpu_pair: 1
    platform:
      module_id: 4

# =============================================================================
# NVLink topology - NVLink 6: 36 links per GPU at 41 GB/s each, all through
# the switch trays, so `nvidia-smi topo -m` shows NV36 between every pair.
# =============================================================================
nvlink:
  version: 6
  links_per_gpu: 36
  bandwidth_per_link_mbps: 41000
  c2c_enabled: true                 # NVLink-C2C to the Vera CPU
  multi_node: true                  # NVLink spans nodes, so IMEX and ComputeDomains apply
  # The per-device NVML calls answer; nvidia-smi -gBwMode is not recognised.
  # The tray advertises modes 0, 4, ... 36; the engine accepts 0 to 4 only
  # (#1171), so the default set stands in for them.
  bw_mode:
    scope: device
  # Switches live in their own switch trays, so they have no PCI identity on
  # the compute tray; see the gb300 profile.
  switches:
    - bdf: "0000:01:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000000"
    - bdf: "0000:02:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000001"
    - bdf: "0000:03:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000002"
    - bdf: "0000:04:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000003"

# =============================================================================
# Scale-out network - 12 RDMA devices per tray, all RoCE: 8 ConnectX-9 ports
# at 200 Gb/s and 4 BlueField-4 ports at 400 Gb/s. A profile has one NIC
# type, so all 12 are modelled as ConnectX-9.
# =============================================================================
infiniband:
  enabled: true
  hca_type: "MT4133"                # ConnectX-9
  fw_version: "82.48.4222"
  hw_rev: "0x0"
  board_id: "MT_0000001658"
  link_layer: "Ethernet"
  rate_gbps: 200
  port_state: "ACTIVE"
  phys_state: "LinkUp"
  hcas_per_gpu: 3
  guid_prefix: "9b88c2:0301:ce"
  node_desc_template: "{node_name} mlx5_{idx}"

# =============================================================================
# PCIe topology: every GPU has its own host bridge, two per Vera NUMA node.
# =============================================================================
pcie_topology:
  root_complexes:
    - id: "pci0002:80"
      numa_node: 0
      devices:
        - "0002:81:00.0"
    - id: "pci0002:c0"
      numa_node: 0
      devices:
        - "0002:C1:00.0"
    - id: "pci000a:80"
      numa_node: 1
      devices:
        - "000A:81:00.0"
    - id: "pci000a:e0"
      numa_node: 1
      devices:
        - "000A:E1:00.0"
