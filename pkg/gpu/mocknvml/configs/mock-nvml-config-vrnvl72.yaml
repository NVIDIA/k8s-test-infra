# Mock NVML Configuration: VR NVL72 compute tray (Vera Rubin)
# One compute tray of a rack-scale system whose NVLink domain spans nodes:
# 2 Vera CPUs and 4 Rubin GPUs per tray, 18 trays per rack.
# Full configuration for nvidia-smi -x -q compatibility
# Use: export MOCK_NVML_CONFIG=/path/to/this/file.yaml
#
# Built from public documentation only (the DGX Vera Rubin NVL72 product page,
# NVIDIA's Rubin architecture and Kubernetes posts, the CUDA 13.4 notes). A
# value no public source states is inherited from the gb300 profile and marked
# "assumption"; anything else no source covers is left absent.

version: "1.0"

# =============================================================================
# System-level configuration
# =============================================================================
system:
  driver_version: "615.00.00"       # assumption: the 615 branch CUDA 13.4 ships with
  nvml_version: "13.615.00"
  cuda_version: "13.4"
  cuda_version_major: 13
  cuda_version_minor: 4

# =============================================================================
# Default device configuration (applied to all devices unless overridden)
# =============================================================================
device_defaults:
  # ---------------------------------------------------------------------------
  # Basic identification
  # ---------------------------------------------------------------------------
  # Early drivers carry no marketing name for the board, so NVML falls back
  # to the generic one.
  name: "NVIDIA Graphics Device"
  brand: "nvidia"
  serial: "1650000000001"
  board_part_number: "699-2G558-0000-000"   # assumption: the G558 board family
  vbios_version: "99.00.00.00.01"           # assumption

  # ---------------------------------------------------------------------------
  # Architecture - Rubin, compute capability 10.7 (sm_107). NVML reports the
  # Rubin architecture; consumers that map compute capability to a family by
  # its major number alone still name it Blackwell.
  # ---------------------------------------------------------------------------
  architecture: "rubin"
  compute_capability:
    major: 10
    minor: 7
  num_gpu_cores: 21632             # assumption: gb300's

  # ---------------------------------------------------------------------------
  # NVLink fabric (multi-node NVLink ComputeDomain). The clique_id / cluster_uuid below
  # are placeholder defaults; the topology-overlay step in the engine
  # rewrites them per-node based on the cluster-level topology ConfigMap
  # (set Helm value `topology.enabled=true`). Nodes that don't appear in
  # the topology fall through to these defaults, which is sufficient for
  # single-node experiments. See pkg/gpu/mocknvml/engine/fabric.go.
  # ---------------------------------------------------------------------------
  fabric:
    cluster_uuid: "00000000-0000-0000-0000-000000000001"
    clique_id: 0
    state: "auto"                   # couple GPU fabric registration to fake fabricmanager readiness
    # Health defaults to a healthy fabric (nvidia-smi -q reports Summary:
    # Healthy, Bandwidth: Full). Add a `health:` block to fault a specific
    # condition, or use `nvml-mock-ctl fabric-health` at runtime.
    # See docs/configuration.md#fabric-health.

  # ---------------------------------------------------------------------------
  # Platform identity — where this node sits in the NVL72 rack, which
  # nvidia-smi -q renders as its "Platform Info" block and rack-scale fault
  # correlation reads to turn a GPU fault into a physical location.
  #
  # Every field but module_id describes the node, so all its GPUs share them:
  # a node occupies one tray, in one slot, of one chassis. Only module_id
  # ("ID of this GPU within the node") is set per device below.
  #
  # slot_number counts switch trays as well as compute trays while tray_index
  # counts compute trays only, so slot runs ahead of tray for a tray sitting
  # above the rack's nine switch trays: compute tray 16 lands in slot 26.
  # ---------------------------------------------------------------------------
  platform:
    chassis_serial_number: "1820000000001"
    slot_number: 26
    tray_index: 16
    host_id: 1                      # the tray's OS domain; all its GPUs report it
    peer_type: "switch_connected"   # peers reached through the NVSwitch trays

  # ---------------------------------------------------------------------------
  # InfoROM versions
  # ---------------------------------------------------------------------------
  inforom:
    image_version: "G558.0000.00.01"  # assumption
    oem_object: "2.1"
    ecc_object: "7.20"
    pwr_object: "1.0"

  # ---------------------------------------------------------------------------
  # Memory configuration - 288 GB HBM4 per GPU (8 stacks, 12-Hi)
  # ---------------------------------------------------------------------------
  memory:
    total_bytes: 309237645312       # 288 GiB HBM4
    reserved_bytes: 1610612736      # assumption: gb300's ~1.5 GiB
    free_bytes: 307627032576        # total - reserved at idle
    used_bytes: 0
    memory_bus_width: 16384         # 8 HBM4 stacks x 2048 bits

  bar1_memory:
    total_bytes: 824633720832       # assumption: gb300's 768 GiB
    free_bytes: 824633720832
    used_bytes: 0

  # ---------------------------------------------------------------------------
  # PCI configuration. No public source gives the Rubin device ID; the board
  # word follows the Blackwell numbering and is an assumption.
  # ---------------------------------------------------------------------------
  pci:
    device_id: 0x300010DE           # assumption
    subsystem_id: 0x221A10DE        # assumption

  pcie:
    max_link_gen: 6                 # PCIe Gen6 x16
    current_link_gen: 6
    max_link_width: 16
    current_link_width: 16
    replay_counter: 0
    tx_throughput_kbps: 0
    rx_throughput_kbps: 0

  # ---------------------------------------------------------------------------
  # Power configuration. NVIDIA publishes no per-GPU limit; the 2.3 kW Max-P
  # figure comes from third-party reports and is an assumption, as are the
  # floor and idle draw. No workload power profiles: none are published.
  # ---------------------------------------------------------------------------
  power:
    management_supported: true
    management_mode: "enabled"
    default_limit_mw: 2300000       # assumption: 2300W Max-P
    enforced_limit_mw: 2300000
    min_limit_mw: 500000            # assumption: gb300's floor
    max_limit_mw: 2300000
    current_draw_mw: 175000         # assumption: gb300's idle draw
    power_state: "P0"
    total_energy_consumption_mj: 1000000  # millijoules since boot

  # ---------------------------------------------------------------------------
  # Thermal configuration (assumption: gb300's liquid-cooled envelope)
  # ---------------------------------------------------------------------------
  thermal:
    temperature_gpu_c: 38           # Idle temperature (liquid cooled)
    temperature_memory_c: 36
    shutdown_threshold_c: 95
    slowdown_threshold_c: 90
    max_operating_c: 85
    target_temperature_c: 85

  # ---------------------------------------------------------------------------
  # Fan configuration (N/A - liquid cooled)
  # ---------------------------------------------------------------------------
  fan:
    count: 0                        # Liquid cooled, no fans
    speed_percent: "N/A"
    target_speed_percent: "N/A"

  # ---------------------------------------------------------------------------
  # Clock speeds (MHz). Not published for Rubin; assumption: gb300's
  # ---------------------------------------------------------------------------
  clocks:
    graphics_current: 345           # Idle
    graphics_max: 2070              # Boost
    graphics_app: 2070
    graphics_app_default: 2070
    sm_current: 345
    sm_max: 2070
    memory_current: 3996            # HBM3e
    memory_max: 3996
    memory_app: 3996
    memory_app_default: 3996
    video_current: 1200
    video_max: 2200

  # ---------------------------------------------------------------------------
  # Clocks throttle reasons
  # ---------------------------------------------------------------------------
  clocks_throttle_reasons:
    gpu_idle: true
    applications_clocks_setting: false
    sw_power_cap: false
    hw_slowdown: false
    hw_thermal_slowdown: false
    hw_power_brake_slowdown: false
    sync_boost: false
    sw_thermal_slowdown: false
    display_clocks_setting: false

  # ---------------------------------------------------------------------------
  # Supported clocks (nvidia-smi -q -d SUPPORTED_CLOCKS). Assumption: the
  # gb300 table, consistent with the clocks above.
  # NVML returns both lists highest first, and nvidia-smi -ac accepts only a
  # memory/graphics pair listed here.
  # ---------------------------------------------------------------------------
  supported_clocks:
    memory_clocks:
      - freq_mhz: 3996
        graphics_clocks: [
          2070, 2062, 2055, 2047, 2040, 2032, 2025, 2017, 2010, 2002, 1995, 1987,
          1980, 1972, 1965, 1957, 1950, 1942, 1935, 1927, 1920, 1912, 1905, 1897,
          1890, 1882, 1875, 1867, 1860, 1852, 1845, 1837, 1830, 1822, 1815, 1807,
          1800, 1792, 1785, 1777, 1770, 1762, 1755, 1747, 1740, 1732, 1725, 1717,
          1710, 1702, 1695, 1687, 1680, 1672, 1665, 1657, 1650, 1642, 1635, 1627,
          1620, 1612, 1605, 1597, 1590, 1582, 1575, 1567, 1560, 1552, 1545, 1537,
          1530, 1522, 1515, 1507, 1500, 1492, 1485, 1477, 1470, 1462, 1455, 1447,
          1440, 1432, 1425, 1417, 1410, 1402, 1395, 1387, 1380, 1372, 1365, 1357,
          1350, 1342, 1335, 1327, 1320, 1312, 1305, 1297, 1290, 1282, 1275, 1267,
          1260, 1252, 1245, 1237, 1230, 1222, 1215, 1207, 1200, 1192, 1185, 1177,
          1170, 1162, 1155, 1147, 1140, 1132, 1125, 1117, 1110, 1102, 1095, 1087,
          1080, 1072, 1065, 1057, 1050, 1042, 1035, 1027, 1020, 1012, 1005, 997,
          990, 982, 975, 967, 960, 952, 945, 937, 930, 922, 915, 907,
          900, 892, 885, 877, 870, 862, 855, 847, 840, 832, 825, 817,
          810, 802, 795, 787, 780, 772, 765, 757, 750, 742, 735, 727,
          720, 712, 705, 697, 690, 682, 675, 667, 660, 652, 645, 637,
          630, 622, 615, 607, 600, 592, 585, 577, 570, 562, 555, 547,
          540, 532, 525, 517, 510, 502, 495, 487, 480, 472, 465, 457,
          450, 442, 435, 427, 420, 412, 405, 397, 390, 382, 375, 367,
          360, 352, 345, 337, 330, 322, 315, 307, 300, 292, 285, 277,
          270, 262, 255, 247, 240, 232, 225, 217, 210, 202, 195, 187,
          180, 172, 165, 157, 150, 142, 135, 127, 120
        ]

  # ---------------------------------------------------------------------------
  # Performance state
  # ---------------------------------------------------------------------------
  performance_state: "P0"

  # ---------------------------------------------------------------------------
  # Utilization (percentage, 0-100)
  # ---------------------------------------------------------------------------
  utilization:
    gpu: 0
    memory: 0
    encoder: 0
    decoder: 0
    jpeg: 0
    ofa: 0

  # ---------------------------------------------------------------------------
  # Dynamic utilization (#506)
  #
  # Live without any Helm overlay, so `utilization.gpu` -- and every
  # DCGM_FI_PROF_* fraction derived from it -- is never a constant 0.
  # The driver is elapsed time, NOT workload: these numbers move on a fully
  # idle node and do not rise under load. gpu_min is deliberately > 0 so
  # "utilization is reported" is a deterministic assertion, not a flaky one.
  # ---------------------------------------------------------------------------
  dynamic_metrics:
    utilization:
      pattern: "steady"
      gpu_min: 10
      gpu_max: 45
      memory_min: 5
      memory_max: 25

  # ---------------------------------------------------------------------------
  # Encoder/Decoder statistics
  # ---------------------------------------------------------------------------
  encoder_stats:
    session_count: 0
    average_fps: 0
    average_latency_us: 0

  fbc_stats:
    session_count: 0
    average_fps: 0
    average_latency_us: 0

  # ---------------------------------------------------------------------------
  # ECC configuration
  # ---------------------------------------------------------------------------
  ecc:
    mode_current: "enabled"
    mode_pending: "enabled"
    default_mode: "enabled"
    errors:
      volatile:
        single_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
        double_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
      aggregate:
        single_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0
        double_bit:
          device_memory: 0
          l1_cache: 0
          l2_cache: 0
          register_file: 0
          texture_memory: 0
          total: 0

  # ---------------------------------------------------------------------------
  # Retired pages
  # ---------------------------------------------------------------------------
  retired_pages:
    single_bit_retirement:
      count: 0
      addresses: []
    double_bit_retirement:
      count: 0
      addresses: []
    pending_blacklist: false
    pending_retirement: false

  # ---------------------------------------------------------------------------
  # Remapped rows
  # ---------------------------------------------------------------------------
  remapped_rows:
    correctable: 0
    uncorrectable: 0
    pending: false
    failure_occurred: false
    # Bank remap availability: every bank still holds its full complement of
    # spare rows. The bank count follows the 16-banks-per-GiB ratio a real
    # 40 GiB A100 reports (assumption).
    availability_histogram:
      max: 4608
      high: 0
      partial: 0
      low: 0
      none: 0

  # ---------------------------------------------------------------------------
  # Display configuration
  # ---------------------------------------------------------------------------
  display:
    mode: "disabled"
    active: "disabled"

  # ---------------------------------------------------------------------------
  # Persistence mode
  # ---------------------------------------------------------------------------
  persistence_mode: "enabled"

  # ---------------------------------------------------------------------------
  # Compute mode
  # ---------------------------------------------------------------------------
  compute_mode: "default"

  # ---------------------------------------------------------------------------
  # Addressing mode: how the GPU reaches system memory (hmm, ats or none)
  # ---------------------------------------------------------------------------
  addressing_mode: "ats"           # Vera CPU: translated over NVLink-C2C

  # ---------------------------------------------------------------------------
  # MIG: Rubin has MIG profiles, but no table is published, so none is
  # declared and the mock reports the board as not MIG-capable.
  # ---------------------------------------------------------------------------
  mig:
    mode_current: "disabled"
    mode_pending: "disabled"

  # ---------------------------------------------------------------------------
  # GPU operation mode (GOM)
  # ---------------------------------------------------------------------------
  gpu_operation_mode:
    current: "all_on"
    pending: "all_on"

  # ---------------------------------------------------------------------------
  # Driver model (Windows only)
  # ---------------------------------------------------------------------------
  driver_model:
    current: "N/A"
    pending: "N/A"

  # ---------------------------------------------------------------------------
  # Accounting mode
  # ---------------------------------------------------------------------------
  accounting:
    mode: "disabled"
    buffer_size: 4000

  # ---------------------------------------------------------------------------
  # Virtualization
  # ---------------------------------------------------------------------------
  virtualization:
    mode: "none"
    host_vgpu_mode: "N/A"

  # ---------------------------------------------------------------------------
  # GSP Firmware
  # ---------------------------------------------------------------------------
  gsp_firmware:
    mode: "enabled"
    version: "615.00.00"

  # ---------------------------------------------------------------------------
  # Rubin features
  # ---------------------------------------------------------------------------
  features:
    transformer_engine: true        # 3rd gen Transformer Engine
    fp4_support: true               # NVFP4
    fp8_support: true
    nvlink_c2c: true                # NVLink-C2C to the Vera CPU, 1.8 TB/s

  # ---------------------------------------------------------------------------
  # Host CPU pairing (Vera Rubin superchip)
  # ---------------------------------------------------------------------------
  cpu:
    type: "vera"                    # NVLink-C2C attached Vera, not a PCIe host
    cores: 88                       # Vera: 88 custom Arm cores
    memory_gb: 1536                 # up to 1.5 TB LPDDR5X per Vera
    coherent_memory: true           # NVLink-C2C coherent memory

  # ---------------------------------------------------------------------------
  # Processes (empty at idle)
  # ---------------------------------------------------------------------------
  processes: []

# =============================================================================
# Device-specific overrides
#
# Four GPUs: one compute tray presents two Vera Rubin superchips (2 Vera CPUs,
# 4 Rubin GPUs) to one OS domain, and the rack's 72 GPUs are 18 such trays.
# GPUs 0-1 sit on the first Vera's NUMA node, 2-3 on the second's. PCI
# addresses and minors are assumptions in the gb300 layout.
# =============================================================================
devices:
  - index: 0
    uuid: "GPU-72000000-0000-0000-0000-000000000000"
    serial: "1650000000001"         # superchip board serial, shared with GPU 1
    pci:
      bus_id: "0000:0A:00.0"
    minor_number: 0
    grace_cpu_pair: 0               # paired with Vera CPU 0
    platform:
      module_id: 1                  # ID of this GPU within the node

  - index: 1
    uuid: "GPU-72000000-0000-0000-0000-000000000001"
    serial: "1650000000001"
    pci:
      bus_id: "0000:0B:00.0"
    minor_number: 1
    grace_cpu_pair: 0
    platform:
      module_id: 2

  - index: 2
    uuid: "GPU-72000000-0000-0000-0000-000000000002"
    serial: "1650000000002"         # second superchip, shared with GPU 3
    pci:
      bus_id: "0000:4A:00.0"
    minor_number: 2
    grace_cpu_pair: 1
    platform:
      module_id: 3

  - index: 3
    uuid: "GPU-72000000-0000-0000-0000-000000000003"
    serial: "1650000000002"
    pci:
      bus_id: "0000:4B:00.0"
    minor_number: 3
    grace_cpu_pair: 1
    platform:
      module_id: 4

# =============================================================================
# NVLink topology - NVLink 6, 3.6 TB/s per GPU. The link count is not
# published; assumption: NVLink 5's 18 links at twice the per-link rate.
# =============================================================================
nvlink:
  version: 6
  links_per_gpu: 18
  bandwidth_per_link_mbps: 106250   # assumption: 2x NVLink5; 18 links ~= 1.9 TB/s/GPU per direction
  c2c_enabled: true                 # NVLink-C2C to the Vera CPU
  multi_node: true                  # NVLink spans nodes, so IMEX and ComputeDomains apply
  bw_mode:
    scope: device                   # assumption: as on Blackwell
  # Switches live in their own switch trays, so they have no PCI identity on
  # the compute tray; see the gb300 profile.
  switches:
    - bdf: "0000:01:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000000"
    - bdf: "0000:02:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000001"
    - bdf: "0000:03:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000002"
    - bdf: "0000:04:00.0"
      uuid: "NVSwitch-VR-0000-0000-0000-000000000003"

# =============================================================================
# Scale-out network - ConnectX-9 SuperNICs, 1.6 Tb/s per GPU: two 800 Gb/s
# NICs per GPU. The PCI identity and firmware are assumptions.
# =============================================================================
infiniband:
  enabled: true
  hca_type: "MT4133"                # assumption
  fw_version: "40.47.1000"          # assumption
  hw_rev: "0x0"
  board_id: "MT_0000001093"         # assumption
  link_layer: "InfiniBand"
  rate_gbps: 800
  port_state: "ACTIVE"
  phys_state: "LinkUp"
  hcas_per_gpu: 2
  guid_prefix: "9b88c2:0301:ce"
  node_desc_template: "{node_name} mlx5_{idx}"

# =============================================================================
# PCIe topology: one root complex per Vera + 2 Rubin superchip, NUMA-aligned.
# =============================================================================
pcie_topology:
  root_complexes:
    - id: "pci0000:00"
      numa_node: 0
      devices:
        - "0000:0A:00.0"
        - "0000:0B:00.0"
    - id: "pci0000:40"
      numa_node: 1
      devices:
        - "0000:4A:00.0"
        - "0000:4B:00.0"
