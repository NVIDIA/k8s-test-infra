# Mock NVML Configuration: VR NVL72 compute tray (Vera Rubin)
# One compute tray of a rack-scale system whose NVLink domain spans nodes:
# 2 Vera CPUs and 4 Rubin GPUs per tray, 18 trays per rack.
# Full configuration for nvidia-smi -x -q compatibility
# Use: export MOCK_NVML_CONFIG=/path/to/this/file.yaml
#
# Values are read off a real tray on driver 615.71.09 (nvidia-smi -q -x, an
# NVML dump, sysfs and the node's Kubernetes labels); identifiers (serials,
# UUIDs) are placeholders. The Vera CPU block comes from public documentation.

version: "1.0"

# =============================================================================
# System-level configuration
# =============================================================================
system:
  driver_version: "615.71.09"
  nvml_version: "13.615.71.09"
  cuda_version: "13.4"
  cuda_version_major: 13
  cuda_version_minor: 4
  # DMI product name; GPU Feature Discovery labels it nvidia.com/gpu.machine
  # (VR-NVL72), where the other profiles fall back to the GPU name.
  product_name: "VR NVL72"
  # Checked against a real tray: a feature this profile leaves out answers
  # NOT_SUPPORTED (N/A), as the tray does, on any driver.
  absent_features: not_supported

# =============================================================================
# Default device configuration (applied to all devices unless overridden)
# =============================================================================
device_defaults:
  # ---------------------------------------------------------------------------
  # Basic identification
  # ---------------------------------------------------------------------------
  # Early drivers carry no marketing name for the board, so NVML falls back
  # to the generic one.
  name: "NVIDIA Graphics Device"
  brand: "nvidia"
  serial: "1650000000001"
  board_part_number: "699-2G558-0201-TS5"
  vbios_version: "99.00.16.55.13"

  # ---------------------------------------------------------------------------
  # Architecture - Rubin, compute capability 10.7 (sm_107). NVML reports the
  # Rubin architecture; consumers that map compute capability to a family by
  # its major number alone still name it Blackwell.
  # ---------------------------------------------------------------------------
  architecture: "rubin"
  compute_capability:
    major: 10
    minor: 7
  num_gpu_cores: 27136

  # ---------------------------------------------------------------------------
  # NVLink fabric (multi-node NVLink ComputeDomain). The clique_id / cluster_uuid below
  # are placeholder defaults; the topology-overlay step in the engine
  # rewrites them per-node based on the cluster-level topology ConfigMap
  # (set Helm value `topology.enabled=true`). Nodes that don't appear in
  # the topology fall through to these defaults, which is sufficient for
  # single-node experiments. See pkg/gpu/mocknvml/engine/fabric.go.
  # ---------------------------------------------------------------------------
  fabric:
    cluster_uuid: "00000000-0000-0000-0000-000000000001"
    clique_id: 65534                # what the captured tray reports
    state: "auto"                   # couple GPU fabric registration to fake fabricmanager readiness
    # Health defaults to a healthy fabric (nvidia-smi -q reports Summary:
    # Healthy, Bandwidth: Full). Add a `health:` block to fault a specific
    # condition, or use `nvml-mock-ctl fabric-health` at runtime.
    # See docs/configuration.md#fabric-health.

  # ---------------------------------------------------------------------------
  # Platform identity — where this node sits in the NVL72 rack, which
  # nvidia-smi -q renders as its "Platform Info" block and rack-scale fault
  # correlation reads to turn a GPU fault into a physical location.
  #
  # Every field but module_id describes the node, so all its GPUs share them:
  # a node occupies one tray, in one slot, of one chassis. Only module_id
  # ("ID of this GPU within the node") is set per device below.
  #
  # slot_number counts switch trays as well as compute trays while tray_index
  # counts compute trays only, so the two can differ: the captured tray
  # reports slot 4, tray index 3.
  # ---------------------------------------------------------------------------
  platform:
    chassis_serial_number: "1820000000001"
    slot_number: 4
    tray_index: 3
    host_id: 1                      # the tray's OS domain; all its GPUs report it
    peer_type: "switch_connected"   # peers reached through the NVSwitch trays

  # ---------------------------------------------------------------------------
  # InfoROM versions. No power-management object: the tray reports N/A.
  # ---------------------------------------------------------------------------
  inforom:
    image_version: "G558.0200.00.02"
    oem_object: "2.1"
    ecc_object: "7.16"

  # ---------------------------------------------------------------------------
  # Memory configuration - 288 GB HBM4 per GPU, of which the driver exposes
  # 286524 MiB
  # ---------------------------------------------------------------------------
  memory:
    total_bytes: 300442189824       # 286524 MiB
    reserved_bytes: 1339031552      # 1277 MiB
    free_bytes: 299103158272        # total - reserved at idle
    used_bytes: 0
    memory_bus_width: 16128

  bar1_memory:
    total_bytes: 549755813888       # 512 GiB
    free_bytes: 549755813888
    used_bytes: 0

  # ---------------------------------------------------------------------------
  # PCI configuration
  # ---------------------------------------------------------------------------
  pci:
    device_id: 0x304110DE
    subsystem_id: 0x221A10DE

  pcie:
    max_link_gen: 6                 # PCIe Gen6 x16
    current_link_gen: 6
    max_link_width: 16
    current_link_width: 2           # the tray trains its links at x2 when idle
    replay_counter: 0
    tx_throughput_kbps: 0
    rx_throughput_kbps: 0

  # ---------------------------------------------------------------------------
  # Power configuration. Workload power profiles are left absent: the tray
  # reports none requested and the capture does not list the supported set.
  # ---------------------------------------------------------------------------
  power:
    management_supported: true
    management_mode: "enabled"
    default_limit_mw: 2300000       # 2300W
    enforced_limit_mw: 2300000
    min_limit_mw: 200000            # 200W
    max_limit_mw: 2300000
    current_draw_mw: 418000         # 418W idle (liquid cooled)
    power_state: "P0"
    total_energy_consumption_mj: 1000000  # millijoules since boot

  # ---------------------------------------------------------------------------
  # Thermal configuration, from one base so the absolute thresholds and the
  # T.Limit view agree. From the NVML dump of the captured tray:
  #   base = max over GPUs of GetTemperature + GetMarginTemperature = 87 C
  #   (34+53, 33+54, 33+53, 34+53), the max operating limit (T.Limit 0).
  #   Distances above it: shutdown -5, slowdown -2 (fields 193, 194).
  # The driver returns max operating for GetTemperatureThreshold(SLOWDOWN)
  # and slowdown for (GPU_MAX), and the mock maps these keys to those calls
  # as is. The raw values the snapshot recorded are shutdown:93 / slowdown:88 /
  # max_operating:90. The snapshot makes one NVML call at a time and the
  # temperature moves between calls, so the base it implies is off by a
  # degree; the profile uses 92 / 87 / 89 so the absolute and T.Limit values
  # agree. No memory sensor and no target temperature: the tray reports N/A
  # for both.
  # ---------------------------------------------------------------------------
  thermal:
    temperature_gpu_c: 34           # idle (liquid cooled), GPU 0 of the dump
    shutdown_threshold_c: 92        # base + 5
    slowdown_threshold_c: 87        # base: what the driver returns for SLOWDOWN
    max_operating_c: 89             # base + 2: what the driver returns for GPU_MAX
    tlimit:
      reference_c: 87               # base; T.Limit Temp = 87 - 34 = 53
      shutdown_c: -5
      slowdown_c: -2
      max_operating_c: 0

  # ---------------------------------------------------------------------------
  # Fan configuration (N/A - liquid cooled)
  # ---------------------------------------------------------------------------
  fan:
    count: 0                        # Liquid cooled, no fans
    speed_percent: "N/A"
    target_speed_percent: "N/A"

  # ---------------------------------------------------------------------------
  # Clock speeds (MHz)
  # ---------------------------------------------------------------------------
  clocks:
    graphics_current: 120           # idle
    graphics_max: 2424
    graphics_app: 2424
    graphics_app_default: 2424
    sm_current: 120
    sm_max: 2424
    memory_current: 4752            # HBM4
    memory_max: 4752
    memory_app: 4752
    memory_app_default: 4752
    video_current: 744
    video_max: 2412

  # ---------------------------------------------------------------------------
  # Clocks throttle reasons
  # ---------------------------------------------------------------------------
  clocks_throttle_reasons:
    gpu_idle: true
    applications_clocks_setting: false
    sw_power_cap: false
    hw_slowdown: false
    hw_thermal_slowdown: false
    hw_power_brake_slowdown: false
    sync_boost: false
    sw_thermal_slowdown: false
    display_clocks_setting: false

  # ---------------------------------------------------------------------------
  # Supported clocks (nvidia-smi -q -d SUPPORTED_CLOCKS), copied from the
  # captured tray; every GPU reports the same table, highest first.
  # ---------------------------------------------------------------------------
  supported_clocks:
    memory_clocks:
      - freq_mhz: 4752
        graphics_clocks: [
          2424, 2412, 2400, 2388, 2376, 2364, 2352, 2340, 2328, 2316, 2304, 2292,
          2280, 2268, 2256, 2244, 2232, 2220, 2208, 2196, 2184, 2172, 2160, 2148,
          2136, 2124, 2112, 2100, 2088, 2076, 2064, 2052, 2040, 2028, 2016, 2004,
          1992, 1980, 1968, 1956, 1944, 1932, 1920, 1908, 1896, 1884, 1872, 1860,
