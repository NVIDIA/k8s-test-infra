    single_bit_retirement:
      count: 0
      addresses: []
    double_bit_retirement:
      count: 0
      addresses: []
    pending_blacklist: false
    pending_retirement: false

  # ---------------------------------------------------------------------------
  # Remapped rows
  # ---------------------------------------------------------------------------
  remapped_rows:
    correctable: 0
    uncorrectable: 0
    pending: false
    failure_occurred: false

  # ---------------------------------------------------------------------------
  # Display configuration
  # ---------------------------------------------------------------------------
  display:
    mode: "disabled"
    active: "disabled"

  # ---------------------------------------------------------------------------
  # Persistence mode
  # ---------------------------------------------------------------------------
  persistence_mode: "enabled"

  # ---------------------------------------------------------------------------
  # Compute mode
  # ---------------------------------------------------------------------------
  compute_mode: "default"

  # ---------------------------------------------------------------------------
  # MIG configuration
  # ---------------------------------------------------------------------------
  mig:
    mode_current: "disabled"
    mode_pending: "disabled"
    max_gpu_instances: 7
    # H100 shares the A100's reported profile IDs: the numbering follows the
    # partition's fraction of the board, not the board's capacity.
    profile_ids: "7_slice"
    # NVIDIA MIG user guide, Supported MIG Profiles, Table 10 (H100 80GB,
    # PCIe and SXM5). nvml_profile binds each row to the NVML enum the mock
    # keys on. NVIDIA publishes the slice placements below only as diagrams,
    # so they are transcribed from the layout those diagrams show.
    #
    # Every row declares its full geometry. `slices` restates the width the
    # nvml_profile enum already spans so load can reconcile the two rather
    # than trust either. `placements` are in *memory units*, not compute
    # slices: a 7-slice board has eight units, so a 1g row is eight starts of
    # size 1 and the full-board row is one `{start: 0, size: 8}`.
    # `compute_instances` is the row's `mig -lcip` listing, and its engine
    # counts are NVML's Shared* fields, which repeat the GPU instance's.
    supported_profiles:
      - name: "1g.10gb"
        nvml_profile: "1_SLICE"
        instances: 7
        memory_mb: 10240
        multiprocessors: 16
        copy_engines: 1
        decoders: 1
        jpeg: 1
        slices: 1
        profile_id: 19
        placements:
          - {start: 0, size: 1}
          - {start: 1, size: 1}
          - {start: 2, size: 1}
          - {start: 3, size: 1}
          - {start: 4, size: 1}
          - {start: 5, size: 1}
          - {start: 6, size: 1}
        compute_instances:
