            slices: 1
            instances: 1
            multiprocessors: 16
            shared_copy_engines: 1
            decoders: 1
            jpeg: 1
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 1
            multiprocessors: 16
            shared_copy_engines: 1
            decoders: 1
            jpeg: 1
      - name: "1g.10gb+me"
