# =============================================================================
# NVLink topology - H100 NVLink 4
# =============================================================================
nvlink:
  version: 4
  links_per_gpu: 18
  bandwidth_per_link_mbps: 26562    # NVLink4 26.562 GB/s/link unidirectional (`nvlink -s`); 18 links ~= 478 GB/s/GPU (900 GB/s bidir)
  c2c_enabled: false                # no Grace C2C on HGX H100
  # Switch-link auto-expansion: switches declared + links_per_gpu > 0 (and no
  # explicit per-device links) makes the engine synthesize 18 active links per
  # GPU fanned round-robin across these NVSwitches, yielding NV18 all-to-all in
  # `nvidia-smi topo -m`. HGX H100 couples fabric-manager readiness via
  # device_defaults.fabric.state: auto.
  switches:
    - bdf: "0000:05:00.0"
      uuid: "NVSwitch-H100-0000-0000-0000-000000000000"
    - bdf: "0000:06:00.0"
      uuid: "NVSwitch-H100-0000-0000-0000-000000000001"
    - bdf: "0000:07:00.0"
      uuid: "NVSwitch-H100-0000-0000-0000-000000000002"
    - bdf: "0000:08:00.0"
      uuid: "NVSwitch-H100-0000-0000-0000-000000000003"

# =============================================================================
# PCIe topology - HGX H100, 2 NUMA nodes, 4 GPUs each.
# Consumed by `render-pci-sysfs` to materialize a fake /sys/bus/pci tree
# under MOCK_PCI_ROOT. C consumers such as `lspci` resolve the PCIe root
# complex through these symlinks. The NVIDIA DRA driver does NOT: it is a
# Go binary, and Go's os package issues raw syscalls that the LD_PRELOAD
# shim cannot intercept, so `dra.k8s.io/pcieRoot` stays absent from the
# ResourceSlices it publishes. See issue #265.
# =============================================================================
pcie_topology:
  root_complexes:
    - id: "pci0000:00"
      numa_node: 0
      devices:
        - "0000:1A:00.0"
        - "0000:1B:00.0"
        - "0000:4A:00.0"
        - "0000:4B:00.0"
    - id: "pci0000:80"
      numa_node: 1
      devices:
        - "0000:8A:00.0"
        - "0000:8B:00.0"
        - "0000:CA:00.0"
        - "0000:CB:00.0"
