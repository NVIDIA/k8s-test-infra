# =============================================================================
# NVLink topology - B200 NVLink 5 (GPU-to-GPU only, no C2C)
# =============================================================================
nvlink:
  version: 5
  links_per_gpu: 18
  bandwidth_per_link_mbps: 53125    # NVLink5 53.125 GB/s/link unidirectional (`nvlink -s`); 18 links ~= 0.95 TB/s/GPU (1.8 TB/s bidir)
  c2c_enabled: false                # no Grace C2C
  # Bandwidth mode answers on the per-device trio, nvmlDeviceGet/SetNvlinkBwMode;
  # the node-wide pair `nvidia-smi nvlink -gBwMode` calls reports it unsupported,
  # as a real GB300 does.
  bw_mode:
    scope: device
  # Standalone B200: negative-control profile -- no NVSwitch, no fabricmanager.
  # topo -m shows PCIe paths only (no NV#); nvmlDeviceGetGpuFabricInfo returns
  # NOT_SUPPORTED.

# =============================================================================
# PCIe topology - B200, 2 NUMA nodes, 4 GPUs each.
# Consumed by `render-pci-sysfs` to materialize a fake /sys/bus/pci tree
# under MOCK_PCI_ROOT. C consumers such as `lspci` resolve the PCIe root
# complex through these symlinks. The NVIDIA DRA driver does NOT: it is a
# Go binary, and Go's os package issues raw syscalls that the LD_PRELOAD
# shim cannot intercept, so `dra.k8s.io/pcieRoot` stays absent from the
# ResourceSlices it publishes. See issue #265.
# =============================================================================
pcie_topology:
  root_complexes:
    - id: "pci0000:00"
      numa_node: 0
      devices:
        - "0000:1A:00.0"
        - "0000:1B:00.0"
        - "0000:4A:00.0"
        - "0000:4B:00.0"
    - id: "pci0000:80"
      numa_node: 1
      devices:
        - "0000:8A:00.0"
        - "0000:8B:00.0"
        - "0000:CA:00.0"
        - "0000:CB:00.0"
