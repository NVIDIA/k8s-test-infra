    single_bit_retirement:
      count: 0
      addresses: []
    double_bit_retirement:
      count: 0
      addresses: []
    pending_blacklist: false
    pending_retirement: false

  # ---------------------------------------------------------------------------
  # Remapped rows
  # ---------------------------------------------------------------------------
  remapped_rows:
    correctable: 0
    uncorrectable: 0
    pending: false
    failure_occurred: false

  # ---------------------------------------------------------------------------
  # Display configuration
  # ---------------------------------------------------------------------------
  display:
    mode: "disabled"                # No display output on A100
    active: "disabled"

  # ---------------------------------------------------------------------------
  # Persistence mode
  # ---------------------------------------------------------------------------
  persistence_mode: "enabled"       # Typically enabled on servers

  # ---------------------------------------------------------------------------
  # Compute mode
  # ---------------------------------------------------------------------------
  compute_mode: "default"           # default, exclusive_thread, prohibited, exclusive_process

  # ---------------------------------------------------------------------------
  # MIG configuration
  # ---------------------------------------------------------------------------
  mig:
    mode_current: "disabled"
    mode_pending: "disabled"
    max_gpu_instances: 7            # A100 supports up to 7 MIG instances
    # NVIDIA MIG user guide, Supported MIG Profiles, Table 12
    # (A100-SXM4-40GB). nvml_profile binds each row to the NVML enum the mock
    # keys on.
    #
    # Every row declares its full geometry. `slices` restates the width the
    # nvml_profile enum already spans so load can reconcile the two rather
    # than trust either. `placements` are in *memory units*, not compute
    # slices: a 7-slice board has eight units, so a 1g row is seven starts of
    # size 1 and the full-board row is one `{start: 0, size: 8}`.
    # `compute_instances` is the row's `mig -lcip` listing, and its engine
    # counts are NVML's Shared* fields, which repeat the GPU instance's.
    supported_profiles:
      - name: "1g.5gb"
        nvml_profile: "1_SLICE"
        slices: 1
        profile_id: 19
        instances: 7
        # Not 5120. A slice holds an eighth of a 40 GiB board, and the "5gb"
        # in the name is that eighth rounded for display. The raw allocation
        # is what NVML reports and what -lgip prints as 4.75 GiB.
        memory_mb: 4864
        multiprocessors: 14
        copy_engines: 1
        placements:
          - {start: 0, size: 1}
          - {start: 1, size: 1}
          - {start: 2, size: 1}
          - {start: 3, size: 1}
          - {start: 4, size: 1}
          - {start: 5, size: 1}
          - {start: 6, size: 1}
        compute_instances:
          - nvml_profile: "1_SLICE"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
      - name: "1g.5gb+me"
