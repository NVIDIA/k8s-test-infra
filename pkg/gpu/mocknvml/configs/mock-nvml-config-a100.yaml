          - {start: 3, size: 1}
          - {start: 4, size: 1}
          - {start: 5, size: 1}
          - {start: 6, size: 1}
        compute_instances:
          - nvml_profile: "1_SLICE"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
            decoders: 1
            jpeg: 1
            ofa: 1
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
            decoders: 1
            jpeg: 1
            ofa: 1
      - name: "1g.10gb"
