# MIG profile table: GB200 NVL72
#
# The board's MIG partition geometry, held apart from its profile so the
# profile stays readable. Resolved at load time via MOCK_MIG_PROFILES_CONFIG
# or as a sibling of the config path, and attached to
# device_defaults.mig.supported_profiles.

version: 1

# NVIDIA's MIG user guide has no GB200 table. The names come from the
# gpu-operator default mig-parted config
# (assets/state-mig-manager/0400_configmap.yaml), which keys GB200 HGX by
# PCI device 0x294110DE and lists 1g.23gb, 2g.47gb and 3g.93gb. Those are
# the eighths of a 186 GiB board, which is what this profile declares, so
# every memory_mb below is an exact multiple of 190464/8 MiB.
#
# Engine counts stay B200's (Table 5). With no published GB200 table they
# are the defensible proxy: same architecture, same slice geometry.
#
# Every row declares its full geometry. `slices` restates the width the
# nvml_profile enum already spans so load can reconcile the two rather
# than trust either. `placements` are in *memory units*, not compute
# slices: a 7-slice board has eight units, so a 1g row is seven starts of
# size 1 and the full-board row is one `{start: 0, size: 8}`.
# `compute_instances` is the row's `mig -lcip` listing, and its engine
# counts are NVML's Shared* fields, which repeat the GPU instance's.
supported_profiles:
  - name: "1g.23gb"
    nvml_profile: "1_SLICE"
    slices: 1
    profile_id: 0
    instances: 7
    memory_mb: 23808
    multiprocessors: 18
    copy_engines: 2
    decoders: 1
    jpeg: 1
    placements:
      - {start: 0, size: 1}
      - {start: 1, size: 1}
      - {start: 2, size: 1}
      - {start: 3, size: 1}
      - {start: 4, size: 1}
      - {start: 5, size: 1}
      - {start: 6, size: 1}
    compute_instances:
      - nvml_profile: "1_SLICE"
        slices: 1
        instances: 1
        multiprocessors: 18
        shared_copy_engines: 2
        decoders: 1
        jpeg: 1
      - nvml_profile: "1_SLICE_REV1"
        slices: 1
        instances: 1
        multiprocessors: 18
        shared_copy_engines: 2
        decoders: 1
        jpeg: 1
