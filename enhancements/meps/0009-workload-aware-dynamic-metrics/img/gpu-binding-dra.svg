<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 814" width="1000" height="814" role="img" aria-labelledby="title desc">
  <title id="title">Pod-to-GPU binding with DRA</title>
  <desc id="desc">NVIDIA's DRA driver lists the GPUs through Mokka's NVML engine, which reports UUIDs and minor numbers, and publishes this Node's ResourceSlice to kube-apiserver with devices gpu-0 to gpu-3, named by minor number. kube-scheduler reads the slices and the pod's claim, picks a free device that fits the claim, such as gpu-2, allocates it in the claim and binds the pod to this Node. The kubelet's DRA manager gets the pod and its claim and calls NodePrepareResources on the driver, which returns a CDI device for the claim. Every 2 seconds, the workload tracker sidecar calls List on the kubelet's PodResources API, which returns each pod and container with the driver, pool and device gpu-2; the tracker matches gpu-2 to the GPU with minor number 2 and marks that GPU busy in the NVML engine. Teal marks the workload tracker's steps.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d1d9e0; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 13px; font-weight: 600; }
    .b { font-size: 12px; fill: #59636e; }
    .c { font-size: 12.5px; }
    .msg, .sub { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .msg { font-size: 12.5px; }
    .sub { font-size: 12px; fill: #59636e; }
    .in { stroke: #ecf7f8; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .life { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 4; }
    .note { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1; }
    .wire { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .reply { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .loop { fill: #ecf7f8; stroke: #0a7782; stroke-width: 1.5; }
    .tag { fill: #0a7782; }
    .tagtext { font-size: 12px; font-weight: 600; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #3d444d; }
      text { fill: #f0f6fc; }
      .b, .sub { fill: #9198a1; }
      .msg, .sub { stroke: #0d1117; }
      .in { stroke: #112329; }
      .box { fill: #0d1117; stroke: #f0f6fc; }
      .life { stroke: #6e7681; }
      .note { fill: #151b23; stroke: #6e7681; }
      .wire, .reply { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .loop { fill: #112329; stroke: #39c5cf; }
      .tag { fill: #39c5cf; }
      .tagtext { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="999" height="813" rx="12"/>

  <!-- The workload tracker's steps, repeated every 2 seconds -->
  <rect class="loop" x="379" y="589" width="595" height="185" rx="8"/>

  <!-- Participants and their lifelines -->
  <path class="life" d="M97,72 V792"/>
  <path class="life" d="M258,72 V792"/>
  <path class="life" d="M419,72 V792"/>
  <path class="life" d="M581,72 V792"/>
  <path class="life" d="M742,72 V792"/>
  <path class="life" d="M903,72 V792"/>
  <rect class="box" x="24" y="20" width="146" height="52" rx="8"/>
  <text class="t" x="97" y="41" text-anchor="middle">kube-scheduler</text>
  <text class="b" x="97" y="58" text-anchor="middle">picks Node and device</text>
  <rect class="box" x="185" y="20" width="146" height="52" rx="8"/>
  <text class="t" x="258" y="41" text-anchor="middle">kube-apiserver</text>
  <text class="b" x="258" y="58" text-anchor="middle">slices and claims</text>
  <rect class="box" x="346" y="20" width="146" height="52" rx="8"/>
  <text class="t" x="419" y="41" text-anchor="middle">kubelet</text>
  <text class="b" x="419" y="58" text-anchor="middle">DRA manager</text>
  <rect class="box" x="508" y="20" width="146" height="52" rx="8"/>
  <text class="t" x="581" y="41" text-anchor="middle">NVIDIA DRA driver</text>
  <text class="b" x="581" y="58" text-anchor="middle">real, on Mokka's NVML</text>
  <rect class="box" x="669" y="20" width="146" height="52" rx="8"/>
  <text class="t" x="742" y="41" text-anchor="middle">NVML engine</text>
  <text class="b" x="742" y="58" text-anchor="middle">GPUs from the profile</text>
  <rect class="box" x="830" y="20" width="146" height="52" rx="8"/>
  <text class="t" x="903" y="41" text-anchor="middle">workload tracker</text>
  <text class="b" x="903" y="58" text-anchor="middle">sidecar</text>

  <!-- Messages: solid calls, dashed replies -->
  <path class="wire" d="M581,122 H742" marker-end="url(#arrow)"/>
  <text class="msg" x="661.5" y="98" text-anchor="middle">lists the GPUs</text>
  <text class="msg" x="661.5" y="113" text-anchor="middle">through NVML</text>
  <path class="reply" d="M742,172 H581" marker-end="url(#arrow)"/>
  <text class="msg" x="661.5" y="148" text-anchor="middle">UUIDs and</text>
  <text class="msg" x="661.5" y="163" text-anchor="middle">minor numbers</text>
  <path class="wire" d="M581,222 H258" marker-end="url(#arrow)"/>
  <text class="msg" x="419.5" y="198" text-anchor="middle">publishes this Node's ResourceSlice:</text>
  <text class="sub" x="419.5" y="213" text-anchor="middle"><tspan class="mono">gpu-0</tspan> … <tspan class="mono">gpu-3</tspan>, named by minor number</text>
  <path class="reply" d="M258,272 H97" marker-end="url(#arrow)"/>
  <text class="msg" x="177.5" y="248" text-anchor="middle">the slices,</text>
  <text class="msg" x="177.5" y="263" text-anchor="middle">the pod's claim</text>
  <path class="wire" d="M97,397 H258" marker-end="url(#arrow)"/>
  <text class="msg" x="177.5" y="373" text-anchor="middle">allocates <tspan class="mono">gpu-2</tspan></text>
  <text class="msg" x="177.5" y="388" text-anchor="middle">in the claim</text>
  <path class="wire" d="M97,447 H258" marker-end="url(#arrow)"/>
  <text class="msg" x="177.5" y="423" text-anchor="middle">binds the pod</text>
  <text class="msg" x="177.5" y="438" text-anchor="middle">to this Node</text>
  <path class="reply" d="M258,482 H419" marker-end="url(#arrow)"/>
  <text class="msg" x="338.5" y="473" text-anchor="middle">the pod and its claim</text>
  <path class="wire" d="M419,517 H581" marker-end="url(#arrow)"/>
  <text class="msg" x="500" y="508" text-anchor="middle"><tspan class="mono">NodePrepareResources</tspan></text>
  <path class="reply" d="M581,567 H419" marker-end="url(#arrow)"/>
  <text class="msg" x="500" y="543" text-anchor="middle">a CDI device</text>
  <text class="msg" x="500" y="558" text-anchor="middle">for the claim</text>
  <path class="wire" d="M903,630 H419" marker-end="url(#arrow)"/>
  <text class="msg in" x="661" y="621" text-anchor="middle">PodResources <tspan class="mono">List</tspan></text>
  <path class="reply" d="M419,665 H903" marker-end="url(#arrow)"/>
  <text class="msg in" x="661" y="656" text-anchor="middle">pod, container → driver, pool, <tspan class="mono">gpu-2</tspan></text>
  <path class="wire" d="M903,760 H742" marker-end="url(#arrow)"/>
  <text class="msg in" x="822.5" y="751" text-anchor="middle">marks that GPU busy</text>

  <!-- Notes -->
  <rect class="note" x="31" y="286" width="132" height="61" rx="6"/>
  <text class="c" x="97" y="306" text-anchor="middle">picks a free device</text>
  <text class="c" x="97" y="321" text-anchor="middle">that fits the claim,</text>
  <text class="c" x="97" y="336" text-anchor="middle">such as <tspan class="mono">gpu-2</tspan></text>
  <rect class="note" x="782" y="679" width="180" height="46" rx="6"/>
  <text class="c" x="872" y="699" text-anchor="middle">matches <tspan class="mono">gpu-2</tspan> to the GPU</text>
  <text class="c" x="872" y="714" text-anchor="middle">with minor number 2</text>

  <!-- The loop's tag, on its top edge -->
  <rect class="tag" x="393" y="579" width="181" height="20" rx="10"/>
  <text class="tagtext" x="405" y="593">workload tracker · every 2 s</text>
</svg>
