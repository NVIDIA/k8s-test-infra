<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title desc">
  <title id="title">A rack moves to a new shard</title>
  <desc id="desc">The new replica creates its shard Lease. The control plane leader sees the Lease added and relabels the racks the new shard wins. Both replicas' watches receive the relabel, in either order: the rack leaves the old owner's watch, so it stops allocating and serving the rack but keeps its Nodes' GPUs, and the rack enters the new owner's watch, so it reads allocations from Pods, re-applies the GPUs and recomputes NRT. The new owner then fetches the rack's runtime views from the control plane and serves the rack's metrics.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d1d9e0; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 14px; font-weight: 600; }
    .body { font-size: 12.5px; fill: #59636e; }
    .label { font-size: 12px; fill: #59636e; }
    .note { font-size: 12px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .box { fill: #ffffff; stroke-width: 1.5; }
    .life { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 4; }
    .wire { fill: none; stroke-width: 1.5; }
    .event { stroke-dasharray: 6 4; }
    .b-cp, .w-cp { stroke: #8250df; }
    .b-dp, .w-dp { stroke: #1a7f37; }
    .b-obj, .w-ext { stroke: #59636e; }
    .h-cp { fill: #8250df; }
    .h-dp { fill: #1a7f37; }
    .h-ext { fill: #59636e; }
    .f-dp { fill: #1a7f37; fill-opacity: 0.1; }
    .n-dp { fill: #1a7f37; fill-opacity: 0.1; stroke: #1a7f37; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #3d444d; }
      text { fill: #f0f6fc; }
      .body, .label { fill: #9198a1; }
      .halo { stroke: #0d1117; }
      .box { fill: #0d1117; }
      .life { stroke: #656c76; }
      .b-cp, .w-cp { stroke: #ab7df8; }
      .b-dp, .w-dp { stroke: #3fb950; }
      .b-obj, .w-ext { stroke: #9198a1; }
      .h-cp { fill: #ab7df8; }
      .h-dp { fill: #3fb950; }
      .h-ext { fill: #9198a1; }
      .f-dp { fill: #3fb950; fill-opacity: 0.16; }
      .n-dp { fill: #3fb950; fill-opacity: 0.16; stroke: #3fb950; }
    }
  </style>
  <defs>
    <marker id="arrow-cp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="h-cp" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-dp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="h-dp" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="h-ext" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="999" height="519" rx="12"/>

  <!-- Participants and lifelines -->
  <line class="life" x1="150" y1="76" x2="150" y2="500"/>
  <line class="life" x1="410" y1="76" x2="410" y2="500"/>
  <line class="life" x1="640" y1="76" x2="640" y2="500"/>
  <line class="life" x1="860" y1="76" x2="860" y2="500"/>

  <rect class="box b-dp" x="50" y="24" width="200" height="52" rx="8"/>
  <rect class="f-dp" x="50" y="24" width="200" height="52" rx="8"/>
  <text class="title" x="150" y="46" text-anchor="middle">New owner</text>
  <text class="body" x="150" y="64" text-anchor="middle">mokka-kwok-data-plane-3</text>

  <rect class="box b-obj" x="320" y="24" width="180" height="52" rx="8"/>
  <text class="title" x="410" y="46" text-anchor="middle">Kubernetes API</text>
  <text class="body" x="410" y="64" text-anchor="middle">Leases and SGPURacks</text>

  <rect class="box b-cp" x="550" y="24" width="180" height="52" rx="8"/>
  <text class="title" x="640" y="46" text-anchor="middle">Control plane leader</text>
  <text class="body" x="640" y="64" text-anchor="middle">ranks shards per rack</text>

  <rect class="box b-dp" x="760" y="24" width="200" height="52" rx="8"/>
  <rect class="f-dp" x="760" y="24" width="200" height="52" rx="8"/>
  <text class="title" x="860" y="46" text-anchor="middle">Old owner</text>
  <text class="body" x="860" y="64" text-anchor="middle">mokka-kwok-data-plane-0</text>

  <!-- Join -->
  <path class="wire w-dp" d="M150,116 H409" marker-end="url(#arrow-dp)"/>
  <text class="label halo" x="280" y="108" text-anchor="middle">creates its shard Lease</text>

  <path class="wire w-ext event" d="M410,156 H639" marker-end="url(#arrow-ext)"/>
  <text class="label halo" x="525" y="148" text-anchor="middle">Lease added</text>

  <path class="wire w-cp" d="M640,206 H411" marker-end="url(#arrow-cp)"/>
  <text class="label halo" x="525" y="186" text-anchor="middle">relabels the racks</text>
  <text class="label halo" x="525" y="199" text-anchor="middle">the new shard wins</text>

  <!-- Both watches receive the relabel -->
  <path class="wire w-ext event" d="M410,256 H151" marker-end="url(#arrow-ext)"/>
  <text class="label halo" x="280" y="248" text-anchor="middle">the rack enters its watch</text>
  <path class="wire w-ext event" d="M410,256 H859" marker-end="url(#arrow-ext)"/>
  <text class="label halo" x="750" y="248" text-anchor="middle">the rack leaves its watch</text>
  <circle class="h-ext" cx="410" cy="256" r="3.5"/>
  <text class="label halo" x="410" y="278" text-anchor="middle">both watches get the relabel, in either order</text>

  <!-- Handover -->
  <rect class="n-dp" x="40" y="294" width="220" height="62" rx="6"/>
  <text class="note" x="150" y="314" text-anchor="middle">reads allocations from Pods</text>
  <text class="note" x="150" y="330" text-anchor="middle">re-applies the GPUs</text>
  <text class="note" x="150" y="346" text-anchor="middle">recomputes NRT</text>

  <rect class="n-dp" x="750" y="294" width="220" height="62" rx="6"/>
  <text class="note" x="860" y="314" text-anchor="middle">stops allocating and</text>
  <text class="note" x="860" y="330" text-anchor="middle">serving the rack</text>
  <text class="note" x="860" y="346" text-anchor="middle">but keeps its Nodes' GPUs</text>

  <path class="wire w-dp" d="M150,392 H639" marker-end="url(#arrow-dp)"/>
  <text class="label halo" x="395" y="384" text-anchor="middle">POST /v1alpha1/racks/runtime:batchGet</text>

  <path class="wire w-cp event" d="M640,432 H151" marker-end="url(#arrow-cp)"/>
  <text class="label halo" x="395" y="424" text-anchor="middle">views at each rack's generation</text>

  <rect class="n-dp" x="40" y="452" width="220" height="30" rx="6"/>
  <text class="note" x="150" y="471" text-anchor="middle">serves the rack's metrics</text>
</svg>
