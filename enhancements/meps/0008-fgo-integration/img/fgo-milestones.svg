<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 666" width="1000" height="666" role="img" aria-labelledby="title desc">
  <title id="title">Milestones of MEP0008, MEP0009 and MEP0010</title>
  <desc id="desc">One plan across three MEPs, in four phases. Phase 1: MEP0010's M1, NUMA setup on CPU Nodes, MEP0001's rack state REST API, and MEP0009's M1, workload telemetry on CPU Nodes. Phase 2: MEP0008's M1, GPUs on KWOK Nodes, after MEP0001's API. Phase 3: the FGO migration, in three milestones that each follow MEP0008's M1 and can run in parallel. MEP0008's M2 adds DRA and ComputeDomains. MEP0008's M3, DCGM metrics with workload telemetry, also follows MEP0009's M1. MEP0010's M2, NodeResourceTopology on KWOK Nodes, also follows MEP0010's M1. MEP0008's optional M5, the KWOK provisioner, needs only its M1 and runs alongside its M2 to M4. Phase 4: MEP0008's M4, scale out, after its M2 and M3.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d1d9e0; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 13px; font-weight: 600; }
    .lane { font-size: 12.5px; font-weight: 600; }
    .done { font-size: 12px; fill: #59636e; }
    .strong { font-weight: 600; fill: #1f2328; }
    .label { font-size: 12px; fill: #59636e; }
    .band { fill: #f6f8fa; }
    .ms { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .key { stroke-width: 3; }
    .ext { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .wire { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #3d444d; }
      text { fill: #f0f6fc; }
      .done, .label { fill: #9198a1; }
      .strong { fill: #f0f6fc; }
      .band { fill: #151b23; }
      .ms { fill: #0d1117; stroke: #f0f6fc; }
      .ext { fill: #0d1117; stroke: #9198a1; }
      .wire { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="999" height="665" rx="12"/>

  <!-- Phases -->
  <text class="label" x="134" y="30" text-anchor="middle"><tspan class="strong">Phase 1</tspan> · foundations</text>
  <text class="label" x="378" y="30" text-anchor="middle"><tspan class="strong">Phase 2</tspan> · first runs</text>
  <text class="label" x="622" y="30" text-anchor="middle"><tspan class="strong">Phase 3</tspan> · FGO parity</text>
  <text class="label" x="866" y="30" text-anchor="middle"><tspan class="strong">Phase 4</tspan> · scale out</text>

  <!-- MEP0010 -->
  <rect class="band" x="12" y="44" width="976" height="116" rx="10"/>
  <text class="lane" x="28" y="64">MEP0010 · NUMA-aware scheduling</text>

  <rect class="ms" x="24" y="76" width="220" height="76" rx="8"/>
  <text class="title" x="38" y="100">M1 · NUMA on CPU Nodes</text>
  <text class="done" x="38" y="121"><tspan class="strong">Done when</tspan> KAI's NUMA suite</text>
  <text class="done" x="38" y="138">passes on Kind</text>

  <rect class="ms key" x="512" y="76" width="220" height="76" rx="8"/>
  <text class="title" x="526" y="100">M2 · NRT on KWOK Nodes</text>
  <text class="done" x="526" y="121"><tspan class="strong">Done when</tspan> KAI's NUMA tests</text>
  <text class="done" x="526" y="138">pass on KWOK Nodes</text>

  <path class="wire" d="M244,102 H511" marker-end="url(#arrow)"/>

  <!-- MEP0001, outside the lanes: MEP0008's band starts at Phase 2 -->
  <rect class="ext" x="24" y="308" width="220" height="76" rx="8"/>
  <text class="title" x="38" y="332">MEP0001 · Control plane</text>
  <text class="done" x="38" y="353">rack state REST API</text>
  <text class="done" x="38" y="370">and delivery generation</text>

  <!-- MEP0008: M2 above, M3 below, the provisioner between them -->
  <rect class="band" x="256" y="188" width="732" height="298" rx="10"/>
  <text class="lane" x="272" y="208">MEP0008 · KWOK integration</text>

  <rect class="ms key" x="512" y="218" width="220" height="76" rx="8"/>
  <text class="title" x="526" y="242">M2 · DRA, ComputeDomains</text>
  <text class="done" x="526" y="263"><tspan class="strong">Done when</tspan> KAI's DRA tests</text>
  <text class="done" x="526" y="280">pass on KWOK Nodes</text>

  <rect class="ms" x="756" y="218" width="220" height="76" rx="8"/>
  <text class="title" x="770" y="242">M4 · Scale out</text>
  <text class="done" x="770" y="263"><tspan class="strong">Done when</tspan> 1,000 racks run</text>
  <text class="done" x="770" y="280">across data plane replicas</text>

  <rect class="ms" x="268" y="308" width="220" height="76" rx="8"/>
  <text class="title" x="282" y="332">M1 · GPUs on KWOK Nodes</text>
  <text class="done" x="282" y="353"><tspan class="strong">Done when</tspan> KAI's scale suite</text>
  <text class="done" x="282" y="370">passes on KWOK Nodes</text>

  <rect class="ms" x="512" y="308" width="220" height="76" rx="8"/>
  <text class="title" x="526" y="332">M5 · KWOK provisioner</text>
  <text class="done" x="526" y="353">optional, alongside M2 to M4</text>
  <text class="done" x="526" y="370"><tspan class="strong">Done when</tspan> Mokka creates Nodes</text>

  <rect class="ms key" x="512" y="398" width="220" height="76" rx="8"/>
  <text class="title" x="526" y="422">M3 · DCGM metrics</text>
  <text class="done" x="526" y="443"><tspan class="strong">Done when</tspan> Run:ai's harness and</text>
  <text class="done" x="526" y="460">MEP0009's story 3 run on KWOK</text>

  <path class="wire" d="M244,346 H267" marker-end="url(#arrow)"/>
  <path class="wire" d="M488,346 H511" marker-end="url(#arrow)"/>
  <path class="wire" d="M470,307 V256 H511" marker-end="url(#arrow)"/>
  <path class="wire" d="M470,385 V436 H511" marker-end="url(#arrow)"/>
  <!-- MEP0008's M1 to MEP0010's M2, branching off the arrow to M2 and drawn over both bands -->
  <path class="wire" d="M470,256 V130 H511" marker-end="url(#arrow)"/>
  <path class="wire" d="M732,256 H755" marker-end="url(#arrow)"/>
  <path class="wire" d="M732,436 H836 V295" marker-end="url(#arrow)"/>

  <!-- MEP0009 -->
  <rect class="band" x="12" y="510" width="976" height="116" rx="10"/>
  <text class="lane" x="28" y="530">MEP0009 · Workload metrics</text>

  <rect class="ms" x="24" y="540" width="220" height="76" rx="8"/>
  <text class="title" x="38" y="564">M1 · CPU Node telemetry</text>
  <text class="done" x="38" y="585"><tspan class="strong">Done when</tspan> stories 1 and 2</text>
  <text class="done" x="38" y="602">pass with plugin and DRA</text>

  <!-- MEP0009's M1 to MEP0008's M3, drawn over both bands -->
  <path class="wire" d="M230,539 V492 H592 V475" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect class="ms key" x="24" y="641" width="28" height="16" rx="4"/><text class="label" x="60" y="653">the FGO migration</text>
  <rect class="ext" x="196" y="641" width="28" height="16" rx="4"/><text class="label" x="232" y="653">prerequisite from another MEP</text>
  <path class="wire" d="M440,649 H474" marker-end="url(#arrow)"/><text class="label" x="482" y="653">comes first</text>
</svg>
