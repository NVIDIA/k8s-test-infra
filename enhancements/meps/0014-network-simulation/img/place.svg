<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="468" viewBox="0 0 1020 468" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>PLACE workflows on Mokka</title>
<desc>Three stages: scheduling, device allocation and container preparation. The scheduler selects nodes by available resource counts and uses Topograph's topology labels and Slurm topology to keep a job in one NVLink domain. Classic device plugins: the kubelet's device manager picks specific devices through the RDMA device plugin, which requires kernel RDMA support, and mounts their device files. DRA: kube-scheduler allocates a ResourceClaim against ResourceSlices by attribute, with constraints that use the PCIe and NUMA locality Mokka exposes, and records the result in the claim's status; the kubelet and DRA drivers prepare the claim through CDI. The pod receives exactly the devices it claimed; RDMA traffic and GPU compute belong to EXECUTE.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1019" height="467" rx="12" fill="#FFFFFF" stroke="#E5E3DA"/>

<!-- Inputs: what DISCOVER left in Kubernetes -->
<rect x="16" y="10" width="180" height="390" rx="14" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="106" y="30" text-anchor="middle" dominant-baseline="central">From DISCOVER</text>
<text font-size="12" fill="#5F5E5A" x="106" y="48" text-anchor="middle" dominant-baseline="central">what 5.1 leaves in Kubernetes</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="26" y="72" width="160" height="52" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="106" y="91" text-anchor="middle" dominant-baseline="central">Topology labels</text>
<text font-size="12" fill="#5F5E5A" x="106" y="109" text-anchor="middle" dominant-baseline="central">and Slurm topology</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="26" y="136" width="160" height="52" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="106" y="155" text-anchor="middle" dominant-baseline="central">kubelet</text>
<text font-size="12" fill="#5F5E5A" x="106" y="173" text-anchor="middle" dominant-baseline="central">rdma/… resources</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="26" y="200" width="160" height="52" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="106" y="219" text-anchor="middle" dominant-baseline="central">ResourceSlices</text>
<text font-size="12" fill="#5F5E5A" x="106" y="237" text-anchor="middle" dominant-baseline="central">PCIe root · NUMA node</text>

<!-- Stage panels -->
<rect x="210" y="10" width="230" height="390" rx="14" fill="#F8F7F3" stroke="#D3D1C7" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="325" y="30" text-anchor="middle" dominant-baseline="central">Scheduling</text>
<text font-size="12" fill="#5F5E5A" x="325" y="48" text-anchor="middle" dominant-baseline="central">selects nodes</text>
<rect x="454" y="10" width="270" height="390" rx="14" fill="#F8F7F3" stroke="#D3D1C7" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="589" y="30" text-anchor="middle" dominant-baseline="central">Device allocation</text>
<text font-size="12" fill="#5F5E5A" x="589" y="48" text-anchor="middle" dominant-baseline="central">assigns specific devices</text>
<rect x="738" y="10" width="266" height="390" rx="14" fill="#F8F7F3" stroke="#D3D1C7" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="871" y="30" text-anchor="middle" dominant-baseline="central">Container preparation</text>
<text font-size="12" fill="#5F5E5A" x="871" y="48" text-anchor="middle" dominant-baseline="central">kubelet makes devices available</text>

<!-- Scheduling -->
<rect fill="#FFFFFF" stroke="#B4B2A9" x="226" y="72" width="198" height="116" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="325" y="91" text-anchor="middle" dominant-baseline="central">Scheduler</text>
<text font-size="12" fill="#5F5E5A" x="325" y="109" text-anchor="middle" dominant-baseline="central">kube-scheduler · Kueue · Slurm</text>
<text font-size="12" fill="#2C2C2A" x="325" y="137" text-anchor="middle" dominant-baseline="central">selects nodes by available</text>
<text font-size="12" fill="#2C2C2A" x="325" y="153" text-anchor="middle" dominant-baseline="central">resource counts; keeps a</text>
<text font-size="12" fill="#2C2C2A" x="325" y="169" text-anchor="middle" dominant-baseline="central">job in one NVLink domain</text>
<rect fill="#FFFFFF" stroke="#639922" x="226" y="266" width="198" height="52" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#27500A" x="325" y="285" text-anchor="middle" dominant-baseline="central">ResourceClaim</text>
<text font-size="12" fill="#27500A" x="325" y="303" text-anchor="middle" dominant-baseline="central">the pod's device request</text>
<line x1="186" y1="98" x2="224" y2="98" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<line x1="186" y1="162" x2="224" y2="162" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="186" y1="226" x2="468" y2="226" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="424" y1="102" x2="468" y2="102" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M400 188 L400 204 L468 204" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<path d="M424 292 L446 292 L446 244 L468 244" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text font-size="12" font-style="italic" fill="#5F5E5A" x="325" y="352" text-anchor="middle">allocation must stay</text>
<text font-size="12" font-style="italic" fill="#5F5E5A" x="325" y="368" text-anchor="middle">correct at fleet size</text>

