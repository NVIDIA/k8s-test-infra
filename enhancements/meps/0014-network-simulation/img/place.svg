<rect fill="#FFFFFF" stroke="#378ADD" x="470" y="76" width="238" height="64" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#0C447C" x="589" y="93" text-anchor="middle" dominant-baseline="central">kubelet device manager</text>
<text font-size="12" fill="#0C447C" x="589" y="110" text-anchor="middle" dominant-baseline="central">picks devices via the RDMA device plugin</text>
<text font-size="11" font-style="italic" fill="#0C447C" x="589" y="127" text-anchor="middle" dominant-baseline="central">(requires kernel RDMA support)</text>
<rect fill="#FFFFFF" stroke="#639922" x="470" y="192" width="238" height="60" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#27500A" x="589" y="208" text-anchor="middle" dominant-baseline="central">DRA allocation</text>
<text font-size="12" fill="#27500A" x="589" y="226" text-anchor="middle" dominant-baseline="central">kube-scheduler, by attribute;</text>
<text font-size="12" fill="#27500A" x="589" y="242" text-anchor="middle" dominant-baseline="central">result in the claim's status</text>
<g>
<rect fill="#E1F5EE" stroke="#0F6E56" x="470" y="280" width="238" height="108" rx="8" stroke-width="0.75"/>
<text font-size="12" font-weight="600" fill="#085041" x="589" y="296" text-anchor="middle" dominant-baseline="central">GPU–NIC topology exposed by Mokka</text>
<rect fill="#FFFFFF" stroke="#639922" x="480" y="308" width="108" height="70" rx="6" stroke-width="1.5"/>
<text font-size="11" fill="#0F6E56" x="534" y="322" text-anchor="middle" dominant-baseline="central">root 0 · NUMA 0</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="596" y="308" width="102" height="70" rx="6" stroke-width="0.75"/>
<text font-size="11" fill="#0F6E56" x="647" y="322" text-anchor="middle" dominant-baseline="central">root 1 · NUMA 1</text>
<rect fill="#F1EFE8" stroke="#B4B2A9" x="486" y="336" width="30" height="20" rx="3" stroke-width="0.75"/>
<text font-size="10" fill="#2C2C2A" x="501" y="346" text-anchor="middle" dominant-baseline="central">GPU0</text>
<rect fill="#F1EFE8" stroke="#B4B2A9" x="520" y="336" width="30" height="20" rx="3" stroke-width="0.75"/>
<text font-size="10" fill="#2C2C2A" x="535" y="346" text-anchor="middle" dominant-baseline="central">NIC0</text>
<rect fill="#F1EFE8" stroke="#B4B2A9" x="554" y="336" width="28" height="20" rx="3" stroke-width="0.75"/>
<text font-size="10" fill="#2C2C2A" x="568" y="346" text-anchor="middle" dominant-baseline="central">VF</text>
<rect fill="#F1EFE8" stroke="#B4B2A9" x="608" y="336" width="34" height="20" rx="3" stroke-width="0.75"/>
<text font-size="10" fill="#2C2C2A" x="625" y="346" text-anchor="middle" dominant-baseline="central">GPU1</text>
<rect fill="#F1EFE8" stroke="#B4B2A9" x="650" y="336" width="34" height="20" rx="3" stroke-width="0.75"/>
<text font-size="10" fill="#2C2C2A" x="667" y="346" text-anchor="middle" dominant-baseline="central">NIC1</text>
<text font-size="10" fill="#27500A" x="534" y="368" text-anchor="middle" dominant-baseline="central">a match for one claim</text>
</g>
<line x1="490" y1="280" x2="490" y2="254" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text font-size="12" fill="#27500A" x="496" y="271">constraints use PCIe / NUMA locality</text>

<!-- Container preparation -->
<rect fill="#FFFFFF" stroke="#378ADD" x="754" y="76" width="234" height="52" rx="8" stroke-width="0.75"/>
