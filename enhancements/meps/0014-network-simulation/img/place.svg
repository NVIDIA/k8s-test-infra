<text font-size="12" fill="#0C447C" x="871" y="113" text-anchor="middle" dominant-baseline="central">mounts the plugin's device files</text>
<rect fill="#FFFFFF" stroke="#639922" x="754" y="192" width="196" height="60" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#27500A" x="852" y="208" text-anchor="middle" dominant-baseline="central">kubelet · DRA drivers</text>
<text font-size="12" fill="#27500A" x="852" y="226" text-anchor="middle" dominant-baseline="central">dranet · SR-IOV · GPU</text>
<text font-size="12" fill="#27500A" x="852" y="242" text-anchor="middle" dominant-baseline="central">prepare the claim via CDI</text>
<line x1="708" y1="102" x2="752" y2="102" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="708" y1="222" x2="752" y2="222" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="754" y="280" width="234" height="108" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="871" y="298" text-anchor="middle" dominant-baseline="central">Pod</text>
<g>
<rect fill="#E1F5EE" stroke="#0F6E56" x="770" y="312" width="202" height="66" rx="6" stroke-width="0.75"/>
<text font-size="12" fill="#0F6E56" x="871" y="328" text-anchor="middle" dominant-baseline="central">GPU and NIC device files</text>
<text font-size="12" fill="#0F6E56" x="871" y="345" text-anchor="middle" dominant-baseline="central">RoCE interface in its netns</text>
<text font-size="12" fill="#0F6E56" x="871" y="362" text-anchor="middle" dominant-baseline="central">exactly what it claimed</text>
</g>
<line x1="970" y1="128" x2="970" y2="278" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="852" y1="252" x2="852" y2="278" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>

<!-- Beyond PLACE -->
<rect x="738" y="410" width="266" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
<text font-size="12" fill="#5F5E5A" x="871" y="426" text-anchor="middle" dominant-baseline="central">EXECUTE: RDMA traffic, GPU compute</text>
<text font-size="12" fill="#5F5E5A" x="871" y="442" text-anchor="middle" dominant-baseline="central">exclusive RDMA mode: beyond Mokka</text>
<line x1="871" y1="388" x2="871" y2="408" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-grey)"/>

