<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="484" viewBox="0 0 1020 484" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Mokka network simulation: architecture</title>
<desc>A test author declares the cluster with SGPURackProfile, SGPUInventory, SFabricProfile and SFabricInventory, and sets runtime policies: SGPURuntimePolicy for device faults and state, SFabricRuntimePolicy for fabric faults. Mokka's control plane resolves the cluster model, manages the controller-owned SGPURack instances, generates the scale-out fabric topology and computes effective state. It delivers each node's effective view to the node-local components through SGPURack, and exposes the generated topology to Topograph through a generic topology interface. The node-local components, the node agent and the NRI plugin, provide simulated interfaces to unmodified node-local consumers; Topograph provides topology information to schedulers.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
