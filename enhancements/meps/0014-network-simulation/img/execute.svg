<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="300" viewBox="0 0 1020 300" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>EXECUTE: the boundary of Mokka's simulation</title>
<desc>On the left, Mokka's simulated interfaces: a pod with its allocated device files, RoCE interface, mock NVML and supported verbs queries, and declared VFs. Outside it, the SR-IOV operator, a consumer that configures VFs. On the right, beyond Mokka: GPU computation needs a real GPU or an execution emulator; network data transfer such as RDMA, NCCL collectives and performance tests needs an RDMA data path; creating VFs through the driver needs a real NIC driver.</desc>
<defs>
<marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1019" height="299" rx="12" fill="#FFFFFF" stroke="#E5E3DA"/>

<!-- What Mokka simulates -->
<rect fill="#E1F5EE" stroke="#0F6E56" x="16" y="16" width="420" height="160" rx="14" stroke-width="0.75"/>
<text font-size="14" font-weight="600" fill="#085041" x="36" y="38" dominant-baseline="central">Mokka's simulated interfaces</text>
<text font-size="12" fill="#0F6E56" x="36" y="58" dominant-baseline="central">enough for DISCOVER, PLACE and OBSERVE</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="36" y="76" width="380" height="88" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="226" y="96" text-anchor="middle" dominant-baseline="central">Pod with its allocated devices</text>
<text font-size="12" fill="#5F5E5A" x="226" y="118" text-anchor="middle" dominant-baseline="central">GPU and NIC device files · RoCE interface</text>
<text font-size="12" fill="#5F5E5A" x="226" y="136" text-anchor="middle" dominant-baseline="central">mock NVML and supported verbs queries</text>
<text font-size="12" fill="#5F5E5A" x="226" y="152" text-anchor="middle" dominant-baseline="central">declared VFs, for discovery and allocation</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="36" y="184" width="200" height="52" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="136" y="203" text-anchor="middle" dominant-baseline="central">SR-IOV operator</text>
<text font-size="12" fill="#5F5E5A" x="136" y="221" text-anchor="middle" dominant-baseline="central">a consumer that configures VFs</text>

<!-- Beyond Mokka -->
<rect fill="none" stroke="#888780" x="500" y="16" width="504" height="232" rx="14" stroke-width="0.75" stroke-dasharray="4 4"/>
<text font-size="14" font-weight="600" fill="#2C2C2A" x="520" y="38" dominant-baseline="central">Needs functional hardware or emulation</text>
<text font-size="12" fill="#5F5E5A" x="520" y="58" dominant-baseline="central">EXECUTE: beyond what Mokka simulates</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="520" y="76" width="464" height="44" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="752" y="91" text-anchor="middle" dominant-baseline="central">GPU computation</text>
<text font-size="12" fill="#5F5E5A" x="752" y="108" text-anchor="middle" dominant-baseline="central">CUDA kernels: needs a real GPU or an execution emulator</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="520" y="132" width="464" height="44" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="752" y="147" text-anchor="middle" dominant-baseline="central">Network data transfer</text>
<text font-size="12" fill="#5F5E5A" x="752" y="164" text-anchor="middle" dominant-baseline="central">RDMA, NCCL collectives, performance tests: needs an RDMA data path</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="520" y="188" width="464" height="44" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="752" y="203" text-anchor="middle" dominant-baseline="central">Hardware configuration</text>
<text font-size="12" fill="#5F5E5A" x="752" y="220" text-anchor="middle" dominant-baseline="central">creating VFs through the driver: needs a real NIC driver</text>

<!-- What would cross the boundary -->
<line x1="416" y1="98" x2="518" y2="98" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-grey)"/>
<path d="M416 140 L456 140 L456 154 L518 154" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-grey)"/>
<line x1="236" y1="210" x2="518" y2="210" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-grey)"/>

<!-- Legend -->
<line x1="24" y1="276" x2="56" y2="276" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/>
<text font-size="12" fill="#5F5E5A" x="64" y="280">needs more than Mokka simulates. Real hardware or other simulators, such as DSX Air, can provide it alongside Mokka</text>
</svg>
