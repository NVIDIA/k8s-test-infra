<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="528" viewBox="0 0 1020 528" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Two GB300 NVL72 racks on a two-plane rail-optimised fabric</title>
<desc>Two GB300 NVL72 racks, each one NVLink domain. NIC k of every tray belongs to rail k; a coloured line per rail runs through the trays. Each rail links to leaf k in plane 0 and to leaf k in plane 1. Each plane is an independent fabric with four leaves and two spines, and every leaf connects to both spines, which carry traffic between rails. Each leaf is labelled with its rail, and a legend maps each colour to its rail: a rail is a logical grouping of corresponding NICs and their network connectivity, not a separate physical device.</desc>
