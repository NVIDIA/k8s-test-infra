<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="524" viewBox="0 0 1020 524" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>DISCOVER workflows on Mokka</title>
<desc>Three discovery paths. Hardware discovery and node configuration: NFD labels the node, the Network Operator places its components on labelled nodes and may deploy the RDMA device plugin, and NIC Feature Discovery labels the driver version. Device registration: the RDMA device plugin, which requires kernel RDMA support, advertises rdma resources to the kubelet, and DRA drivers, installed from their own charts, publish NICs, VFs and EFA devices in ResourceSlices. Topology discovery: GFD labels the clique, Topograph reads clique labels, depending on its provider, and Mokka's generated files or a live walk and writes topology labels and Slurm topology, and the GPU DRA driver brings up a ComputeDomain with IMEX.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1019" height="523" rx="12" fill="#FFFFFF" stroke="#E5E3DA"/>
<!-- Kubernetes band first, so the arrows into it stay on top -->
<rect x="8" y="400" width="1004" height="90" rx="14" fill="#F8F7F3" stroke="#D3D1C7" stroke-width="0.75"/>
<text font-size="14" font-weight="600" fill="#2C2C2A" x="22" y="414" dominant-baseline="central">Kubernetes</text>

<!-- What Mokka presents, one segment per discovery path -->
<rect x="8" y="10" width="1004" height="102" rx="14" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text font-size="14" font-weight="600" fill="#2C2C2A" x="22" y="26" dominant-baseline="central">Mokka simulated cluster</text>
<g>
<rect fill="#E6F1FB" stroke="#378ADD" x="16" y="40" width="320" height="62" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#0C447C" x="176" y="57" text-anchor="middle" dominant-baseline="central">Hardware discovery and node configuration</text>
<text font-size="12" fill="#0C447C" x="176" y="76" text-anchor="middle" dominant-baseline="central">PCI functions in sysfs</text>
<text font-size="12" fill="#0C447C" x="176" y="92" text-anchor="middle" dominant-baseline="central">NIC driver attributes</text>
</g>
<g>
<rect fill="#EAF3DE" stroke="#639922" x="350" y="40" width="320" height="62" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#27500A" x="510" y="57" text-anchor="middle" dominant-baseline="central">Device registration</text>
<text font-size="12" fill="#27500A" x="510" y="76" text-anchor="middle" dominant-baseline="central">/sys/class/infiniband · /dev/infiniband</text>
<text font-size="12" fill="#27500A" x="510" y="92" text-anchor="middle" dominant-baseline="central">network interfaces · VFs · EFA</text>
</g>
<g>
<rect fill="#FAEEDA" stroke="#BA7517" x="684" y="40" width="320" height="62" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#633806" x="844" y="57" text-anchor="middle" dominant-baseline="central">Topology discovery</text>
<text font-size="12" fill="#633806" x="844" y="76" text-anchor="middle" dominant-baseline="central">NVML fabric and clique state</text>
<text font-size="12" fill="#633806" x="844" y="92" text-anchor="middle" dominant-baseline="central">generated topology files · mock-ib fabric</text>
</g>

<!-- Path 1: hardware discovery and node configuration -->
<rect fill="#FFFFFF" stroke="#B4B2A9" x="76" y="136" width="200" height="52" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="176" y="155" text-anchor="middle" dominant-baseline="central">NFD</text>
<text font-size="12" fill="#5F5E5A" x="176" y="173" text-anchor="middle" dominant-baseline="central">Node Feature Discovery</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="76" y="230" width="200" height="52" rx="8" stroke-width="0.75"/>
