<text font-size="12" fill="#27500A" x="588" y="463" text-anchor="middle" dominant-baseline="central">NICs · VFs · EFA</text>
<rect fill="#FFFFFF" stroke="#BA7517" x="692" y="428" width="168" height="48" rx="8" stroke-width="0.75"/>
