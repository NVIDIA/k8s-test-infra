<text font-size="12" fill="#5F5E5A" x="764" y="173" text-anchor="middle" dominant-baseline="central">GPU Feature Discovery</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="852" y="136" width="144" height="52" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="924" y="155" text-anchor="middle" dominant-baseline="central">GPU DRA driver</text>
<text font-size="12" fill="#5F5E5A" x="924" y="173" text-anchor="middle" dominant-baseline="central">NVLink · IMEX</text>
<rect fill="#FFFFFF" stroke="#B4B2A9" x="692" y="230" width="168" height="68" rx="8" stroke-width="0.75"/>
