<line x1="176" y1="282" x2="176" y2="322" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text font-size="12" fill="#0C447C" x="184" y="306">places on labelled nodes</text>
<path d="M40 102 L40 350 L74 350" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="176" y1="376" x2="176" y2="426" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M276 256 L350 256" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
<text font-size="12" fill="#0C447C" x="313" y="233" text-anchor="middle">may deploy</text>
<text font-size="12" fill="#0C447C" x="313" y="247" text-anchor="middle">RDMA plugin</text>

