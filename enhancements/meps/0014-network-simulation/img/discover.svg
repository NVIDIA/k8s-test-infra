<rect fill="#FFFFFF" stroke="#B4B2A9" x="352" y="230" width="160" height="66" rx="8" stroke-width="0.75"/>
<text font-size="13" font-weight="600" fill="#2C2C2A" x="432" y="247" text-anchor="middle" dominant-baseline="central">RDMA device plugin</text>
<text font-size="12" fill="#5F5E5A" x="432" y="264" text-anchor="middle" dominant-baseline="central">InfiniBand, RoCE</text>
<text font-size="11" font-style="italic" fill="#5F5E5A" x="432" y="281" text-anchor="middle" dominant-baseline="central">(requires kernel RDMA support)</text>
