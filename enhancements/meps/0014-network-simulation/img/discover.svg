<text font-size="13" font-weight="600" fill="#2C2C2A" x="588" y="249" text-anchor="middle" dominant-baseline="central">DRA drivers</text>
<text font-size="12" fill="#5F5E5A" x="588" y="267" text-anchor="middle" dominant-baseline="central">dranet · SR-IOV DRA</text>
<line x1="432" y1="102" x2="432" y2="228" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="588" y1="102" x2="588" y2="228" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="432" y1="296" x2="432" y2="426" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="588" y1="282" x2="588" y2="426" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text font-size="12" font-style="italic" fill="#5F5E5A" x="580" y="312" text-anchor="end">installed from</text>
<text font-size="12" font-style="italic" fill="#5F5E5A" x="580" y="327" text-anchor="end">their own charts</text>

<!-- Path 3: topology discovery -->
<rect fill="#FFFFFF" stroke="#B4B2A9" x="692" y="136" width="144" height="52" rx="8" stroke-width="0.75"/>
