<text font-size="12" fill="#5F5E5A" x="176" y="361" text-anchor="middle" dominant-baseline="central">a Network Operator component</text>
<line x1="176" y1="102" x2="176" y2="134" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
