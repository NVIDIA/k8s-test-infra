<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" role="img" aria-labelledby="gb300-tray-title gb300-tray-desc" class="nicfig nf-tray">
  <title id="gb300-tray-title">One GB300 tray as the gb300 rack profile declares it</title>
  <desc id="gb300-tray-desc">Two NUMA nodes, one per Grace CPU, each with two GPUs attached over C2C and one ConnectX-8 board with two NIC slots. NUMA node 0: slot nic1 serves GPU 0 and slot nic0 serves GPU 1, on board 0. NUMA node 1: slot nic3 serves GPU 2 and slot nic2 serves GPU 3, on board 1, and the BlueField-3 slot frontend0 hangs off Grace CPU 1. Each ConnectX-8 has its network device in a PCIe domain of its CPU and its Data Direct device in its GPU's PCIe domain. In the default ib-xdr-4plane configuration each ConnectX-8 has one 800 Gb/s port, p0, on one OSFP module, split into four planes of 200 Gb/s; the BlueField-3 has two 400 Gb/s ports on QSFP modules. Connectors are not declared.</desc>
  <style>
    .nf-tray { --fg: #1f2328; --muted: #59636e; --rule: #d1d9e0; --band: #f6f8fa; --box: #ffffff; --gpu: #1a7f37; --nic: #0969da; --fe: #bc4c00; --c2c: #8250df; --port: #9a6700; }
    @media (prefers-color-scheme: dark) {
      .nf-tray { --fg: #f0f6fc; --muted: #9198a1; --rule: #3d444d; --band: #151b23; --box: #0d1117; --gpu: #3fb950; --nic: #4493f8; --fe: #f0883e; --c2c: #ab7df8; --port: #d29922; }
    }
    :root[data-theme="light"] .nf-tray { --fg: #1f2328; --muted: #59636e; --rule: #d1d9e0; --band: #f6f8fa; --box: #ffffff; --gpu: #1a7f37; --nic: #0969da; --fe: #bc4c00; --c2c: #8250df; --port: #9a6700; }
    :root[data-theme="dark"] .nf-tray { --fg: #f0f6fc; --muted: #9198a1; --rule: #3d444d; --band: #151b23; --box: #0d1117; --gpu: #3fb950; --nic: #4493f8; --fe: #f0883e; --c2c: #ab7df8; --port: #d29922; }
    .nf-tray text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: var(--fg); }
    .nf-tray .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); }
    .nf-tray .b { font-weight: 600; }
    .nf-tray .muted { fill: var(--muted); }
    .nf-tray .tiny { font-size: 9.5px; fill: var(--muted); }
    .nf-tray .band { fill: var(--band); stroke: var(--rule); }
    .nf-tray .cpu { fill: var(--box); stroke: var(--muted); stroke-width: 1.5; }
    .nf-tray .gpu { fill: var(--box); stroke: var(--gpu); stroke-width: 1.5; }
    .nf-tray .nic { fill: var(--box); stroke: var(--nic); stroke-width: 1.5; }
    .nf-tray .fe { fill: var(--box); stroke: var(--fe); stroke-width: 1.5; }
    .nf-tray .board { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .nf-tray .cage { fill: var(--box); stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 3 3; }
    .nf-tray .c2c { fill: none; stroke: var(--c2c); stroke-width: 2; }
    .nf-tray .tip-c2c { fill: var(--c2c); }
    .nf-tray .netdev { fill: none; stroke: var(--nic); stroke-width: 2; }
    .nf-tray .dd { fill: none; stroke: var(--gpu); stroke-width: 2; }
    .nf-tray .fedev { fill: none; stroke: var(--fe); stroke-width: 2; }
    .nf-tray .port { fill: none; stroke: var(--port); stroke-width: 2.5; }
    .nf-tray .plane { fill: none; stroke: var(--port); stroke-width: 1.25; }
    .nf-tray .t-port { fill: var(--port); }
    .nf-tray .t-c2c { fill: var(--c2c); }
  </style>
