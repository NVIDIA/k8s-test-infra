<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 636" width="1000" height="636" role="img" aria-labelledby="title desc">
  <title id="title">Runtime view delivery</title>
  <desc id="desc">How a Node's runtime view is delivered. Administrators or GitOps create and change inventories, profiles and runtime policies. The leader, the elected replica and the only one that writes to the Kubernetes API, first binds Node worker-06 in its SGPURack at assignment revision 7 and advances the rack's delivery generation, then publishes the revision and a generation floor of 12 in the Node's sgpu-assignment annotation. The rack's delivery record lists the exact input revisions behind each generation, and every binding or input change advances it: here a policy change has advanced it to 13 without touching the Node. Every ready replica watches these objects. The node daemon on worker-06 polls with its Node UID and its last applied pair of assignment revision and rack generation, (7, 12). A replica computes the view on request and stores none. It serves the view at (7, 13) only if its caches hold the annotation and a binding that matches it, a rack generation at or above the floor, and every input in that generation's manifest, and only at a pair no older than the daemon's; otherwise it returns retry. The node daemon never applies an older pair.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d1d9e0; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 14px; font-weight: 600; }
    .body { font-size: 12.5px; fill: #59636e; }
    .label { font-size: 12px; fill: #59636e; }
    .box, .badge { fill: #ffffff; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .wire { fill: none; stroke-width: 1.5; }
    .btext { font-size: 11px; font-weight: 700; }
    .b-cp, .w-cp { stroke: #8250df; }
    .b-dp, .w-dp { stroke: #1a7f37; }
    .b-obj, .b-ext, .w-ext { stroke: #59636e; }
    .h-cp, .bt-cp { fill: #8250df; }
    .h-dp { fill: #1a7f37; }
    .h-ext { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #3d444d; }
      text { fill: #f0f6fc; }
      .body, .label { fill: #9198a1; }
      .box, .badge { fill: #0d1117; }
      .b-cp, .w-cp { stroke: #ab7df8; }
      .b-dp, .w-dp { stroke: #3fb950; }
      .b-obj, .b-ext, .w-ext { stroke: #9198a1; }
      .h-cp, .bt-cp { fill: #ab7df8; }
      .h-dp { fill: #3fb950; }
      .h-ext { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow-cp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="h-cp" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-dp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="h-dp" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="h-ext" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="999" height="635" rx="12"/>

  <!-- Writers: the administrators declare the inputs, and the leader alone writes the records that order delivery -->
  <rect class="box b-ext dashed" x="24" y="24" width="260" height="88" rx="8"/>
  <text class="title" x="40" y="50">Administrators or GitOps</text>
  <text class="body" x="40" y="72">declare inventories, profiles</text>
  <text class="body" x="40" y="90">and runtime policies</text>

  <rect class="box b-cp" x="396" y="24" width="360" height="88" rx="8"/>
  <text class="title" x="412" y="50">Leader</text>
  <text class="body" x="412" y="72">the elected replica, and the only one</text>
  <text class="body" x="412" y="90">that writes to the Kubernetes API</text>

  <!-- The records, with the values of the example in the text -->
  <rect class="box b-ext dashed" x="24" y="176" width="952" height="172" rx="8"/>
  <text class="title" x="40" y="200">Kubernetes API</text>

  <rect class="box b-obj" x="40" y="216" width="272" height="116" rx="8"/>
  <text class="title" x="56" y="240">Declared inputs</text>
  <text class="body" x="56" y="262">SGPUInventory, SGPURackProfile,</text>
  <text class="body" x="56" y="280">SGPURuntimePolicy, each revision</text>
  <text class="body" x="56" y="298">named by its UID and generation</text>

  <rect class="box b-obj" x="352" y="216" width="296" height="116" rx="8"/>
  <text class="title" x="368" y="240">SGPURack</text>
  <text class="body" x="368" y="262">nodeRef: worker-06, revision 7</text>
  <text class="body" x="368" y="280">delivery: generation 13, advanced by</text>
  <text class="body" x="368" y="298">every binding or input change, and</text>
  <text class="body" x="368" y="316">the exact input revisions it used</text>

  <rect class="box b-obj" x="688" y="216" width="272" height="116" rx="8"/>
  <text class="title" x="704" y="240">Node worker-06</text>
  <text class="body" x="704" y="262">sgpu-assignment annotation:</text>
  <text class="body" x="704" y="280">revision 7, rack and slot, and</text>
  <text class="body" x="704" y="298">floor 12, the rack's generation</text>
  <text class="body" x="704" y="316">when revision 7 was published</text>

  <!-- Readers: every ready replica serves from its caches, and the node daemon only moves forward -->
  <rect class="box b-cp" x="40" y="412" width="420" height="168" rx="8"/>
  <rect class="box b-cp" x="32" y="404" width="420" height="168" rx="8"/>
  <rect class="box b-cp" x="24" y="396" width="420" height="168" rx="8"/>
  <text class="title" x="40" y="420">Ready replicas</text>
  <text class="body" x="40" y="442">compute a Node's view on request and store none.</text>
  <text class="body" x="40" y="460">A replica serves the view only if its caches hold:</text>
  <circle class="h-cp" cx="50" cy="478" r="2.5"/>
  <text class="body" x="60" y="482">the annotation and a binding that matches it</text>
  <circle class="h-cp" cx="50" cy="496" r="2.5"/>
  <text class="body" x="60" y="500">a rack generation at or above the floor</text>
  <circle class="h-cp" cx="50" cy="514" r="2.5"/>
  <text class="body" x="60" y="518">every input in that generation's manifest</text>
  <text class="body" x="40" y="542">and only at a pair no older than the daemon's.</text>

  <rect class="box b-dp" x="640" y="424" width="336" height="104" rx="8"/>
  <text class="title" x="656" y="450">Node daemon</text>
  <text class="body" x="656" y="472">node-agent on worker-06</text>
  <text class="body" x="656" y="490">last applied (revision, generation):</text>
  <text class="body" x="656" y="508">(7, 12); never applies an older pair</text>

  <!-- Arrows point from who acts to what it acts on; writes take the writer's color, reads are gray -->
  <path class="wire w-ext" d="M230,112 V215" marker-end="url(#arrow-ext)"/>
  <text class="label" x="238" y="150">create and change</text>

  <path class="wire w-cp" d="M470,112 V215" marker-end="url(#arrow-cp)"/>
  <circle class="badge b-cp" cx="488" cy="140" r="9"/>
  <text class="btext bt-cp" x="488" y="144" text-anchor="middle">1</text>
  <text class="label" x="504" y="137">binds worker-06 and</text>
  <text class="label" x="504" y="152">advances the generation</text>

  <path class="wire w-cp" d="M736,112 V215" marker-end="url(#arrow-cp)"/>
  <circle class="badge b-cp" cx="754" cy="140" r="9"/>
  <text class="btext bt-cp" x="754" y="144" text-anchor="middle">2</text>
  <text class="label" x="770" y="137">then publishes the</text>
  <text class="label" x="770" y="152">revision and the floor</text>

  <path class="wire w-ext" d="M200,396 V349" marker-end="url(#arrow-ext)"/>
  <text class="label" x="208" y="377">watch all of these</text>

  <path class="wire w-dp" d="M640,446 H461" marker-end="url(#arrow-dp)"/>
  <text class="label" x="550" y="422" text-anchor="middle">polls with its Node UID</text>
  <text class="label" x="550" y="437" text-anchor="middle">and (7, 12)</text>

  <path class="wire w-cp" d="M461,490 H639" marker-end="url(#arrow-cp)"/>
  <text class="label" x="550" y="510" text-anchor="middle">the view at (7, 13),</text>
  <text class="label" x="550" y="525" text-anchor="middle">or retry</text>

  <!-- Legend -->
  <rect class="box b-ext dashed" x="24" y="600" width="28" height="16" rx="4"/>
  <text class="label" x="60" y="612">not part of Mokka</text>
  <circle class="badge b-cp" cx="193" cy="608" r="9"/>
  <text class="btext bt-cp" x="193" y="612" text-anchor="middle">1</text>
  <circle class="badge b-cp" cx="215" cy="608" r="9"/>
  <text class="btext bt-cp" x="215" y="612" text-anchor="middle">2</text>
  <text class="label" x="232" y="612">the leader's writes for an assignment change, in order</text>
</svg>
