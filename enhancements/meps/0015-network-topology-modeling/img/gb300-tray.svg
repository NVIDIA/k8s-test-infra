<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="440" viewBox="0 0 1020 440" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>GB300 compute tray: GPUs, NICs, planes and leaf switches</title>
<desc>One GB300 compute tray is one node: two Grace CPUs, four GPUs and two ConnectX-8 boards with four 800 Gb/s InfiniBand ports, one next to each GPU. Port k serves rail k. Each port splits into four 200 Gb/s planes, and each plane goes to its own ASIC in the rail's Q3400 leaf switch. A BlueField-3 DPU carries storage and management traffic outside the compute fabric.</desc>
