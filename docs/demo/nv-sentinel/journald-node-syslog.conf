#
# journald drop-in mounted onto every node by kind.yaml, so a Kind node keeps a
# "syslog" that agents reading host kernel logs can consume — NVSentinel's
# syslog-health-monitor opens the journal DIRECTORY under a /var/log hostPath
# and admits only kernel-transport entries. The stock Kind node image satisfies
# neither requirement:
#
#   Storage=persistent  journald otherwise keeps the journal in /run/log/journal,
#                       where a /var/log hostPath mount cannot see it. The
#                       directory is created on start.
#   ReadKMsg=yes        journald.conf ships ReadKMsg=no, dropping kernel
#                       messages. With this, a line written to /dev/kmsg — how
#                       `nvml-mock-ctl fail --xid` announces an Xid on a node
#                       with no real driver — is ingested as _TRANSPORT=kernel.
#
# It must arrive before journald starts, hence a mount at cluster creation
# rather than a write into a running node: journald cannot reload
# (CanReload=no), so a later drop-in would need a restart to take effect.
[Journal]
Storage=persistent
ReadKMsg=yes
