#
# kube-prometheus-stack values for the observability demo, trimmed for Kind.
#
# Issue #597 requires this stack be sized against the per-node footprint budget,
# so Alertmanager is off, retention is 2h, and Prometheus has explicit limits.
# node-exporter stays ON: host CPU/memory pressure is exactly what a scale run
# needs to correlate GPU symptoms against, and it is the one per-node DaemonSet
# this stack adds.

# Nothing in this demo alerts; Alertmanager would only add footprint.
alertmanager:
  enabled: false

# The bundled Kubernetes control-plane alert rules fire constantly on Kind
# (single-node etcd, no kube-proxy metrics) and would bury the demo in noise.
defaultRules:
  create: false

grafana:
  # adminPassword is deliberately absent: run.sh always passes it with
  # --set-string from GRAFANA_PASSWORD, so a value here would be dead weight that
  # reads like the effective password.
  service:
    type: NodePort
    # Must match the containerPort of the 3000 mapping in kind.yaml, which is
    # the only reason Grafana is reachable on the host at all.
    nodePort: 30300
  # The sidecar provisions any ConfigMap labelled grafana_dashboard=1, which is
  # how dashboards/mokka-gpu.json gets in without being clicked together in the
  # UI. These are chart defaults, pinned here because the dashboard ConfigMap
  # depends on them. The dashboard also depends on one default that is NOT
  # pinnable from here: it hardcodes "uid": "prometheus" in every panel, which is
  # this chart's default datasource uid (grafana.sidecar.datasources.uid). If a
  # future chart version changes it, every panel renders "datasource not found".
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

prometheus:
  service:
    type: NodePort
    # Must match the containerPort of the 9090 mapping in kind.yaml.
    nodePort: 30090
  prometheusSpec:
    # dcgm-exporter collects every 5s; scraping slower would alias away the
    # step change the fault-injection phases assert on.
    scrapeInterval: 5s
    evaluationInterval: 30s
    retention: 2h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
