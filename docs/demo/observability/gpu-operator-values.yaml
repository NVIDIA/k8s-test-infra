#
# GPU Operator values for the observability demo (mock GPUs on Kind).
#
# Differs from docs/demo/nv-sentinel/gpu-operator-values.yaml in two ways:
# standalone DCGM (nv-hostengine) stays DISABLED because nothing here polls it
# directly -- dcgm-exporter embeds its own hostengine -- and the exporter's
# ServiceMonitor is ENABLED so Prometheus discovers it.

# The mock replaces the kernel driver + container toolkit.
driver:
  enabled: false
toolkit:
  enabled: false

dcgm:
  enabled: false

dcgmExporter:
  enabled: true
  env:
    - name: NVIDIA_DRIVER_ROOT
      value: "/var/lib/nvml-mock/driver"
    # 5s so an injected fault shows up on the dashboard promptly.
    - name: DCGM_EXPORTER_COLLECT_INTERVAL
      value: "5000"
  serviceMonitor:
    enabled: true
    interval: 5s
    # additionalLabels.release is deliberately NOT set here. kube-prometheus-stack
    # defaults serviceMonitorSelectorNilUsesHelmValues=true, so Prometheus only
    # selects ServiceMonitors labelled release=<its own Helm release>; a value
    # hardcoded here would be silently ignored the moment it drifted from
    # KPS_RELEASE, with no error anywhere. run.sh passes it with --set from that
    # same variable so the two cannot disagree.

# MIG unsupported by the mock.
mig:
  strategy: none
migManager:
  enabled: false

# Reports driver/GPU state read from the real driver interfaces; the mock does
# not implement them and nothing in this demo consumes its metrics.
nodeStatusExporter:
  enabled: false

# CDI mode — toolkit reads /var/run/cdi/nvidia.yaml generated by nvml-mock.
cdi:
  enabled: true
  default: true

devicePlugin:
  enabled: true
  # Chart default, restated for symmetry with the repo's other gpu-operator
  # values files: no device-plugin ConfigMap, so the plugin runs on its built-in
  # defaults. The mock supports neither MIG nor time-slicing, which is what such
  # a ConfigMap would otherwise configure.
  config:
    name: ""
  env:
    - name: NVIDIA_DRIVER_ROOT
      value: "/var/lib/nvml-mock/driver"

gfd:
  enabled: true
  env:
    - name: NVIDIA_DRIVER_ROOT
      value: "/var/lib/nvml-mock/driver"

validator:
  driver:
    env:
      - name: DRIVER_INSTALL_DIR
        value: "/run/nvidia/driver"
      - name: LD_LIBRARY_PATH
        value: "/run/nvidia/driver/usr/lib64"
      - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
        value: "true"
  toolkit:
    env:
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
  plugin:
    env:
      - name: LD_LIBRARY_PATH
        value: "/run/nvidia/driver/usr/lib64"
