apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-mock
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin-mock
    spec:
      nodeSelector:
        mokka.nvidia.com/type: sgpu
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.2
          args:
            - --nvidia-driver-root=/var/lib/nvml-mock/driver
            - --driver-root-ctr-path=/var/lib/nvml-mock/driver
            - --device-discovery-strategy=nvml
            # The NVIDIA runtime resolves the allocated UUID against Mokka's
            # nvidia.com/gpu CDI spec. Passing the mock device node also keeps
            # Mokka's visibility filtering aligned with the allocation.
            - --pass-device-specs=true
          securityContext:
            privileged: true
          volumeMounts:
            - name: mock-root
              mountPath: /var/lib/nvml-mock
              readOnly: true
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: mock-root
          hostPath:
            path: /var/lib/nvml-mock
            type: Directory
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
