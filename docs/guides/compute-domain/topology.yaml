# Helm values fragment for the ComputeDomain guide
# (docs/guides/compute-domain/run.sh). Passed to `helm upgrade --install`
# via `-f <this file>` so the chart merges it on top of its defaults.
#
# `--set-file` is NOT used here: that flag stuffs the raw file bytes
# into the target key as a string literal, which would defeat the
# structured list helm expects under `topology.domains`.
#
# Two GB200 NVL72 racks of two nodes each, matching the
# mokka.nvidia.com/clique labels in tests/e2e/kind-compute-domain-racks.yaml.
# That cluster config names its Kubernetes nodes worker-0 .. worker-3
# whatever the Kind cluster is called, so this file fits any cluster name.
#
# Layout:
#   domain "rack-1" (00000000-0000-0000-0000-0000000000a1)
#     clique 0: worker-0, worker-1
#   domain "rack-2" (00000000-0000-0000-0000-0000000000b2)
#     clique 0: worker-2, worker-3
topology:
  enabled: true
  domains:
    - name: rack-1
      uuid: "00000000-0000-0000-0000-0000000000a1"
      cliques:
        - id: 0
          nodes:
            - worker-0
            - worker-1
    - name: rack-2
      uuid: "00000000-0000-0000-0000-0000000000b2"
      cliques:
        - id: 0
          nodes:
            - worker-2
            - worker-3
