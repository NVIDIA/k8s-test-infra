apiVersion: v1
kind: Pod
metadata:
  name: mokka-verify
spec:
  restartPolicy: Never
  nodeSelector:
    mokka.nvidia.com/type: sgpu
  containers:
    - name: nvidia-smi
      # This image deliberately contains no Mokka components. The device
      # plugin allocates a simulated GPU UUID, and the NVIDIA runtime applies
      # Mokka's CDI specification to mount nvidia-smi, libnvidia-ml, and the
      # mock configuration.
      image: ubuntu:24.04
      command: [nvidia-smi]
      args: [-L]
      resources:
        limits:
          nvidia.com/gpu: 1
